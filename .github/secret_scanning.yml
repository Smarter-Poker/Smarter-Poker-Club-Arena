# Secret Scanning Configuration
# https://docs.github.com/en/code-security/secret-scanning
#
# 2026-08-15: `**/*.md` and `**/*.txt` were previously excluded. That blind
# spot is why a live service_role JWT sat in CLAUDE_AUDIT_LOG.md, and why the
# engine-host incident report was published verbatim, without either being
# flagged. Documentation is exactly where pasted credentials end up. Do not
# re-add extension-based excludes here — narrow to specific paths if ever
# needed.

paths-ignore:
  - '**/node_modules/**'
  - '**/.next/**'
  - '**/dist/**'
