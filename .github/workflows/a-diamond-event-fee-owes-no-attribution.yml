name: A Diamond event fee owes no attribution

# v_tournament_rake_attribution_gaps (migration 20261016104032). Runs
# scripts/ci/test-a-diamond-event-fee-owes-no-attribution.py against a
# throwaway PostgreSQL 17 cluster, never production: production's exact view
# text (md5 equal to the live view on 2026-10-16) must count a Diamond house
# fee as credited nobody; the migration must stop counting it while a chip fee
# that credited nobody still counts, keep the grants and security_invoker, and
# refuse a second run. No timer (CLAUDE.md 10.85): pull_request only, scoped to
# the paths it proves. ci.yml has no push trigger, so neither does this.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261016104032_a_diamond_event_fee_owes_no_attribution.sql
      - scripts/ci/fixtures/a-diamond-event-fee-owes-no-attribution/**
      - scripts/ci/test-a-diamond-event-fee-owes-no-attribution.py
      - .github/workflows/a-diamond-event-fee-owes-no-attribution.yml

permissions:
  contents: read

concurrency:
  group: a-diamond-event-fee-owes-no-attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a-diamond-event-fee-owes-no-attribution:
    name: A Diamond event fee owes no attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: A Diamond event fee owes no attribution
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-a-diamond-event-fee-owes-no-attribution.py --output artifacts/a-diamond-event-fee-owes-no-attribution
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-diamond-event-fee-owes-no-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/a-diamond-event-fee-owes-no-attribution/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
