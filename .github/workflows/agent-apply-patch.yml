name: Agent Apply Patch

# Applies queued unified diffs pushed to patch/** branches. Purpose: the
# agent-side GitHub bridge caps a single pushed file at ~65KB, so large files
# (TablePage.tsx at 307KB) could never be edited remotely. A patch file is a
# few KB regardless of target size. Flow:
#   1. agent creates branch patch/<name> from main
#   2. agent pushes .agent/patches/<name>.patch (unified diff, -p1 paths)
#      and optionally .agent/deletes.txt (one repo-relative path per line)
#   3. this workflow applies it, removes the patch file, commits, pushes
#   4. agent opens a normal PR from the branch — build gate runs as usual
# Pushes made with GITHUB_TOKEN do not trigger workflows, so the apply
# commit cannot recurse.

on:
  push:
    branches:
      - 'patch/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, NOT the default depth-1 shallow clone. `git apply
          # --3way` needs the patch's preimage blob to be present locally;
          # under a shallow checkout it never is, so the 3-way fallback
          # silently degraded to "falling back to direct application" and
          # failed on any patch cut against a slightly older main.
          fetch-depth: 0
          # blob:none keeps every one of the 7,223 commits and drops the blobs of old
          # revisions. Measured 2026-09-13, three runs each: 33-35s / 531MB against
          # 36-43s / 766MB, for identical ancestry. Nothing in this repo's workflows
          # reads a historical file version - they ask merge-base, rev-list, log and
          # cat-file -e, which are all commit-graph work - so those blobs were paid
          # for on every run and never read.
          filter: blob:none

      - name: Apply queued patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(.agent/patches/*.patch)
          deletes=.agent/deletes.txt
          if [ ${#patches[@]} -eq 0 ] && [ ! -f "$deletes" ]; then
            echo "No queued patches — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Base commit: $(git log --oneline -1)"
          for p in "${patches[@]}"; do
            echo "::group::Applying $p"
            # --index stages the result; a patch that does not apply cleanly
            # fails the job loudly instead of committing garbage.
            #
            # ORDER MATTERS, and getting it wrong corrupts files silently.
            #
            # 2026-08-15: this chain originally tried the plain form first.
            # Plain `git apply` does NOT reject a zero-context (-U0) hunk it
            # cannot place — it reports success and appends the content at the
            # END of the file. A lobby patch applied that way put six imports
            # and a JSX block after the component's closing brace, at line
            # 1402 instead of lines 28/54/713/1060, and the job went green.
            # --unidiff-zero is the flag that makes git place -U0 hunks by
            # their stated line numbers, so it has to run FIRST. It is a no-op
            # for patches that do carry context, so trying it first costs
            # nothing and closes the silent-corruption path.
            if git apply --index --unidiff-zero --whitespace=nowarn "$p"; then
              echo "applied (unidiff-zero)"
            elif git apply --index --whitespace=nowarn "$p"; then
              echo "applied (standard)"
            elif git apply --index --3way --whitespace=nowarn "$p"; then
              echo "applied (3-way)"
            else
              echo "::error::Patch $p did not apply. Reject detail follows."
              git apply --check --verbose "$p" || true
              exit 1
            fi
            git rm -q "$p"
            git commit -m "agent-patch: apply $(basename "$p")"
            echo "::endgroup::"
          done
          # File removals. A deletion inside a unified diff has to carry every
          # removed line, which for a handful of components is tens of KB of
          # pure noise across the bridge — and every one of those lines is
          # another chance to mis-transcribe. A path list does the same job.
          if [ -f "$deletes" ]; then
            echo "::group::Processing $deletes"
            while IFS= read -r target || [ -n "$target" ]; do
              case "$target" in ''|\#*) continue ;; esac
              case "$target" in /*|*..*) echo "::error::Refusing unsafe path: $target"; exit 1 ;; esac
              if [ -e "$target" ]; then
                git rm -r -q "$target"
                echo "deleted $target"
              else
                echo "::error::Listed for deletion but not found: $target"
                exit 1
              fi
            done < "$deletes"
            git rm -q "$deletes"
            git commit -m "agent-patch: process deletes.txt"
            echo "::endgroup::"
          fi
          git push
