name: An empty event is not overdue

# fn_tournament_metrics().overdue_start (migration 20261016013324). Runs
# scripts/ci/test-an-empty-event-is-not-overdue.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definition
# captured 2026-10-16 (pg_get_functiondef md5 equal to the live function)
# must count an MTT nobody entered at 10 minutes past start, and the
# migration must count it only once the engine's 30-minute empty-event
# cancel is itself late, keep every entered event counted at 10 minutes,
# keep the owner park exclusion, and reproduce production's derived
# postimage md5. No timer (CLAUDE.md 10.85): pull_request only, scoped to
# the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261016013324_an_empty_event_is_not_overdue_until_its_cancel_is.sql
      - scripts/ci/fixtures/empty-event-overdue/**
      - scripts/ci/test-an-empty-event-is-not-overdue.py
      - server/src/tournament/emptyPastStartEvent.ts
      - .github/workflows/an-empty-event-is-not-overdue.yml

permissions:
  contents: read

concurrency:
  group: an-empty-event-is-not-overdue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  an-empty-event-is-not-overdue:
    name: An empty event is not overdue until its cancel is
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: An empty event is not overdue until its cancel is
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-an-empty-event-is-not-overdue.py --output artifacts/an-empty-event-is-not-overdue
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: an-empty-event-is-not-overdue-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/an-empty-event-is-not-overdue/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
