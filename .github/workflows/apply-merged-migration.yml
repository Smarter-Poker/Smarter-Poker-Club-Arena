# Apply one merged-but-unapplied migration, from its own bytes.
#
# check-migrations-are-live.mjs finds migrations that merged to main and never
# reached the database. Its remediation line says to apply them with the
# Supabase MCP apply_migration, which takes the SQL as a call argument - so the
# applier has to reproduce the file by hand. A 126 KB money migration cannot be
# retyped safely, and on 2026-09-23 exactly that left the engine unable to ship
# for five days with 65 stalled tables (see scripts/ci/apply-recorded-migration.mjs).
#
# This job reads the file off the checkout and sends it once, in its own single
# transaction, through the same DATABASE_URL credential boundary the
# auto-deploy doors gate already uses. Nothing is transcribed.
#
# It is DISPATCH ONLY. It has no schedule, no push trigger, and it never
# discovers work for itself: one run applies exactly the one file it is given.
#
# Two doors, one job (2026-10-16). workflow_dispatch needs the Actions write
# scope, which the cloud agents' GitHub App integration does not hold - its
# dispatch answers 403 "Resource not accessible by integration" - so every
# merged migration from a cloud agent had to be retyped into the Supabase MCP,
# the exact hazard this job exists to remove. repository_dispatch
# (event type apply-merged-migration) is reachable with contents:write and
# carries ONLY {migration, dry_run} in client_payload. The recovery and
# emergency options stay on workflow_dispatch alone. Every guard the applier
# runs (filename shape, merged bytes, schema_migrations, break window, single
# transaction, certificate) is the same for both doors.
# It is not a repair job (CLAUDE.md 10.12) - it writes no money and retries
# nothing. THE READER is the person who dispatches it: the run's own conclusion
# is the answer, and the job summary states it.
name: Apply Merged Migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration filename under supabase/migrations (e.g. 20260922143541_club_and_union_diamond_commerce.sql)'
        required: true
        type: string
      recover_index:
        description: 'Opt-in recovery: exact qualified contract or Chicago cash index only'
        required: false
        default: ''
        type: string
      recover_oid:
        description: 'Observed invalid index OID; required together with recover_index'
        required: false
        default: ''
        type: string
      recover_transient_oid:
        description: 'Optional inspected invalid original-name_ccnew OID; exact interrupted recovery only'
        required: false
        default: ''
        type: string
      recover_selector_oid:
        description: 'Observed VALID replacement selector OID; exact proof-hand retirement-only recovery'
        required: false
        default: ''
        type: string
      recover_before:
        description: 'Inspected original operation timestamp (provenance only; admission uses fresh server time)'
        required: false
        default: ''
        type: string
      final_table_pages:
        description: 'Explicit bounded final-table normalization: 1..3000 pages; empty installs only'
        required: false
        default: ''
        type: string
      final_table_operation:
        description: 'UUID identifying this finite normalization operation; retain on unknown acknowledgment'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Read and check only; send nothing'
        required: false
        default: false
        type: boolean
      serial_journal_index:
        description: 'Exact journal cover only: source-bound serial build on the configured Supavisor session endpoint'
        required: false
        default: false
        type: boolean
      maintenance_thaw_repair:
        description: 'Explicit audited installation of the exact merged trigger repair for an expired maintenance thaw'
        required: false
        default: false
        type: boolean
      qualify_rake_report_history:
        description: 'Explicit finite closed-day report qualification for the exact rake agent report migration only'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [apply-merged-migration]

# One applier at a time. Two concurrent DDL transactions would each take their
# own PostgREST schema reload (~28s on this database).
#
# The group is PER FILE, and the one-at-a-time order is the queue step in the
# job (2026-10-24). A single shared group holds one running and ONE pending
# run, and GitHub cancels the pending run whenever a newer one joins: at
# 22:53Z three merges dispatched three files within a second, two runs were
# cancelled before they started, and 20261024213143 (the Lightning pilot
# switch-off) silently never applied. A per-file group still collapses a
# duplicate dispatch of the same file; different files no longer erase each
# other, and the queue step below runs them in run-id order.
concurrency:
  group: apply-merged-migration-${{ inputs.migration || github.event.client_payload.migration }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  apply:
    name: Apply ${{ inputs.migration || github.event.client_payload.migration }}
    runs-on: ubuntu-latest
    # Queue wait (900 s) + the applier's bounded DDL admission wait (12 min,
    # apply-recorded-migration.mjs) + the apply itself. Pinned by
    # tests/unit/aMergedMigrationIsInstallable.test.ts.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Use the production Node major
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Postgres client library
        run: npm i pg@8 --no-save --no-audit --no-fund

      - name: Apply the migration
        id: apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINAL_TABLE_PAGES: ${{ inputs.final_table_pages }}
          FINAL_TABLE_OPERATION: ${{ inputs.final_table_operation }}
          MIGRATION_FILE: ${{ inputs.migration || github.event.client_payload.migration }}
          SERIAL_JOURNAL_INDEX: ${{ inputs.serial_journal_index }}
          RECOVER_INDEX: ${{ inputs.recover_index }}
          RECOVER_OID: ${{ inputs.recover_oid }}
          RECOVER_BEFORE: ${{ inputs.recover_before }}
          RECOVER_SELECTOR_OID: ${{ inputs.recover_selector_oid }}
          RECOVER_TRANSIENT_OID: ${{ inputs.recover_transient_oid }}
          MAINTENANCE_THAW_REPAIR: ${{ inputs.maintenance_thaw_repair }}
          QUALIFY_RAKE_REPORT_HISTORY: ${{ inputs.qualify_rake_report_history }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # The pipeline below is allowed to fail WITHOUT aborting this step.
          # GitHub runs `run:` under `bash -e`, and `set -uo pipefail` does not
          # clear -e, so an exit 1 (REFUSED) or 3 (UNKNOWN) used to abort here
          # BEFORE the code reached $GITHUB_OUTPUT. The summary then read an
          # empty code and called every refusal "UNEXPECTED exit" - the three
          # outcomes this script is careful to separate, collapsed into one
          # that names no cause (CLAUDE.md 10.86 rule 1). Record it, then exit
          # with it.
          set +e
          # THE QUEUE. Wait, bounded, until no earlier run of this workflow is
          # queued or running, so files still apply one at a time in dispatch
          # order. Nothing is sent while waiting; a timeout or an unreadable
          # queue is REFUSED with nothing sent, never UNKNOWN. The budget covers
          # an earlier run waiting out its own bounded DDL admission (12 min),
          # so a file queued behind a maintenance window is not refused by the
          # queue for the wait its predecessor was allowed (2026-10-26).
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            ahead=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/apply-merged-migration.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID and .status != \"completed\")] | length" 2>/dev/null)
            if ! [[ "$ahead" =~ ^[0-9]+$ ]]; then
              echo "[apply] REFUSED: could not read the applier queue. Nothing was sent; dispatch again." | tee /tmp/apply.log
              echo "code=1" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            [[ "$ahead" == "0" ]] && break
            if (( $(date +%s) >= deadline )); then
              echo "[apply] REFUSED: $ahead earlier applier run(s) still active after 900s. Nothing was sent; dispatch again once they finish." | tee /tmp/apply.log
              echo "code=1" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "[queue] $ahead earlier applier run(s) queued or running; waiting"
            sleep 15
          done
          recovery_args=()
          if [[ "${SERIAL_JOURNAL_INDEX:-false}" == "true" ]]; then
            recovery_args+=(--serial-journal-index)
          fi
          if [[ -n "$RECOVER_INDEX" || -n "$RECOVER_OID" || -n "$RECOVER_BEFORE" || -n "$RECOVER_TRANSIENT_OID" ]]; then
            recovery_args+=(--recover-index "$RECOVER_INDEX" --recover-oid "$RECOVER_OID" --recover-before "$RECOVER_BEFORE")
          fi
          if [[ -n "$RECOVER_TRANSIENT_OID" ]]; then
            recovery_args+=(--recover-transient-oid "$RECOVER_TRANSIENT_OID")
          fi
          if [[ -n "${RECOVER_SELECTOR_OID:-}" ]]; then
            recovery_args+=(--recover-selector-oid "$RECOVER_SELECTOR_OID")
          fi
          if [[ -n "$FINAL_TABLE_PAGES" || -n "$FINAL_TABLE_OPERATION" ]]; then
            recovery_args+=(--final-table-pages "$FINAL_TABLE_PAGES" --final-table-operation "$FINAL_TABLE_OPERATION")
          fi
          if [[ "$QUALIFY_RAKE_REPORT_HISTORY" == "true" ]]; then
            recovery_args+=(--qualify-rake-report-history)
          fi
          if [[ "$MAINTENANCE_THAW_REPAIR" == "true" ]]; then
            recovery_args+=(--maintenance-thaw-repair)
          fi
          node scripts/ci/apply-recorded-migration.mjs \
            --ssl-root-cert scripts/ci/certificates/supabase-prod-ca-2021.crt \
            --migration "$MIGRATION_FILE" \
            "${recovery_args[@]}" \
            ${{ (inputs.dry_run || toJSON(github.event.client_payload.dry_run) == 'true') && '--dry-run' || '' }} 2>&1 | tee /tmp/apply.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Say what happened
        if: always()
        env:
          # Read through env, never interpolated into the script: a
          # repository_dispatch payload is caller-supplied text.
          SUMMARY_FILE: ${{ inputs.migration || github.event.client_payload.migration }}
          SUMMARY_DRY_RUN: ${{ inputs.dry_run || toJSON(github.event.client_payload.dry_run) == 'true' }}
          SUMMARY_DOOR: ${{ github.event_name }}
        run: |
          set -eu
          code="${{ steps.apply.outputs.code }}"
          {
            echo "### Apply Merged Migration"
            echo ""
            echo "- file: \`$SUMMARY_FILE\`"
            echo "- dry run: \`$SUMMARY_DRY_RUN\`"
            echo "- door: \`$SUMMARY_DOOR\`"
            case "$code" in
              0) echo "- result: **APPLIED, ALREADY-APPLIED or BOUNDED PAGES** (see exact committed/partial log)";;
              1) echo "- result: **REFUSED** - nothing committed, or the reason is in the log";;
              3) echo "- result: **UNKNOWN** - inspect the log and durable outcome before another operation";;
              "") echo "- result: **COULD NOT TELL** - the applier recorded no exit code, so whether anything was sent is UNREAD. Inspect the log and schema_migrations before any other operation; do not re-dispatch blind.";;
              *) echo "- result: **UNEXPECTED exit $code**";;
            esac
            echo ""
            echo '```'
            tail -40 /tmp/apply.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$code" = "0"
