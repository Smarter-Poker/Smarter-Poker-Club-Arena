name: Apply Migration Temp

on:
  push:
    branches:
      - feat/wallet-cashier-claim-back

jobs:
  apply_sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SQL using psql pooler brute force
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          REGIONS=(
            "aws-0-us-east-1"
            "aws-0-us-west-1"
            "aws-0-eu-central-1"
            "aws-0-eu-west-1"
            "aws-0-eu-west-2"
            "aws-0-eu-west-3"
            "aws-0-ap-southeast-1"
            "aws-0-ap-southeast-2"
            "aws-0-ap-northeast-1"
            "aws-0-ap-northeast-2"
            "aws-0-sa-east-1"
            "aws-0-ca-central-1"
          )
          
          SUCCESS=0
          for REGION in "${REGIONS[@]}"; do
            HOST="${REGION}.pooler.supabase.com"
            echo "Trying $HOST..."
            if psql -h "$HOST" -U "postgres.kuklfnapbkmacvwxktbh" -d postgres -p 6543 -c "SELECT 1" > /dev/null 2>&1; then
              echo "SUCCESS on $HOST!"
              SUCCESS=1
              psql -h "$HOST" -U "postgres.kuklfnapbkmacvwxktbh" -d postgres -p 6543 -f supabase/migrations/20260823250000_wallet_claim_back.sql
              psql -h "$HOST" -U "postgres.kuklfnapbkmacvwxktbh" -d postgres -p 6543 -f supabase/migrations/20260823390000_stats_perf.sql
              break
            else
              echo "Failed on $HOST"
            fi
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "Could not connect to any pooler."
            exit 1
          fi
          
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Regenerate Manifest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/gen-schema-manifest.mjs

      - name: Commit back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate manifest"
            git push
          fi
