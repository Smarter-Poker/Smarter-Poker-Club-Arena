name: Apply Migration Temp

on:
  push:
    branches:
      - feat/wallet-cashier-claim-back

jobs:
  apply_sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Apply SQL using supabase cli
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref kuklfnapbkmacvwxktbh
          supabase db push

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Regenerate Manifest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/gen-schema-manifest.mjs

      - name: Commit back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate manifest"
            git push
          fi
