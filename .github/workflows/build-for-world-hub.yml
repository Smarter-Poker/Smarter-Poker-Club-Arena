name: Build for World Hub Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

# 2026-08-21: was cancel-in-progress: true, which deadlocked publishing.
# This build takes about 4 minutes. With several agents pushing to main every
# minute or two, every run was killed by the next push before it reached the
# sync step, so production sat on one sha (7547a6e45) for hours while main
# moved far ahead. The queue was never idle and never finished.
#
# false is correct here because of how GitHub scopes it: a new run still
# cancels an older PENDING run in the group, but a run already RUNNING is
# allowed to finish. The group therefore holds at most one in-flight build
# plus the newest queued commit, and each wave of pushes converges on
# publishing the latest main instead of publishing nothing at all.
concurrency:
  group: build-world-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUSKY: '0'
    outputs:
      sync_branch: ${{ steps.set-branch.outputs.sync_branch }}

    steps:
      - name: Checkout Club Arena
        uses: actions/checkout@v4

      # STAGE MARKERS REMOVED (2026-08-21).
      #
      # Three steps here used to `git push HEAD:refs/heads/ci-marker/<sha>-*`
      # after checkout, deps and build, so that "which markers exist" told you
      # which stage died. They were added 2026-08-06 with the explicit
      # justification "without needing the Actions API" — at the time that API
      # was not readable from here.
      #
      # It is readable now. `gh run view <id> --json` and
      # `gh api repos/.../actions/runs/<id>/jobs` return every step with its
      # own conclusion, which is strictly more information than the markers
      # ever carried: today that is how the failing step was identified as
      # "Client tests must pass before the bundle ships", something the
      # markers could only have narrowed to "somewhere after deps".
      #
      # The cost was not free. Three refs per push, never cleaned up, had
      # accumulated 716 ci-marker branches out of 1025 total on this repo —
      # every one of them a permanent ref that `actions/checkout` and every
      # `git ls-remote` pays for. Deleted here so it stops growing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ═══════════════════════════════════════════════════════════════════
      # CLIENT TESTS GATE THE BUNDLE — added 2026-08-21.
      #
      # ci.yml's unit job exists but NEVER COMPLETES on main: pushes land
      # faster than the ~6-minute CI and cancel-in-progress kills every run,
      # while this workflow ships the bundle on push regardless. Proven live:
      # a format pass mangled the em-dash classes in popupStyle.ts (Dan's
      # BINDING popup rule) and 19 client tests sat red on main while the
      # broken bundle served production. Same philosophy as the engine's
      # "Server tests must pass before anything is deployed": the suite runs
      # HERE, in the workflow that publishes, so a red suite means no sync.
      # The whole suite is ~15s; a superseding push re-tests its own commit.
      # ═══════════════════════════════════════════════════════════════════
      - name: Client tests must pass before the bundle ships
        run: npx vitest run tests/

      - name: Build Club Arena
        env:
          NODE_ENV: production
          VITE_ANTIGRAVITY_ENABLED: 'true'
          VITE_SUPABASE_URL: 'https://kuklfnapbkmacvwxktbh.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          VITE_ENGINE_URL: 'https://engine.smarter.poker'
          VITE_APP_ENV: production
        run: npm run build

      # Build provenance: record the commit this dist was actually built from,
      # inside the bundle. Three syncs on 2026-08-19 published a bundle built
      # from a stale tree while naming the current sha in the commit message;
      # nothing in the artefact contradicted them. With this file,
      #   curl -s https://smarter.poker/hub/club-arena/build-info.json
      # answers "what is actually live" without grepping minified chunks.
      - name: Stamp build provenance
        run: |
          cat > dist/build-info.json <<JSON
          {
            "ca_sha": "${{ github.sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "built_by": "build-for-world-hub.yml",
            "run_id": "${{ github.run_id }}"
          }
          JSON
          cat dist/build-info.json

      - name: Commit dist to sync branch
        id: set-branch
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          BRANCH="build/world-hub-sync-${SHORT_SHA}"
          echo "sync_branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "SYNC_BRANCH=${BRANCH}" >> $GITHUB_ENV
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "${BRANCH}"
          git add --force dist/
          git commit -m "build: compiled dist for world hub sync (${SHORT_SHA})"
          git push --no-verify --force origin "${BRANCH}"

      - name: Build summary
        run: |
          echo "### Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "Sync branch: \`${{ env.SYNC_BRANCH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Proceeding to sync directly to World Hub..." >> $GITHUB_STEP_SUMMARY

  sync-to-world-hub:
    needs: build-and-store
    runs-on: ubuntu-latest
    # Needed by the sync-branch cleanup at the end of this job. build-and-store
    # already declares this because it PUSHES the branch; without it here the
    # matching delete silently no-ops behind its `|| true` and the refs keep
    # accumulating — which is the failure mode this cleanup exists to end.
    permissions:
      contents: write

    steps:
      - name: Checkout Club Arena sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-store.outputs.sync_branch }}
          path: club-arena-build

      - name: Checkout World Hub
        uses: actions/checkout@v4
        with:
          repository: Smarter-Poker/Smarter-Poker-World-Hub
          token: ${{ secrets.WORLD_HUB_SYNC_TOKEN }}
          path: world-hub

      - name: Sync dist/ to World Hub public/hub/club-arena/
        run: |
          rsync -av --delete \
            club-arena-build/dist/ \
            world-hub/public/hub/club-arena/

      - name: Commit and push to World Hub
        run: |
          cd world-hub
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/hub/club-arena/
          if git diff --cached --quiet; then
            echo "No changes to sync — World Hub already up to date."
            exit 0
          fi
          git commit -m "chore(club-arena): sync build ${{ github.sha }}"
          # World Hub main receives pushes from other pipelines while this job
          # runs, so a bare push loses the race with a non-fast-forward reject.
          # Rebase our single sync commit on top and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "World Hub updated successfully (attempt ${attempt})."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto origin/main."
            git pull --rebase --no-edit origin main || exit 1
            sleep 5
          done
          echo "World Hub push failed after 5 attempts."
          exit 1

      # The sync branch is a courier, not a record. It exists only so this job
      # can check out the dist/ that the previous job built; once World Hub has
      # the files, nothing ever reads it again — and the bundle it carried is
      # recorded permanently in the World Hub sync commit either way.
      #
      # Left behind, they accumulated 180 build/world-hub-sync-* refs. Deleting
      # on success (and only on success — a failed sync's branch is the one
      # thing worth keeping, so you can retry from it by hand) keeps the ref
      # namespace flat. `|| true`: a cleanup failure must never turn a
      # successful publish into a red run.
      - name: Delete the sync branch now that World Hub has the files
        if: success()
        run: |
          cd club-arena-build
          git push --no-verify origin --delete "${{ needs.build-and-store.outputs.sync_branch }}" || true

      - name: Sync summary
        run: |
          echo "### Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "Club Arena \`dist/\` → World Hub \`public/hub/club-arena/\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
