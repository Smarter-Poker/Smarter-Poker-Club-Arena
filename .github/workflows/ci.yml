name: CI — Build & Type Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel previous runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # STEP 1: TypeScript compilation check (fast — ~40s)
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript Check
        run: npx tsc --noEmit

      # ── Security Audit ──────────────────────────────────────────────────
      - name: Dependency Audit
        continue-on-error: true
        run: |
          echo "## 🔒 Dependency Audit" >> $GITHUB_STEP_SUMMARY
          AUDIT=$(npm audit --audit-level=high 2>&1) || true
          HIGH=$(echo "$AUDIT" | grep -c "high" || echo 0)
          CRITICAL=$(echo "$AUDIT" | grep -c "critical" || echo 0)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::warning::Found $CRITICAL critical vulnerability(ies)"
            echo "⚠️ **$CRITICAL critical** and **$HIGH high** vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          elif [ "$HIGH" -gt 0 ]; then
            echo "::warning::Found $HIGH high vulnerability(ies)"
            echo "⚠️ **$HIGH high** vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No high/critical vulnerabilities" >> $GITHUB_STEP_SUMMARY
          fi

      # ── Dead Code Detection ─────────────────────────────────────────────
      - name: Dead Code Detection
        continue-on-error: true
        run: |
          echo "## 🧹 Dead Code Check" >> $GITHUB_STEP_SUMMARY
          DEAD_FILES=0

          # Find .ts/.tsx files not imported anywhere
          for f in $(find src -name '*.ts' -o -name '*.tsx' | grep -v 'node_modules\|\.d\.ts\|index\.ts\|vite-env\|main\.tsx\|App\.tsx'); do
            BASENAME=$(basename "$f" | sed 's/\.\(ts\|tsx\)$//')
            # Check if this file is imported anywhere
            REFS=$(grep -rl "$BASENAME" src/ --include='*.ts' --include='*.tsx' 2>/dev/null | grep -v "$f" | wc -l | tr -d ' ')
            if [ "$REFS" -eq 0 ]; then
              echo "::warning file=$f::File appears unused (not imported anywhere)"
              DEAD_FILES=$((DEAD_FILES + 1))
            fi
          done

          if [ "$DEAD_FILES" -gt 0 ]; then
            echo "⚠️ **$DEAD_FILES potentially unused file(s)** found — review recommended" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No dead code detected" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # STEP 2: Full production build + bundle metrics (depends on typecheck)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Stamp Service Worker Version
        run: |
          # Update DEPLOY_TS in sw-bus.js so the browser detects a new SW on each deploy
          STAMP=$(date -u +%Y%m%d%H%M%S)
          sed -i "s/const DEPLOY_TS = '[^']*'/const DEPLOY_TS = '${STAMP}'/" public/sw-bus.js
          echo "SW version stamped: ${STAMP}"

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      # ── Lighthouse Performance Audit ──────────────────────────────────────
      - name: Lighthouse Audit
        continue-on-error: true
        run: |
          npm install -g @lhci/cli
          echo "## 🔦 Lighthouse Performance Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run basic static analysis on the built HTML
          INDEX_SIZE=$(wc -c < dist/index.html | tr -d ' ')
          INDEX_KB=$((INDEX_SIZE / 1024))

          # Check for render-blocking resources
          RENDER_BLOCK=$(grep -c 'rel="stylesheet"' dist/index.html || echo 0)
          INLINE_SCRIPTS=$(grep -c '<script>' dist/index.html || echo 0)

          # Count total assets
          JS_COUNT=$(find dist/assets -name '*.js' 2>/dev/null | wc -l | tr -d ' ')
          CSS_COUNT=$(find dist/assets -name '*.css' 2>/dev/null | wc -l | tr -d ' ')
          IMG_COUNT=$(find dist/images -type f 2>/dev/null | wc -l | tr -d ' ')

          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| HTML size | ${INDEX_KB}kB |" >> $GITHUB_STEP_SUMMARY
          echo "| JS bundles | $JS_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS bundles | $CSS_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Images | $IMG_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Render-blocking stylesheets | $RENDER_BLOCK |" >> $GITHUB_STEP_SUMMARY
          echo "| Inline scripts | $INLINE_SCRIPTS |" >> $GITHUB_STEP_SUMMARY

      # ── Bundle Size Tracking ─────────────────────────────────────────────
      - name: Track Bundle Size
        if: success()
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|---------|" >> $GITHUB_STEP_SUMMARY

          TOTAL_JS=0
          TOTAL_CSS=0

          # JS bundles
          for f in dist/assets/*.js; do
            if [ -f "$f" ]; then
              SIZE=$(wc -c < "$f" | tr -d ' ')
              GZIP=$(gzip -c "$f" | wc -c | tr -d ' ')
              SIZE_KB=$((SIZE / 1024))
              GZIP_KB=$((GZIP / 1024))
              TOTAL_JS=$((TOTAL_JS + SIZE))
              BASENAME=$(basename "$f")
              echo "| \`${BASENAME}\` | ${SIZE_KB}kB | ${GZIP_KB}kB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # CSS bundles
          for f in dist/assets/*.css; do
            if [ -f "$f" ]; then
              SIZE=$(wc -c < "$f" | tr -d ' ')
              GZIP=$(gzip -c "$f" | wc -c | tr -d ' ')
              SIZE_KB=$((SIZE / 1024))
              GZIP_KB=$((GZIP / 1024))
              TOTAL_CSS=$((TOTAL_CSS + SIZE))
              BASENAME=$(basename "$f")
              echo "| \`${BASENAME}\` | ${SIZE_KB}kB | ${GZIP_KB}kB |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          TOTAL_JS_KB=$((TOTAL_JS / 1024))
          TOTAL_CSS_KB=$((TOTAL_CSS / 1024))
          TOTAL_KB=$(( (TOTAL_JS + TOTAL_CSS) / 1024 ))

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total JS:** ${TOTAL_JS_KB}kB | **Total CSS:** ${TOTAL_CSS_KB}kB | **Grand Total:** ${TOTAL_KB}kB" >> $GITHUB_STEP_SUMMARY

          # Fail if total bundle exceeds 5MB (guard against bloat)
          if [ $TOTAL_KB -gt 5120 ]; then
            echo "::error::Bundle size exceeds 5MB limit (${TOTAL_KB}kB). Investigate code splitting."
            exit 1
          fi

          echo "✅ Bundle size: ${TOTAL_KB}kB (limit: 5120kB)"

  # ─────────────────────────────────────────────────────────────────────────────
  # STEP 3: Deploy to Vercel ONLY after typecheck + build pass (push only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    needs: [typecheck, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          npm install -g vercel
          DEPLOY_URL=$(vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1 | grep -oE 'https://[^ ]+\.vercel\.app' | head -1)
          echo "url=${DEPLOY_URL}" >> $GITHUB_OUTPUT
          echo "✅ Deployed: ${DEPLOY_URL}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post Deploy Summary
        if: success()
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Report Failure
        if: failure()
        run: |
          echo "## ❌ Deployment FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "TypeScript and build passed, but Vercel deployment failed." >> $GITHUB_STEP_SUMMARY
          echo "Check Vercel dashboard for details." >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # STEP 4: Notify on failure (runs when any job fails)
  # ─────────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Failure Notification
    needs: [typecheck, build, deploy]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);

            // Check if there's already an open CI failure issue
            const issues = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'ci-failure',
              state: 'open',
              per_page: 1
            });

            if (issues.data.length > 0) {
              // Comment on existing issue
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issues.data[0].number,
                body: `🔴 **Another CI failure** on commit \`${sha}\`\n\n[View run](${runUrl})`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner, repo,
                title: `🔴 CI Pipeline Failed — ${new Date().toISOString().split('T')[0]}`,
                body: `## CI Pipeline Failure\n\n**Commit:** \`${sha}\`\n**Run:** [View details](${runUrl})\n\nThis issue was auto-created by the CI pipeline. Close when resolved.`,
                labels: ['ci-failure']
              });
            }
