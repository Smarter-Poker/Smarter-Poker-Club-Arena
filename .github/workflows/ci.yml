          needs.changes.outputs.phase4 == 'true'
        env:
          PG17_BIN: /usr/lib/postgresql/17/bin
        run: bash scripts/ci/probes/horse-phase4-certified-solver/run-pg17.sh

  server_shards:
    # Independent engine tests run alongside isolated PostgreSQL qualification.
    # The required server aggregate below still refuses unless both pass.
    # COST 2026-08-23: this already ran, and passed, on the pull request -
    # the ruleset will not merge without it. Re-running it on the merge
    # commit tests an identical tree. 34 of every 100 CI runs were that
    # duplicate, and CI is six jobs, each billed as a whole minute even
    # when it takes twenty seconds.
    # 78% of pull requests never touch server/. This suite is two billed
    # minutes and cannot be broken by a file outside it.
    needs: changes
    # FAILS CLOSED, and this is the whole point.
    #
    # 2026-08-23, caught within the hour: the `changes` job 403'd, its dependants
    # were skipped by `needs:` as GitHub does by default, every required check
    # reported SKIPPED - and a ruleset counts a skipped required check as
    # SATISFIED. For a few minutes this repo would have merged unchecked code and
    # shown all green doing it. That is precisely the silent failure this estate
    # exists to prevent, introduced by the change meant to save money.
    #
    # `always()` makes the job evaluate even when `changes` did not succeed, and
    # `needs.changes.result != 'success'` then RUNS it. An undetermined diff is
    # treated as "could break anything", never as "nothing to do".
    #
    # `schedule` runs it unconditionally - see the note on the unit job.
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'pull_request' &&
        needs.changes.outputs.head_current != 'false' &&
        (needs.changes.result != 'success' ||
         needs.changes.outputs.server == 'true')))
    name: Server Engine shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # 2026-09-01 (cost audit): cache the installed tree, skip npm ci on a hit.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: nm-server-${{ runner.os }}-node22-${{ hashFiles('server/package-lock.json') }}

      - name: Install Dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # server/ is a separate package with its own tsconfig; the root typecheck
      # job never compiles it, so a type error here used to ship to production.
      - name: TypeScript Check (server)
        run: npx tsc --noEmit

      # BLOCKING. Named explicitly so it is obvious in the job log which
      # regressions are being defended, and so deleting them is a visible diff.
      # PHASE 2 (2026-09-02): the restart gate's pins ride the named regression
      # step, not only the full suite, so a #2537-class regression that outdates
      # them is a named red line on a required check.
      - name: Freeze + watchdog + restart-gate regression suite
        run: npx vitest run src/engine/FreezeRegression.test.ts src/engine/TableWatchdog.test.ts src/maintenance/MaintenanceBreak.test.ts src/maintenance/thawInstallments.test.ts --reporter=verbose

      - name: Full server test suite
        env:
          SERVER_TEST_SHARD: ${{ matrix.shard }}
        run: |
          [[ "$SERVER_TEST_SHARD" =~ ^[1-4]$ ]]
          npm test -- --shard="$SERVER_TEST_SHARD/4"

      # Guards the single highest-impact line of the freeze fix. The all-in
      # dead-buttons bug (production hand #1315: 30.1s between a river shove
      # and a forced fold) was CSS, not engine logic — `pointer-events: none`
      # on the action panel in all-in mode made Call and Fold unclickable while
      # the timer ran down. No test can catch that, so it is asserted here.
      - name: All-in action panel must never be pointer-events:none
        working-directory: .
        run: node scripts/ci/check-allin-pointer-events.mjs

  # Preserve the required check name. A cancelled/failed matrix, or an
  # unexplained skip, must never satisfy branch protection through one shard.
  server:
    needs: [changes, server_shards, accounting_postgres]
    if: always()
    name: Server Engine (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every shard and real PostgreSQL accounting passed
        env:
          MATRIX_RESULT: ${{ needs.server_shards.result }}
          ACCOUNTING_RESULT: ${{ needs.accounting_postgres.result }}
          DIFF_RESULT: ${{ needs.changes.result }}
          SERVER_CHANGED: ${{ needs.changes.outputs.server }}
          HEAD_CURRENT: ${{ needs.changes.outputs.head_current }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          for dependency in "server:$MATRIX_RESULT" "accounting:$ACCOUNTING_RESULT"; do
            suite="${dependency%%:*}"
            result="${dependency#*:}"
            case "$result" in
              success) echo "Required $suite checks passed." ;;
              skipped)
                if [ "$CI_EVENT_NAME" = pull_request ] && [ "$DIFF_RESULT" = success ] && [ "$SERVER_CHANGED" = false ]; then
                  echo "$suite checks skipped: the checked diff does not change the server."
                elif [ "$CI_EVENT_NAME" = pull_request ] && [ "$HEAD_CURRENT" = false ]; then
                  # A superseded sha. This run verifies a commit nobody will
                  # merge; the run for the head that replaced it carries the
                  # required check. Said out loud rather than passed in silence,
                  # because a skip that explains nothing is what this whole
                  # block exists to refuse.
                  echo "::notice title=SUPERSEDED::$suite checks skipped: this sha is no longer the pull request head, so the heavy matrix ran for the head that replaced it."
                else
                  echo "::error::Required $suite checks were unexpectedly skipped."
                  exit 1
                fi ;;
              *) echo "::error::Required $suite checks did not pass ($result)."; exit 1 ;;
            esac
          done

  # ═══════════════════════════════════════════════════════════════════════════
  #  WHAT DID THIS RUN ACTUALLY VERIFY?
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # Added 2026-08-31, after four tests were found failing on main under a green
  # badge for an unknown length of time.
  #
  # A skipped job and a passing job are both green in the run list, in the PR
  # header and in `gh run list`. Everything above is gated - on the event, on
  # the diff, or on `needs` - so a run can legitimately execute nothing at all
  # and still report success. That is the correct BEHAVIOUR and a terrible
  # REPORT, and it is the same failure this repo already named twice: the
  # Hetzner deploy's "DID NOT DEPLOY - this run shipped nothing" step, and the
  # cron-health check that exists because nobody was reading job_run_details.
  #
  # This job costs a few seconds, blocks nothing, and makes the run say out
  # loud which suites ran and which did not. A warning is an ANNOTATION, so it
  # surfaces in the run header without anyone thinking to open the logs.
  verdict:
    name: What this run verified
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [changes, stub_gate, typecheck, typecheck_compile, fixture_native, unit, server]
    steps:
      - uses: actions/checkout@v4
      - name: Exact revision evidence summary
        env:
          POLICY_CI_NEEDS: ${{ toJSON(needs) }}
          POLICY_CI_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node docs/agent-policy/agent-policy.mjs ci-report >> "$GITHUB_STEP_SUMMARY"
      - name: Say what ran, and what did not
        run: |
          UNIT='${{ needs.unit.result }}'
          SERVER='${{ needs.server.result }}'
          TYPECHECK='${{ needs.typecheck.result }}'
          COMPILE='${{ needs.typecheck_compile.result }}'
          NATIVE='${{ needs.fixture_native.result }}'
          STUB='${{ needs.stub_gate.result }}'
          CHANGES='${{ needs.changes.result }}'
          HEAD_CURRENT='${{ needs.changes.outputs.head_current }}'

          {
            echo "## What this run verified"
            echo ""
            echo "| Suite | Result |"
            echo "| --- | --- |"
            echo "| What changed | $CHANGES |"
            echo "| Stub Gate | $STUB |"
            echo "| Required compilation + fixture result | $TYPECHECK |"
            echo "| TypeScript + repo invariants | $COMPILE |"
            echo "| Native fixture prerequisites | $NATIVE |"
            echo "| Client Unit Tests | $UNIT |"
            echo "| Server Engine | $SERVER |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          SKIPPED=""
          [ "$UNIT" = "skipped" ] && SKIPPED="$SKIPPED client-unit"
          [ "$SERVER" = "skipped" ] && SKIPPED="$SKIPPED server-engine"

          if [ "$HEAD_CURRENT" = "false" ]; then
            echo "::notice title=SUPERSEDED SHA::This sha is no longer the pull request head, so only the fast gates ran. The heavy matrix ran for the head that replaced it, which is the sha the required checks are evaluated against."
            {
              echo "**This sha was superseded while it was being tested.** The"
              echo "fast gates ran; the heavy matrix ran for the head that"
              echo "replaced it. Required checks are evaluated against that head."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$UNIT" = "skipped" ] && [ "$SERVER" = "skipped" ]; then
            echo "::warning title=NO TESTS RAN::This run executed neither test suite. It is green because nothing was checked, not because everything passed. On a push to main that is expected - every job here is gated on pull_request - and it is exactly why the daily scheduled run against main exists."
            {
              echo "**No test suite ran in this run.** It is green because nothing"
              echo 'was checked. The daily scheduled run (`35 6 * * *`) is what'
              echo "answers whether main is actually passing."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$SKIPPED" ]; then
            echo "::notice title=PARTIAL VERIFICATION::These suites did not run:$SKIPPED. Change detection judged them unaffected by this diff."
          else
            echo "Both test suites ran."
          fi

      # The gate itself must fail closed. A suite that ERRORED (not skipped,
      # not passed) while some other job's failure is what turned the run red
      # is easy to lose in a long job list; naming it here is free.
      - name: Fail if a suite that ran did not pass
        if: needs.unit.result == 'failure' || needs.server.result == 'failure' || needs.typecheck.result == 'failure' || needs.stub_gate.result == 'failure'
        run: |
          echo "::error title=A suite that ran did not pass::unit=${{ needs.unit.result }} server=${{ needs.server.result }} typecheck=${{ needs.typecheck.result }} stub_gate=${{ needs.stub_gate.result }}"
          exit 1

  build:
    # COST 2026-08-23: this already ran, and passed, on the pull request -
    # the ruleset will not merge without it. Re-running it on the merge
    # commit tests an identical tree. 34 of every 100 CI runs were that
    # duplicate, and CI is six jobs, each billed as a whole minute even
    # when it takes twenty seconds.
    # Nothing outside src/ changes the bundle, its size or its Lighthouse score.
    needs: changes
    # FAILS CLOSED, and this is the whole point.
    #
    # 2026-08-23, caught within the hour: the `changes` job 403'd, its dependants
    # were skipped by `needs:` as GitHub does by default, every required check
    # reported SKIPPED - and a ruleset counts a skipped required check as
    # SATISFIED. For a few minutes this repo would have merged unchecked code and
    # shown all green doing it. That is precisely the silent failure this estate
    # exists to prevent, introduced by the change meant to save money.
    #
    # `always()` makes the job evaluate even when `changes` did not succeed, and
    # `needs.changes.result != 'success'` then RUNS it. An undetermined diff is
    # treated as "could break anything", never as "nothing to do".
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.changes.outputs.head_current != 'false' &&
      (needs.changes.result != 'success' || needs.changes.outputs.src == 'true')
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Validate this event's exact merge/base/head with full ancestry.
          # Main may advance while queued; this disposable PR build never
          # qualifies as a publishable current-main artifact.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Vite Build
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: vite-${{ runner.os }}-

      # 2026-09-01 (cost audit): cache the installed tree, skip npm ci on a
      # hit. Shares `nm-full` with the unit job - both run a full npm ci.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-full-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify production minifier execution and hidden maps
        run: node --test tests/operations/client-chunk-execution.test.mjs

      # 2026-09-04: the optimized rasters are content-addressed, so this is
      # keyed on the media that feeds them plus the script that encodes them.
      # When no image changed the key HITS and nothing is re-saved, so this
      # adds no cache churn on the overwhelmingly common PR. When one does,
      # `restore-keys` still hands over every other image's result and only
      # the changed file is encoded. See scripts/optimize-dist-media.mjs.
      - name: Cache optimized dist media
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/dist-media
          key: >-
            dist-media-v1-${{ runner.os }}-${{ hashFiles('public/**/*.png',
            'public/**/*.jpg', 'public/**/*.jpeg', 'public/**/*.webp',
            'src/assets/**', 'scripts/optimize-dist-media.mjs') }}
          restore-keys: dist-media-v1-${{ runner.os }}-

      - name: Record Build Start
        id: build-timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      # `build:ci` is `build` WITHOUT the leading `tsc -b` (package.json keeps
      # `build` = `tsc -b && npm run build:ci`, so the two can never drift).
      #
      # This is not a weakened check, and the proof is structural rather than
      # empirical: all three tsconfigs set `"noEmit": true`, none declares
      # `composite` or `references`, and vite.config.ts loads no dts or checker
      # plugin. `tsc -b` therefore writes nothing that `vite build` reads - two
      # dists built with and without it hash identically - so on this repo it
      # is a typecheck wearing a build's clothes, and it was being run three
      # times per merge (46.7s here, 47.8s in CSS Beat E2E, 10.2s in the
      # publisher) for one answer.
      #
      # The answer is still produced: the `typecheck` job above runs
      # `tsc --noEmit` over this same commit, is a REQUIRED check, and is
      # ungated (no `changes` filter can skip it). And the publisher keeps the
      # full `npm run build` - the tree that actually reaches players is still
      # typechecked before it ships. What is gone is only the duplication.
      - name: Build
        run: npm run build:ci
        env:
          CA_BUILD_PURPOSE: ${{ github.event_name == 'pull_request' && 'ci-validation' || 'release-build' }}
          NODE_ENV: production
          # Public browser configuration. The previous PR build omitted these,
          # so it produced an artifact that threw before React mounted and no
          # browser performance check could exercise the actual application.
          VITE_SUPABASE_URL: 'https://kuklfnapbkmacvwxktbh.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          VITE_ENGINE_URL: 'https://engine.smarter.poker'
          VITE_APP_ENV: production
      - name: Report Build Time
        if: always()
        run: |
          END=$(date +%s)
          ELAPSED=$(( END - ${{ steps.build-timer.outputs.start }} ))
          echo "## ⏱️ Build Duration: ${ELAPSED}s" >> $GITHUB_STEP_SUMMARY

      # ── Build Artifact Inventory ──────────────────────────────────────────
      - name: Build Artifact Inventory
        continue-on-error: true
        run: |
          echo "## Build Artifact Inventory" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          INDEX_SIZE=$(wc -c < dist/index.html | tr -d ' ')
          INDEX_KB=$((INDEX_SIZE / 1024))
          JS_COUNT=$(find dist/assets -name '*.js' 2>/dev/null | wc -l | tr -d ' ')
          CSS_COUNT=$(find dist/assets -name '*.css' 2>/dev/null | wc -l | tr -d ' ')
          IMG_COUNT=$(find dist/images -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| HTML size | ${INDEX_KB}kB |" >> $GITHUB_STEP_SUMMARY
          echo "| JS bundles | $JS_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS bundles | $CSS_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Images | $IMG_COUNT |" >> $GITHUB_STEP_SUMMARY

      # ── Bundle Size Tracking ─────────────────────────────────────────────
      - name: Track Bundle Size
        id: bundle_size
        if: success()
        # Measures INITIAL LOAD (what a user downloads to open the app) and
        # gates on it, then reports whole-app size against a bloat ceiling.
        # The previous inline version summed every file in dist/assets and
        # failed on the total -- charging every push for ~1.6MB gzipped of
        # lazily-split route chunks that no session ever fetches, which made
        # correct code-splitting score exactly as badly as shipping the code
        # eagerly. See the header of the script for the measurements.
        run: node scripts/ci/bundle-size.mjs

      # ── Who Pays For First Paint ─────────────────────────────────────────
      - name: Entry Chunk Is A Reviewed List
        # `always()` rather than `success()` on purpose: the step above gates a
        # SIZE, this one gates WHO PAYS, and the second answer is most wanted
        # exactly when the first has just gone red. On 2026-09-01 the size gate
        # failed on the whole-app ceiling while the real defect - operator-only
        # code newly landing in the chunk every player downloads before first
        # paint - sat underneath it, invisible, and passed its own limit at
        # 309kB against 320kB. It was found by hand, after the fact.
        #
        # Runs when the build succeeded, AND specifically when the size gate
        # above is the thing that went red - which is when "who is paying for
        # this" is most worth answering. Not always(): if the BUILD failed
        # there is no dist to measure, and turning one clear failure into two
        # helps nobody.
        if: success() || steps.bundle_size.conclusion == 'failure'
        run: node scripts/ci/entry-chunk-delta.mjs dist

      # Real browser performance and responsive budgets. This replaces the old
      # file-count step that was labelled Lighthouse but never opened a page.
      #
      # BRANCHED ON THE RUNNER 2026-09-07, and this was the last unguarded
      - name: Install Performance Browser
        if: success()
        run: npx playwright install --with-deps chromium

      - name: Route Performance Budget
        if: success()
        run: npm run test:performance

      # The public arena (every prerendered route) is audited with axe-core
      # at a phone and a desktop viewport; a serious or critical violation
      # fails the build (discoverability phase 6, 2026-09-17).
      - name: Public Arena Accessibility
        if: success()
        run: npm run test:a11y

  # ───────────────────────────────────────────────────────────────────────────
  # LIVE PRODUCTION E2E (split out of `Production Build` 2026-08-22).
  #
  # WHY THIS IS ITS OWN JOB, AND WHY IT ONLY RUNS ON main:
  # these specs drive https://smarter.poker — the DEPLOYED site. On a pull
  # request that is not the pull request's code, it is whatever main last
  # shipped. So as a PR gate it could never validate the change under review;
  # it only imported production's current health (and Vercel's deploy timing)
  # into an unrelated PR as a red X. That is why `Production Build` went red on
  # branches whose own build was fine, and why agents started reaching for
  # `--admin` to get past it.
  #
  # `Production Build` is now purely deterministic (vite build + bundle budget)
  # and is a REQUIRED check. This job runs after main deploys, as verification,
  # and files an issue when production actually breaks.
  #
  # The PR-time E2E gate is `CSS Beat E2E (multi-table + animations)`, which
  # serves THIS COMMIT'S OWN BUILD locally — that one is required.
  # ───────────────────────────────────────────────────────────────────────────
  live-e2e:
    # Moved off push:main to the two-hourly schedule above, and on 2026-09-04
    # narrowed again to the DAILY cron only.
    #
    # post-deploy-e2e.yml runs the production specs on workflow_run after every
    # publish, and Club Arena publishes roughly nineteen times an hour, so
    # production is already exercised continuously by the thing that changed it.
    # This job's distinct value is catching drift NOT caused by a publish - an
    # expired certificate, a Supabase change, a DNS or CDN regression - and that
    # does not need a 25-minute browser run twelve times a day.
    #
    # The two-hourly cron is deliberately left in place for `unit` and `server`:
    # that is the "is main actually green" net (see the schedule note).
    if: github.event_name == 'schedule' && github.event.schedule == '35 6 * * *'
    name: Live Production E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for Production Deploy
        run: |
          # A blind `sleep 60` tested the site mid-build. Vercel Next.js builds
          # take 3-5 min (World Hub CLAUDE.md 1.4) and rapid pushes queue, so
          # E2E routinely navigated into an in-flight deploy and failed with
          # `page.goto: Test timeout` and transient 413s -- red CI, healthy site.
          # Poll for readiness instead, and require CONSECUTIVE healthy
          # responses so we never start testing during a swap.
          # No trailing slash: that path 308-redirects. -L follows anyway, so a
          # future redirect change cannot silently make this gate unpassable.
          URL="https://smarter.poker/hub/club-arena"
          NEED=3; STREAK=0; CODE=000
          DEADLINE=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            # curl already prints 000 on connection failure; do NOT `|| echo 000`
            # as well or the reported code becomes "000000".
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$URL" 2>/dev/null) || true
            [ -z "$CODE" ] && CODE=000
            if [ "$CODE" = "200" ]; then
              STREAK=$((STREAK + 1))
              echo "healthy ${STREAK}/${NEED} (HTTP ${CODE})"
              if [ "$STREAK" -ge "$NEED" ]; then
                echo "Production is serving cleanly - starting E2E."
                exit 0
              fi
            else
              [ "$STREAK" -ne 0 ] && echo "streak reset (HTTP ${CODE})"
              STREAK=0
            fi
            sleep 10
          done
          echo "::error::Production never returned ${NEED} consecutive 200s in 10 min (last HTTP ${CODE})."
          exit 1

      - name: Run E2E Tests (Production)
        run: npx playwright test --project=chromium
        env:
          # Point tests at production — set PLAYWRIGHT_BASE_URL in the test config
          BASE_URL: https://smarter.poker/hub/club-arena
          CI: true
          # This branch-executable workflow is intentionally signed out and
          # holds no production credentials. Authenticated production coverage
          # lives in post-deploy-e2e.yml, whose code comes from default branch.
        continue-on-error: false

      # ── MOBILE FIT + AVATAR WATCHDOG (2026-08-24) ─────────────────────────
      # The August mobile sweep ended with two live guarantees: no Club Arena
      # page scrolls sideways on a phone, and no avatar renders broken. These
      # are exactly the regressions a CSS/asset PR can silently reintroduce,
      # so the scheduled production run re-proves both on every cycle using
      # the same instrumented harnesses the sweep itself used. A representative
      # route subset keeps this under ~3 minutes; the full 101-route sweep can
      # be run locally with no ROUTES env. Signed-out runs still measure — the
      # harness logs in with the same optional secrets as the E2E step and
      # falls back to public pages without them.
      - name: Mobile Fit Audit (no sideways scroll, production)
        if: always()
        run: node scripts/e2e-mobile-overflow-audit.mjs
        env:
          FAIL_ON_FINDINGS: '1'
          ROUTES: '["/","/auth","/clubs/a0000000-0000-0000-0000-000000000001","/clubs/a0000000-0000-0000-0000-000000000001/members","/clubs/a0000000-0000-0000-0000-000000000001/cashier","/clubs/a0000000-0000-0000-0000-000000000001/tournaments","/clubs/a0000000-0000-0000-0000-000000000001/settings","/clubs/a0000000-0000-0000-0000-000000000001/promotions","/profile","/friends","/cashier","/transactions","/vip","/marketplace","/settlement-dashboard","/analytics","/dev/bus","/leaderboard"]'

      - name: Avatar Audit (no broken avatars, production)
        if: always()
        run: node scripts/e2e-avatar-audit.mjs
        env:
          FAIL_ON_FINDINGS: '1'

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3 # 2026-09-01 cost audit: reports are read same-day or never

      - name: Report E2E Status
        if: always()
        run: |
          echo "## 🎭 Playwright E2E Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests ran against: [smarter.poker/hub/club-arena](https://smarter.poker/hub/club-arena)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This duplicate drift sweep is intentionally signed out; the authenticated post-deploy workflow owns credentialed coverage." >> $GITHUB_STEP_SUMMARY

      # ─────────────────────────────────────────────────────────────────────────────
      # STEP 4: Post-deploy smoke test on smarter.poker
      # ─────────────────────────────────────────────────────────────────────────────

      - name: Open an issue if production E2E failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Live production E2E failed on main ($(echo "$SHA" | cut -c1-8))"
          EXISTING=$(gh issue list --repo "$REPO" --state open --label live-e2e --limit 1 --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Still failing on \`$SHA\`. Run: $RUN"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label live-e2e \
              --body "Production E2E went red after a merge to main.\n\nCommit: \`$SHA\`\nRun: $RUN\n\nThis job tests the DEPLOYED site, so this means smarter.poker itself is degraded — not that a PR is bad." || true
          fi

  post-deploy-check:
    # It checks the Hetzner origin and its public rewrite. It never used the build it
    # declared `needs: build` for - that was ordering, and it cost a full Vite
    # production build on every merge, on top of the one publish-club-arena.yml
    # already does to publish.
    # 2026-09-01: was `push` to main - a CDN poll per merge, ~85 times a day,
    # third in line behind post-deploy-e2e.yml and production-integrity-audit.yml which
    # both ask production the same question. The schedule keeps the smoke
    # logic alive at 13 runs a day instead of 85.
    if: github.event_name == 'schedule'
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for the Hetzner origin and public rewrite
        # The origin symlink swap is atomic; the public edge can take a short
        # interval to revalidate. Both paths must answer before smoke testing.
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            ORIGIN_STATUS=$(curl -sI -o /dev/null -w "%{http_code}" https://ca-static.smarter.poker/ 2>/dev/null || echo "000")
            PUBLIC_STATUS=$(curl -sI -o /dev/null -w "%{http_code}" https://smarter.poker/hub/club-arena 2>/dev/null || echo "000")
            if [ "$ORIGIN_STATUS" = "200" ] && [ "$PUBLIC_STATUS" = "200" ]; then
              echo "Hetzner origin and public rewrite ready after ${i}×10s ($((i * 10))s total)"
              exit 0
            fi
            echo "  poll $i/18: origin HTTP $ORIGIN_STATUS, public HTTP $PUBLIC_STATUS — waiting..."
            sleep 10
          done
          echo "::error::Hetzner origin or public Club Arena rewrite did not become ready within 3 minutes."
          exit 1

      - name: Smoke Test — smarter.poker
        run: |
          echo "## 🔍 Post-Deploy Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ERRORS=0

          # Check HTTP status (final confirmation after the poll loop above)
          STATUS=$(curl -sI -o /dev/null -w "%{http_code}" https://smarter.poker/hub/club-arena)
          if [ "$STATUS" = "200" ]; then
            echo "✅ HTTP $STATUS — smarter.poker/hub/club-arena is live" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ HTTP $STATUS — expected 200 after 3min poll" >> $GITHUB_STEP_SUMMARY
            ERRORS=$((ERRORS + 1))
          fi

          # A 200 can still be a stale edge response. The direct Hetzner origin
          # and the public rewrite must report the same immutable release SHA.
          ORIGIN_SHA=$(curl -fsS -H 'Cache-Control: no-cache' "https://ca-static.smarter.poker/build-info.json?cb=$RANDOM" \
            | sed -n 's/.*"ca_sha"[[:space:]]*:[[:space:]]*"\([a-f0-9]*\)".*/\1/p' || true)
          PUBLIC_SHA=$(curl -fsS -H 'Cache-Control: no-cache' "https://smarter.poker/hub/club-arena/build-info.json?cb=$RANDOM" \
            | sed -n 's/.*"ca_sha"[[:space:]]*:[[:space:]]*"\([a-f0-9]*\)".*/\1/p' || true)
          if [ -n "$ORIGIN_SHA" ] && [ "$ORIGIN_SHA" = "$PUBLIC_SHA" ]; then
            echo "✅ Hetzner origin and public rewrite serve ${ORIGIN_SHA:0:8}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Release stamp mismatch: origin '${ORIGIN_SHA:-unreadable}', public '${PUBLIC_SHA:-unreadable}'" >> $GITHUB_STEP_SUMMARY
            ERRORS=$((ERRORS + 1))
          fi

          # Check security headers
          HEADERS=$(curl -sI https://smarter.poker/hub/club-arena)
          for HEADER in "x-content-type-options" "x-frame-options" "referrer-policy" "permissions-policy"; do
            if echo "$HEADERS" | grep -qi "$HEADER"; then
              echo "✅ $HEADER header present" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ $HEADER header MISSING" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Check HTML content marker
          BODY=$(curl -s https://smarter.poker/hub/club-arena)
          if echo "$BODY" | grep -q "club-arena"; then
            echo "✅ HTML contains club-arena content" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ HTML may not contain expected content" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Post-deploy check failed with $ERRORS error(s)"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # CSS BEAT E2E (2026-08-21): the multi-table and gameplay-animation beats,
  # in real Chrome, against THIS COMMIT'S OWN BUILD (served locally under the
  # production /hub/club-arena prefix). Two silent clobbers happened in one
  # evening of concurrent agent pushes; this is the net that turns the next
  # one red before it ships.
  # ───────────────────────────────────────────────────────────────────────────
  css-beats-e2e:
    # COST 2026-08-23: this already ran, and passed, on the pull request -
    # the ruleset will not merge without it. Re-running it on the merge
    # commit tests an identical tree. 34 of every 100 CI runs were that
    # duplicate, and CI is six jobs, each billed as a whole minute even
    # when it takes twenty seconds.
    # This one builds the app AGAIN, installs Chromium and serves it - four
    # billed minutes, and only src/ can change what it measures.
    needs: changes
    # FAILS CLOSED, and this is the whole point.
    #
    # 2026-08-23, caught within the hour: the `changes` job 403'd, its dependants
    # were skipped by `needs:` as GitHub does by default, every required check
    # reported SKIPPED - and a ruleset counts a skipped required check as
    # SATISFIED. For a few minutes this repo would have merged unchecked code and
    # shown all green doing it. That is precisely the silent failure this estate
    # exists to prevent, introduced by the change meant to save money.
    #
    # `always()` makes the job evaluate even when `changes` did not succeed, and
    # `needs.changes.result != 'success'` then RUNS it. An undetermined diff is
    # treated as "could break anything", never as "nothing to do".
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.changes.outputs.head_current != 'false' &&
      (needs.changes.result != 'success' || needs.changes.outputs.src == 'true')
    name: CSS Beat E2E (multi-table + animations)
    runs-on: ubuntu-latest
    # Run35289214041 needed 9.6m for beats, 7m for Studio, plus 3.3m
    # to build/install; 20m killed the final financial-decision suite.
    # Preserve every suite and its own deadlines, with room for cleanup.
    timeout-minutes: 30

    steps:
      - name: Reserve disk for browser checks
        # This browser-only job does not invoke the separate Android build.
        # Keep its fixtures and failure evidence; reclaim the unused hosted SDK.
        run: |
          df -h /
          if [ -d /usr/local/lib/android/sdk ]; then
            sudo du -sh /usr/local/lib/android/sdk
            sudo rm -rf -- /usr/local/lib/android/sdk
          fi
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Validate this event's exact merge/base/head with full ancestry.
          # Main may advance while queued; this disposable PR build never
          # qualifies as a publishable current-main artifact.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # This job had NO cache of any kind, alone among the jobs that build.
      # It therefore paid a cold `npm ci` (45s) and a fully cold build (235s on
      # 2026-09-04) on every run. node_modules carries `node_modules/.vite` and
      # `node_modules/.tmp/*.tsbuildinfo` with it, so restoring it warms the vite
      # transform cache and lets `tsc -b` run incrementally rather than from
      # scratch.
      #
      # Its own key, deliberately, and it is worth saying why so nobody merges
      # it later to "tidy up". `nm-full` belongs to `unit` and `build`, which
      # install with a plain `npm ci`; this job uses `--ignore-scripts`, so that
      # tree is NOT interchangeable - the same class of mistake as reusing a
      # Node 20 cache in a Node 22 job. `nm-lite` (typecheck) DOES install
      # identically, but typecheck never builds, so its tree carries no warm
      # `.vite` or `.tsbuildinfo` - which is the entire point here. Separate key,
      # so this job restores a tree that has already built once.
      - name: Restore node_modules (vite + tsbuildinfo ride along)
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-beats-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      # THE GUARD BELOW IS THE POINT OF THE CACHE ABOVE (added 2026-09-04).
      #
      # This step had no `if:`, alone among the four jobs that install, so
      # `npm ci` ran on EVERY run - and `npm ci` DELETES node_modules before
      # installing. The restore above put a ~1GB tree back, complete with the
      # warm `node_modules/.vite` and `node_modules/.tmp/*.tsbuildinfo` the
      # comment above brags about carrying, and this step then threw all of it
      # away and re-installed from scratch. The cache was doing nothing except
      # cost the time to download and unpack it.
      #
      # It cost the CRITICAL PATH twice over: the install itself (45s warm,
      # minutes on a contended box - 8.6m was measured on 2026-09-04 in the
      # sibling typecheck job while twelve runners installed at once), and then
      # a cold Vite transform and a cold `tsc -b` on top, because the two
      # caches that ride inside node_modules had just been deleted with it.
      #
      # The other three installing jobs (`unit`, `build`, `typecheck`, and the
      # publisher's shards) have carried this `if:` since 2026-09-01. This one
      # was simply missed.
      - name: Install Dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

      - name: Install Chromium and WebKit
        run: npx playwright install chromium webkit --with-deps

      # Same content-addressed media cache as Production Build, same key, so
      # whichever of the two runs first warms it for the other.
      - name: Cache optimized dist media
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/dist-media
          key: >-
            dist-media-v1-${{ runner.os }}-${{ hashFiles('public/**/*.png',
            'public/**/*.jpg', 'public/**/*.jpeg', 'public/**/*.webp',
            'src/assets/**', 'scripts/optimize-dist-media.mjs') }}
          restore-keys: dist-media-v1-${{ runner.os }}-

      # `build:ci` - see the long note on the Production Build step for why
      # dropping `tsc -b` here checks nothing less than before. This job is the
      # critical path of the whole pipeline, so the 47.8s it was spending on a
      # typecheck the required `typecheck` job had already performed was 47.8s
      # added to every push-to-live.
      - name: Build this commit
        env:
          CA_BUILD_PURPOSE: ${{ github.event_name == 'pull_request' && 'ci-validation' || 'release-build' }}
          # The app fails closed before React mounts when these Vite values are
          # absent. Footer route probes do not call Supabase, so deterministic
          # non-secret placeholders are the correct isolated CI configuration.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: footer-probe-ci
          # ── ONE BUILD, THREE SUITES (2026-09-05) ───────────────────────────
          #
          # These two flags gate lazy-loaded dev showcase routes in App.tsx.
          # Without them here, the two harness suites below could not use this
          # build, so each started a Vite DEV server of its own and compiled
          # the whole app again on demand. Measured on runs 8843 and 8844 that
          # second compile was 141-200s - roughly HALF of this job, which is
          # itself the critical path of every merge (CSS Beat p50 334s of a
          # 6.8m ci.yml, and PR-to-merge p50 was also 6.8m: CI *is* the merge
          # latency here).
          #
          # WHY THIS IS SAFE, and the reason the flags stay BUILD-time rather
          # than becoming a runtime toggle: this bundle is thrown away. The
          # `Production Build` job and `publish-club-arena.yml` both build
          # WITHOUT these flags, so nothing a player downloads contains the
          # harness routes. tests/one-build-three-suites.law.test.ts asserts
          # they appear in this job and nowhere else - a flag like this leaking
          # into the publisher is the one way this change could hurt.
          #
          # The beats are unaffected: two extra lazy routes change no CSS and
          # no component the fixtures render.
          VITE_CUSTOMIZATION_TEST_HARNESS: 'true'
          VITE_FINANCIAL_DECISION_TEST_HARNESS: 'true'
        run: npm run build:ci

      # PER-RUNNER PREVIEW PORT (2026-09-04). 4173 was hardcoded, which was
      # fine while this job ran on a GitHub-hosted VM of its own and stopped
      # being fine the moment it moved onto the estate: three boxes, TWELVE
      # runners each, one network namespace. Two pull requests reaching this
      # step together both bound it, and the second failed with "is already
      # used" - a red required check caused by nothing in either diff.
      #
      # It also frees the port first. `--strictPort` refuses to fall back, so
      # a preview orphaned by a CANCELLED run on THIS runner would keep failing
      # every later job on it. Safe to kill precisely because the port is now
      # this runner's alone; with a shared port it would have killed a
      # neighbour's server.
      - name: Reserve this runner's preview port
        id: preview-port
        run: |
          PORT=$(node scripts/ci/e2e-port.mjs 4173)
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "Preview port for ${RUNNER_NAME:-local}: $PORT"
          for P in "$PORT" "$(node scripts/ci/e2e-port.mjs 5188)" "$(node scripts/ci/e2e-port.mjs 5189)"; do
            PIDS=$(lsof -tiTCP:"$P" -sTCP:LISTEN 2>/dev/null || true)
            if [ -n "$PIDS" ]; then
              echo "freeing port $P held by orphaned pid(s): $PIDS"
              kill -9 $PIDS 2>/dev/null || true
            fi
          done

      # Serve one build to every suite. Started here rather than inside the
      # beats step because it has to outlive that step: the two harness suites
      # after it share this exact server, which is what removed the second
      # compile from the critical path. Reaped by "Stop the shared preview"
      # below, which runs on always().
      - name: Serve one build to every suite
        run: |
          nohup npx vite preview --host 127.0.0.1 \
            --port ${{ steps.preview-port.outputs.port }} --strictPort \
            > /tmp/arena-preview.log 2>&1 &
          echo $! > /tmp/arena-preview.pid
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:${{ steps.preview-port.outputs.port }}/hub/club-arena/index.html > /dev/null && exit 0
            sleep 0.5
          done
          echo "::error::the preview never answered on port ${{ steps.preview-port.outputs.port }}"
          cat /tmp/arena-preview.log
          exit 1

      - name: Run the beats against this commit's CSS
        id: css-beats
        env:
          ARENA_BASE_URL: http://127.0.0.1:${{ steps.preview-port.outputs.port }}/hub/club-arena
          BASE_URL: http://127.0.0.1:${{ steps.preview-port.outputs.port }}/hub/club-arena/
        # hero-card-row.spec.ts was written to gate bug list item 11 and then
        # ran in NO job at all - 40 pure-geometry assertions that nobody ever
        # executed, which is why PR #178 could sit for 39 commits proposing
        # changes to a spec whose result could not affect anything. It needs no
        # server and no login (it renders SeatSlot.css with page.setContent) and
        # the whole file runs in ~2.5s, so it belongs in the required gate.
        #
        # table-proportions.spec.ts added 2026-08-28 with the proportional
        # sizing it guards. Same reasoning as hero-card-row above, and the same
        # trap it is a warning about: a spec that is not named here runs in NO
        # job and cannot fail anything. It needs no server and no login either
        # (page.setContent against the real stylesheets) and takes about a
        # second. It is what stops a breakpoint being reintroduced for cards,
        # avatars or seats — the failure the ladder caused was invisible for as
        # long as nobody happened to open a tablet.
        # 2026-08-29: seven more self-contained specs joined, because the no-job
        # trap fired again at scale. An inventory found SIXTEEN spec files
        # running in no job; every self-contained one is now named here.
        #
        # customization-studios is intentionally not in this fixture list. It
        # now mounts the real component and a deterministic Supabase browser
        # mock, so the dedicated step below runs it through its own Vite config.
        #
        # diamond-checkout-mobile.spec.ts joined 2026-08-29 too - it landed from
        # another branch the same day and arrived orphaned, which is the trap
        # doing its work in real time. It is self-contained (readFileSync +
        # setContent), so it belongs here. THE RULE, restated because it keeps
        # being learned: a spec that is not named in a job runs in NO job. Add
        # yours in the same commit that writes it.
        #
        # spin-wheel-on-a-phone.spec.ts (2026-08-31) is named here IN THE SAME
        # COMMIT that writes it, per the rule restated below. It is
        # self-contained in this gate's sense - it pulls this commit's own
        # built stylesheets from the preview server and mounts the wheel's
        # markup, needing no login and no deployed site. It closes the last
        # place a Spin could break with nothing red: the wheel is a
        # full-screen takeover and live-animations only ever measured it at
        # Desktop Chrome, while the horse fleet that proves the engine has no
        # browser at all (10.5) and cannot exercise one pixel of it.
        #
        # tap-sweep-rules.spec.ts (2026-08-30) tests the POST-DEPLOY sweep's own
        # judgement, and belongs in this gate rather than beside the sweep it
        # models: it builds its DOM by hand, needs no login and no live site, and
        # the thing it guards - "excuse a control under fixed chrome only when
        # the page can still scroll" - is exactly the kind of rule that rots
        # into "excuse everything" without a beat that fails when it does. Three were already red - top-rail-seat pinned the
        # px-ladder avatar #1650 retired, pot-above-chips froze a pot position
        # two deliberate redesigns old, raise-panel-covers-chat lost the
        # stylesheet its anchor moved into - and every one had been failing
        # invisibly. The remaining orphans (mobile-fit-audit, smoke,
        # tournament-watch, the routes/ suite, showdown-beats,
        # mobile-chrome-occlusion, mobile-input-zoom, mobile-tap-targets,
        # club-lobby, tournament-buy-in-dialog) need a login or a deployed URL
        # and belong to the post-deploy tier, not this gate.
        #
        # club-mobile-wallet-reach.spec.ts (2026-08-31) is the deterministic
        # reproduction of a post-deploy 375px failure: the tiny Share artwork
        # lacked a thumb target and the collapsed wallet disclosure exposed
        # fully clipped controls. It renders this commit's real lobby styles,
        # needs no credentials, and must block the same regression pre-merge.
        #
        # mobile-lobby-chrome.spec.ts (2026-09-09) is the same shape for the
        # three defects Dan photographed on an iPad that day: the wallets count
        # clipped at the plate's edge, the filter row scrolling out from under
        # Find Your Game, and a strip of lobby showing under the footer frame.
        # It builds the lobby from this commit's real stylesheets, measures the
        # painted edges in Chromium AND WebKit, and needs no login.
        #
        # ── THE PREVIEW OUTLIVES THIS STEP NOW (2026-09-05) ─────────────────
        # It used to be started here under `trap ... EXIT`, so it died with the
        # step and the two harness suites below each had to start a Vite DEV
        # server of their own and compile the app again. That second compile
        # was 141-200s of every merge. The preview is started in its own step
        # above and torn down in an always() step below; all three suites share
        # it. See the note on "Serve one build to every suite".
        run: |
          npx playwright test tests/e2e/multi-table.spec.ts tests/e2e/live-animations.spec.ts tests/e2e/card-squeeze-visual-regression.spec.ts tests/e2e/card-squeeze-mobile.spec.ts tests/e2e/river-squeeze-interactive.spec.ts tests/e2e/spin-wheel-on-a-phone.spec.ts tests/e2e/hero-card-row.spec.ts tests/e2e/table-proportions.spec.ts tests/e2e/top-rail-seat.spec.ts tests/e2e/pot-above-chips.spec.ts tests/e2e/flop-fan-open.spec.ts tests/e2e/hero-cards-no-glitch.spec.ts tests/e2e/raise-panel-covers-chat.spec.ts tests/e2e/customization-controls.spec.ts tests/e2e/diamond-checkout-mobile.spec.ts tests/e2e/css/diamond-wheel-reveal.spec.ts tests/e2e/tap-sweep-rules.spec.ts tests/e2e/club-mobile-wallet-reach.spec.ts tests/e2e/mobile-lobby-chrome.spec.ts tests/e2e/css/club-lobby-sticky-selector.spec.ts tests/e2e/footer-visual-regression.spec.ts tests/e2e/footer-route.spec.ts tests/e2e/header-portrait-frame.spec.ts --project=chromium --project=webkit-footer --reporter=line --retries=1
          # Software WebGL must not compete with the other three browser workers.
          # Keep the full real-scene transitions; this invocation has no retries.
          npx playwright test tests/e2e/css/diamond-games-playfield.spec.ts --project=chromium --workers=1 --reporter=line --retries=0

      # Capture the failed fixture before a later suite can clear its output.
      # These tests use the local build and synthetic data, without a login.
      - name: Preserve failed CSS beat browser evidence
        if: ${{ failure() && steps.css-beats.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: css-beats-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 3
          if-no-files-found: warn

      # Unlike the CSS fixtures above, this mounts the production Studio and
      # drives its real Supabase client through a deterministic browser mock.
      # Its dedicated route redirects unless the test-harness flag is enabled -
      # which the shared build below now carries, so this needs no server.
      - name: Table Studio real-component purchase, sync, and accessibility gate
        id: table-studio
        env:
          ARENA_SHARED_PREVIEW_URL: http://127.0.0.1:${{ steps.preview-port.outputs.port }}
        run: npm run test:e2e:customization

      # These traces contain the throwaway Studio mock, not authenticated
      # production journeys. Preserve failures before the next suite can clear
      # Playwright's output directory; keep the original gate failure intact.
      - name: Preserve failed Table Studio browser evidence
        if: ${{ failure() && steps.table-studio.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: table-studio-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 3
          if-no-files-found: warn

      - name: Insurance and Rabbit Hunt 375px decision gate
        env:
          ARENA_SHARED_PREVIEW_URL: http://127.0.0.1:${{ steps.preview-port.outputs.port }}
        run: npm run test:e2e:financial-decisions

      # if: always() because the preview is now started outside the step that
      # uses it, so nothing else will reap it - and an orphaned --strictPort
      # server would fail every later job on this runner. The port-reserve step
      # above frees it defensively for the same reason; this is the tidy path.
      - name: Stop the shared preview
        if: always()
        run: |
          pid=$(cat /tmp/arena-preview.pid 2>/dev/null || echo "")
          [ -n "$pid" ] && kill "$pid" 2>/dev/null || true
          exit 0
