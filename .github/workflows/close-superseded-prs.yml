# ─────────────────────────────────────────────────────────────────────────────
# CLOSE SUPERSEDED PULL REQUESTS — the step between "named" and "resolved".
#
# Autopilot lands what can land. report-stuck-prs.sh names what cannot. Nothing
# ever resolved anything, and on 2026-08-26 that gap became visible: a swarm
# opened 455 pull requests, 320 merged, and 116 were left conflicted. Issue #375
# listed all of them correctly every thirty minutes for a day and a half and
# nobody acted, because ninety-six rows of "resolve it hunk by hunk" is not a
# task list, it is wallpaper.
#
# Almost none of them needed resolving. The same fix had already reached main
# through a sibling branch from the same swarm. This closes those, with the
# evidence, so the stuck-PR issue shrinks to the ones that need a person.
#
# CADENCE: every six hours, not every thirty minutes. A redundant pull request
# is not an emergency, and the schedule line on agent-autopilot.yml records what
# frequent sweeps cost across seven repos. Nothing here is time-critical.
#
# NOT FOLDED INTO agent-autopilot.yml ON PURPOSE: that file is listed in
# estate-integrity.sh's SHARED_FILES and must stay byte-identical in all seven
# repos. Editing it here alone would raise an estate-drift issue within the
# hour. A new file carries no such contract.
# ─────────────────────────────────────────────────────────────────────────────
name: Close Superseded PRs

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would close, close nothing'
        type: boolean
        default: true
      min_age_h:
        description: 'Only consider pull requests at least this many hours old'
        type: string
        default: '24'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: close-superseded-prs
  cancel-in-progress: false

jobs:
  reap:
    name: Close pull requests that propose nothing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required: the script asks git for the merge base of
          # every candidate against the default branch, and a depth-1 clone has
          # no merge base to find. blob:none keeps that affordable — trees and
          # commits are fetched, file contents only when actually read.
          fetch-depth: 0
          filter: blob:none

      - name: Mint a GitHub App installation token
        id: app-token
        if: vars.AUTOPILOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}

      - name: Close superseded pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # A scheduled run acts. A manual run defaults to reporting only, so
          # anyone can see the verdict list before trusting it.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          MIN_AGE_H: ${{ github.event_name == 'workflow_dispatch' && inputs.min_age_h || '24' }}
        run: bash .github/scripts/close-superseded-prs.sh
