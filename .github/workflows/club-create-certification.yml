        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: >-
          psql
          "host=aws-0-us-west-2.pooler.supabase.com port=6543 dbname=postgres user=postgres.kuklfnapbkmacvwxktbh sslmode=require connect_timeout=8"
          -X -v ON_ERROR_STOP=1
          -f supabase/migrations/20260831163500_remove_dead_club_join_requests_dependency.sql
      - name: Certify Authenticated Club Creation And Cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx
          CLUB_CREATE_CERT_ASSET_URL: https://smarter.poker/hub/club-arena/club-logos/preset-19.webp
        run: node scripts/ci/certify-club-create.mjs
