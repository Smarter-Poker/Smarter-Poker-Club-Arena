name: Club Create Certification

on:
  repository_dispatch:
    types: [certify-club-create]
  workflow_run:
    workflows: ['Publish Club Arena']
    types: [completed]

concurrency:
  # This certificate creates real, reserved fixtures and its `always()` steps
  # retire them. A later publish must queue behind it, never cancel cleanup.
  group: club-create-certification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certify:
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Each guarded account cleanup may wait six minutes for an active platform
    # freeze to clear. Keep enough time for install, provenance, both fixture
    # families, UI proof and both cleanup paths.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Wait For This Exact Revision On Both Public Endpoints
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          for attempt in $(seq 1 40); do
            origin="$(curl -fsS -H 'Cache-Control: no-cache' "https://ca-static.smarter.poker/build-info.json?cert=$RANDOM" || true)"
            public="$(curl -fsS -H 'Cache-Control: no-cache' "https://smarter.poker/hub/club-arena/build-info.json?cert=$RANDOM" || true)"
            origin_sha="$(printf '%s' "$origin" | node scripts/ci/production-e2e-provenance.mjs build-info 2>/dev/null || true)"
            public_sha="$(printf '%s' "$public" | node scripts/ci/production-e2e-provenance.mjs build-info 2>/dev/null || true)"
            if [[ "$origin_sha" == "$expected" && "$public_sha" == "$expected" ]]; then
              echo "Both public endpoints serve exact revision $expected."
              exit 0
            fi
            echo "Attempt $attempt: waiting for exact revision $expected (origin=${origin_sha:-invalid}, public=${public_sha:-invalid})."
            sleep 15
          done
          echo "::error::Both public endpoints did not converge on exact revision $expected."
          exit 1
      - name: Certify Authenticated Club Creation And Cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx
          CLUB_CREATE_CERT_ASSET_URL: https://smarter.poker/hub/club-arena/club-logos/preset-19.webp
        run: node scripts/ci/certify-club-create.mjs
      - name: Provision A Brand-New Player
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs create
      - name: Create A Club Through The Published User Interface
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          E2E_NEW_CLUB_CERT: '1'
          E2E_REQUIRE_AUTH: '1'
          PLAYWRIGHT_WORKERS: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx
        # A retry would create another real club before `always()` cleanup.
        run: npx playwright test tests/e2e/production-create-club.spec.ts --project=chromium --workers=1 --retries=0
      - name: Retire The Created Club
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs retire-create-clubs
      - name: Delete The Reserved Player
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs cleanup
      - name: Upload Create Club Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-club-production-evidence
          path: |
            test-results/create-club-ready-mobile.png
            test-results/create-club-opened-mobile.png
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
