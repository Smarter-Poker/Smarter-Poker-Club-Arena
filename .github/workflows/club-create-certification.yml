name: Club Create Certification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/create-club-crest-vault-20260831
    paths:
      - .github/workflows/club-create-certification.yml
      - public/club-logos/**
      - scripts/ci/certify-club-create.mjs
      - src/components/modals/CreateClubModal.tsx
      - src/services/ClubsService.ts
      - supabase/migrations/20260831163500_remove_dead_club_join_requests_dependency.sql

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Certify Authenticated Club Creation And Cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx
          CLUB_CREATE_CERT_ASSET_URL: https://smarter.poker/hub/club-arena/club-logos/preset-19.webp
        run: node scripts/ci/certify-club-create.mjs
