name: Club Create Certification

on:
  workflow_dispatch:
  push:
    branches:
      - feature/create-club-crest-vault-20260831

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply Club Creation Repair
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          for attempt in $(seq 1 12); do
            if PGOPTIONS='-c lock_timeout=8s -c statement_timeout=30s' psql \
              "host=aws-0-us-west-2.pooler.supabase.com port=6543 dbname=postgres user=postgres.kuklfnapbkmacvwxktbh sslmode=require connect_timeout=8" \
              -X -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260831163500_remove_dead_club_join_requests_dependency.sql; then
              exit 0
            fi
            echo "Repair Lock Attempt ${attempt} Did Not Complete. Retrying."
            sleep $((attempt * 2))
          done
          echo "Club Creation Repair Could Not Acquire Its Schema Lock."
          exit 1
      - name: Certify Authenticated Club Creation And Cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx
          CLUB_CREATE_CERT_ASSET_URL: https://smarter.poker/hub/club-arena/club-logos/preset-19.webp
        run: node scripts/ci/certify-club-create.mjs
