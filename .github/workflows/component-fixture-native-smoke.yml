name: Component fixture native smoke
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      connected_ui_observations:
        required: false
        default: false
        type: boolean
      web_artifact_run_id:
        required: false
        type: string
      web_artifact_id:
        required: false
        type: string
      engine_source_sha:
        required: false
        type: string
    secrets:
      DATABASE_URL:
        required: false
    outputs:
      native_verified:
        description: True only after native assertions and all cleanup pass
        value: ${{ jobs.native-smoke.outputs.native_verified }}
      source_sha:
        description: Exact source verified by the native driver
        value: ${{ jobs.native-smoke.outputs.source_sha }}
permissions:
  contents: read
  actions: read
concurrency:
  group: fixture-native-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  native-smoke:
    if: >-
      (!inputs.connected_ui_observations && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (inputs.connected_ui_observations && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && github.repository_id == '1132369872' &&
      github.repository == 'Smarter-Software-PIQ/Smarter-Poker-Club-Arena' &&
      github.workflow_ref == 'Smarter-Software-PIQ/Smarter-Poker-Club-Arena/.github/workflows/schema-manifest-refresh.yml@refs/heads/main' &&
      inputs.source_sha == github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.connected_ui_observations && 120 || 55 }}
    outputs:
      native_verified: ${{ steps.smoke.outputs.native_verified }}
      source_sha: ${{ steps.smoke.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Native alert intake survives actual process death without duplicate queue submission
        if: ${{ !inputs.connected_ui_observations }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: node --test tools/production-alerts-native-wakeup/state.test.mjs
      - name: Install locked fixture test dependencies on the disposable CI runner
        run: npm ci --prefix operations/release/fixture --ignore-scripts --no-audit --no-fund
      - name: Compile the actual engine for isolated EV actors
        run: |
          npm ci --prefix server --ignore-scripts --no-audit --no-fund
          npm run build --prefix server
      - name: Check financial route and fixture ownership boundaries
        if: ${{ !inputs.connected_ui_observations }}
        run: |
          node --test operations/release/fixture/tournament-admission.test.mjs operations/release/fixture/actors.test.mjs operations/release/fixture/financial-route-phase.test.mjs tests/operations/financial-checkpoint-observer.test.mjs tests/operations/financial-topup-verifier.test.mjs tests/operations/financial-insurance-verifier.test.mjs tests/operations/fixture-runtime-files.test.mjs tests/operations/financial-route-suite.test.mjs tests/operations/component-source-contract.test.mjs tests/operations/fixture-seed.test.mjs
          node --test tests/operations/fixture-auth-bootstrap.test.mjs tests/operations/fixture-service-role-boundary.test.mjs tests/operations/fixture-cron-provider.test.mjs tests/operations/fixture-safeupdate-provider.test.mjs
          node --test tests/operations/fixture-supervisor.test.mjs tests/operations/fixture-database-owner.test.mjs tests/operations/fixture-auth.test.mjs tests/operations/fixture-gateway.native.test.mjs tests/operations/fixture-realtime-launcher.test.mjs tests/operations/fixture-realtime-listener.test.mjs
          node --test tests/operations/fixture-native-diagnostics.test.mjs tests/operations/fixture-service-preimage.test.mjs tests/operations/fixture-role-alignment.test.mjs tests/operations/fixture-role-alignment-render.test.mjs
          node --test tests/fixtures/ev-cashout-lifecycle/diagnostics.test.mjs tests/fixtures/ev-cashout-lifecycle/controller-sequence.test.mjs
          node --test operations/release/fixture/representative/*.test.mjs
          python3 tests/fixtures/ev-cashout-lifecycle/bootstrap.test.py
          python3 tests/operations/native-component-semantics.test.py
          python3 -B tests/operations/connected-ui-native.test.py
          python3 tests/operations/fixture-smoke-runner.test.py
          python3 tests/operations/fixture-smoke-lifecycle.test.py
          python3 tests/operations/fixture-native-diagnostics.test.py
      - name: Require native PostgreSQL17 read-only export client
        if: inputs.connected_ui_observations
        run: |
          if [[ ! -x /usr/lib/postgresql/17/bin/pg_dump ]]; then
            sudo python3 scripts/ci/ubuntu-apt-mirror.py
            pg_sources="$(mktemp -d "$RUNNER_TEMP/isolated-export-apt.XXXXXX")"
            chmod 755 "$pg_sources"
            cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
            apt_options=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error --location --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            pg_codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
            printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$pg_codename" > "$pg_sources/pgdg.sources"
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends postgresql-client-17
          fi
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -Eq '^pg_dump \(PostgreSQL\) 17\.'
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Capture private schema-only qualification candidate
        if: inputs.connected_ui_observations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMPDIR: ${{ runner.temp }}
        run: node operations/release/fixture/schema-snapshot.mjs "$RUNNER_TEMP/isolated-schema-candidate"
      - name: Build exact committed fixture and smoke native services
        id: smoke
        env:
          FIXTURE_SOURCE_SHA: ${{ inputs.source_sha }}
          FIXTURE_CONNECTED_UI: ${{ inputs.connected_ui_observations }}
          FIXTURE_WEB_ARTIFACT_RUN_ID: ${{ inputs.web_artifact_run_id }}
          FIXTURE_WEB_ARTIFACT_ID: ${{ inputs.web_artifact_id }}
          FIXTURE_ENGINE_SOURCE_SHA: ${{ inputs.engine_source_sha }}
          GH_TOKEN: ${{ inputs.connected_ui_observations && github.token || '' }}
          TMPDIR: ${{ runner.temp }}
        run: |
          if [[ "$FIXTURE_CONNECTED_UI" == true ]]; then
            python3 -B operations/release/ci/fixture-smoke.py . "$RUNNER_TEMP/isolated-ui-evidence" "$FIXTURE_SOURCE_SHA" --connected-observations
          else
            python3 -B operations/release/ci/fixture-smoke.py . "$RUNNER_TEMP/fixture-smoke-evidence" "$FIXTURE_SOURCE_SHA"
          fi
          echo "native_verified=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$FIXTURE_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Preserve sanitized native smoke and cleanup observations
        if: always() && !inputs.connected_ui_observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: draft-native-fixture-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fixture-smoke-evidence/native-smoke-receipt.json
            ${{ runner.temp }}/fixture-smoke-evidence/ev-cashout-lifecycle.json
            ${{ runner.temp }}/fixture-smoke-evidence/native-service-preimage.json
            ${{ runner.temp }}/fixture-smoke-evidence/native-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Remove private candidate on every outcome
        if: always() && inputs.connected_ui_observations
        run: python3 -B operations/release/native/observe-connected-ui.py --cleanup-private "$RUNNER_TEMP/isolated-schema-candidate"
      - name: Preserve only sanitized connected observation receipts
        if: always() && inputs.connected_ui_observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-connected-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/isolated-ui-evidence/native-smoke-receipt.json
            ${{ runner.temp }}/isolated-ui-evidence/connected-ui-observations.json
            ${{ runner.temp }}/isolated-ui-evidence/schema-preflight-receipt.json
            ${{ runner.temp }}/isolated-ui-evidence/private-cleanup.json
          if-no-files-found: error
          retention-days: 7
