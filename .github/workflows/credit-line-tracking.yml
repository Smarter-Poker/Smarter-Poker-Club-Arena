name: Credit line tracks the funded wallet
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/credit-line-tracking.yml'
      - 'scripts/ci/credit-tracking-*.mjs'
      - 'supabase/migrations/*credit_line_tracks*'
      - 'src/services/cashierBalanceRead.ts'
  workflow_dispatch:
concurrency:
  group: credit-line-tracking-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  catalog:
    name: Read credit tracking financial owners
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Read fixed catalog with no financial writes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ci/credit-tracking-catalog.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: credit-tracking-catalog-${{ github.run_id }}
          path: artifacts/credit-tracking/catalog.json
          retention-days: 7
          if-no-files-found: error
