# ─────────────────────────────────────────────────────────────────────────────
# A SCHEDULED JOB THAT NEVER SUCCEEDS MUST BE SAID OUT LOUD
#
# sp_upcoming_tournament_pushes ran every minute and failed 4,017 consecutive
# times over nearly three days - the "your tournament starts in 15 minutes"
# reminders, silently off. Every one of those failures was already sitting in
# cron.job_run_details. Nothing read it.
#
# 20260831193608 widened v_system_health_cron from three name prefixes to all
# 75 active jobs and added fn_ca_cron_health(). 20260831193846 taught it that a
# run still in flight has not failed. This is the half that makes somebody look.
#
# SCHEDULED, NOT A PR GATE - same reasoning as applied-migrations-recorded.yml:
# a broken cron job is not a reason to block an unrelated branch, it is a reason
# for a red run in the Actions tab that someone can act on.
#
# RED means: at least one active job ran in the window and NEVER ONCE succeeded.
# That is the exact shape that hid for three days. Flaky jobs (some failures,
# some successes) are `warn` and do not fail the run.
# ─────────────────────────────────────────────────────────────────────────────
name: Cron Health

on:
  schedule:
    # Every six hours. The push job was broken for 4,017 minutes; six hours is
    # a 36x improvement on "nobody ever" without being noise.
    - cron: '40 1,7,13,19 * * *'
  repository_dispatch:
    types: [audit-cron-health]
  # RUN IT NOW (2026-09-19). Six hours is the right cadence for an alarm and the
  # wrong one for a person who has just fixed a failing job and wants to watch
  # it go green. Adds no schedule and no new case: github.event.schedule is
  # already empty on the repository_dispatch above, and this workflow's job
  # carries no `if:` that reads it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-health
  cancel-in-progress: false

jobs:
  check:
    name: No scheduled job is failing silently
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ask the database which scheduled work is failing
        id: cron
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          # Exit 1 = a job never succeeded. Exit 2 = the script itself could not
          # run (no credentials, RPC missing). Both must be visible; neither may
          # be swallowed by the pipe.
          set +e
          node scripts/ci/check-cron-health.mjs 2>&1 | tee /tmp/cron-health.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      # -- THE OTHER THING ONLY THE DATABASE KNOWS (2026-08-31) -------------
      #
      # Dan's copy rules have five source gates and every one of them reads
      # files. A Postgres function hands its RAISE message and its jsonb
      # {'message': ...} straight to the client, which toasts it verbatim, so
      # 120 functions were serving banned dash characters to players while all
      # five gates reported OK. Migration 20260831202752 cleaned them and left
      # fn_ca_banned_copy_characters() behind; this is the thing that reads it.
      #
      # It lives HERE rather than in ci.yml because this is the workflow that
      # already holds the service-role credentials, and because the question it
      # asks - what does production actually serve - is the same question the
      # cron check asks. A source-only CI job cannot answer either one.
      - name: Ask the database whether it serves any banned copy characters
        id: dbcopy
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          set +e
          node scripts/ci/check-db-copy.mjs 2>&1 | tee /tmp/db-copy.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      # THE ROSTER, OUTSIDE THE DATABASE (2026-09-19).
      #
      # 20260906114257 deleted ca_expected_cron_jobs and the hourly job that
      # watched it, and kept the finding in prose: a migration recorded as
      # applied whose cron job was simply gone from cron.job, invisible because
      # every cron check measures jobs that RUN AND FAIL. This writes the active
      # roster to a file git owns, on the schedule this workflow already has.
      # No table, no new timer, no watcher.
      - name: Anchor the scheduled-work roster outside the database
        id: roster
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          set +e
          node scripts/ci/anchor-cron-roster.mjs 2>&1 | tee /tmp/cron-roster.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      - name: Summary
        if: always()
        run: |
          {
            echo "## Scheduled job health"
            echo ""
            echo '```'
            cat /tmp/cron-health.log 2>/dev/null || echo "(the check produced no output)"
            echo '```'
            echo ""
            echo "## Database copy rules"
            echo ""
            echo '```'
            cat /tmp/db-copy.log 2>/dev/null || echo "(the check produced no output)"
            echo '```'
            echo ""
            echo "\`critical\` = ran in the window and never once succeeded. Read the job's"
            echo "last error above, then \`select * from public.fn_ca_cron_health();\` as"
            echo "service_role for the full picture."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run when a job never succeeded
        if: steps.cron.outputs.status != '0'
        run: |
          echo "::error title=Cron job failing silently::At least one active scheduled job ran and never succeeded. See the job summary."
          exit 1

      - name: Fail the run when the database serves a banned character
        if: always() && steps.dbcopy.outputs.status != '0'
        run: |
          echo "::error title=Banned copy character in the database::A public function still carries a dash character Dan banned. See the job summary."
          exit 1

      - name: Fail the run when the roster changed
        if: always() && steps.roster.outputs.status != '0'
        run: |
          echo "::error title=Scheduled-work roster changed::A pg_cron job appeared or vanished on production. See the job summary, then commit the regenerated docs/attestation/cron-roster.tsv and the new count in tests/the-scheduled-work-roster-is-pinned.law.test.ts."
          exit 1
