name: Deploy Hetzner Engine

# Mirror of server/deploy-hetzner.sh, triggerable from anywhere with the
# right GitHub PAT — no Mac SSH access required. Cowork uses this to ship
# engine fixes without going through Antigravity.
#
# Required repo secrets:
#   HETZNER_SSH_KEY  — full contents of ~/.ssh/openclaw_ed25519 private key
#   HETZNER_HOST     — Hetzner VPS IP (e.g. 178.156.160.206)
#
# Trigger:
#   gh workflow run deploy-hetzner.yml -f confirm=deploy
# or via API with the repo PAT:
#   POST /repos/Smarter-Poker/Smarter-Poker-Club-Arena/actions/workflows/deploy-hetzner.yml/dispatches
#   body: { "ref": "main", "inputs": { "confirm": "deploy" } }

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        type: string
      ref_sha:
        description: 'Optional commit SHA to verify after deploy (will fail deploy if container HEAD != this SHA)'
        required: false
        type: string

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "::error::You must type 'deploy' to confirm. Got: '${{ github.event.inputs.confirm }}'"
          exit 1

  deploy:
    name: Deploy to Hetzner
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      SSH_USER: root
      CONTAINER: club-arena-engine
      REPO_DIR: /opt/club-arena
      ENGINE_URL: https://engine.smarter.poker

    steps:
      - name: Checkout (for log/audit trail)
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # sanity-check the key parses
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null

      - name: Capture pre-deploy state
        id: pre
        run: |
          BEFORE_SHA=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HETZNER_HOST" \
            "cd $REPO_DIR && git rev-parse HEAD" 2>&1 || echo "unknown")
          echo "before_sha=$BEFORE_SHA" >> $GITHUB_OUTPUT
          echo "Pre-deploy commit on host: $BEFORE_SHA"

      - name: Pre-flight Sentry check
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HETZNER_HOST" \
            "grep -q '^SENTRY_DSN=..' /opt/club-arena/server/.env 2>/dev/null \
              && echo '   ✅ SENTRY_DSN present' \
              || echo '   ⚠️  SENTRY_DSN missing — Sentry will not capture engine errors (non-blocking)'"

      - name: Pull latest code on host
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HETZNER_HOST" \
            "cd $REPO_DIR && git fetch origin && git reset --hard origin/main"

      - name: Rebuild Docker image
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HETZNER_HOST" \
            "cd $REPO_DIR/server && docker build -t $CONTAINER ."

      - name: Stop and remove old container
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HETZNER_HOST" \
            "docker stop $CONTAINER 2>/dev/null || true && docker rm $CONTAINER 2>/dev/null || true"

      - name: Start new container
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HETZNER_HOST" \
            "docker run -d \
              --name $CONTAINER \
              --restart always \
              -p 8080:8080 \
              --env-file $REPO_DIR/server/.env \
              $CONTAINER"

      - name: Health check
        id: health
        run: |
          # Give it a few seconds to bind 8080
          sleep 5
          for i in 1 2 3 4 5 6; do
            HEALTH=$(curl -sf "$ENGINE_URL/health" || echo "FAILED")
            if echo "$HEALTH" | grep -q '"running":true'; then
              echo "✅ Engine is healthy on attempt $i"
              echo "$HEALTH" | python3 -m json.tool
              UPTIME=$(echo "$HEALTH" | python3 -c "import json,sys; print(json.load(sys.stdin).get('uptime', -1))")
              echo "uptime=$UPTIME" >> $GITHUB_OUTPUT
              # uptime should be < 60s if container actually restarted
              if [ "$UPTIME" -ge 60 ]; then
                echo "::warning::uptime=$UPTIME — container may not have restarted, but engine is responding"
              fi
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 5s..."
            sleep 5
          done
          echo "::error::Health check failed after 6 attempts"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HETZNER_HOST" \
            "docker logs --tail 80 $CONTAINER" || true
          exit 1

      - name: Verify deployed SHA matches expectation
        if: ${{ github.event.inputs.ref_sha != '' }}
        run: |
          AFTER_SHA=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HETZNER_HOST" \
            "cd $REPO_DIR && git rev-parse HEAD")
          echo "Post-deploy commit on host: $AFTER_SHA"
          EXPECTED="${{ github.event.inputs.ref_sha }}"
          # Accept full or short SHA prefix match
          if [[ "$AFTER_SHA" == "$EXPECTED"* ]] || [[ "$EXPECTED" == "$AFTER_SHA"* ]]; then
            echo "✅ Deployed SHA matches expected ($EXPECTED)"
          else
            echo "::error::Deployed SHA ($AFTER_SHA) does NOT match expected ($EXPECTED)"
            exit 1
          fi

      - name: Capture post-deploy state
        id: post
        run: |
          AFTER_SHA=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HETZNER_HOST" \
            "cd $REPO_DIR && git rev-parse HEAD")
          echo "after_sha=$AFTER_SHA" >> $GITHUB_OUTPUT
          echo "## Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Before: \`${{ steps.pre.outputs.before_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- After:  \`$AFTER_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- Engine uptime: ${{ steps.health.outputs.uptime }}s" >> $GITHUB_STEP_SUMMARY
          echo "- URL: $ENGINE_URL" >> $GITHUB_STEP_SUMMARY

      - name: Prune old Docker images
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$SSH_USER@$HETZNER_HOST" \
            "docker image prune -f" || true

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
