name: A Diamond cluster tick skips an operator closed table

# fn_poker_diamond_project_cluster (migration 20261015181551). Runs
# scripts/ci/test-diamond-cluster-operator-close.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definitions
# captured 2026-10-15 must refuse a cluster for an operator-closed sibling,
# and the migration must admit it, still refuse an open table that is not
# plain cash, judge a reopened table again, and reproduce production's derived
# postimage md5. No timer (CLAUDE.md 10.85): pull_request only, scoped to the
# paths it proves.

on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261015181551_a_diamond_cluster_tick_skips_an_operator_closed_table.sql
      - scripts/ci/fixtures/diamond-cluster-operator-close/**
      - scripts/ci/test-diamond-cluster-operator-close.py
      - .github/workflows/diamond-cluster-operator-close.yml

permissions:
  contents: read

concurrency:
  group: diamond-cluster-operator-close-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diamond-cluster-operator-close:
    name: An operator closed table never refuses a Diamond cluster
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: An operator closed table never refuses a Diamond cluster
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-diamond-cluster-operator-close.py --output artifacts/diamond-cluster-operator-close
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-cluster-operator-close-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/diamond-cluster-operator-close/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
