name: Daily digest findings fixed at the root

# fn_refuse_while_frozen (migration 20261016103946) and
# fn_sp_daily_metrics_compute (migration 20261016104001). Runs
# scripts/ci/test-digest-findings-at-the-root.py against a throwaway
# PostgreSQL 17 cluster, never production: each function's exact production
# text (pg_get_functiondef md5 equal to the live function) shows its defect,
# and each migration must fix it and reproduce production's derived
# postimage md5. No timer (CLAUDE.md 10.85): pull_request only, scoped to the
# paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261016103946_a_new_account_s_empty_wallet_is_not_frozen.sql
      - supabase/migrations/20261016104001_the_digest_counts_real_crashes_and_failed_deploys.sql
      - supabase/migrations/20261016100458_sp_daily_digest_standalone_rake_and_club_ranking.sql
      - scripts/ci/fixtures/digest-findings-at-the-root/**
      - scripts/ci/test-digest-findings-at-the-root.py
      - .github/workflows/digest-findings-at-the-root.yml

permissions:
  contents: read

concurrency:
  group: digest-findings-at-the-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digest-findings-at-the-root:
    name: Digest findings, a frozen signup gets its wallet, crashes and deploy failures are real
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Digest findings, a frozen signup gets its wallet, crashes and deploy failures are real
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-digest-findings-at-the-root.py --output artifacts/digest-findings-at-the-root
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-findings-at-the-root-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/digest-findings-at-the-root/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
