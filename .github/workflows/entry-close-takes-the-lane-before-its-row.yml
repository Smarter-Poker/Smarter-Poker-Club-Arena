name: Entry close takes the lane before its row

# fn_close_tournament_entry_window and fn_close_tournament_addon_period
# (migration 20261025030526). Runs
# scripts/ci/test-entry-close-takes-the-lane-before-its-row.py against a
# throwaway PostgreSQL 17 cluster, never production: the exact production
# definitions captured 2026-10-24 (pg_get_functiondef md5 equal to the live
# functions) of both entry-close doors, the lane helper and the deferred
# pay-at-finalization trigger must reproduce the 40P01 with an add-on and
# with a hand that hold the tournament lane and wait for the row; after the
# unmodified migration file the partner waits on the lane instead, the payer
# runs to completion at the door's COMMIT and no alert is written. No timer
# (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261025030526_entry_close_takes_the_tournament_lane_before_its_row.sql
      - scripts/ci/fixtures/entry-close-lane/**
      - scripts/ci/test-entry-close-takes-the-lane-before-its-row.py
      - .github/workflows/entry-close-takes-the-lane-before-its-row.yml

permissions:
  contents: read

concurrency:
  group: entry-close-takes-the-lane-before-its-row-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entry-close-takes-the-lane-before-its-row:
    name: Entry close takes the tournament lane before its row
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Entry close takes the tournament lane before its row
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-entry-close-takes-the-lane-before-its-row.py --output artifacts/entry-close-takes-the-lane-before-its-row
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-close-takes-the-lane-before-its-row-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/entry-close-takes-the-lane-before-its-row/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
