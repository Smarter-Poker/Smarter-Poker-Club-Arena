# ─────────────────────────────────────────────────────────────────────────────
# ESTATE DIGEST — the morning page (added 2026-09-01, phase 3 of the audit)
#
# One scheduled run a day that answers, in one place, the questions whose
# answers kept arriving as surprises: is production serving main, how much did
# the agents merge and burn, are the crons alive, what does the incident board
# hold, and how far has migration-record drift been worked down.
#
# Delivery is the single `estate-digest`-labeled issue (updated in place -
# the edit history IS the archive) plus an in-app notification to every
# active platform-scope recipient, the same audience the daily chip
# attestation already reaches.
#
# Cheap by design: one job, ~1 billed minute, once a day. The script exits 0
# no matter what it could not read; a section that failed says so in the
# digest itself, because a red daily job becomes wallpaper within a week.
# ─────────────────────────────────────────────────────────────────────────────
name: Estate Digest

on:
  schedule:
    # 11:07 UTC = 6:07am Chicago - on Dan's desk before the day starts.
    - cron: '7 11 * * *'
  repository_dispatch:
    types: [run-estate-digest]

permissions:
  contents: read
  issues: write

concurrency:
  group: estate-digest
  cancel-in-progress: false

jobs:
  digest:
    name: One page before the surprise
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          owner: Smarter-Poker
          repositories: Smarter-Poker-Club-Arena,Smarter-Poker-World-Hub

      - name: Gather and deliver
        env:
          # Cross-repo reads on the App token (World Hub is a separate private
          # repo); issue writes on GITHUB_TOKEN, the same split as the
          # read-only audits, because the App deliberately has no issues scope.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN_ISSUES: ${{ github.token }}
          REPO: ${{ github.repository }}
          WH_REPO: Smarter-Poker/Smarter-Poker-World-Hub
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/estate-digest.mjs
