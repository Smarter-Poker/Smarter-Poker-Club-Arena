name: Explicit table access
# The check reads only the migrations a change adds or edits (git diff --
# supabase/migrations), so a change touching none of these paths cannot change
# its answer. Not a required check. 2026-10-25: 54 of 99 pull request runs in six
# hours were on pull requests that touched no migration.
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/ci/check-explicit-table-access.mjs'
      - 'scripts/ci/recording-only.mjs'
      - 'scripts/ci/recorded-migrations.manifest.json'
      - 'tests/explicit-table-access.test.mjs'
      - '.github/workflows/explicit-table-access.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/ci/check-explicit-table-access.mjs'
      - 'scripts/ci/recording-only.mjs'
      - 'scripts/ci/recorded-migrations.manifest.json'
      - 'tests/explicit-table-access.test.mjs'
      - '.github/workflows/explicit-table-access.yml'
# Pull request runs are pure checks on refs/pull/N/merge: a newer push
# supersedes the older run, so it is cancelled. A push to main checks its own
# before..after range, which a later main push does not re-read, so each main
# run keeps a per-SHA group and is never cancelled.
concurrency:
  group: explicit-table-access-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  explicit-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify explicit table declaration boundaries
        env:
          TABLE_ACCESS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test tests/explicit-table-access.test.mjs
          node scripts/ci/check-explicit-table-access.mjs
