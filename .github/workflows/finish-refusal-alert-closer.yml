name: Finish refusal alert closer (PostgreSQL 17)

# The regression for migration 20261001151637 (class 5 of
# fn_resolve_settled_financial_alerts: a retried tournament finish refusal
# closes only when its terminal receipt settled and paid). It lives in its own
# workflow instead of a ci.yml accounting_postgres step so that ci.yml, the
# change classifier and every pin of their bytes stay unchanged. The install
# step and the regression commands are the exact ones the accounting job uses,
# on the same runner image, as the same non-root runner user.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261001151637_a_retried_finish_refusal_closes_when_its_terminal_receipt_se.sql'
      - 'scripts/ci/test-finish-refusal-alert-closer-postgres.py'
      - 'scripts/ci/fixtures/finish-refusal-alert-closer/**'
      - '.github/workflows/finish-refusal-alert-closer.yml'

permissions:
  contents: read

concurrency:
  group: finish-refusal-alert-closer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finish_refusal_alert_closer:
    name: A retried finish refusal closes only when its terminal receipt settled
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL 17 tools without a default database service
        shell: bash
        run: |
          set -euo pipefail
          pg_ci_build_tools_ready=true
          for pg_ci_tool in cc make bison flex perl tar bzip2 patch; do
            if ! command -v "$pg_ci_tool" >/dev/null; then pg_ci_build_tools_ready=false; fi
          done
          if [[ "$pg_ci_build_tools_ready" == true &&
                -x /usr/lib/postgresql/17/bin/initdb &&
                -x /usr/lib/postgresql/17/bin/pg_config &&
                -f /usr/include/postgresql/17/server/postgres.h &&
                -f /usr/share/postgresql/17/extension/pg_cron.control &&
                -f /usr/lib/postgresql/17/lib/pg_cron.so ]]; then exit 0; fi
          # The hosted image also configures Chrome and Microsoft repositories.
          # An unrelated Chrome index hash mismatch blocked this accounting job.
          # Limit this installation to signed Ubuntu and PostgreSQL sources.
          pg_ci_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_ci_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_ci_sources/ubuntu.sources"
          pg_ci_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_ci_sources")
          sudo apt-get "${pg_ci_apt[@]}" update
          sudo apt-get "${pg_ci_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          pg_ci_codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$pg_ci_codename" > "$pg_ci_sources/pgdg.sources"
          sudo apt-get "${pg_ci_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_ci_apt[@]}" install -y --no-install-recommends postgresql-17 postgresql-17-cron postgresql-server-dev-17 build-essential bison flex perl bzip2 patch
      - name: A retried finish refusal closes only when its terminal receipt settled
        id: finish_refusal_alert_closer
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: |
          # The preimage must leave a settled, paid refusal open (the defect);
          # the migration must close it and nothing unproven. The baseline must
          # fail for exactly that reason: an infrastructure or fixture error
          # never counts as proof of the defect.
          if baseline_out=$(python3 scripts/ci/test-finish-refusal-alert-closer-postgres.py --baseline 2>&1); then
            printf '%s\n' "$baseline_out"
            echo "baseline unexpectedly passed: the regression no longer detects the defect" >&2
            exit 1
          fi
          printf '%s\n' "$baseline_out"
          if ! grep -qF 'a retried finish whose terminal receipt settled and paid is still open' <<<"$baseline_out"; then
            echo "baseline failed for a reason other than the defect" >&2
            exit 1
          fi
          python3 scripts/ci/test-finish-refusal-alert-closer-postgres.py
