name: Horse human results
on:
  pull_request:
    paths:
      - scripts/horse-human-scoreboard.mjs
      - scripts/ci/test-horse-human-scoreboard.mjs
      - .github/workflows/horse-human-scoreboard.yml
  push:
    branches: [main]
    paths:
      - scripts/horse-human-scoreboard.mjs
      - scripts/ci/test-horse-human-scoreboard.mjs
      - .github/workflows/horse-human-scoreboard.yml
concurrency:
  group: horse-human-scoreboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scoreboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Install PostgreSQL tools on the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x /usr/lib/postgresql/17/bin/initdb ]]; then exit 0; fi
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-17
      - name: Qualify report against an isolated database
        env:
          PG_SCOREBOARD_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: node --test scripts/ci/test-horse-human-scoreboard.mjs
