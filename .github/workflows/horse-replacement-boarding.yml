name: Original replacement horse DSS boarding
run-name: Original 62 horse DSS boarding - ${{ inputs.mode || 'qualification' }}
on:
  pull_request:
    branches: [main]
    paths:
      - server/src/services/HorseReplacementBoarding*.ts
      - server/src/scripts/boardRetiredHorseReplacements.ts
      - server/src/services/supabase/client.ts
      - server/src/services/supabase/replacementSubjectClient.test.ts
      - server/src/services/TournamentManagerRequestFence.guard.test.ts
      - scripts/ci/test-replacement-horse-boarding.py
      - scripts/ci/fixtures/replacement-boarding/**
      - scripts/ci/fixtures/patterned-horse-retirement-cohort.json
      - .github/workflows/horse-replacement-boarding.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect or execute the finite original DSS membership operation after births
        type: choice
        options: [inspect, execute]
        default: inspect
        required: true
permissions:
  contents: read
concurrency:
  group: horse-replacement-boarding-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix server --ignore-scripts
      - run: server/node_modules/.bin/tsc --noEmit -p server/tsconfig.json
      - name: Qualify original subject transport and finite recovery
        working-directory: server
        run: node_modules/.bin/vitest run src/services/HorseReplacementBoarding.test.ts src/services/HorseReplacementBoardingTransport.test.ts src/services/supabase/replacementSubjectClient.test.ts src/services/TournamentManagerRequestFence.guard.test.ts
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      - name: Exercise actual ordinary join and KingFish referral owners
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: python3 scripts/ci/test-replacement-horse-boarding.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-horse-boarding-${{ github.run_id }}
          path: work/replacement-boarding-native/RESULTS.json
          if-no-files-found: error
          retention-days: 90
  original-boarding:
    needs: qualification
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: original-patterned-horse-replacement-20261006
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix server --ignore-scripts
      - name: Use only original horse subject sessions and normal DSS membership door
        working-directory: server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --import tsx src/scripts/boardRetiredHorseReplacements.ts --${{ inputs.mode }}
