name: An in-progress close owns its tick

# fn_accounting_week_clubs and fn_process_weekly_accounting_scope (migration
# 20261016000241). Runs scripts/ci/test-in-progress-close-owns-its-tick.py
# against a throwaway PostgreSQL 17 cluster, never production: the exact
# production definitions (pg_get_functiondef md5 equal to the live functions,
# rebuilt through 20261015173123 and 20261015182133) must show the in-progress
# union visited behind a finished club, and the migration must reproduce
# production's derived postimage md5s, return the same week clubs as the old
# read on a randomized fixture, keep that answer only under the attempt's own
# week lock, and give an in-progress book its tick first.
# The same command ci.yml would run, kept in its own file so the change does
# not edit ci.yml. No timer (CLAUDE.md 10.85): pull_request only, scoped to
# the paths it proves. ci.yml has no push trigger, so neither does this.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261016000241_an_in_progress_close_owns_its_tick_and_reads_its_clubs_once.sql
      - supabase/migrations/20261015182133_a_proving_week_advances_on_its_own_tick.sql
      - supabase/migrations/20261015173123_a_calculating_week_advances_on_its_own_tick.sql
      - supabase/migrations/20261013212336_weekly_standalone_selector_callbacks_run_once_per_earning_cl.sql
      - supabase/migrations/20261013195428_weekly_cohort_cutoff_runs_once_per_earning_club.sql
      - scripts/ci/test-in-progress-close-owns-its-tick.py
      - .github/workflows/in-progress-close-owns-its-tick.yml

permissions:
  contents: read

concurrency:
  group: in-progress-close-owns-its-tick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  in-progress-close-owns-its-tick:
    name: An in-progress close owns its tick and reads its clubs once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: An in-progress close owns its tick and reads its clubs once
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-in-progress-close-owns-its-tick.py --output artifacts/in-progress-close-owns-its-tick
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: in-progress-close-owns-its-tick-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/in-progress-close-owns-its-tick/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
