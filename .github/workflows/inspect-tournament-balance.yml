name: Inspect Tournament Balance (Read Only)
on:
  workflow_dispatch:
    inputs:
      expected_engine_sha:
        description: Exact full currently serving engine release SHA
        required: true
        type: string
      tournament_prefixes:
        description: Comma-separated 8-character tournament id prefixes (at most 12)
        required: true
        type: string
      window_minutes:
        description: Minutes of engine log to read (5-240)
        required: true
        type: string
        default: '60'
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      EXPECTED_ENGINE_SHA: ${{ inputs.expected_engine_sha }}
      TOURNAMENT_PREFIXES: ${{ inputs.tournament_prefixes }}
      WINDOW_MINUTES: ${{ inputs.window_minutes }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read masked balance templates with pinned SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected SHA refused'; exit 1; }
          [[ "$TOURNAMENT_PREFIXES" =~ ^[0-9a-f]{8}(,[0-9a-f]{8}){0,11}$ ]] || { echo '::error::Prefixes refused'; exit 1; }
          [[ "$WINDOW_MINUTES" =~ ^[0-9]{1,3}$ ]] || { echo '::error::Window refused'; exit 1; }
          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo '::error::Configured host refused'; exit 1; }
          [ -n "$SSH_KEY" ] && [ -n "$HOST_KEY" ] || { echo '::error::Configured SSH metadata unavailable'; exit 1; }
          SSH_DIR="$RUNNER_TEMP/tournament-balance-ssh-$GITHUB_RUN_ID"
          install -d -m 0700 "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT
          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$HOST_KEY" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          ssh-keygen -y -f "$SSH_DIR/key" >/dev/null
          ssh-keygen -l -f "$SSH_DIR/known_hosts" >/dev/null
          timeout --signal=TERM --kill-after=5s 150s ssh \
            -i "$SSH_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "root@$HETZNER_HOST" "python3 - '$EXPECTED_ENGINE_SHA' '$TOURNAMENT_PREFIXES' '$WINDOW_MINUTES'" \
            < scripts/ci/inspect-tournament-balance.py > "$RUNNER_TEMP/tournament-balance.json"
          cat "$RUNNER_TEMP/tournament-balance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-balance-read-only-${{ github.run_id }}
          path: ${{ runner.temp }}/tournament-balance.json
          if-no-files-found: error
          retention-days: 7
