name: Inspect Tournament Refill (Read Only)
on:
  workflow_dispatch:
    inputs:
      expected_engine_sha:
        description: Exact full currently serving engine release SHA
        required: true
        type: string
      mtt_addon_policy:
        description: Verify the fixed pure MTT add-on selector from the exact installed image; no purchases
        required: false
        default: false
        type: boolean
      reference_cases_json:
        description: Optional v1 refusal, v2 preflop calloff, or v3 exact actor/seat/stage postflop calloff metadata for at most six exact original cases; no private records or commands
        required: false
        type: string
      tournament_cases_json:
        description: Optional v1 unique/hash or v2 original public-action ordinal tournament metadata for at most six accepted hands; sanitized predicates only
        required: false
        type: string
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_ENGINE_SHA: ${{ inputs.expected_engine_sha }}
      MTT_ADDON_POLICY: ${{ inputs.mtt_addon_policy }}
      REFERENCE_CASES_JSON: ${{ inputs.reference_cases_json }}
      TOURNAMENT_CASES_JSON: ${{ inputs.tournament_cases_json }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read sanitized host outcomes with pinned SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected SHA refused'; exit 1; }
          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo '::error::Configured host refused'; exit 1; }
          [ -n "$SSH_KEY" ] && [ -n "$HOST_KEY" ] || { echo '::error::Configured SSH metadata unavailable'; exit 1; }
          [ -z "$REFERENCE_CASES_JSON" ] || [ -z "$TOURNAMENT_CASES_JSON" ] || { echo '::error::Case modes are mutually exclusive'; exit 1; }
          if [ "$MTT_ADDON_POLICY" = true ]; then
            [ -z "$REFERENCE_CASES_JSON" ] && [ -z "$TOURNAMENT_CASES_JSON" ] || { echo '::error::Policy mode is exclusive'; exit 1; }
          fi
          TOURNAMENT_CASES_B64=''
          if [ -n "$TOURNAMENT_CASES_JSON" ]; then
            TOURNAMENT_CASES_B64=$(printf '%s' "$TOURNAMENT_CASES_JSON" | python3 scripts/ci/inspect-tournament-refill.py --encode-tournament-cases "$EXPECTED_ENGINE_SHA")
            [[ "$TOURNAMENT_CASES_B64" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo '::error::Tournament metadata refused'; exit 1; }
          fi
          python3 scripts/ci/inspect-tournament-refill.py --host-script > "$RUNNER_TEMP/tournament-refill-host.py"
          REFERENCE_CASES_B64=''
          if [ -n "$REFERENCE_CASES_JSON" ]; then
            REFERENCE_CASES_B64=$(printf '%s' "$REFERENCE_CASES_JSON" | python3 scripts/ci/inspect-tournament-refill.py --encode-reference-cases "$EXPECTED_ENGINE_SHA")
            [[ "$REFERENCE_CASES_B64" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo '::error::Case metadata refused'; exit 1; }
          fi
          SSH_DIR="$RUNNER_TEMP/tournament-refill-ssh-$GITHUB_RUN_ID"
          install -d -m 0700 "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT
          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$HOST_KEY" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          ssh-keygen -y -f "$SSH_DIR/key" >/dev/null
          ssh-keygen -l -f "$SSH_DIR/known_hosts" >/dev/null
          REMOTE_READ="python3 - '$EXPECTED_ENGINE_SHA' '$REFERENCE_CASES_B64' '$TOURNAMENT_CASES_B64'"
          if [ "$MTT_ADDON_POLICY" = true ]; then
            REMOTE_READ="python3 - --mtt-addon-policy '$EXPECTED_ENGINE_SHA'"
          fi
          timeout --signal=TERM --kill-after=5s 100s ssh \
            -i "$SSH_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "root@$HETZNER_HOST" "$REMOTE_READ" \
            < "$RUNNER_TEMP/tournament-refill-host.py" > "$RUNNER_TEMP/tournament-refill.json"
          cat "$RUNNER_TEMP/tournament-refill.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-refill-read-only-${{ github.run_id }}
          path: ${{ runner.temp }}/tournament-refill.json
          if-no-files-found: error
          retention-days: 7
