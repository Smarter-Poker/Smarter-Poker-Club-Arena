name: Inspect V31 Worker Readiness (Read Only)
on:
  push:
    branches: [main]
    paths:
      - scripts/ci/inspect-v31-worker-readiness.mjs
      - tests/operations/v31-worker-readiness-inspection.test.mjs
      - .github/workflows/inspect-v31-worker-readiness.yml
  pull_request:
    paths:
      - scripts/ci/inspect-v31-worker-readiness.mjs
      - tests/operations/v31-worker-readiness-inspection.test.mjs
      - .github/workflows/inspect-v31-worker-readiness.yml
  workflow_dispatch:
    inputs:
      request_base64:
        description: Metadata-only source SHA, dataset UUID/checksum, cellCount, workerCount 8 and actual promotion afterUtc
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: v31-worker-readiness-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'manual' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/operations/v31-worker-readiness-inspection.test.mjs
  inspect:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      REQUEST_BASE64: ${{ inputs.request_base64 }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read only bounded private journal metadata through the configured pinned SSH boundary
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          node scripts/ci/inspect-v31-worker-readiness.mjs --validate "$REQUEST_BASE64"
          [[ "$REQUEST_BASE64" =~ ^[A-Za-z0-9+/=]+$ ]] || exit 1
          EXPECTED_ENGINE_SHA=$(node --input-type=module -e 'console.log(JSON.parse(Buffer.from(process.env.REQUEST_BASE64,"base64")).sourceSha)')
          [[ "$EXPECTED_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || exit 1
          [ -n "$SSH_KEY" ] && [ -n "$HOST_KEY" ] || { echo '::error::Configured SSH metadata unavailable'; exit 1; }
          SSH_DIR="$RUNNER_TEMP/v31-readiness-ssh-$GITHUB_RUN_ID"
          install -d -m 0700 "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT
          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$HOST_KEY" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          ssh-keygen -y -f "$SSH_DIR/key" >/dev/null
          ssh-keygen -l -f "$SSH_DIR/known_hosts" >/dev/null
          curl --fail --silent --show-error --max-time 15 https://engine.smarter.poker/health > "$RUNNER_TEMP/v31-health-before.json"
          node scripts/ci/inspect-v31-worker-readiness.mjs --health "$REQUEST_BASE64" "$RUNNER_TEMP/v31-health-before.json"
          timeout --signal=TERM --kill-after=5s 75s ssh \
            -i "$SSH_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "root@$HETZNER_HOST" \
            "test -f /var/lock/club-arena-engine-up.lock || { echo inspection_lock_missing >&2; exit 1; }; exec 9>/var/lock/club-arena-engine-up.lock || exit 1; flock -n 9 || { echo inspection_lock_busy >&2; exit 1; }; test \"\$(docker inspect -f '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' club-arena-engine)\" = '$EXPECTED_ENGINE_SHA' || { echo inspection_image_mismatch >&2; exit 1; }; docker exec -i club-arena-engine node --input-type=module - '$REQUEST_BASE64'" \
            < scripts/ci/inspect-v31-worker-readiness.mjs > "$RUNNER_TEMP/v31-worker-readiness.json"
          node scripts/ci/inspect-v31-worker-readiness.mjs --receipt "$REQUEST_BASE64" "$RUNNER_TEMP/v31-worker-readiness.json"
          curl --fail --silent --show-error --max-time 15 https://engine.smarter.poker/health > "$RUNNER_TEMP/v31-health-after.json"
          node scripts/ci/inspect-v31-worker-readiness.mjs --health "$REQUEST_BASE64" "$RUNNER_TEMP/v31-health-after.json"
          cat "$RUNNER_TEMP/v31-worker-readiness.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v31-worker-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/v31-worker-readiness.json
          if-no-files-found: error
          retention-days: 7
