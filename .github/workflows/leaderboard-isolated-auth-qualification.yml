name: Leaderboard Isolated Actual Auth Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard-isolated-auth-qualification
  cancel-in-progress: false

jobs:
  qualify-auth:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record immutable source provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated Auth source contracts
        run: |
          bash scripts/verification-harness/leaderboard-isolated-auth-qualification.sh --check
          node --check scripts/verification-harness/leaderboard-real-auth-launcher-draft.mjs
          node --check scripts/verification-harness/leaderboard-real-auth-draft.mjs
          node --check scripts/verification-harness/leaderboard-delegated-role-matrix.mjs
          node --test scripts/verification-harness/leaderboard-real-auth-launcher-draft.test.mjs scripts/verification-harness/leaderboard-delegated-role-matrix.test.mjs scripts/verification-harness/leaderboard-signup-fixture-draft.test.mjs scripts/verification-harness/leaderboard-auth-integration-candidate.test.mjs scripts/verification-harness/leaderboard-isolation-startup-profile.test.mjs
      - name: Qualify actual Auth in a faithfully restored disposable database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEADERBOARD_ISOLATION_SCRATCH_PARENT: ${{ runner.temp }}
        run: bash scripts/verification-harness/leaderboard-isolated-auth-qualification.sh
