name: Leaderboard Current Schema Isolation Preflight

on:
  workflow_dispatch:
    inputs:
      replica_descriptor:
        description: Reviewed Dedicated Read Replica Provider Metadata; No Credentials
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: leaderboard-isolation-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source provenance
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
      - name: Check source safeguards
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client
          bash scripts/verification-harness/leaderboard-isolation-preflight.sh --check
          node --check scripts/verification-harness/leaderboard-schema-replica.mjs
          node --test scripts/verification-harness/leaderboard-schema-replica.test.mjs
          node --test scripts/verification-harness/leaderboard-isolation-preflight.test.mjs
      - name: Build And Qualify Pinned Native Metadata Client
        run: bash scripts/verification-harness/leaderboard-native-function-batch-build.sh "${{ runner.temp }}"
      - name: Export metadata and verify isolated catalog coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEADERBOARD_SCHEMA_REPLICA_DESCRIPTOR: ${{ inputs.replica_descriptor }}
          LEADERBOARD_ISOLATION_SCRATCH_PARENT: ${{ runner.temp }}
        run: bash scripts/verification-harness/leaderboard-isolation-preflight.sh
