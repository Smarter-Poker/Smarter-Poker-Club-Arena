name: Lightning Latency Qualification
# Dispatch only. One read-only R19 verdict from the engine's own closed
# lightning_latency_window rows for the private pilot Clusters: per leg PASS,
# FAIL or INSUFFICIENT against fn_lightning_config. No schedule, no writes, no
# seats, no money, no player action. The browser latency witness stays a
# supplementary sample (lightning-pilot-witness.yml, mode latency).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Pilot targets, comma separated: action, madness or action,madness'
        required: false
        default: 'action,madness'
        type: string
      lookback_minutes:
        description: 'Bounded lookback of closed windows, 15 to 1440 minutes'
        required: false
        default: '360'
        type: string
permissions:
  contents: read
concurrency:
  group: lightning-latency-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Verdict Semantics Before Reading
        run: node --test scripts/ops/lightning-latency-qualification.test.mjs
      - run: npm ci --ignore-scripts
      - name: Read Production Telemetry; Issue No Certificate Beyond R19
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LATENCY_TARGETS: ${{ inputs.targets }}
          LATENCY_LOOKBACK_MINUTES: ${{ inputs.lookback_minutes }}
          LATENCY_REPORT_PATH: lightning-latency-qualification.json
        run: node scripts/ops/lightning-latency-qualification.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-latency-qualification
          path: lightning-latency-qualification.json
          if-no-files-found: warn
