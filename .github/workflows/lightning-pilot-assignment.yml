name: Lightning Pilot Assignment
run-name: Lightning Assignment ${{ inputs.phase }} ${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Explicit preparation, assignment, first withdrawal, release or read-only report'
        type: choice
        options: [prepare, assign, withdraw, release, report]
        required: true
      operation_id:
        description: 'Original operation UUID; never replace an unknown withdrawal'
        type: string
        required: true
      prepare_run:
        description: 'Withdraw only: exact successful preparation run'
        type: string
      reason:
        description: 'Audited reason, at least twelve characters'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: lightning-private-pilot-setup
  cancel-in-progress: false
jobs:
  assignment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Scope And First Provider Owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PILOT_ASSIGNMENT_PHASE: ${{ inputs.phase }}
          PILOT_ASSIGNMENT_OPERATION_ID: ${{ inputs.operation_id }}
          PILOT_ASSIGNMENT_PREPARE_RUN: ${{ inputs.prepare_run }}
        run: |
          node --test scripts/ops/lightning-pilot-assignment-run.test.mjs scripts/ops/lightning-pilot-assignment-withdraw.test.mjs scripts/ops/lightning-pilot-assignment.test.mjs
          node scripts/ops/lightning-pilot-assignment-run.mjs
      - uses: actions/download-artifact@v4
        if: inputs.phase == 'withdraw'
        with:
          name: lightning-assignment-baseline
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prepare_run }}
      - run: npm ci --ignore-scripts
      - name: Explicit Authorized Assignment Or Normal Zero-Cost Withdrawal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SP_EMAIL: ${{ secrets.SP_EMAIL }}
          SP_PASS: ${{ secrets.SP_PASS }}
          PILOT_ASSIGNMENT_PHASE: ${{ inputs.phase }}
          PILOT_ASSIGNMENT_OPERATION_ID: ${{ inputs.operation_id }}
          PILOT_ASSIGNMENT_REASON: ${{ inputs.reason }}
          PILOT_ASSIGNMENT_BASELINE_PATH: lightning-assignment-baseline.json
          PILOT_ASSIGNMENT_REPORT_PATH: lightning-assignment-report.json
        run: node scripts/ops/lightning-pilot-assignment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-assignment-report
          path: lightning-assignment-report.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: inputs.phase == 'prepare' && success()
        with:
          name: lightning-assignment-baseline
          path: lightning-assignment-baseline.json
          if-no-files-found: error
