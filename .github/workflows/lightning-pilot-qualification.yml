name: Lightning Pilot Qualification Report
on:
  workflow_dispatch:
    inputs:
      designated_outsider_id:
        description: Optional designated existing nonmember UUID for read-only database access decisions
        required: false
        type: string
      populated_cluster_ids:
        description: Optional comma-separated populated Must-Move Cluster UUIDs (at most 4) to observe read-only
        required: false
        type: string
      access_proof_run_id:
        description: Optional Lightning Pilot Stage (stage=access) run id whose retained artifact proves outsider browser/socket refusal; defaults to the newest successful one on main
        required: false
        type: string
      report_from:
        description: Optional ISO start time within the supported 90-day evidence window; defaults to pilot creation
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lightning-pilot-qualification-report
  cancel-in-progress: false
jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Evidence Semantics Before Collection
        run: node --test scripts/ops/lightning-pilot-qualification.test.mjs scripts/ops/lightning-latency-qualification.test.mjs scripts/ops/lightning-pilot-access-proof.test.mjs
      - run: npm ci --ignore-scripts
      - name: Fetch The Retained Access Stage Proof (Read Only; Verified In The Report)
        env:
          GH_TOKEN: ${{ github.token }}
          ACCESS_RUN: ${{ inputs.access_proof_run_id }}
        run: |
          set -u
          mkdir -p access-proof
          run="$ACCESS_RUN"
          if [ -z "$run" ]; then
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/lightning-pilot-stage.yml/runs?branch=main&status=success&per_page=30" \
              -q '.workflow_runs[].id' | while read -r id; do
                if gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" -q '.artifacts[].name' | grep -qx 'lightning-pilot-stage-access'; then echo "$id"; break; fi
              done)
          fi
          if ! printf '%s' "$run" | grep -Eq '^[0-9]{1,20}$'; then
            echo "No access stage run found; the report keeps the proof blocker."; exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/runs/$run" \
            -q '{id:.id,path:.path,headBranch:.head_branch,event:.event,status:.status,conclusion:.conclusion}' > access-proof/run.json || exit 0
          gh run download "$run" -R "${{ github.repository }}" -n lightning-pilot-stage-access -D access-proof/artifact || exit 0
          echo "Access stage run $run retained for verification."
      - name: Collect Read-Only Observations; No Launch Certificate Or Activation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SP_EMAIL: ${{ secrets.SP_EMAIL }}
          SP_PASS: ${{ secrets.SP_PASS }}
          PILOT_DESIGNATED_OUTSIDER_ID: ${{ inputs.designated_outsider_id }}
          PILOT_REPORT_FROM: ${{ inputs.report_from }}
          PILOT_POPULATED_CLUSTER_IDS: ${{ inputs.populated_cluster_ids }}
          PILOT_REPORT_PATH: lightning-pilot-qualification.json
          PILOT_ACCESS_PROOF_RUN_PATH: access-proof/run.json
          PILOT_ACCESS_PROOF_PATH: access-proof/artifact/lightning-pilot-stage.json
        run: node scripts/ops/lightning-pilot-qualification.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-pilot-qualification-report
          path: lightning-pilot-qualification.json
          if-no-files-found: warn
