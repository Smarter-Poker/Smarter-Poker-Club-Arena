name: Lightning Pilot Roster Expansion
run-name: Lightning Roster Expansion ${{ inputs.phase }} ${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Prepare immutable evidence, or execute the owner-authorized exact 72-horse expansion once'
        type: choice
        options: [prepare, execute]
        required: true
      operation_id:
        description: 'Exact UUID shared by preparation and its one execution; never replace an unknown operation'
        type: string
        required: true
      prepare_run:
        description: 'Execute only: successful prepare run ID for this exact operation'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lightning-private-pilot-setup
  cancel-in-progress: false
jobs:
  expansion:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Exact Scope And Refusal Boundaries
        run: node --test scripts/ops/lightning-pilot-roster-expand.test.mjs scripts/ops/lightning-pilot-roster-run.test.mjs
      - name: Verify This One Provider Owner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PILOT_EXPANSION_PHASE: ${{ inputs.phase }}
          PILOT_EXPANSION_OPERATION_ID: ${{ inputs.operation_id }}
          PILOT_EXPANSION_PREPARE_RUN: ${{ inputs.prepare_run }}
        run: node scripts/ops/lightning-pilot-roster-expand.mjs --guard
      - uses: actions/download-artifact@v4
        if: inputs.phase == 'execute'
        with:
          name: lightning-roster-expansion-baseline
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prepare_run }}
      - run: npm ci --ignore-scripts
      - name: Use Only The Normal Join, Approval And Club Bank Doors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SP_EMAIL: ${{ secrets.SP_EMAIL }}
          SP_PASS: ${{ secrets.SP_PASS }}
          PILOT_EXPANSION_PHASE: ${{ inputs.phase }}
          PILOT_EXPANSION_OPERATION_ID: ${{ inputs.operation_id }}
          PILOT_EXPANSION_EXECUTE_ADMITTED: ${{ inputs.phase == 'execute' && 'true' || 'false' }}
          PILOT_EXPANSION_PREPARE_RUN_ID: ${{ inputs.prepare_run }}
          PILOT_EXPANSION_BASELINE_PATH: lightning-roster-expansion-baseline.json
          PILOT_EXPANSION_REPORT_PATH: lightning-roster-expansion-report.json
        run: node scripts/ops/lightning-pilot-roster-expand.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-roster-expansion-report
          path: lightning-roster-expansion-report.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: inputs.phase == 'prepare' && success()
        with:
          name: lightning-roster-expansion-baseline
          path: lightning-roster-expansion-baseline.json
          if-no-files-found: error
          retention-days: 90
