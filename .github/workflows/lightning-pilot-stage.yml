name: Lightning Pilot Stage
# Dispatch only. One run performs one ROLLOUT.md stage step on the private
# Lightning pilot through the audited control door, as the service owner. It
# has no schedule and never discovers work: the dispatcher names the stage, the
# operation id (a retry with the same id replays) and the reason.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'One explicit private-pilot stage, recovery control, investigated signal review or access proof'
        required: true
        type: choice
        options: [report, shadow, form, drain, 'off', control, review, access]
      accept_outsider_terms:
        description: 'Explicit owner-authorized normal TOS and Privacy acceptance for the designated outsider only; access stage only'
        required: false
        type: boolean
        default: false
      control_action:
        description: 'One explicit recovery/rehearsal control; used only with stage=control'
        required: false
        type: choice
        default: pause
        options:
          [pause, resume, disable_joins, enable_joins, freeze, unfreeze, rollback_matcher_version]
      signal_id:
        description: 'One investigated finding ID (1 to 8, 50, or one listed in INVESTIGATED_FINDINGS), stage=review only; select its one target and give the evidence note as reason'
        required: false
        type: string
      operation_id:
        description: 'UUID for this operation; reuse it to retry the same step (not needed for report)'
        required: false
        type: string
      reason:
        description: 'Audited reason recorded on every control event (not needed for report)'
        required: false
        type: string
      targets:
        description: 'Pilot targets, comma separated: action, madness or action,madness'
        required: false
        default: 'action,madness'
        type: string
permissions:
  contents: read
concurrency:
  group: lightning-pilot-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.stage == 'access' && 15 || 5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Stage Semantics Before Acting
        run: node --test scripts/ops/lightning-pilot-stage.test.mjs scripts/ops/prepare-lightning-private-pilot.test.mjs scripts/ops/lightning-pilot-access.test.mjs
      - run: npm ci --ignore-scripts
      - name: Install Chromium For Explicit Private Access Proof
        if: inputs.stage == 'access'
        run: |
          sudo python3 scripts/ci/ubuntu-apt-mirror.py
          npx playwright install --with-deps chromium
      - name: Perform The Named Stage Step Through The Control Door
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SP_EMAIL: ${{ secrets.SP_EMAIL }}
          SP_PASS: ${{ secrets.SP_PASS }}
          PILOT_STAGE: ${{ inputs.stage }}
          PILOT_ACCEPT_OUTSIDER_TERMS: ${{ inputs.accept_outsider_terms }}
          PILOT_CONTROL_ACTION: ${{ inputs.control_action }}
          PILOT_SIGNAL_ID: ${{ inputs.signal_id }}
          PILOT_OPERATION_ID: ${{ inputs.operation_id }}
          PILOT_REASON: ${{ inputs.reason }}
          PILOT_TARGETS: ${{ inputs.targets }}
          PILOT_STAGE_REPORT_PATH: lightning-pilot-stage.json
        run: node scripts/ops/lightning-pilot-stage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-pilot-stage-${{ inputs.stage }}
          path: lightning-pilot-stage.json
          if-no-files-found: warn
