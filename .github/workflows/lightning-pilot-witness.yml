name: Lightning Pilot Witness
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'One finite evidence operation'
        type: choice
        options:
          [
            player,
            replay,
            cycle,
            recovery,
            latency,
            admission,
            financial_top_up,
            financial_top_up_sitout,
            financial_cash_out,
            financial_auto_top_up,
            financial_stop_playing,
          ]
        required: true
      accept_player_terms:
        description: 'Explicit owner-authorized normal TOS and Privacy acceptance only for named players 0097309f-2864-4d09-b02b-56bca012a9c3, Samantha a23ca5c9-b748-482f-9b59-9db35f7aa996 or milehigh 09dd202d-115b-49ae-afa8-cb528c7b8f72'
        type: boolean
        default: false
      cluster_id:
        description: 'Exact private pilot cluster UUID'
        type: string
        required: true
      player_id:
        description: 'Browser modes: pinned funded pilot horse (009, Samantha or milehigh 09dd202d) with prior accepted terms'
        type: string
      pool_session_id:
        description: 'Existing-pool browser modes: exact active pool UUID; admission discovers it through normal UI'
        type: string
      second_pool_session_id:
        description: 'Recovery only: same authorized player existing active pool session in the other private pilot cluster'
        type: string
      from:
        description: 'Replay mode: closed interval start ISO timestamp'
        type: string
      to:
        description: 'Replay mode: closed interval end ISO timestamp, no later than now'
        type: string
      cursor:
        description: 'Replay mode: previous page nextCursor UUID, empty for first page'
        type: string
      batch:
        description: 'Replay mode: maximum hands in this one page (1 to 1000)'
        type: string
        default: '100'
permissions:
  contents: read
concurrency:
  group: lightning-pilot-witness
  cancel-in-progress: false
jobs:
  witness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify The Finite Witness Before Acting
        run: node --test scripts/ops/lightning-pilot-financial.test.mjs scripts/ops/lightning-pilot-targets.test.mjs scripts/ops/lightning-pilot-admission.test.mjs scripts/ops/lightning-pilot-witness.test.mjs scripts/ops/lightning-pilot-player.test.mjs scripts/ops/lightning-pilot-replay-batch.test.mjs scripts/ops/lightning-pilot-cycle.test.mjs scripts/ops/lightning-pilot-recovery.test.mjs scripts/ops/lightning-pilot-latency-workload.test.mjs
      - run: npm ci --ignore-scripts
      - name: Install Chromium For The Explicit Player Witness
        if: inputs.mode != 'replay'
        run: npx playwright install --with-deps chromium
      - name: Collect The Explicit Witness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SP_EMAIL: ${{ secrets.SP_EMAIL }}
          SP_PASS: ${{ secrets.SP_PASS }}
          PILOT_WITNESS_MODE: ${{ inputs.mode }}
          PILOT_ACCEPT_PLAYER_TERMS: ${{ inputs.accept_player_terms }}
          PILOT_CLUSTER_ID: ${{ inputs.cluster_id }}
          PILOT_PLAYER_ID: ${{ inputs.player_id }}
          PILOT_POOL_SESSION_ID: ${{ inputs.pool_session_id }}
          PILOT_SECOND_POOL_SESSION_ID: ${{ inputs.second_pool_session_id }}
          PILOT_FROM: ${{ inputs.from }}
          PILOT_TO: ${{ inputs.to }}
          PILOT_CURSOR: ${{ inputs.cursor }}
          PILOT_BATCH: ${{ inputs.batch }}
          PILOT_WITNESS_REPORT_PATH: lightning-pilot-witness.json
        run: node scripts/ops/lightning-pilot-witness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-pilot-witness
          path: lightning-pilot-witness.json
          if-no-files-found: warn
