name: Lightning Private Pilot Setup
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Pilot targets to prepare, comma separated: action, madness or action,madness; or retire (switch off retired games only)'
        required: false
        default: 'action,madness'
        type: string
permissions:
  contents: read
concurrency:
  group: lightning-private-pilot-setup
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Prepare One Durable Private Pilot Through Authenticated Doors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SP_EMAIL: ${{ secrets.SP_EMAIL }}
          SP_PASS: ${{ secrets.SP_PASS }}
          PILOT_RECEIPT_PATH: lightning-private-pilot-receipt.json
          PILOT_SETUP_TARGETS: ${{ inputs.targets }}
        run: node scripts/ops/prepare-lightning-private-pilot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightning-private-pilot-receipt
          path: lightning-private-pilot-receipt.json
          if-no-files-found: warn
