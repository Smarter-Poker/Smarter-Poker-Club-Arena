name: Main Rewind Guard

# ═══════════════════════════════════════════════════════════════════════════
# Catches a force-push that DELETES commits from main.
#
# 2026-08-21: main was rewound to ada755ab3 and four commits were dropped —
# 5d42741e4 (seat-as-reservation), d884f5fd2 (BBJ palette re-land),
# ea6d53082 (throwables sizing), e0f707a09 (case-sensitivity CI fix). All
# four had already been built, synced, and were SERVING IN PRODUCTION. main
# no longer contained the code production was running, so the next sync
# would have silently deleted four features. Nothing detected it; it was
# found by hand, hours later, by comparing production's build-info.json
# against main.
#
# The `.husky/pre-push` hook now refuses such a push at source. This is the
# backstop for the case the hook cannot cover: a clone that never installed
# husky, a push from the GitHub web UI or API, or `--no-verify`.
#
# It cannot PREVENT the rewind — by the time a workflow runs, the push has
# landed. Branch protection is what prevents it, and that needs GitHub Pro
# on a private repo (see .husky/pre-push check 0). What this does is make
# the loss impossible to MISS: a red run and an issue within a minute,
# instead of hours of production drift nobody has noticed.
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  detect-rewind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          # Ancestry cannot be computed on a shallow clone, and the dropped
          # commits are by definition not reachable from the new tip.
          fetch-depth: 0

      - name: Was anything dropped from main?
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -u
          ZERO=0000000000000000000000000000000000000000

          # Branch creation has no "before" to compare against.
          if [ "$BEFORE" = "$ZERO" ]; then
            echo "Branch created — nothing to compare."
            exit 0
          fi

          # A force-push leaves the old tip unreachable from any ref, so a
          # normal clone will not have fetched it. Ask for it explicitly.
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE" 2>/dev/null || true
          fi

          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # Unreachable AND ungettable is itself the signature of a rewind
            # whose objects have already been pruned. Report rather than pass.
            {
              echo "dropped=unknown"
              echo "count=?"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Previous main tip $BEFORE is no longer retrievable — cannot verify."
            exit 0
          fi

          if git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            echo "Fast-forward. Nothing dropped."
            echo "dropped=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(git rev-list --count "$AFTER..$BEFORE")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "dropped=yes" >> "$GITHUB_OUTPUT"

          {
            echo "list<<COMMITS"
            git log --oneline --max-count=30 "$AFTER..$BEFORE"
            echo "COMMITS"
          } >> "$GITHUB_OUTPUT"

          echo "::error::main was rewound — $COUNT commit(s) dropped."
          git log --oneline --max-count=30 "$AFTER..$BEFORE"

      - name: Open an issue naming the lost commits
        if: steps.check.outputs.dropped == 'yes'
        uses: actions/github-script@v7
        env:
          COUNT: ${{ steps.check.outputs.count }}
          LIST: ${{ steps.check.outputs.list }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        with:
          script: |
            const { COUNT, LIST, BEFORE, AFTER } = process.env;
            const body = [
              `main was force-pushed and **${COUNT} commit(s) were dropped**.`,
              '',
              `- previous tip: \`${BEFORE}\``,
              `- new tip: \`${AFTER}\``,
              `- pushed by: @${context.actor}`,
              '',
              '### Commits no longer on main',
              '```',
              LIST || '(unavailable)',
              '```',
              '',
              '### Why this matters',
              'A dropped commit may still be live in production. Compare',
              '`https://smarter.poker/hub/club-arena/build-info.json` against main:',
              'if its `ca_sha` is not an ancestor of the new tip, production is',
              'running code main no longer has, and the next sync will delete it.',
              '',
              '### Recovering',
              'The objects usually still exist. From a clone that has them:',
              '```bash',
              `git branch recover/dropped ${BEFORE}`,
              'git pull --rebase origin main   # replays the dropped work on top',
              'git push origin main',
              '```',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `main rewound — ${COUNT} commit(s) dropped`,
              body,
              labels: ['incident'],
            });

      - name: Fail the run so it is visible
        if: steps.check.outputs.dropped == 'yes'
        run: exit 1
