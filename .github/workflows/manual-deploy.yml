name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        type: string

concurrency:
  group: manual-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Deploy Request
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Intent
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "::error::You must type 'deploy' to confirm. Got: '${{ github.event.inputs.confirm }}'"
          exit 1

  deploy:
    name: Manual Deploy to ${{ github.event.inputs.environment }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Node 20
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # Phase U5.1 (task #133): same Sentry wiring as ci.yml so manual
          # deploys also produce symbolicated stack traces.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: smarter-poker
          SENTRY_PROJECT: club-arena

      - name: Deploy to Vercel
        id: deploy
        run: |
          npm install -g vercel
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            DEPLOY_OUTPUT=$(vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
          else
            DEPLOY_OUTPUT=$(vercel --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
          fi
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^ ]+\.vercel\.app' | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Failed to capture deploy URL from Vercel output"
            echo "Vercel output: $DEPLOY_OUTPUT"
            exit 1
          fi
          echo "url=${DEPLOY_URL}" >> $GITHUB_OUTPUT
          echo "✅ Deployed: ${DEPLOY_URL}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Summary
        run: |
          echo "## 🚀 Manual Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
