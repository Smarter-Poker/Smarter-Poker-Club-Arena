name: Money check board reads cron

# fn_money_check_health (migration 20261015101106). Runs
# scripts/ci/test-money-check-health-reads-cron.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production function
# captured 2026-10-15 (pg_get_functiondef md5 equal to the live one) must call
# every cron-driven money check never run, and the migration must report only a
# check whose job fails or is deactivated, keep owner, security, settings and
# grants, reproduce the derived postimage md5, and refuse a second run. No timer
# (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261015101106_the_money_check_board_reads_the_cron_runs_that_drive_each_ch.sql
      - scripts/ci/fixtures/money-check-health-reads-cron/**
      - scripts/ci/test-money-check-health-reads-cron.py
      - .github/workflows/money-check-health-reads-cron.yml

permissions:
  contents: read

concurrency:
  group: money-check-health-reads-cron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  money-check-health-reads-cron:
    name: The money check board reads the cron runs that drive each check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: The money check board reads the cron runs that drive each check
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-money-check-health-reads-cron.py --output artifacts/money-check-health-reads-cron
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: money-check-health-reads-cron-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/money-check-health-reads-cron/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
