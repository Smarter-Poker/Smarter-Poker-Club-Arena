name: Operational alert addressing

# Every operational alert must carry payload.target_task_id, or the fleet lane
# that fixes it never sees it (2026-09-26: the smarter-poker-workers writers had
# been recording unaddressed rows for days).
#
# It adds no timer (CLAUDE.md 10.85): the detection job rides the existing
# hourly Production Integrity Audit through workflow_run. It checks the last
# two hours, records one fleet-addressed incident (and later its recovery) in
# the operational inbox through fn_record_operational_alert, never edits the
# rows it reports, and exits 3 COULD NOT TELL when it cannot get an answer.
# On pull requests touching this path it runs the decision-rule regression test.
#
# The same rule is enforced BEFORE a row can exist (2026-09-28): a SQL function
# that calls fn_record_operational_alert must prove the fleet address on every
# call, as its latest body and in every migration on its own (20260927143752
# shipped exactly that gap, and nothing checked it). The rule lives in
# tests/helpers/operational-sender-addressing.mjs, and the BLOCKING readings run
# inside the required Client Unit Tests (vitest) check:
# tests/an-operational-alert-sender-addresses-the-fleet.law.test.ts (the corpus)
# and ...decisions.test.ts (the rule's own cases), which classify-ci-changes.mjs
# reaches from any change under tests/. This workflow is not a required check.
# sql-senders-address-the-fleet stays for the one reading only it can make, the
# migrations the branch adds (--added-since: an added file never gets the
# history exemption); it is also the reader tests/every-guard-has-a-reader.law.test.ts
# requires for scripts/ci/check-operational-sender-addressing.mjs.
on:
  workflow_run:
    workflows: ['Production Integrity Audit']
    types: [completed]
  pull_request:
    paths:
      - scripts/ci/check-operational-alert-addressing.mjs
      - scripts/ci/check-operational-alert-addressing.test.mjs
      - scripts/ci/check-operational-sender-addressing.mjs
      - tests/helpers/operational-sender-addressing.mjs
      - tests/helpers/sql-reader.mjs
      - supabase/migrations/**
      - .github/workflows/operational-alert-addressing.yml

permissions:
  contents: read

concurrency:
  group: operational-alert-addressing-${{ github.event_name == 'workflow_run' && 'live' || github.ref }}
  cancel-in-progress: false

jobs:
  decision-rules:
    name: Unaddressed alerts fire one fleet incident and recover through the same route
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/ci/check-operational-alert-addressing.test.mjs

  live-addressing:
    name: No unaddressed operational alert in the last two hours
    if: github.event_name == 'workflow_run'
    needs: decision-rules
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install the pinned database client
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Record or recover the addressing incident
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ci/check-operational-alert-addressing.mjs

  sql-senders-address-the-fleet:
    name: Every SQL sender of a Production Alerts event addresses the fleet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its first parent (the base),
          # so the check can name the migrations this branch adds.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ci/check-operational-sender-addressing.mjs --added-since HEAD^1
