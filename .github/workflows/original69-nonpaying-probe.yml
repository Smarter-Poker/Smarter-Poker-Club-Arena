name: Original69 Nonpaying Rollback Probe
on:
  workflow_dispatch:
    inputs:
      tournament_id:
        description: One exact original69 event, after sealed healthy own thaw and original quiescence
        type: string
        required: true
      expected_money_hash:
        description: Privately reviewed canonical quiescence money hash
        type: string
        required: true
      expected_economic_sha256:
        description: Privately reviewed original-charge economic projection digest
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: original69-nonpaying-probe-${{ inputs.tournament_id }}
  cancel-in-progress: false
jobs:
  single-rollback-probe:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROBE_EVENT: ${{ inputs.tournament_id }}
      PROBE_MONEY_HASH: ${{ inputs.expected_money_hash }}
      PROBE_ECONOMIC_SHA256: ${{ inputs.expected_economic_sha256 }}
      PROBE_RECEIPT_DIRECTORY: ${{ runner.temp }}/original69-probe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write immutable safe intent before any service request
        run: node .github/scripts/original69-nonpaying-probe.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: original69-probe-intent-${{ github.run_id }}
          path: ${{ runner.temp }}/original69-probe/intent.json
          if-no-files-found: error
          retention-days: 7
      - name: One genuine-service always-aborting call and readback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/original69-nonpaying-probe.mjs execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original69-probe-safe-result-${{ github.run_id }}
          path: ${{ runner.temp }}/original69-probe/*.json
          if-no-files-found: error
          retention-days: 7
