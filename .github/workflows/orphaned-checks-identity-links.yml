name: Orphaned checks exempt the identity links reader

# ca_check_sweep_exemptions (migration 20261008052116). Runs
# scripts/ci/test-orphaned-checks-identity-links.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production
# fn_ca_orphaned_checks captured 2026-10-08 (pg_get_functiondef md5 equal to
# the live function) must list the identity links paged reader before the
# migration and not after, while a genuine unrun check stays listed. The same
# command ci.yml would run, kept in its own file so the change does not edit
# ci.yml. No timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it
# proves. ci.yml has no push trigger, so neither does this.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261008052116_the_identity_links_reader_is_exempt_from_the_orphaned_checks.sql
      - scripts/ci/fixtures/orphaned-checks-identity-links/**
      - scripts/ci/test-orphaned-checks-identity-links.py
      - .github/workflows/orphaned-checks-identity-links.yml

permissions:
  contents: read

concurrency:
  group: orphaned-checks-identity-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orphaned-checks-identity-links:
    name: Orphaned checks exempt the identity links reader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Orphaned checks exempt the identity links reader
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-orphaned-checks-identity-links.py --output artifacts/orphaned-checks-identity-links
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orphaned-checks-identity-links-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/orphaned-checks-identity-links/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
