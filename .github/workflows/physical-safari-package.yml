name: Physical Safari acceptance package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/physical-safari/**'
      - '.github/workflows/physical-safari-package.yml'
permissions:
  contents: read
jobs:
  build-for-testing:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate package refusal contracts
        working-directory: tests/physical-safari
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B -m unittest test_package_build.py
      - name: Generate owning project
        run: python3 -B tests/physical-safari/generate_project.py
      - name: Build actual iPhoneOS XCTest runner
        run: |
          xcodebuild -project tests/physical-safari/ios/Acceptance.xcodeproj -scheme Acceptance -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/physical-safari-derived" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Ad-hoc sign every nested bundle and verify package
        run: python3 -B tests/physical-safari/package_build.py "$RUNNER_TEMP/physical-safari-derived/Build/Products" "$RUNNER_TEMP/physical-safari-package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: physical-safari-xctest-${{ github.sha }}
          path: ${{ runner.temp }}/physical-safari-package
          if-no-files-found: error
