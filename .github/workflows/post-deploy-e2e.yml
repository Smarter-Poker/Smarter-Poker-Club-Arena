name: Post-Deploy E2E (production)
run-name: Post-Deploy E2E ${{ github.event.client_payload.engine_sha || github.sha }}

# ─────────────────────────────────────────────────────────────────────────────
# THE TIER THAT DID NOT EXIST (Dan 2026-08-29)
#
# An inventory of the e2e suite found SIXTEEN spec files running in no CI job
# at all. Seven pure-geometry ones joined `css-beats-e2e` on the same day. The
# rest could not: they need a signed-in session or a deployed URL, and
# `css-beats-e2e` has neither by design (it renders stylesheets with
# page.setContent so it can gate a merge in seconds).
#
# So they had nowhere to run, and "nowhere to run" is how a guard becomes a
# comment. mobile-fit-audit.spec.ts has said the answer in its own header
# since the day it was written:
#
#   "STRICT mode (MOBILE_FIT_STRICT=1, or CI where this suite runs against
#    production AFTER a deploy) fails on any violation. Post-deploy CI is the
#    right place for strict: a red run names the route and the offending
#    element without blocking anyone's merge."
#
# This is that job. It runs AFTER Club Arena publishes to its Hetzner origin,
# against the real deployed bundle through the public rewrite, signed in.
#
# WHY IT DOES NOT GATE A MERGE, and why that is not a weakness: by the time it
# runs, the code is already on main and already published. Blocking is not
# available. What it provides is the thing this estate keeps discovering it
# lacks: somebody actually looking at production after a deploy. A red run
# here is a real defect on the live site, named by route and element.
#
# NOT A `schedule:` TRIGGER. `workflow_run` is explicitly not the cron the
# estate rules restrict (World Hub CLAUDE.md section 11), because it is
# event-driven off the publish it verifies, and it schedules nothing.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    # This is the publisher's `name:`, not its filename. #2676 deleted
    # build-for-world-hub.yml (name 'Build for World Hub Sync') and repointed
    # fifteen files by FILENAME - and missed this one, so from 19:17 to 01:30
    # on 2026-09-02/03 this workflow could only fire from GitHub's throttled
    # scheduler. tests/workflow-run-names-a-live-workflow.law.test.ts now
    # refuses any workflow_run listener whose name no workflow carries.
    workflows: ['Publish Club Arena']
    types: [completed]
  repository_dispatch:
    types: [run-post-deploy-e2e, run-stats-pagination-proof, run-private-record-client-proof]

jobs:
  # No production fixture job may enter even its always-cleanup steps until
  # the root cleanup repair is installed. This job only reads catalog/history.
  certification-cleanup-safety:
    name: Installed certification cleanup protects live tables
    needs: publication-gate
    if: >-
      always() && !cancelled() &&
      (needs.publication-gate.outputs.should_run == 'true' ||
       (github.event_name == 'repository_dispatch' &&
        (github.event.action == 'run-stats-pagination-proof' ||
         github.event.action == 'run-private-record-client-proof')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked read-only verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require installed scoped cleanup before production fixtures
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ci/await-certification-cleanup-safety.mjs

  # Explicit one-client transport proof. This never publishes or changes source flags.
  private-record-client-proof:
    needs: certification-cleanup-safety
    # The focused event skips publication-gate; require successful cleanup
    # explicitly so that skipped ancestor cannot suppress the actual proof.
    if: always() && !cancelled() && needs.certification-cleanup-safety.result == 'success' && github.event_name == 'repository_dispatch' && github.event.action == 'run-private-record-client-proof'
    name: Exact published private record client failover proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: private-record-client-proof-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Admit exact protected gateway functional receipt
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_CLIENT_PROOF_ACTION: ${{ github.event.action }}
          RECORD_CLIENT_PROOF_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/ci/private-record-client-proof.mjs admit
      - name: Require protected source ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git merge-base --is-ancestor "$LIVE_SHA" origin/main
          git merge-base --is-ancestor "$EXPECTED_GATEWAY_REVISION" origin/main
      - name: Install locked verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pin published client, gateway and retained paid source
        id: before
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ci/private-record-client-proof.mjs pin before.json
      - name: Install Chromium only
        timeout-minutes: 5
        run: |
          sudo python3 scripts/ci/ubuntu-apt-mirror.py
          npx playwright install --with-deps chromium
      - name: Create the owned isolated account
        id: account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs create
      - name: Prepare its existing zero-balance member workspace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
        run: node scripts/ci/production-e2e-account.mjs prepare-staff
      - name: Verify the actual published SDK and visible own record
        id: browser
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/private-record-client/report.json
        run: >-
          npx playwright test tests/e2e/production-private-record-failover.spec.ts
          --project=chromium --workers=1 --retries=0 --trace=off --reporter=line,json
          --output=test-results/private-record-client
      - name: Read identities and paid source after the case
        id: after
        if: always() && steps.before.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ci/private-record-client-proof.mjs pin after.json
      - name: Retire only the owned account and verify cleanup
        id: cleanup
        if: always() && steps.account.outcome != '' && steps.account.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { cleanupProductionE2EAccount } from './scripts/ci/production-e2e-account.mjs';
          if (await cleanupProductionE2EAccount() !== true) throw new Error('Owned account cleanup did not verify retirement');
          writeFileSync('e2e-report/private-record-client/cleanup.json', JSON.stringify({verified:true}));
          NODE
      - name: Certify only the completed modern client case
        if: always() && steps.admit.outcome == 'success'
        env:
          ACCOUNT_OUTCOME: ${{ steps.account.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          AFTER_PIN_OUTCOME: ${{ steps.after.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: node scripts/ci/private-record-client-proof.mjs verify
      - name: Retain token-free scoped proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-record-client-proof-${{ github.run_id }}
          path: |
            e2e-report/private-record-client/
            test-results/private-record-client/
          if-no-files-found: warn
          retention-days: 14

  # Explicit, closed recovery of the one release-bound Stats case. It never publishes.
  stats-pagination-proof:
    needs: certification-cleanup-safety
    # The focused event deliberately skips publication-gate. Evaluate this
    # lane despite that ancestor, but never bypass cleanup qualification.
    if: always() && !cancelled() && needs.certification-cleanup-safety.result == 'success' && github.event_name == 'repository_dispatch' && github.event.action == 'run-stats-pagination-proof'
    name: Exact published Stats pagination proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: stats-pagination-proof-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Admit only the fixed protected-main proof
        id: admit
        env:
          STATS_PROOF_ACTION: ${{ github.event.action }}
          STATS_PROOF_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          node scripts/ci/stats-pagination-proof.mjs admit
          git fetch --no-tags --filter=blob:none origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install locked verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium only
        timeout-minutes: 5
        run: |
          sudo python3 scripts/ci/ubuntu-apt-mirror.py
          npx playwright install --with-deps chromium
      - name: Create the owned isolated account
        id: account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs create
      - name: Pin both origins immediately before the one case
        id: pin
        run: |
          set -euo pipefail
          mkdir -p e2e-report/stats-pagination
          git fetch --no-tags --filter=blob:none origin main
          SHA=$(node scripts/ci/stats-pagination-proof.mjs pin e2e-report/stats-pagination/before.json)
          git cat-file -e "$SHA^{commit}"
          git merge-base --is-ancestor "$SHA" origin/main
          echo "LIVE_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Qualify the exact dedicated journey pin
        id: journey_pin
        run: |
          set -euo pipefail
          SHA=$(node scripts/ci/downline-journey-pin.mjs)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SHA" = "$LIVE_SHA"
          echo "DOWNLINE_JOURNEY_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Execute exactly the published pagination case
        id: proof
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
          E2E_STATS_PAGINATION_PROOF: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/stats-pagination/report.json
        run: >-
          npx playwright test tests/e2e/stats-deep.spec.ts
          --grep '^.*published downline pagination survives the initial debounce and resets only for changed search$'
          --project=chromium --workers=1 --retries=0 --reporter=line,json
          --trace=retain-on-failure --output=test-results/stats-pagination
      - name: Require the same two origins immediately after the case
        id: after_pin
        if: always() && steps.pin.outcome == 'success'
        run: node scripts/ci/stats-pagination-proof.mjs pin e2e-report/stats-pagination/after.json
      - name: Verify cleanup of this exact isolated account
        id: cleanup
        if: always() && steps.admit.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { cleanupProductionE2EAccount } from './scripts/ci/production-e2e-account.mjs';
          if (await cleanupProductionE2EAccount() !== true) throw new Error('Owned account cleanup did not verify retirement');
          mkdirSync('e2e-report/stats-pagination', { recursive: true });
          writeFileSync('e2e-report/stats-pagination/cleanup.json', JSON.stringify({ verified: true }));
          NODE
      - name: Require one first-attempt pass, exact release and actual cleanup
        if: always()
        env:
          ACCOUNT_OUTCOME: ${{ steps.account.outcome }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          AFTER_PIN_OUTCOME: ${{ steps.after_pin.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: >-
          node scripts/ci/stats-pagination-proof.mjs verify
          e2e-report/stats-pagination/report.json e2e-report/stats-pagination/before.json
          e2e-report/stats-pagination/after.json e2e-report/stats-pagination/cleanup.json
      - name: Retain the one-case proof on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-pagination-proof
          path: |
            e2e-report/stats-pagination/
            e2e-report/downline-journey-pin.json
            test-results/stats-pagination/
          if-no-files-found: error
          retention-days: 14

  publication-gate:
    if: github.event_name != 'repository_dispatch' || (github.event.action != 'run-stats-pagination-proof' && github.event.action != 'run-private-record-client-proof')
    name: Confirm The Hetzner Web Publish Reached Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.origin.outputs.should_run }}
      engine_trigger_sha: ${{ steps.origin.outputs.engine_trigger_sha }}
      client_navigation: ${{ steps.origin.outputs.client_navigation }}
      client_target_sha: ${{ steps.client-target.outputs.sha }}
      verification_sha: ${{ steps.client-target.outputs.verification_sha }}
    steps:
      - name: Checkout trusted publication verification
        if: github.event_name == 'workflow_run' || (github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.client_navigation) != 'null')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      # workflow_run.conclusion covers the whole publisher, including the
      # optional Capgo job. A Capgo failure after a verified web publish must
      # never suppress web E2E, so read the exact origin job and its proof step.
      - name: Read The Origin Job Verdict
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          SOURCE_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          REPOSITORY_ID: ${{ github.repository_id }}
          ENGINE_TRIGGER_SHA: ${{ github.event.client_payload.engine_sha || '' }}
          ENGINE_TRIGGER_JSON: ${{ toJSON(github.event.client_payload.engine_sha) }}
          MOBILE_MULTIRUN_JSON: ${{ toJSON(github.event.client_payload.mobile_multirun) }}
          HORSE_SOCIAL_JSON: ${{ toJSON(github.event.client_payload.horse_social) }}
          MOBILE_MULTIRUN_TARGET_JSON: ${{ toJSON(github.event.client_payload.mobile_multirun_target) }}
          CLIENT_NAVIGATION_JSON: ${{ toJSON(github.event.client_payload.client_navigation) }}
          CLIENT_NAVIGATION_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            # One explicitly requested natural observation per fixture budget.
            # Horse evidence is valid only for an exact engine-triggered run.
            if [ "${HORSE_SOCIAL_JSON-null}" != null ]; then
              { [ "$HORSE_SOCIAL_JSON" = true ] && [ "$MOBILE_MULTIRUN_JSON" = null ] && [ "$MOBILE_MULTIRUN_TARGET_JSON" = null ] && [ "$CLIENT_NAVIGATION_JSON" = null ] && [ "$ENGINE_TRIGGER_JSON" != null ]; } \
                || { echo '::error::Horse social proof requires literal true, one engine pin and no other observation mode.'; exit 1; }
            fi
            if node -e 'const p=JSON.parse(process.env.CLIENT_NAVIGATION_PAYLOAD || "null"); process.exit(p && Object.hasOwn(p,"client_navigation") ? 0 : 1)'; then
              [ "${CLIENT_NAVIGATION_JSON-null}" = true ] \
                || { echo '::error::client_navigation must be literal true.'; exit 1; }
              node scripts/ci/client-navigation-certificate.mjs admit
              echo 'client_navigation=true' >> "$GITHUB_OUTPUT"
              echo 'engine_trigger_sha=' >> "$GITHUB_OUTPUT"
              echo 'should_run=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${MOBILE_MULTIRUN_TARGET_JSON-null}" != null ]; then
              { { [ "$MOBILE_MULTIRUN_TARGET_JSON" = 1 ] || [ "$MOBILE_MULTIRUN_TARGET_JSON" = 3 ]; } && [ "$MOBILE_MULTIRUN_JSON" = true ] && [ "$ENGINE_TRIGGER_JSON" = null ] && [ "${HORSE_SOCIAL_JSON-null}" = null ] && [ "${CLIENT_NAVIGATION_JSON-null}" = null ]; } \
                || { echo '::error::A targeted natural proof requires numeric target 1 or 3, literal mobile true and no engine pin.'; exit 1; }
            fi
            if [ "$MOBILE_MULTIRUN_JSON" = true ] && [ "$ENGINE_TRIGGER_JSON" = null ]; then
              # An explicit client observation binds the healthy serving engine
              # when its job starts, just like the publication-triggered lane.
              echo 'engine_trigger_sha=' >> "$GITHUB_OUTPUT"
              echo 'should_run=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$ENGINE_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || { echo '::error::An engine-triggered production certificate requires one full lowercase engine SHA.'; exit 1; }
            [ "$ENGINE_TRIGGER_JSON" = "\"$ENGINE_TRIGGER_SHA\"" ] \
              || { echo '::error::An engine pin must be a JSON string containing its full SHA.'; exit 1; }
            echo "engine_trigger_sha=$ENGINE_TRIGGER_SHA" >> "$GITHUB_OUTPUT"
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'engine_trigger_sha=' >> "$GITHUB_OUTPUT"
          [ "$EVENT_NAME" = workflow_run ] \
            || { echo "::error::Unsupported production certification event: $EVENT_NAME"; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] \
            || { echo '::error::The source workflow run id is malformed.'; exit 1; }
          JOBS_JSON="$(mktemp)"
          trap 'rm -f -- "$JOBS_JSON"' EXIT
          timeout 30s node scripts/ci/read-publisher-jobs.mjs \
            "${{ github.repository }}" "$SOURCE_RUN_ID" > "$JOBS_JSON"
          node - "$JOBS_JSON" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const { publisherJobKey } = require('./scripts/ci/publisher-job-identity.mjs');
          const [file, output] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          const publisherJob = (entry, key) => publisherJobKey(entry?.name) === key || entry?.name === key || entry?.name === `production / ${key}`;
          if (!Array.isArray(payload.jobs)) throw new Error('The source jobs response is malformed.');
          const jobs = payload.jobs.filter((entry) => publisherJob(entry, 'publish-to-origin'));
          // A PUBLISHER THAT NEVER PUBLISHED IS NOT A DEFECT ON PRODUCTION.
          //
          // publish-club-arena cancels in progress when a newer merge arrives,
          // and on 2026-09-30 merges were landing every few minutes. Run
          // 36749429418 was cancelled while still queued and produced ZERO
          // jobs, so this read said `Expected one latest publish-to-origin
          // job, received 0` and the certificate went red - twice in thirty
          // seconds (36749436277, 36749498583), both before a single browser
          // started. Nothing had gone wrong: a newer publisher had taken over,
          // and its own certificate is the one that means anything.
          //
          // So when no publish-to-origin job exists AND every job the source
          // run did produce ended cancelled or skipped, nothing reached the
          // origin and there is nothing to certify. Stand down without a
          // verdict: should_run is never written, so every downstream job
          // skips and this run occupies no production lock.
          //
          // This deliberately cannot hide a real publish. A source run holding
          // any job that actually ran, with no publish-to-origin among them,
          // is the renamed-or-missing-job hole and still throws below. The
          // source conclusion never qualifies or suppresses proven web publication.
          // Only cancelled read-only preparation with no writer can stand down;
          // an optional Capgo failure must not suppress web E2E.
          if (payload.total_count !== payload.jobs.length) throw new Error('Source job metadata is incomplete.');
          const inspection = payload.jobs.filter(entry => publisherJob(entry, 'inspect-record-gateway-host'));
          if (inspection.length === 1 && inspection[0].conclusion !== 'skipped' && jobs.length === 1 && jobs[0].conclusion === 'skipped') {
            const read = (inspection[0].steps ?? []).filter(entry => entry.name === 'Read fixed gateway host metadata without changing host state');
            if (inspection[0].status !== 'completed' || inspection[0].conclusion !== 'success' || read.length !== 1 || read[0].conclusion !== 'success') throw new Error('Gateway host inspection is incomplete; no installation or publication certified.');
            console.log('Read-only host inspection; no installation or publication certified.');
            process.exit(0);
          }
          const credential = payload.jobs.filter(entry => publisherJob(entry, 'install-record-gateway-credentials'));
          if (credential.length === 1 && credential[0].conclusion !== 'skipped' && jobs.length === 1 && jobs[0].conclusion === 'skipped') {
            const install = (credential[0].steps ?? []).filter(entry => entry.name === 'Install only the dedicated listener credential');
            if (credential[0].status !== 'completed' || credential[0].conclusion !== 'success' || install.length !== 1 || install[0].conclusion !== 'success') throw new Error('Dedicated listener credential is incomplete; no gateway activation or client publication certified.');
            console.log('Dedicated listener credential only; no gateway activation or client publication certified.');
            process.exit(0);
          }
          const bootstrap = payload.jobs.filter(entry => publisherJob(entry, 'bootstrap-record-gateway'));
          if (bootstrap.length === 1 && bootstrap[0].conclusion !== 'skipped' && jobs.length === 1 && jobs[0].conclusion === 'skipped') {
            const install = (bootstrap[0].steps ?? []).filter(entry => entry.name === 'Install inert prerequisites through the existing protected provider');
            if (bootstrap[0].status !== 'completed' || bootstrap[0].conclusion !== 'success' || install.length !== 1 || install[0].conclusion !== 'success') throw new Error('Gateway bootstrap is incomplete; no activation or client publication is certified.');
            console.log('Gateway bootstrap only; no gateway activation or client publication certified.');
            process.exit(0);
          }
          const gateway = payload.jobs.filter((entry) => publisherJob(entry, 'publish-record-gateway'));
          const gatewayOnly = gateway.length === 1 && gateway[0].conclusion !== 'skipped' &&
            jobs.length === 1 && jobs[0].conclusion === 'skipped' &&
            payload.jobs.filter(entry => publisherJob(entry, 'retain-runtime')).every(entry => entry.conclusion === 'skipped');
          if (gatewayOnly) {
            const builds = payload.jobs.filter(entry => entry?.name === 'build-record-gateway');
            const proofNames = ['Activate only the prepared independent service', 'Verify authenticated gateway record delivery', 'Ensure the reserved gateway canary account is retired'];
            const proofsComplete = proofNames.every(name => {
              const matching = (gateway[0].steps ?? []).filter(entry => entry.name === name);
              return matching.length === 1 && matching[0].status === 'completed' && matching[0].conclusion === 'success';
            });
            if (builds.length !== 1 || builds[0].conclusion !== 'success' || gateway[0].status !== 'completed' || gateway[0].conclusion !== 'success' || !proofsComplete) throw new Error('Independent gateway installation or authenticated verification is incomplete; no client publication is certified.');
            console.log('Gateway component only; client publication and client E2E remain unclaimed.');
            process.exit(0);
          }
          const retained = payload.jobs.filter((entry) => publisherJob(entry, 'retain-runtime'));
          const retentionSucceeded = retained.length === 1 && retained[0].status === 'completed' && retained[0].conclusion === 'success' &&
            ['Verify both origins still serve the qualified immutable runtime', 'Record qualified retained runtime'].every((name) =>
              (retained[0].steps ?? []).filter((entry) => entry.name === name && entry.status === 'completed' && entry.conclusion === 'success').length === 1);
          if (retentionSucceeded) {
            if (jobs.length !== 1 || jobs[0].conclusion !== 'skipped') throw new Error('Retention cannot coexist with an origin transaction.');
            fs.appendFileSync(output, 'should_run=true\nretained=true\n');
          } else {
          const inconclusive = (entry) =>
            entry?.conclusion === 'cancelled' || entry?.conclusion === 'skipped';
          // A CANCELLED PUBLISHER WHOSE ORIGIN DOOR NEVER OPENED (2026-10-19).
          // The zero-job rule above misses the commoner shape: publish-needed
          // and the client tests succeed, the run is cancelled while its
          // read-only retain-runtime job is still verifying, and
          // publish-to-origin is therefore skipped with no steps. Nothing
          // reached the origin, exactly as with zero jobs, but this read threw
          // "missing one of its release-verdict steps" and turned the
          // certificate red (39283184506 on publisher 39275112750). A
          // publish-to-origin that started (any step) may have moved the
          // origin and still needs its proof; any failed or timed-out job is
          // a real publisher fault and still throws below.
          const neverOpened = (entry) =>
            entry?.conclusion === 'skipped' ||
            (entry?.conclusion === 'cancelled' && (entry.steps ?? []).length === 0);
          const cancelledBeforeOrigin =
            jobs.length === 1 && jobs.every(neverOpened) &&
            retained.every(inconclusive) &&
            payload.jobs.some((entry) => entry?.conclusion === 'cancelled') &&
            payload.jobs.every((entry) => entry?.conclusion === 'success' || inconclusive(entry));
          // Preparation now precedes the production caller's lock. A pending
          // caller can be superseded after all read-only preparation succeeded,
          // before GitHub creates any nested writer job. This is not a publish
          // verdict: unknown/renamed jobs, failures or any child execution refuse.
          const preparationNames = new Set([
            'publish-needed', 'build-and-store', 'build-record-gateway',
            ...[1,2,3,4].map(n => `client-tests (${n})`),
            'client-publication / admit',
            'client-publication / Admit The Selected Client Publication Window',
            'client-publication / build-and-store',
            ...Array.from({length:16}, (_, i) => `client-publication / client-tests (${i + 1})`),
          ]);
          const cancelledBeforeTransaction = process.env.SOURCE_CONCLUSION === 'cancelled' &&
            jobs.length === 0 && retained.length === 0 && payload.jobs.length > 0 &&
            new Set(payload.jobs.map(entry => entry.name)).size === payload.jobs.length &&
            payload.jobs.every(entry => entry.status === 'completed' &&
              ((preparationNames.has(entry.name) && (entry.conclusion === 'success' || inconclusive(entry))) ||
               (['production', 'client-publication / production'].includes(entry.name) && ['cancelled', 'skipped'].includes(entry.conclusion) && (entry.steps ?? []).length === 0)));
          const superseded =
            (jobs.length === 0 && payload.jobs.every(inconclusive)) || cancelledBeforeOrigin || cancelledBeforeTransaction;
          if (superseded) {
            console.log(
              'The source publisher was superseded before it reached the origin; ' +
                'nothing was published, so this run has nothing to certify.'
            );
          } else {
          if (jobs.length !== 1) {
            throw new Error(`Expected one latest publish-to-origin job, received ${jobs.length}.`);
          }
          const origin = jobs[0];
          const verdicts = (origin.steps ?? []).filter(
            (entry) => entry?.name === 'Stand down if the origin already serves a newer bundle'
          );
          const publishes = (origin.steps ?? []).filter(
            (entry) => entry?.name === 'Publish through the host-owned immutable transaction'
          );
          const proofs = (origin.steps ?? []).filter(
            (entry) => entry?.name === 'Verify the origin serves this bundle'
          );
          if (verdicts.length !== 1 || publishes.length !== 1 || proofs.length !== 1) {
            throw new Error('The origin job is missing one of its release-verdict steps.');
          }
          const originSucceeded =
            origin.status === 'completed' &&
            origin.conclusion === 'success';
          const publishProved =
            proofs[0].status === 'completed' &&
            proofs[0].conclusion === 'success';
          const safeStanddown =
            verdicts[0].status === 'completed' &&
            verdicts[0].conclusion === 'success' &&
            publishes[0].status === 'completed' &&
            publishes[0].conclusion === 'skipped' &&
            proofs[0].status === 'completed' &&
            proofs[0].conclusion === 'skipped';
          if (!originSucceeded || (!publishProved && !safeStanddown)) {
            throw new Error(
              'The source run neither proved a Hetzner web publish nor completed a safe forward stand-down.'
            );
          }
          fs.appendFileSync(output, 'should_run=true\n');
          }
          }
          NODE

      # The publisher selects current main, which can be newer than its trigger.
      # Its unique same-run dist artifact binds that selection. Never substitute
      # a PR artifact or whichever newer SHA happens to be live now. If a later
      # publisher has superseded it, the exact live comparison still refuses.
      - name: Resolve the exact client artifact selected by this publisher
        # A STOOD-DOWN PUBLISHER HAS NO ARTIFACT (2026-10-02). When the origin
        # verdict above stands down for a superseded publisher it never writes
        # should_run, so every downstream job skips - but this step still ran,
        # asked the cancelled run for its client artifact, found 0 and turned
        # the stand-down red (37021105028, 37021996055, 37027174306,
        # 37043492278, 37045423284). It only resolves a publisher that ran.
        if: github.event_name == 'workflow_run' && steps.origin.outputs.should_run == 'true'
        id: client-target
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RETAINED_RUNTIME: ${{ steps.origin.outputs.retained }}
        run: |
          set -euo pipefail
          if [ "$RETAINED_RUNTIME" = 'true' ]; then
            # The receipt is a separate same-run artifact, never a new dist.
            timeout 30s gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
              | node scripts/ci/client-runtime-retention.mjs receipt-artifact "$SOURCE_RUN_ID" "$SOURCE_TRIGGER_SHA" "$REPOSITORY_ID" > "$RUNNER_TEMP/retained-artifact-id"
            timeout 60s gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" \
              --name club-arena-retained-runtime --dir "$RUNNER_TEMP/retained-runtime"
            # Fetch complete baseline and verification ancestry before receipt
            # validation; neither an API-capped compare nor trigger diff suffices.
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            node scripts/ci/client-runtime-retention.mjs receive "$RUNNER_TEMP/retained-runtime/retained-runtime.json" \
              "$SOURCE_RUN_ID" "$SOURCE_TRIGGER_SHA" "$REPOSITORY_ID"
            exit 0
          fi
          SELECTED_SHA=$(timeout 30s gh api \
            "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            | node scripts/ci/production-e2e-provenance.mjs \
              publisher-artifact "$SOURCE_RUN_ID" "$SOURCE_TRIGGER_SHA" "$REPOSITORY_ID")
          echo "sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Publisher run $SOURCE_RUN_ID selected client \`$SELECTED_SHA\` (trigger \`$SOURCE_TRIGGER_SHA\`)." >> "$GITHUB_STEP_SUMMARY"

  # DISCOVERABILITY PHASE 3 (2026-09-17). What a crawler gets from production,
  # checked against what the deployed bundle says it published: build-info,
  # the prerender manifest, every prerendered route's head and words, the
  # sitemap and every URL in it, and the shell behind a deep link. Independent
  # of the engine certificate below on purpose: the public pages do not need
  # the engine, and an engine release lagging main must not hide a broken head.
  # No route list lives here; scripts/ci/check-live-seo-contract.mjs reads it
  # from the site.
  seo-contract:
    needs: publication-gate
    if: needs.publication-gate.outputs.should_run == 'true' && github.event_name == 'workflow_run'
    name: The Live SEO Contract Holds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the published commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publication-gate.outputs.client_target_sha }}
          # Full commit graph, no blobs: when a later protected-main release
          # has replaced this client before the job starts, the checker proves
          # the served commit descends from it (merge-base) instead of waiting
          # three minutes for a release that is gone (2026-10-19).
          fetch-depth: 0
          filter: blob:none
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read production as Googlebot and hold it to the contract
        run: node scripts/ci/check-live-seo-contract.mjs --sha "${{ needs.publication-gate.outputs.client_target_sha }}"

  production-e2e:
    needs: [publication-gate, certification-cleanup-safety]
    # A verified publish and a safe forward stand-down both certify the live
    # player route. A failed/skipped origin job makes the gate red, never green
    # without executing the browser suite. Optional downstream failures cannot
    # hide a successful web release.
    if: needs.publication-gate.outputs.should_run == 'true'
    name: Client browser verification
    # This trusted workflow can receive production database credentials. Run it
    # on a fresh hosted image, never on a persistent runner that has executed
    # pull-request code.
    runs-on: ubuntu-latest
    # Serialize only jobs that will really touch the shared production test
    # accounts. Gate-only no-op runs never occupy this lock.
    #
    # A "cancelled" client lane is almost always a QUEUED job that never ran,
    # not a running certificate that was killed. With cancel-in-progress false,
    # GitHub keeps one running and one pending job per group, and a newer
    # pending job replaces the older pending one. The replaced job has
    # runner_id 0 and zero steps, and nothing is lost: the job that does run
    # reads build-info.json when it starts and re-targets onto that commit
    # (the `descendant` branch below), so it covers every commit it replaced.
    # Measured 2026-10-07 04:00-07:25 UTC: all nineteen cancelled client lanes
    # had runner_id 0 and zero steps, and every job that took the lock
    # (04:10, 04:49, 05:28, 06:08, 06:41, 07:25) ran to its own verdict.
    # cancel-in-progress true would instead kill the running certificate on
    # every merge; see tests/unit/postDeployE2EConcurrency.test.ts.
    concurrency:
      group: post-deploy-e2e-production
      cancel-in-progress: false
    # Cashier, the isolated stateful groups, and the responsive route sweep
    # normally finish well below this ceiling. Runs 37397055463 and
    # 37407226104 proved first that 50 minutes and then that 65 minutes could
    # cancel the job after the nine-surface Table Management audit received
    # its truthful sequential route budget. The latter ran for 67 minutes.
    # Keep enough bounded headroom for that audit plus the honesty, cleanup,
    # release-window, and report steps. A timeout before those steps produces
    # neither a verdict nor fixture-cleanup proof.
    timeout-minutes: 80
    outputs:
      client_sha: ${{ steps.live.outputs.sha }}
      certified: ${{ steps.release_window.outcome == 'success' && steps.release_window.outputs.certified == 'true' }}
      phase1_certified: ${{ steps.phase1_verdict.outcome == 'success' && steps.phase1_verdict.outputs.certified == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publication-gate.outputs.verification_sha || github.sha }}
          # The step below may need to resolve the sha production is actually
          # serving, which is usually an ancestor of this run's commit and is
          # absent from the default shallow clone.
          fetch-depth: 0
          # blob:none keeps every one of the 7,223 commits and drops the blobs of old
          # revisions. Measured 2026-09-13, three runs each: 33-35s / 531MB against
          # 36-43s / 766MB, for identical ancestry. Nothing in this repo's workflows
          # reads a historical file version - they ask merge-base, rev-list, log and
          # cat-file -e, which are all commit-graph work - so those blobs were paid
          # for on every run and never read.
          filter: blob:none

      - name: Download source-bound retained runtime evidence
        if: needs.publication-gate.outputs.verification_sha != ''
        uses: actions/download-artifact@v4
        with:
          name: club-arena-retained-runtime
          path: retained-runtime-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # Production credentials are confined to this trusted default-branch
      # workflow. Pull-request CI validates committed source and never receives
      # them; every successful publish runs this read-only production audit.
      # Keep this chip-safety proof in its own first step. A failure in another
      # catalogue audit must not prevent the FK question from being asked.
      - name: Prove every club foreign key remains deletable
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/check-club-fk-indexes.mjs

      - name: Audit the remaining live schema from trusted code
        if: needs.publication-gate.outputs.client_navigation != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/ci/check-phantom-tables.mjs
          node scripts/ci/check-phantom-columns.mjs
          node scripts/ci/check-embed-relationships.mjs

      # The Azure Ubuntu mirror stalled this install for 59 minutes on
      # 2026-10-26 (97 MB at 27 kB/s) and timed the whole job out; the
      # primary HTTPS mirror is the shared fix (scripts/ci/ubuntu-apt-mirror.py).
      - name: Install Chromium and WebKit
        # Comparable success121591382452 took49s. Install121619175020 took
        # 49m32s, then created an account with too little of the80m job left.
        # Refuse a stalled setup before any production fixture exists; leave
        # the suite and its always-cleanup their existing execution budget.
        timeout-minutes: 10
        run: |
          sudo python3 scripts/ci/ubuntu-apt-mirror.py
          npx playwright install chromium webkit --with-deps

      # Production must be reachable and serving one exact repository commit
      # before any browser assertion can carry a verdict.
      - name: Confirm production is serving, and record what we are testing
        id: live
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            BODY=''
            if BODY=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://smarter.poker/hub/club-arena/build-info.json?cb=$RANDOM"); then
              if LIVE=$(printf '%s' "$BODY" \
                | node scripts/ci/production-e2e-provenance.mjs build-info); then
                [[ "$LIVE" =~ ^[0-9a-f]{40}$ ]]
                echo "sha=$LIVE" >> "$GITHUB_OUTPUT"
                echo "ready=true" >> "$GITHUB_OUTPUT"
                echo "### Post-deploy E2E" >> "$GITHUB_STEP_SUMMARY"
                echo "Testing production as it is serving right now: \`$LIVE\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "  attempt $i: build-info.json did not contain one exact Club Arena SHA"
            sleep 10
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::error::production did not serve one valid full build-info.json SHA."
          exit 1

      # ───────────────────────────────────────────────────────────────────
      # THE SPECS AND THE BUNDLE MUST COME FROM THE SAME COMMIT.
      #
      # The step above stopped pinning to this run's sha on purpose, and the
      # reasoning is sound: the question is "is production healthy right now".
      # But the CHECKOUT was never brought along. So the run tested whatever
      # production served using the assertions from a different, newer commit.
      #
      # That is not a hypothetical. On 2026-08-31 runs 33394046555 and
      # 33394398578 failed on `[data-cashier-recovery="true"]` not found. The
      # element was on `main` (CashierTradePage.tsx:2162, merged in #2165 at
      # 12:43) and the spec asserting it was in the checkout - but production
      # was still serving a bundle from before it. Nothing was broken. The run
      # was asking a new question of an old page, and calling the answer a
      # defect. Ten minutes later, unchanged, the same spec passed.
      #
      # A guard whose reds are routinely false is a guard people learn to
      # ignore, which is how it becomes a comment again.
      #
      # So: when production is serving an ANCESTOR of this checkout, take the
      # specs from that ancestor too. Unknown and divergent provenance fail
      # closed because a mismatched assertion set cannot produce a verdict.
      # ───────────────────────────────────────────────────────────────────
      # A tooling-only merge can retain an older qualified runtime. Preserve
      # only this trusted report validator before aligning specs to that runtime.
      - name: Preserve the closed navigation report validator
        id: navigation_validator
        if: needs.publication-gate.outputs.client_navigation == 'true'
        run: cp scripts/ci/client-navigation-certificate.mjs "$RUNNER_TEMP/client-navigation-certificate.mjs"

      - name: Take the specs from the commit production is actually serving
        if: steps.live.outputs.ready == 'true'
        id: align
        run: |
          set -euo pipefail
          LIVE='${{ steps.live.outputs.sha }}'
          HERE=$(git rev-parse HEAD)
          [[ "$LIVE" =~ ^[0-9a-f]{40}$ ]] && [[ "$HERE" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$LIVE^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$LIVE" --depth=1
          fi
          if [ -n '${{ needs.publication-gate.outputs.verification_sha }}' ]; then
            RETAINED='${{ needs.publication-gate.outputs.client_target_sha }}'
            test "$HERE" = '${{ needs.publication-gate.outputs.verification_sha }}'
            [[ "$RETAINED" =~ ^[0-9a-f]{40}$ ]]
            if [ "$LIVE" = "$RETAINED" ]; then
              node scripts/ci/client-runtime-retention.mjs harness "$LIVE" "$HERE" \
                retained-runtime-evidence/retained-runtime.json \
                '${{ github.event.workflow_run.id }}' '${{ github.event.workflow_run.head_sha }}' '${{ github.repository_id }}'
              echo "specs=$HERE" >> "$GITHUB_OUTPUT"
              echo "Actual runtime \`$LIVE\`; complete current qualified verification source \`$HERE\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # A LATER PUBLISH IS NOT A DEFECT IN THE RETAINED ONE (2026-10-11).
            #
            # This used to be a bare `test "$LIVE" = <retained runtime>`. A
            # retaining publisher's certificate can wait behind the production
            # lock for longer than the gap between merges, and run 38170604116
            # started its browsers 48 minutes after publisher 38169740342
            # retained 5c1e013, by which time production served a76ebb9, three
            # commits later on protected main. The test exited 1 with no message
            # and the whole lane went red ("the suite did not run") although
            # nothing on the live site had been examined at all. That is
            # "could not tell" reported as a defect (CLAUDE.md 10.86 rule 1).
            #
            # A forward protected-main release is handled exactly as a run
            # without a retained runtime handles it: the lineage logic below
            # aligns the specs with what production actually serves, and the
            # release-window step classifies anything that moves after that.
            # The retained-runtime harness proof is skipped only because it
            # describes a runtime production no longer serves. A rollback, or a
            # live SHA that is not a descendant of the retained runtime, is still
            # a hard red.
            git cat-file -e "$RETAINED^{commit}"
            if ! git merge-base --is-ancestor "$RETAINED" "$LIVE"; then
              echo "::error::production serves \`$LIVE\`, which is not a forward release from retained runtime \`$RETAINED\`."
              exit 1
            fi
            echo "Retained runtime \`$RETAINED\` was superseded by \`$LIVE\` before the browsers started; certifying the release production actually serves." >> "$GITHUB_STEP_SUMMARY"
          fi
          RELATION=$(node scripts/ci/production-e2e-provenance.mjs lineage "$LIVE" "$HERE")
          if [ "$RELATION" = same ]; then
            echo "specs=$HERE" >> $GITHUB_OUTPUT
            echo "The specs and the deployed bundle are the same commit (\`$HERE\`)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$RELATION" = ancestor ]; then
            # ASSERTIONS from the deployed commit; HARNESS from this one.
            #
            # Swapping tests/e2e wholesale would also drag global-setup.ts and
            # its support/ helpers back to $LIVE - and $LIVE predates the
            # E2E_REQUIRE_AUTH throw added in this very commit. The run would
            # then silently regain the signed-out fallback it just lost, on
            # exactly the runs where production is behind. A fix that disables
            # itself under the condition it was written for is worse than none.
            # Local CSS/component/art fixtures execute with these assertions.
            # Retarget their inputs too; a later spec can import new source.
            git checkout "$LIVE" -- tests/e2e src public
            # Authentication and support are harness authority, not page-version
            # assertions. Never let deploy lag
            # roll either guard back to an older, weaker implementation.
            git checkout "$HERE" -- \
              tests/e2e/global-setup.ts \
              tests/e2e/support
            echo "specs=$LIVE" >> $GITHUB_OUTPUT
            echo "Production is serving \`$LIVE\`, an ancestor of this run's \`$HERE\`." >> $GITHUB_STEP_SUMMARY
            echo "Page assertions taken from \`$LIVE\`; auth and support harnesses kept at \`$HERE\`." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$RELATION" = descendant ]; then
            # PRODUCTION IS AHEAD OF THIS CHECKOUT, AND THAT IS NORMAL.
            #
            # Until 2026-09-30 this was a hard red reading `Production SHA X is
            # not an ancestor of checkout Y` (run 36673263757). It never meant a
            # divergence: the publisher fires on every merge and merges land
            # every few minutes, so by the time forty minutes of browsers have
            # run, a LATER commit on the same protected main is usually what is
            # being served. Refusing it told nobody anything about the live site.
            #
            # Re-target instead. Take the WHOLE suite from the live commit -
            # assertions and harness together - because here $LIVE is the newer
            # one, and restoring $HERE's harness over it would be exactly the
            # roll-back-to-a-weaker-guard that the ancestor branch above exists
            # to prevent, pointed the other way.
            # Local CSS/component/art fixtures execute with these assertions.
            # Retarget their inputs too; a later spec can import new source.
            git checkout "$LIVE" -- tests/e2e src public
            echo "specs=$LIVE" >> $GITHUB_OUTPUT
            echo "Production is serving \`$LIVE\`, a later commit than this run's \`$HERE\`." >> $GITHUB_STEP_SUMMARY
            echo "The whole suite was re-targeted onto \`$LIVE\` so the assertions match the bundle the browser loads." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "::error::Unexpected provenance relation '$RELATION'."
          exit 1

      # A standing shared login is eventually changed, disabled, left behind a
      # one-time gate, or mutated by two overlapping suites. Build one isolated
      # player for this job instead. The account lives only in RUNNER_TEMP and
      # is hard-deleted by the always() cleanup below through a server function
      # that refuses every email outside the reserved certification namespace.
      - name: Provision an isolated production E2E account
        if: steps.live.outputs.ready == 'true'
        id: account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs create

      # The Player Command route is intentionally staff-only. Give the brand
      # new reserved identity a zero-balance admin membership before any
      # browser starts. The helper refuses existing memberships and non-test
      # identities; the always() sweep below removes this row with the account.
      - name: Prepare isolated Player Command staff access
        if: steps.live.outputs.ready == 'true' && steps.account.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
        run: node scripts/ci/production-e2e-account.mjs prepare-staff

      - name: Verify agent bank and private-data boundaries with the isolated identity
        id: agent_boundary
        if: steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
        run: |
          node scripts/ci/qualify-agent-boundary.mjs
          node scripts/ci/qualify-agent-assignment.mjs

      # The standalone template builder requires independent club authority.
      # Reuse the reserved zero-balance identity; save no template or game.
      - name: Prepare isolated standalone template access
        id: template_access
        if: steps.live.outputs.ready == 'true' && steps.account.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
        run: node scripts/ci/production-e2e-account.mjs prepare-template-staff

      # Lightning membership is independent of standalone template topology.
      # A union member club still hosts its authorized operator dashboard.
      - name: Prepare isolated Lightning operator access
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
        run: node scripts/ci/production-e2e-account.mjs prepare-lightning-staff

      - name: Certify the live cashier database contract
        if: always() && steps.live.outputs.ready == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # `pg` is a pinned repository dependency. This stays deterministic on
        # hosted and estate runners instead of assuming the image has psql.
        run: node scripts/verification-harness/certify-cashier-contract.mjs

      # Keep the release-critical Cashier result independent from the broader
      # production sweep. A failure on Stats or another route must not obscure
      # whether the money surface itself passed or failed.
      # Read the real operator doors and cancel a worker decision. This uses
      # the existing disposable zero-balance staff identity and makes no writes.
      - name: Certify the authenticated production notification inbox
        id: notification_inbox
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/notifications.json
        run: >-
          npx playwright test tests/e2e/production-notifications.spec.ts
          --project=chromium --reporter=line,json --workers=1 --retries=0

      - name: Preserve the notification verdict before the broader page sweep
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && needs.publication-gate.outputs.client_navigation != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-notification-report
          path: |
            e2e-report/notifications.json
            test-results/production-notifications-*/
          if-no-files-found: error
          retention-days: 3

      # A BRAND-NEW PLAYER ON AN iPHONE (2026-10-17). Every other account here
      # is normalized past Complete Your Profile, so the gate a new sign-up
      # meets first was never certified, and ENTER ARENA sat dead on iPhone
      # Safari for two referred players. This lane makes its own disposable
      # account exactly as a sign-up arrives (alias chosen, no arena avatar),
      # walks terms -> profile -> welcome on real WebKit with an iPhone
      # profile, never joins a club, and is hard-deleted below.
      - name: Provision an isolated first-run account
        id: first_run_account
        if: always() && steps.live.outputs.ready == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs create-first-run

      - name: Certify a new iPhone player gets through Complete Your Profile
        id: first_run
        if: always() && steps.live.outputs.ready == 'true' && steps.first_run_account.outcome == 'success' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/first-run-iphone.json
        run: >-
          npx playwright test tests/e2e/production-first-run-iphone.spec.ts
          --project=webkit-first-run --reporter=line,json --workers=1 --retries=0

      - name: Hard-delete the isolated first-run account
        if: always() && steps.live.outputs.ready == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs cleanup-first-run

      # WHICH RELEASE DID THE LIGHTNING OPERATOR CERTIFICATE RUN AGAINST?
      #
      # Until 2026-10-12 the spec compared build-info.json against the SHA this
      # job recorded at its start and failed on any difference. The publisher
      # fires on every merge, so a forward publish while the browsers ran sent
      # this step red with no defect on the live site (runs 38206133852 and
      # 38244592617: production had advanced to a later protected-main commit).
      # That is "could not tell" (CLAUDE.md 10.86 rule 1), not a failure.
      #
      # The step now reads build-info.json immediately before and after its own
      # browsers, and the step below classifies that bracket with the same
      # `bracket` classifier the Phase 1 journeys use: both reads on the
      # recorded SHA certifies; a later commit on protected main is an UNKNOWN
      # non-verdict; a rollback or an off-lineage SHA is still a hard red.
      # LIVE_SHA is deliberately no longer passed to the spec, so a spec taken
      # from an older deployed commit cannot re-introduce the bare comparison.
      - name: Certify the authenticated Lightning operator cold loads
        id: lightning_operator
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/lightning-operator.json
        run: |
          set +e
          mkdir -p release-bracket
          read_release () {
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://smarter.poker/hub/club-arena/build-info.json?bracket=$RANDOM" > "$1" 2>/dev/null \
              || : > "$1"
          }
          read_release release-bracket/lightning-before.json
          # Read-only Join Lightning from the member lobby (#7879) rides the same
          # authenticated account and the same release bracket.
          npx playwright test tests/e2e/production-lightning-operator.spec.ts \
            tests/e2e/production-lightning-lobby-join.spec.ts \
            --project=chromium --reporter=line,json --workers=1 --retries=0
          rc=$?
          read_release release-bracket/lightning-after.json
          exit $rc

      - name: Classify the release the Lightning operator certificate ran against
        id: lightning_release
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          EXPECTED_LIVE_SHA: ${{ steps.live.outputs.sha }}
        run: |
          set -uo pipefail
          echo 'certified=false' >> "$GITHUB_OUTPUT"
          if ! [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The recorded live SHA is malformed."
            exit 1
          fi
          # Production may have moved past this checkout's view of main while
          # the browsers ran. Refresh only trusted main, never an arbitrary SHA.
          if ! timeout 30s git fetch --no-tags origin main; then
            echo "::warning::UNKNOWN: protected-main history was unreadable, so the Lightning operator release is unknown."
            echo "NON-VERDICT: protected-main history was unreadable; the Lightning operator certificate certifies no release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATUS=0
          BRACKET="$(node scripts/ci/production-e2e-provenance.mjs bracket "$EXPECTED_LIVE_SHA" \
            release-bracket/lightning-before.json release-bracket/lightning-after.json)" || STATUS=$?
          case "$STATUS" in
            0)
              echo 'certified=true' >> "$GITHUB_OUTPUT"
              echo "Production served \`$EXPECTED_LIVE_SHA\` before and after the Lightning operator certificate." >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              case "$BRACKET" in
                superseded\ *)
                  echo "::warning::UNKNOWN: production advanced during certification ($BRACKET). The Lightning operator certificate could not certify one exact release; it is not a report of a defect."
                  echo "NON-VERDICT: production advanced from \`$EXPECTED_LIVE_SHA\` during the Lightning operator certificate ($BRACKET)." >> "$GITHUB_STEP_SUMMARY"
                  ;;
                *)
                  echo "::warning::UNKNOWN: production build-info.json could not be read around the Lightning operator certificate ($BRACKET)."
                  echo "NON-VERDICT: the Lightning operator release bracket was unreadable ($BRACKET); it certifies no release." >> "$GITHUB_STEP_SUMMARY"
                  ;;
              esac
              ;;
            *)
              echo "::error::Lightning operator release mismatch: production left \`$EXPECTED_LIVE_SHA\` around the Lightning operator certificate for a release that is not a forward publish on this lineage."
              exit 1
              ;;
          esac

      - name: Certify the authenticated production Cashier
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          ARENA_BASE_URL: https://smarter.poker/hub/club-arena
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          # This job has credentials. A silent signed-out fallback here produces
          # a green run that verified almost nothing - see global-setup.ts.
          E2E_REQUIRE_AUTH: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/cashier.json
        run: >-
          npx playwright test tests/e2e/production-cashier.spec.ts
          --project=chromium --reporter=line,json --workers=1 --retries=0

      # Cashier Phase 5: the Full Statement route is the same money surface
      # read through a second door (clubs/:clubId/cashier/statements), so it
      # gets the same dedicated, credentialed gate as the Trade cashier rather
      # than a seat in the shared sweep. The spec observes
      # fn_cashier_statement_page on the wire and asserts whichever verdict the
      # server returns; it never clicks Export, so no export job is started.
      - name: Certify the authenticated production Cashier Statements
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          ARENA_BASE_URL: https://smarter.poker/hub/club-arena
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/cashier-statements.json
        run: >-
          npx playwright test tests/e2e/production-cashier-statements.spec.ts
          --project=chromium --reporter=line,json --workers=1 --retries=0

      # `always()` is the point. Without it, a failed Cashier step skips this one
      # entirely - so a single money-surface red hid the whole production sweep,
      # which is the exact opposite of what the note above this job's Cashier
      # step promises ("A failure on Stats or another route must not obscure
      # whether the money surface itself passed or failed"). It promised
      # independence and delivered it in one direction only. Run 33394046555:
      # Cashier failed, and thirteen spec files plus tests/e2e/routes never ran.
      - name: Run the specs that need a deployed page
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          ARENA_BASE_URL: https://smarter.poker/hub/club-arena
          # Customization certification never mutates either standing player.
          # Realtime creates two isolated identities to prove cross-device sync
          # and cross-player isolation; commerce creates a third for checkout.
          # Routed gameplay below owns a fourth cosmetic-only account. Every
          # fixture is hard-deleted and residue-checked before the run ends.
          CUSTOMIZATION_COMMERCE_CERTIFICATION: '1'
          # The routed customization lane owns a disposable account and makes
          # only cosmetic writes. Its hand and seat are deterministic browser
          # projections, so the certificate never buys in or touches live play.
          GAMEPLAY_CUSTOMIZATION_CERTIFICATION: '1'
          # Daily Missions uses the same reserved hard-delete harness for one
          # production player, then proves the complete economy/realtime/error
          # journey and verifies that no account or ledger residue remains.
          DAILY_MISSIONS_CERTIFICATION: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          # The mode mobile-fit-audit.spec.ts was built for and has never been
          # run in. Without it the spec logs a report and passes regardless.
          MOBILE_FIT_STRICT: '1'
          E2E_REQUIRE_AUTH: '1'
          LIVE_SHA: ${{ steps.live.outputs.sha }}
        # Every spec the css-beats gate cannot take, named explicitly for the
        # same reason that gate names its own: a spec not named in a job runs
        # in no job. If you add a spec that needs a login or a live URL, add it
        # here in the same commit.
        #
        # tests/e2e/routes/ (nine files) is named as a DIRECTORY on purpose.
        # The first sweep that wired the orphans missed it entirely by globbing
        # only tests/e2e/*.spec.ts, so nine route suites stayed invisible one
        # level down - the same class of miss as the specs this job exists for.
        # A directory cannot go stale when a tenth file is added beside them.
        run: |
          # Do NOT let the first invocation abort the second. Under `set -e` a
          # red Stats run stopped the sweep before a single route spec loaded,
          # which is the same "one failure hides the rest" fault that `always()`
          # above fixes at the step level. Record every verdict, report them all,
          # and fail at the end if any of them failed.
          set +e
          rc=0

          # run_suite <json-name> <spec path...>
          #
          # Two jobs, both of which used to be done inline and wrongly.
          #
          # 1. A spec added AFTER the deployed commit is absent once the step
          #    above takes the specs from $LIVE_SHA. Playwright errors on a named
          #    path that does not exist, before running anything - turning a
          #    normal deploy lag back into the false red this job just stopped
          #    producing. So run what is present and warn about what is not.
          #
          # 2. If nothing is present, WRITE DOWN WHY. A missing report is read by
          #    the honesty check below as "it did not run", which is exactly
          #    right for a silent hole and exactly wrong for a stated absence.
          #
          # Each spec path is passed as an argument and therefore appears in this
          # file exactly once - tests/stats-experience-contract.test.ts requires
          # that of stats-deep.spec.ts, and it is a good rule: a path repeated
          # across a guard and its invocation is a path that can be updated in
          # one place and not the other.
          run_suite () {
            json="$1"; shift
            specs=""
            flags=""
            for a in "$@"; do
              case "$a" in
                -*) flags="$flags $a" ;;
                *)
                  if [ -e "$a" ]; then
                    specs="$specs $a"
                  else
                    echo "::warning::$a is not present at the deployed commit - not run"
                  fi
                  ;;
              esac
            done
            mkdir -p e2e-report
            if [ -z "$specs" ]; then
              printf '{"notRunReason":"no spec in this group exists at the deployed commit %s"}\n' \
                "$LIVE_SHA" > "e2e-report/$json"
              return 0
            fi
            echo "running:$specs"
            output_dir="${json%.json}"
            PLAYWRIGHT_JSON_OUTPUT_NAME="e2e-report/$json" npx playwright test $specs $flags \
              --output="test-results/$output_dir"
          }

          # THE PHASE 1 JOURNEYS RUN FIRST, INSIDE ONE RELEASE BRACKET.
          #
          # The cutover seal needs these three journeys - not the whole forty
          # minute sweep - to have run against one exact client. Read
          # build-info.json immediately before the first and immediately after
          # the last; scripts/ci/production-e2e-provenance.mjs `bracket`
          # certifies the release only when both reads are the SHA this job
          # recorded and took its specs from. They run first so the bracket
          # opens minutes after that recording instead of a quarter hour later.
          mkdir -p release-bracket
          read_release () {
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://smarter.poker/hub/club-arena/build-info.json?bracket=$RANDOM" > "$1" 2>/dev/null \
              || : > "$1"
          }
          read_release release-bracket/phase1-before.json

          run_suite customization-realtime.json tests/e2e/production-customization-realtime.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          customization_realtime_rc=$?; [ $customization_realtime_rc -ne 0 ] && rc=$customization_realtime_rc

          run_suite gameplay-customization-runtime.json tests/e2e/gameplay-customization-runtime.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          gameplay_customization_runtime_rc=$?; [ $gameplay_customization_runtime_rc -ne 0 ] && rc=$gameplay_customization_runtime_rc

          run_suite customization-commerce.json tests/e2e/production-customization-commerce.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          customization_commerce_rc=$?; [ $customization_commerce_rc -ne 0 ] && rc=$customization_commerce_rc

          read_release release-bracket/phase1-after.json

          # Certify Stats first among the broader route checks. Cashier has its
          # own preceding release gate so this suite cannot hide its verdict.
          # This journey starts well after the job-level LIVE_SHA read. Qualify
          # its current published test/harness source without repinning the job
          # or any other suite/certificate. UNKNOWN never uses the stale pin.
          stats_pin_rc=0
          stats_pin="$(node scripts/ci/downline-journey-pin.mjs)" || stats_pin_rc=$?
          [ "$stats_pin_rc" -eq 0 ] || stats_pin=UNKNOWN
          DOWNLINE_JOURNEY_SHA="$stats_pin" run_suite stats.json tests/e2e/stats-deep.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          stats_rc=$?
          if [ "$stats_pin_rc" -ne 0 ] && [ "$stats_pin_rc" -ne 3 ]; then stats_rc=$stats_pin_rc; fi
          [ $stats_rc -ne 0 ] && rc=$stats_rc

          # Financial Admin is the staff-scoped sibling of the Stats and Club
          # Data deep certificates. It runs against this job's disposable,
          # prepared staff account in its own process and report so a skip or
          # missing spec cannot hide behind the broader sweep.
          run_suite financial-admin.json tests/e2e/financial-admin-deep.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          financial_admin_rc=$?; [ $financial_admin_rc -ne 0 ] && rc=$financial_admin_rc

          # These contracts either mutate the standing authenticated player or
          # create and destroy isolated production fixtures. Each gets its own
          # single-worker process so a waitlist/realtime update cannot
          # invalidate another browser's snapshot. Playwright retries stay off:
          # a release must not hide a broken first attempt behind a warm retry.
          # This maintained club supplies both real MTTs and clustered cash
          # games. global-setup joins this same club through the public door.
          E2E_CLUB_ID=002c2d27-9584-4e52-835a-bb2be148fc81 run_suite lobby.json tests/e2e/club-lobby.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          lobby_rc=$?; [ $lobby_rc -ne 0 ] && rc=$lobby_rc
          node scripts/ci/lobby-certificate-coverage.mjs e2e-report/lobby.json
          lobby_coverage_rc=$?; [ $lobby_coverage_rc -ne 0 ] && rc=$lobby_coverage_rc

          # The exact Shark Club Players route from the six-phase audit. This
          # is read-only, but gets an isolated real member from global-setup so
          # it proves auth handoff, roster RPCs, controls and 375px rendering.
          run_suite club-members.json tests/e2e/production-club-members.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          club_members_rc=$?; [ $club_members_rc -ne 0 ] && rc=$club_members_rc

          # Table Management: each section is its own page on its own approved
          # frame family. Proved on a harness and in the served bundle when it
          # shipped, and then watched by nothing. Read-only: it navigates and
          # reads, and skips itself without management authority.
          run_suite table-management.json tests/e2e/production-table-management.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          table_management_rc=$?; [ $table_management_rc -ne 0 ] && rc=$table_management_rc

          run_suite daily-missions.json tests/e2e/production-daily-missions.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          daily_missions_rc=$?; [ $daily_missions_rc -ne 0 ] && rc=$daily_missions_rc

          run_suite daily-missions-accessibility.json tests/e2e/daily-challenges-accessibility-responsive.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          daily_missions_accessibility_rc=$?; [ $daily_missions_accessibility_rc -ne 0 ] && rc=$daily_missions_accessibility_rc

          run_suite daily-missions-settlement.json tests/e2e/daily-missions-database-settlement.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          daily_missions_settlement_rc=$?; [ $daily_missions_settlement_rc -ne 0 ] && rc=$daily_missions_settlement_rc

          # tests/e2e/routes/ (nine files) is named as a DIRECTORY on purpose.
          # The first sweep that wired the orphans missed it entirely by globbing
          # only tests/e2e/*.spec.ts, so nine route suites stayed invisible one
          # level down - the same class of miss as the specs this job exists for.
          # A directory cannot go stale when a tenth file is added beside them.
          run_suite sweep.json \
            tests/e2e/smoke.spec.ts \
            tests/e2e/club-data-deep.spec.ts \
            tests/e2e/production-mobile-lobby-chrome.spec.ts \
            tests/e2e/production-row-channel-owners.spec.ts \
            tests/e2e/mobile-fit-audit.spec.ts \
            tests/e2e/mobile-tap-targets.spec.ts \
            tests/e2e/mobile-input-zoom.spec.ts \
            tests/e2e/mobile-chrome-occlusion.spec.ts \
            tests/e2e/showdown-beats.spec.ts \
            tests/e2e/card-squeeze-visual-regression.spec.ts \
            tests/e2e/card-squeeze-mobile.spec.ts \
            tests/e2e/river-squeeze-interactive.spec.ts \
            tests/e2e/tournament-buy-in-dialog.spec.ts \
            tests/e2e/tournament-watch.spec.ts \
            tests/e2e/footer-route.spec.ts \
            tests/e2e/mobile-lobby-chrome.spec.ts \
            tests/e2e/header-portrait-frame.spec.ts \
            tests/e2e/diamond-arena-route.spec.ts \
            tests/e2e/an-old-bookmark-lands-somewhere-true.spec.ts \
            tests/e2e/production-csp-violations.spec.ts \
            tests/e2e/routes \
            --reporter=line,json --workers=2 --retries=0
          sweep_rc=$?; [ $sweep_rc -ne 0 ] && rc=$sweep_rc

          echo "stats exit=$stats_rc  financial admin exit=$financial_admin_rc  lobby exit=$lobby_rc  club members exit=$club_members_rc  customization realtime exit=$customization_realtime_rc  gameplay customization exit=$gameplay_customization_runtime_rc  customization commerce exit=$customization_commerce_rc  daily missions exit=$daily_missions_rc  daily missions accessibility exit=$daily_missions_accessibility_rc  daily missions settlement exit=$daily_missions_settlement_rc  sweep exit=$sweep_rc"
          exit $rc

      # A closed recovery mode reuses this lane's provenance, fresh identity,
      # standalone staff fixture and always-cleanup, without the unrelated sweep.
      - name: Verify only the two client navigation repairs
        if: needs.publication-gate.outputs.client_navigation == 'true' && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && steps.template_access.outcome == 'success'
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
        run: |
          set +e
          mkdir -p e2e-report
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-report/navigation-table.json npx playwright test \
            tests/e2e/production-table-management.spec.ts \
            --grep '^.*no surface scrolls sideways on a phone$' \
            --project=chromium --reporter=line,json --workers=1 --retries=0 \
            --trace=retain-on-failure --output=test-results/navigation-table
          table_rc=$?
          PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-report/navigation-lobby.json npx playwright test \
            tests/e2e/production-mobile-lobby-chrome.spec.ts \
            --grep '^.*compact rows open details and filters stay at their original position$' \
            --project=chromium --project=webkit-footer --reporter=line,json --workers=1 --retries=0 \
            --trace=retain-on-failure --output=test-results/navigation-lobby
          lobby_rc=$?
          node "$RUNNER_TEMP/client-navigation-certificate.mjs" reports e2e-report/navigation-table.json e2e-report/navigation-lobby.json
          proof_rc=$?
          [ "$table_rc" -eq 0 ] && [ "$lobby_rc" -eq 0 ] && [ "$proof_rc" -eq 0 ]

      # THE RUN MUST NOT PASS BY NOT RUNNING.
      #
      # Everything above can succeed while verifying nothing: Playwright exits 0
      # when every test skips, and dozens of these specs skip themselves when
      # they land on /auth or find no live fixture. `always()` so this reports
      # on a red run too - a run can be BOTH failed and dishonest, and the
      # second fact is the one nobody was being told.
      # Keep this small, scoped receipt even when all browser assertions pass.
      - name: Name every skipped mobile check and its exact reason
        if: always() && steps.live.outputs.ready == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
        run: >-
          node scripts/ci/report-mobile-e2e-skips.mjs
          e2e-report/mobile-skips.json
          e2e-report/first-run-iphone.json
          e2e-report/cashier.json
          e2e-report/lobby.json
          e2e-report/sweep.json

      - name: Retain named mobile skips on every outcome
        if: always() && steps.live.outputs.ready == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-mobile-skips
          path: e2e-report/mobile-skips.json
          if-no-files-found: error
          retention-days: 14

      # NAME THE FAILED TEST WHERE THE API CAN READ IT (2026-10-04). A red run
      # used to say only "Process completed with exit code 1" to anyone reading
      # check-run annotations; the failing test and its error lived in the job
      # log and the uploaded report, both behind blob storage. Report-only:
      # it never changes the verdict.
      - name: Name every failed test as an annotation
        if: always() && steps.live.outputs.ready == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
        run: >-
          node scripts/ci/annotate-e2e-failures.mjs
          e2e-report/notifications.json
          e2e-report/cashier.json
          e2e-report/cashier-statements.json
          e2e-report/lightning-operator.json
          e2e-report/stats.json
          e2e-report/financial-admin.json
          e2e-report/lobby.json
          e2e-report/club-members.json
          e2e-report/table-management.json
          e2e-report/customization-realtime.json
          e2e-report/gameplay-customization-runtime.json
          e2e-report/customization-commerce.json
          e2e-report/daily-missions.json
          e2e-report/daily-missions-accessibility.json
          e2e-report/daily-missions-settlement.json
          e2e-report/sweep.json

      - name: Did the suite actually verify production?
        if: always() && steps.live.outputs.ready == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
        run: >-
          node scripts/ci/assert-e2e-actually-ran.mjs
          e2e-report/notifications.json
          e2e-report/cashier.json
          e2e-report/cashier-statements.json
          e2e-report/lightning-operator.json
          e2e-report/stats.json
          e2e-report/financial-admin.json
          e2e-report/lobby.json
          e2e-report/club-members.json
          e2e-report/table-management.json
          e2e-report/customization-realtime.json
          e2e-report/gameplay-customization-runtime.json
          e2e-report/customization-commerce.json
          e2e-report/daily-missions.json
          e2e-report/daily-missions-accessibility.json
          e2e-report/daily-missions-settlement.json
          e2e-report/sweep.json

      # The broad client job deliberately keeps unrelated routes visible and
      # red. The database cutover has a narrower question: did every affected
      # customization journey pass exactly once, without a skip or retry?
      # Report that answer independently so a Club Data or Financial Admin
      # defect cannot either impersonate or erase the Phase 1 evidence.
      - name: Did every Phase 1 customization journey pass exactly?
        id: phase1_coverage
        if: always() && steps.live.outputs.ready == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
        run: >-
          node scripts/ci/phase1-customization-certificate-coverage.mjs
          e2e-report/customization-realtime.json
          e2e-report/gameplay-customization-runtime.json
          e2e-report/customization-commerce.json

      - name: Retire interrupted assignment qualification fixtures
        if: always() && steps.live.outputs.ready == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/cleanup-agent-assignment-fixtures.mjs

      - name: Hard-delete the isolated production E2E account
        id: account_cleanup
        if: always() && steps.live.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs cleanup

      # The suite runs against an unversioned public route for long enough that
      # another legitimate publisher may advance `current` while browsers are
      # still running. A green result assembled across two bundles certifies
      # neither one, so the exact SHA recorded before the first browser must
      # still be live after fixture cleanup. There is deliberately no retry: a
      # changed or unreadable final document is a non-verdict, not eventual
      # success for the release this run claims to have tested.
      # WHICH RELEASE DID THIS CERTIFICATE COVER, AND IS ANY OTHER ANSWER A DEFECT?
      #
      # This step used to demand ONE frozen SHA across forty minutes of
      # browsers, and `publish-club-arena` fires on every merge. At this
      # repository's real merge rate that demand can essentially never hold:
      # twelve of the twenty runs sampled on 2026-09-30 died here or on its
      # sibling lineage check, every one of them reading `Production changed
      # from X to Y during certification`, and not one of them had found
      # anything wrong with the live site.
      #
      # The reasoning behind the guard is still right - a green assembled
      # across two bundles certifies neither - so it is kept, and classified
      # rather than collapsed into a red:
      #
      #   certified  production never left the SHA this run recorded.
      #   superseded production advanced to a LATER trusted commit on this
      #              same protected main while the browsers were running. The
      #              suites that finished before the switch still certify the
      #              recorded SHA; anything that straddled it COULD NOT TELL.
      #              That is a non-verdict (CLAUDE.md 10.86 rule 1), and it is
      #              reported as one - never as a defect on production, and
      #              never silently as success either.
      #
      # A rollback, a SHA off this lineage, or a SHA that does not resolve to a
      # trusted commit is still a hard red. Those are the states worth waking
      # somebody for, and they are exactly what the old string comparison could
      # not tell apart from an ordinary publish.
      #
      # `unchanged` is deliberately NOT reused here and keeps its own meaning:
      # `publish-club-arena` calls it the instant after it swaps its own
      # symlink, where any change at all really is wrong.
      - name: Classify the release window this certificate covers
        id: release_window
        if: always() && steps.live.outputs.ready == 'true'
        env:
          EXPECTED_LIVE_SHA: ${{ steps.live.outputs.sha }}
        run: |
          set -uo pipefail
          echo 'certified=false' >> "$GITHUB_OUTPUT"
          if ! [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The recorded live SHA is malformed."
            exit 1
          fi
          BODY="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
            "https://smarter.poker/hub/club-arena/build-info.json?final=$RANDOM")" || BODY=''
          if [ -z "$BODY" ]; then
            echo "::warning::UNKNOWN: production build-info.json could not be read at the end of this run, so the release window is unknown."
            echo "NON-VERDICT: the closing release document was unreadable; this run does not certify a release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The certificate may outlive a new protected publication. Refresh
          # only trusted main, never an arbitrary SHA from the live document.
          if ! timeout 30s git fetch --no-tags origin main; then
            echo "::warning::UNKNOWN: protected-main history was unreadable at the end of certification."
            echo "NON-VERDICT: protected-main history was unreadable; this run does not certify a release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATUS=0
          WINDOW="$(printf '%s' "$BODY" \
            | node scripts/ci/production-e2e-provenance.mjs release-window "$EXPECTED_LIVE_SHA")" || STATUS=$?
          case "$STATUS" in
            0)
              echo 'certified=true' >> "$GITHUB_OUTPUT"
              echo "Production stayed on \`$EXPECTED_LIVE_SHA\` for the complete browser certificate." >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              echo "::warning::UNKNOWN: production advanced during certification ($WINDOW). This run could not certify one exact release; it is not a report of a defect."
              {
                echo "NON-VERDICT: production advanced from \`$EXPECTED_LIVE_SHA\` during certification ($WINDOW)."
                echo "Every suite that completed before the switch still certifies \`$EXPECTED_LIVE_SHA\`; any suite that straddled it could not tell."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::production left \`$EXPECTED_LIVE_SHA\` for a release that is not a forward publish on this lineage."
              exit 1
              ;;
          esac

      - name: Require exact client navigation release and fixture cleanup
        if: always() && needs.publication-gate.outputs.client_navigation == 'true'
        env:
          RELEASE_CERTIFIED: ${{ steps.release_window.outputs.certified }}
          CLEANUP_OUTCOME: ${{ steps.account_cleanup.outcome }}
        run: |
          test "$RELEASE_CERTIFIED" = true
          test "$CLEANUP_OUTCOME" = success

      # The seal's client evidence is the bracket around the three Phase 1
      # journeys (opened and closed in the sweep step above), not the whole
      # job's window: see classifyBracket in production-e2e-provenance.mjs.
      - name: Classify the release the Phase 1 journeys ran against
        id: phase1_release
        if: always() && steps.live.outputs.ready == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          EXPECTED_LIVE_SHA: ${{ steps.live.outputs.sha }}
        run: |
          set -uo pipefail
          echo 'certified=false' >> "$GITHUB_OUTPUT"
          if ! [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The recorded live SHA is malformed."
            exit 1
          fi
          if ! timeout 30s git fetch --no-tags origin main; then
            echo "::warning::UNKNOWN: protected-main history was unreadable, so the Phase 1 release bracket is unknown."
            echo "NON-VERDICT: protected-main history was unreadable; the Phase 1 journeys certify no release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATUS=0
          BRACKET="$(node scripts/ci/production-e2e-provenance.mjs bracket "$EXPECTED_LIVE_SHA" \
            release-bracket/phase1-before.json release-bracket/phase1-after.json)" || STATUS=$?
          case "$STATUS" in
            0)
              echo 'certified=true' >> "$GITHUB_OUTPUT"
              echo "Production served \`$EXPECTED_LIVE_SHA\` before and after all three Phase 1 journeys." >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              echo "::warning::UNKNOWN: the Phase 1 journeys did not run inside one release ($BRACKET). This is a non-verdict, not a defect."
              echo "NON-VERDICT: the Phase 1 journeys were not bracketed by \`$EXPECTED_LIVE_SHA\` ($BRACKET)." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::production left \`$EXPECTED_LIVE_SHA\` around the Phase 1 journeys for a release that is not a forward publish on this lineage."
              exit 1
              ;;
          esac

      - name: Classify the Phase 1 customization certificate
        id: phase1_verdict
        if: always() && needs.publication-gate.outputs.client_navigation != 'true'
        env:
          PHASE1_RELEASE_CERTIFIED: ${{ steps.phase1_release.outputs.certified }}
          PHASE1_RELEASE_OUTCOME: ${{ steps.phase1_release.outcome }}
          RELEASE_WINDOW_OUTCOME: ${{ steps.release_window.outcome }}
          CUSTOMIZATION_COVERAGE_COMPLETE: ${{ steps.phase1_coverage.outputs.complete }}
          CUSTOMIZATION_COVERAGE_OUTCOME: ${{ steps.phase1_coverage.outcome }}
          ACCOUNT_CLEANUP_OUTCOME: ${{ steps.account_cleanup.outcome }}
        run: |
          set -euo pipefail
          CERTIFIED=false
          if [ "$CUSTOMIZATION_COVERAGE_OUTCOME" != 'success' ]; then
            echo 'certified=false' >> "$GITHUB_OUTPUT"
            echo '::error::The Phase 1 customization coverage producer did not complete successfully.'
            exit 1
          fi
          if [ "$CUSTOMIZATION_COVERAGE_COMPLETE" != 'true' ]; then
            echo 'certified=false' >> "$GITHUB_OUTPUT"
            echo '::error::Phase 1 customization coverage was missing or incomplete.'
            exit 1
          fi
          if [ "$ACCOUNT_CLEANUP_OUTCOME" != 'success' ]; then
            echo 'certified=false' >> "$GITHUB_OUTPUT"
            echo '::error::The isolated production account was not proven deleted.'
            exit 1
          fi
          if [ "$RELEASE_WINDOW_OUTCOME" != 'success' ]; then
            echo 'certified=false' >> "$GITHUB_OUTPUT"
            echo '::error::The release-window producer did not complete successfully.'
            exit 1
          fi
          if [ "$PHASE1_RELEASE_OUTCOME" != 'success' ]; then
            echo 'certified=false' >> "$GITHUB_OUTPUT"
            echo '::error::The Phase 1 release bracket producer did not complete successfully.'
            exit 1
          fi
          if [ "$PHASE1_RELEASE_CERTIFIED" = 'true' ]; then
            CERTIFIED=true
            echo 'The exact served client has complete Phase 1 customization coverage.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NON-VERDICT: no Phase 1 cutover seal may be written without one exact release and all three exact customization journeys.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "certified=$CERTIFIED" >> "$GITHUB_OUTPUT"

      - name: Upload the report when something is wrong on production
        # `failure()` is false when GitHub cancels a job at its time limit. The
        # old condition therefore discarded the only report from exactly the
        # run that exposed the obsolete timeout. Preserve evidence for both
        # kinds of non-verdict, while still skipping uploads on a clean run.
        if: always() && (failure() || cancelled() || steps.phase1_coverage.outputs.complete != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-playwright-report
          path: |
            playwright-report/
            test-results/
            e2e-report/
          retention-days: 3 # 2026-09-01 cost audit: reports are read same-day or never

  # A client publication must not wait for an unrelated unshipped engine.
  # This independent verdict retains real-hand/reconnect coverage after every
  # publication, and exact immutable engine certification after engine cutover.
  live-table-e2e:
    needs: [publication-gate, certification-cleanup-safety]
    if: needs.publication-gate.outputs.should_run == 'true' && needs.publication-gate.outputs.client_navigation != 'true'
    name: Live-table and engine verification
    runs-on: ubuntu-latest
    # Preserve the existing prerequisite, maintenance-wait and cleanup margin.
    # The daily maintenance announcement can defer a certificate's start;
    # await-engine-gameplay separately waits for the exact engine to resume.
    # The opt-in adds a separate 20m observation plus 2m setup/retention.
    # Two proven natural MTT closures may each require another complete subject:
    # 2 x (390s startup + 15m maximum HUD clock + 60s reserve) = 45m.
    # Preserve the existing 76/98-minute overhead and optional multirun budget,
    # plus five minutes for the bounded isolated notice proof (cleanup unchanged).
    timeout-minutes: ${{ github.event_name == 'repository_dispatch' && (toJSON(github.event.client_payload.mobile_multirun) == 'true' || toJSON(github.event.client_payload.horse_social) == 'true') && 148 || 126 }}
    permissions:
      contents: read
    # An explicit passive observation owns a distinct serialized queue. Ordinary
    # publication jobs otherwise replace it while pending (38933600568, three
    # zero-step attempts). Horse social proof has the same passive ownership:
    # 40784165630 was replaced by a publication before any test step ran.
    # These lanes create fresh disposable Auth principals;
    # their table cases are read-only and cleanup owns only that exact account.
    # Client browser checks retain their original shared write-serialization.
    concurrency:
      group: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.mobile_multirun) == 'true' && 'post-deploy-live-table-multirun-production' || github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.horse_social) == 'true' && toJSON(github.event.client_payload.mobile_multirun) == 'null' && 'post-deploy-live-table-horse-social-production' || 'post-deploy-live-table-production' }}
      cancel-in-progress: false
    outputs:
      client_sha: ${{ steps.live.outputs.sha }}
      engine_sha: ${{ steps.engine.outputs.sha }}
      certified: ${{ steps.release_window.outcome == 'success' && steps.release_window.outputs.certified == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publication-gate.outputs.verification_sha || github.sha }}
          # The step below may need to resolve the sha production is actually
          # serving, which is usually an ancestor of this run's commit and is
          # absent from the default shallow clone.
          fetch-depth: 0
          # blob:none keeps every one of the 7,223 commits and drops the blobs of old
          # revisions. Measured 2026-09-13, three runs each: 33-35s / 531MB against
          # 36-43s / 766MB, for identical ancestry. Nothing in this repo's workflows
          # reads a historical file version - they ask merge-base, rev-list, log and
          # cat-file -e, which are all commit-graph work - so those blobs were paid
          # for on every run and never read.
          filter: blob:none

      - name: Download source-bound retained runtime evidence
        if: needs.publication-gate.outputs.verification_sha != ''
        uses: actions/download-artifact@v4
        with:
          name: club-arena-retained-runtime
          path: retained-runtime-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Prove every club foreign key remains deletable
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/check-club-fk-indexes.mjs

      - name: Audit the remaining live schema from trusted code
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/ci/check-phantom-tables.mjs
          node scripts/ci/check-phantom-columns.mjs
          node scripts/ci/check-embed-relationships.mjs

      - name: Resolve the exact protected-main engine component
        id: engine
        env:
          EVENT_NAME: ${{ github.event_name }}
          ENGINE_TRIGGER_SHA: ${{ needs.publication-gate.outputs.engine_trigger_sha }}
          ENGINE_TRIGGER_JSON: ${{ toJSON(github.event.client_payload.engine_sha) }}
          MOBILE_MULTIRUN_JSON: ${{ toJSON(github.event.client_payload.mobile_multirun) }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          MAIN_SHA="$(git rev-parse --verify 'origin/main^{commit}')"
          if [ "$EVENT_NAME" = repository_dispatch ] && [ -n "$ENGINE_TRIGGER_SHA" ]; then
            # Certify the immutable release that requested this run. A newer
            # unshipped merge cannot substitute a different release identity.
            ENGINE_SHA="$ENGINE_TRIGGER_SHA"
          elif [ -z "$ENGINE_TRIGGER_SHA" ] && { [ "$EVENT_NAME" = workflow_run ] || \
               { [ "$EVENT_NAME" = repository_dispatch ] && [ "${MOBILE_MULTIRUN_JSON:-}" = true ] && [ "${ENGINE_TRIGGER_JSON:-}" = null ]; }; }; then
            # Test the published client with the engine actually serving it.
            # Latest main may contain another task's staged, unshipped engine.
            #
            # Read it through the announced break. This was one `curl -fsS`
            # with no tolerance, and the engine restarts at :55 of every hour
            # (CLAUDE.md section 13) and is genuinely down for about two
            # minutes of it. Run 36717851302 started at 12:54:24Z and died at
            # 12:55:36Z on `curl: (22) ... error: 502` - the engine keeping the
            # schedule we set, reported as a production failure. The reader
            # below waits the SAME measured budget the resume step a few steps
            # down already waits, and parses with the same readReadyEngineSha,
            # so nothing about what counts as a healthy release changed.
            ENGINE_SHA="$(node scripts/ci/read-engine-release.mjs \
              "https://engine.smarter.poker/health?certificate=$GITHUB_RUN_ID")"
          else
            echo '::error::Unsupported or contradictory engine certification event.'
            exit 1
          fi
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::Could not resolve one exact engine-runtime commit from protected main.'; exit 1; }
          git cat-file -e "$ENGINE_SHA^{commit}" \
            || { echo '::error::The requested engine commit is unavailable.'; exit 1; }
          git merge-base --is-ancestor "$ENGINE_SHA" "$MAIN_SHA" \
            || { echo '::error::The requested engine commit is outside protected main.'; exit 1; }
          echo "sha=$ENGINE_SHA" >> "$GITHUB_OUTPUT"
          echo "Exact protected-main engine component: \`$ENGINE_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Require the exact engine before opening production browser fixtures
        id: engine_gate
        env:
          EXPECTED_ENGINE_SHA: ${{ steps.engine.outputs.sha }}
        run: |
          set -euo pipefail
          # Same break tolerance as the resolve step above: an engine inside
          # its announced restart has not refused this release, it has not
          # answered yet. The equality below is the unchanged gate.
          READY_SHA="$(node scripts/ci/read-engine-release.mjs \
            "https://engine.smarter.poker/health?certificate=$GITHUB_RUN_ID")"
          if [ "$READY_SHA" = "$EXPECTED_ENGINE_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$READY_SHA" =~ ^[0-9a-f]{40}$ ]] && \
               git cat-file -e "$READY_SHA^{commit}" 2>/dev/null && \
               git merge-base --is-ancestor "$EXPECTED_ENGINE_SHA" "$READY_SHA" && \
               git merge-base --is-ancestor "$READY_SHA" origin/main; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NON-VERDICT: engine \`$EXPECTED_ENGINE_SHA\` was superseded by later protected-main release \`$READY_SHA\`."
            echo "NON-VERDICT: engine \`$EXPECTED_ENGINE_SHA\` was superseded by later protected-main release \`$READY_SHA\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "::error::Production engine $READY_SHA has not reached required $EXPECTED_ENGINE_SHA; this run cannot begin certification."
            exit 1
          fi

      - name: Install Chromium and WebKit
        if: steps.engine_gate.outputs.current == 'true'
        run: |
          sudo python3 scripts/ci/ubuntu-apt-mirror.py
          npx playwright install chromium webkit --with-deps

      - name: Confirm production is serving, and record what we are testing
        if: steps.engine_gate.outputs.current == 'true'
        id: live
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            BODY=''
            if BODY=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://smarter.poker/hub/club-arena/build-info.json?cb=$RANDOM"); then
              if LIVE=$(printf '%s' "$BODY" \
                | node scripts/ci/production-e2e-provenance.mjs build-info); then
                [[ "$LIVE" =~ ^[0-9a-f]{40}$ ]]
                echo "sha=$LIVE" >> "$GITHUB_OUTPUT"
                echo "ready=true" >> "$GITHUB_OUTPUT"
                echo "### Post-deploy E2E" >> "$GITHUB_STEP_SUMMARY"
                echo "Testing production as it is serving right now: \`$LIVE\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "  attempt $i: build-info.json did not contain one exact Club Arena SHA"
            sleep 10
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::error::production did not serve one valid full build-info.json SHA."
          exit 1

      - name: Take the specs from the commit production is actually serving
        if: steps.live.outputs.ready == 'true'
        id: align
        run: |
          set -euo pipefail
          LIVE='${{ steps.live.outputs.sha }}'
          HERE=$(git rev-parse HEAD)
          [[ "$LIVE" =~ ^[0-9a-f]{40}$ ]] && [[ "$HERE" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$LIVE^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$LIVE" --depth=1
          fi
          if [ -n '${{ needs.publication-gate.outputs.verification_sha }}' ]; then
            RETAINED='${{ needs.publication-gate.outputs.client_target_sha }}'
            test "$HERE" = '${{ needs.publication-gate.outputs.verification_sha }}'
            [[ "$RETAINED" =~ ^[0-9a-f]{40}$ ]]
            if [ "$LIVE" = "$RETAINED" ]; then
              node scripts/ci/client-runtime-retention.mjs harness "$LIVE" "$HERE" \
                retained-runtime-evidence/retained-runtime.json \
                '${{ github.event.workflow_run.id }}' '${{ github.event.workflow_run.head_sha }}' '${{ github.repository_id }}'
              echo "specs=$HERE" >> "$GITHUB_OUTPUT"
              echo "Actual runtime \`$LIVE\`; complete current qualified verification source \`$HERE\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # A LATER PUBLISH IS NOT A DEFECT IN THE RETAINED ONE (2026-10-11).
            #
            # This used to be a bare `test "$LIVE" = <retained runtime>`. A
            # retaining publisher's certificate can wait behind the production
            # lock for longer than the gap between merges, and run 38170604116
            # started its browsers 48 minutes after publisher 38169740342
            # retained 5c1e013, by which time production served a76ebb9, three
            # commits later on protected main. The test exited 1 with no message
            # and the whole lane went red ("the suite did not run") although
            # nothing on the live site had been examined at all. That is
            # "could not tell" reported as a defect (CLAUDE.md 10.86 rule 1).
            #
            # A forward protected-main release is handled exactly as a run
            # without a retained runtime handles it: the lineage logic below
            # aligns the specs with what production actually serves, and the
            # release-window step classifies anything that moves after that.
            # The retained-runtime harness proof is skipped only because it
            # describes a runtime production no longer serves. A rollback, or a
            # live SHA that is not a descendant of the retained runtime, is still
            # a hard red.
            git cat-file -e "$RETAINED^{commit}"
            if ! git merge-base --is-ancestor "$RETAINED" "$LIVE"; then
              echo "::error::production serves \`$LIVE\`, which is not a forward release from retained runtime \`$RETAINED\`."
              exit 1
            fi
            echo "Retained runtime \`$RETAINED\` was superseded by \`$LIVE\` before the browsers started; certifying the release production actually serves." >> "$GITHUB_STEP_SUMMARY"
          fi
          RELATION=$(node scripts/ci/production-e2e-provenance.mjs lineage "$LIVE" "$HERE")
          if [ "$RELATION" = same ]; then
            echo "specs=$HERE" >> $GITHUB_OUTPUT
            echo "The specs and the deployed bundle are the same commit (\`$HERE\`)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$RELATION" = ancestor ]; then
            # ASSERTIONS from the deployed commit; HARNESS from this one.
            #
            # Swapping tests/e2e wholesale would also drag global-setup.ts and
            # its support/ helpers back to $LIVE - and $LIVE predates the
            # E2E_REQUIRE_AUTH throw added in this very commit. The run would
            # then silently regain the signed-out fallback it just lost, on
            # exactly the runs where production is behind. A fix that disables
            # itself under the condition it was written for is worse than none.
            git checkout "$LIVE" -- tests/e2e
            # Authentication and exact cross-artifact provenance are harness
            # authority, not page-version assertions. Never let deploy lag
            # roll either guard back to an older, weaker implementation.
            git checkout "$HERE" -- \
              tests/e2e/global-setup.ts \
              tests/e2e/production-live-table-realtime.spec.ts \
              tests/e2e/production-live-table-multirun.spec.ts \
              tests/e2e/production-seat-move-announcement.spec.ts \
              tests/e2e/support
            echo "specs=$LIVE" >> $GITHUB_OUTPUT
            echo "Production is serving \`$LIVE\`, an ancestor of this run's \`$HERE\`." >> $GITHUB_STEP_SUMMARY
            echo "Page assertions taken from \`$LIVE\`; auth, exact engine provenance, and support harnesses kept at \`$HERE\`." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$RELATION" = descendant ]; then
            # PRODUCTION IS AHEAD OF THIS CHECKOUT, AND THAT IS NORMAL.
            #
            # Until 2026-09-30 this was a hard red reading `Production SHA X is
            # not an ancestor of checkout Y` (run 36673263757). It never meant a
            # divergence: the publisher fires on every merge and merges land
            # every few minutes, so by the time forty minutes of browsers have
            # run, a LATER commit on the same protected main is usually what is
            # being served. Refusing it told nobody anything about the live site.
            #
            # Re-target instead. Take the WHOLE suite from the live commit -
            # assertions and harness together - because here $LIVE is the newer
            # one, and restoring $HERE's harness over it would be exactly the
            # roll-back-to-a-weaker-guard that the ancestor branch above exists
            # to prevent, pointed the other way.
            git checkout "$LIVE" -- tests/e2e
            echo "specs=$LIVE" >> $GITHUB_OUTPUT
            echo "Production is serving \`$LIVE\`, a later commit than this run's \`$HERE\`." >> $GITHUB_STEP_SUMMARY
            echo "The whole suite was re-targeted onto \`$LIVE\` so the assertions match the bundle the browser loads." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "::error::Unexpected provenance relation '$RELATION'."
          exit 1

      - name: Wait for the same engine to resume gameplay
        if: steps.live.outputs.ready == 'true'
        id: gameplay
        env:
          EXPECTED_ENGINE_SHA: ${{ steps.engine.outputs.sha }}
        # Exit 3 is UNKNOWN: a later protected-main engine release cut over
        # inside the break, and that release dispatches its own certificate.
        # Stand the live-table certificate down instead of certifying (or
        # failing) an engine production no longer serves. Any other failure
        # remains a red.
        run: |
          set -uo pipefail
          STATUS=0
          node scripts/ci/await-engine-gameplay.mjs "$EXPECTED_ENGINE_SHA" || STATUS=$?
          case "$STATUS" in
            0) echo 'resumed=true' >> "$GITHUB_OUTPUT" ;;
            3)
              echo 'resumed=false' >> "$GITHUB_OUTPUT"
              echo "NON-VERDICT: engine \`$EXPECTED_ENGINE_SHA\` was superseded by a later release during its maintenance break; that release's own certificate covers live tables." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$STATUS" ;;
          esac

      - name: Provision an isolated production E2E account
        if: steps.live.outputs.ready == 'true' && steps.gameplay.outputs.resumed == 'true'
        id: account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs create

      # Union boards (MTT, SPIN, SNG) are readable only by members of a club in
      # the union's scope. Without this the identity could read the platform
      # Diamond Arena but no Midway board, so SPIN and SNG (union-only) were
      # never observable and every certificate was a NON-VERDICT. An ordinary
      # zero-balance player join through the public door; cleanup removes it.
      - name: Let the isolated spectator read the union boards it certifies
        if: steps.live.outputs.ready == 'true' && steps.account.outcome == 'success'
        id: spectator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_SPECTATOR_CLUB_ID: a41434bb-8d0c-400a-8f0d-e8b3d65afed4
        run: node scripts/ci/production-e2e-account.mjs prepare-spectator

      - name: Certify live-table continuity against the exact serving engine
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success' && steps.spectator.outcome == 'success'
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          ARENA_BASE_URL: https://smarter.poker/hub/club-arena
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
          # Observe chip cash games through the prepared Midway member club.
          # Diamond Arena disables play and cannot supply the cash witness
          # (run 41168425572). Setup joins this same public player door.
          E2E_CLUB_ID: a41434bb-8d0c-400a-8f0d-e8b3d65afed4
          # The SPIN and SNG subjects are hosted only by the fixture union, and
          # public.tables carries a RESTRICTIVE policy (poker_arena_table_access)
          # that hides a union table from an account with no membership inside
          # that union's scope. The cases already ask the engine for both scopes
          # (liveness_club_ids = [CLUB_ID, UNION_ID]); this gives the same
          # account the durable read scope to qualify what the engine offers.
          # Setup joins this chips club through the same public player door.
          E2E_UNION_CLUB_ID: a41434bb-8d0c-400a-8f0d-e8b3d65afed4
          LIVE_TABLE_REALTIME_CERTIFICATION: '1'
          ENGINE_HEALTH_URL: https://engine.smarter.poker/health
          EXPECTED_ENGINE_SHA: ${{ steps.engine.outputs.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/live-table-realtime.json
        run: >-
          npx playwright test tests/e2e/production-live-table-realtime.spec.ts
          --project=webkit-live-table-realtime --reporter=line,json --workers=1 --retries=0
          --output=test-results/live-table-realtime

      # The move notice is presentation-only. Exercise the actual served
      # consumer in this lane's reserved spectator browser, without moving
      # a production seat or waiting for the unrelated staff-page sweep.
      - name: Verify seat-move notices in the served spectator browser
        id: seat_move_notice
        if: "!cancelled() && steps.live.outputs.ready == 'true' && steps.gameplay.outputs.resumed == 'true' && steps.account.outcome == 'success' && steps.spectator.outcome == 'success'"
        # 150s case plus authentication/membership setup and report headroom.
        timeout-minutes: 5
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          ARENA_BASE_URL: https://smarter.poker/hub/club-arena
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
          E2E_CLUB_ID: a41434bb-8d0c-400a-8f0d-e8b3d65afed4
          E2E_UNION_CLUB_ID: a41434bb-8d0c-400a-8f0d-e8b3d65afed4
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/seat-move-announcement.json
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/production-seat-move-announcement.spec.ts \
            --project=chromium --reporter=line,json --workers=1 --retries=0 \
            --output=test-results/seat-move-announcement
          node scripts/ci/assert-e2e-actually-ran.mjs e2e-report/seat-move-announcement.json

      - name: Observe natural horse chat, reactions and throwables
        id: horse_social
        if: "!cancelled() && github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.horse_social) == 'true' && steps.gameplay.outputs.resumed == 'true' && steps.account.outcome == 'success' && steps.spectator.outcome == 'success'"
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          ARENA_BASE_URL: https://smarter.poker/hub/club-arena
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
          E2E_CLUB_ID: a41434bb-8d0c-400a-8f0d-e8b3d65afed4
          E2E_UNION_CLUB_ID: a41434bb-8d0c-400a-8f0d-e8b3d65afed4
          LIVE_TABLE_REALTIME_CERTIFICATION: '1'
          HORSE_SOCIAL_CERTIFICATION: '1'
          EXPECTED_ENGINE_SHA: ${{ steps.engine.outputs.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/horse-social.json
        run: >-
          npx playwright test tests/e2e/production-live-table-realtime.spec.ts
          --project=webkit-live-table-realtime --grep='natural horse social behavior'
          --reporter=line,json --workers=1 --retries=0 --output=test-results/horse-social
          && node scripts/ci/assert-e2e-actually-ran.mjs e2e-report/horse-social.json

      - name: Retain natural horse social evidence
        if: always() && steps.horse_social.outcome != 'skipped' && toJSON(github.event.client_payload.horse_social) == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: horse-social-live-proof
          path: |
            test-results/horse-social/
            e2e-report/horse-social.json
          if-no-files-found: error
          retention-days: 3

      # One explicit owner-requested observation. Ordinary publication keeps its
      # existing four required continuity cases; absence of a natural multirun
      # sample cannot silently satisfy this separate opted-in certificate.
      # It runs even when a continuity case above failed (!cancelled()): the
      # two certificates observe different things, and on 2026-10-17 run
      # 39034908810 lost its whole natural observation because one MTT subject
      # table closed before its level changed. The failed case still fails
      # the job, so nothing is hidden; a cancelled run still stops here.
      - name: ${{ toJSON(github.event.client_payload.mobile_multirun_target) == '1' && 'Observe natural once decisions on mobile' || toJSON(github.event.client_payload.mobile_multirun_target) == '3' && 'Observe natural three-run only hands on mobile' || 'Observe natural two-run and three-run hands on mobile' }}
        id: multirun
        if: "!cancelled() && github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.mobile_multirun) == 'true' && steps.gameplay.outputs.resumed == 'true' && steps.account.outcome == 'success' && steps.spectator.outcome == 'success'"
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          ARENA_BASE_URL: https://smarter.poker/hub/club-arena
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
          E2E_CLUB_ID: 002c2d27-9584-4e52-835a-bb2be148fc81
          E2E_UNION_CLUB_ID: a41434bb-8d0c-400a-8f0d-e8b3d65afed4
          LIVE_TABLE_MULTIRUN_CERTIFICATION: '1'
          MOBILE_MULTIRUN_TARGET_JSON: ${{ toJSON(github.event.client_payload.mobile_multirun_target) }}
          MOBILE_MULTIRUN_JSON: ${{ toJSON(github.event.client_payload.mobile_multirun) }}
          ENGINE_TRIGGER_JSON: ${{ toJSON(github.event.client_payload.engine_sha) }}
          HORSE_SOCIAL_JSON: ${{ toJSON(github.event.client_payload.horse_social) }}
          CLIENT_NAVIGATION_JSON: ${{ toJSON(github.event.client_payload.client_navigation) }}
          EXPECTED_ENGINE_SHA: ${{ steps.engine.outputs.sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/live-table-multirun.json
        run: >-
          npx playwright test tests/e2e/production-live-table-multirun.spec.ts
          --project=webkit-live-table-realtime --reporter=line,json --workers=1 --retries=0
          --output=test-results/live-table-multirun

      - name: Retain natural mobile multirun evidence
        if: always() && github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.mobile_multirun) == 'true' && steps.multirun.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-natural-multirun-proof
          path: |
            test-results/live-table-multirun/**/mobile-live-table-*
            test-results/live-table-multirun/**/trace.zip
            e2e-report/live-table-multirun.json
          if-no-files-found: error
          retention-days: 3

      - name: Name every failed live-table test as an annotation
        # A superseded engine stands the certificate down with no report
        # (resumed=false); that is a non-verdict, not missing evidence.
        if: always() && steps.live.outputs.ready == 'true' && steps.gameplay.outputs.resumed != 'false'
        run: node scripts/ci/annotate-e2e-failures.mjs e2e-report/live-table-realtime.json

      - name: Did the live-table certificate actually execute?
        if: always() && steps.live.outputs.ready == 'true' && steps.gameplay.outputs.resumed != 'false'
        run: node scripts/ci/assert-e2e-actually-ran.mjs e2e-report/live-table-realtime.json

      - name: Did all required live-table cases pass?
        id: live_coverage
        if: always() && steps.live.outputs.ready == 'true' && steps.gameplay.outputs.resumed != 'false'
        run: node scripts/ci/live-table-certificate-coverage.mjs e2e-report/live-table-realtime.json

      - name: Hard-delete the isolated production E2E account
        if: always() && steps.live.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs cleanup

      # WHICH RELEASE DID THIS CERTIFICATE COVER, AND IS ANY OTHER ANSWER A DEFECT?
      #
      # This step used to demand ONE frozen SHA across forty minutes of
      # browsers, and `publish-club-arena` fires on every merge. At this
      # repository's real merge rate that demand can essentially never hold:
      # twelve of the twenty runs sampled on 2026-09-30 died here or on its
      # sibling lineage check, every one of them reading `Production changed
      # from X to Y during certification`, and not one of them had found
      # anything wrong with the live site.
      #
      # The reasoning behind the guard is still right - a green assembled
      # across two bundles certifies neither - so it is kept, and classified
      # rather than collapsed into a red:
      #
      #   certified  production never left the SHA this run recorded.
      #   superseded production advanced to a LATER trusted commit on this
      #              same protected main while the browsers were running. The
      #              suites that finished before the switch still certify the
      #              recorded SHA; anything that straddled it COULD NOT TELL.
      #              That is a non-verdict (CLAUDE.md 10.86 rule 1), and it is
      #              reported as one - never as a defect on production, and
      #              never silently as success either.
      #
      # A rollback, a SHA off this lineage, or a SHA that does not resolve to a
      # trusted commit is still a hard red. Those are the states worth waking
      # somebody for, and they are exactly what the old string comparison could
      # not tell apart from an ordinary publish.
      #
      # `unchanged` is deliberately NOT reused here and keeps its own meaning:
      # `publish-club-arena` calls it the instant after it swaps its own
      # symlink, where any change at all really is wrong.
      - name: Classify the release window this certificate covers
        id: release_window
        if: always() && steps.live.outputs.ready == 'true'
        env:
          EXPECTED_LIVE_SHA: ${{ steps.live.outputs.sha }}
          RUNTIME_RESUMED: ${{ steps.gameplay.outputs.resumed }}
          LIVE_COVERAGE_COMPLETE: ${{ steps.live_coverage.outputs.complete }}
          SEAT_MOVE_NOTICE_OUTCOME: ${{ steps.seat_move_notice.outcome }}
          HORSE_SOCIAL_REQUESTED: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.horse_social) == 'true' }}
          HORSE_SOCIAL_OUTCOME: ${{ steps.horse_social.outcome }}
          MULTIRUN_REQUESTED: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.mobile_multirun) == 'true' }}
          MULTIRUN_OUTCOME: ${{ steps.multirun.outcome }}
        run: |
          set -uo pipefail
          echo 'certified=false' >> "$GITHUB_OUTPUT"
          if [ "${HORSE_SOCIAL_REQUESTED:-false}" = 'true' ] && [ "${HORSE_SOCIAL_OUTCOME:-}" != 'success' ]; then
            echo "NON-VERDICT: the requested natural horse social observation did not pass." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${MULTIRUN_REQUESTED:-false}" = 'true' ] && [ "${MULTIRUN_OUTCOME:-}" != 'success' ]; then
            echo "NON-VERDICT: the requested natural mobile multirun certificate did not pass." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${SEAT_MOVE_NOTICE_OUTCOME:-}" != 'success' ]; then
            echo "NON-VERDICT: the served seat-move notice did not pass its isolated browser proof." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The recorded live SHA is malformed."
            exit 1
          fi
          BODY="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
            "https://smarter.poker/hub/club-arena/build-info.json?final=$RANDOM")" || BODY=''
          if [ -z "$BODY" ]; then
            echo "::warning::UNKNOWN: production build-info.json could not be read at the end of this run, so the release window is unknown."
            echo "NON-VERDICT: the closing release document was unreadable; this run does not certify a release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The certificate may outlive a new protected publication. Refresh
          # only trusted main, never an arbitrary SHA from the live document.
          if ! timeout 30s git fetch --no-tags origin main; then
            echo "::warning::UNKNOWN: protected-main history was unreadable at the end of certification."
            echo "NON-VERDICT: protected-main history was unreadable; this run does not certify a release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATUS=0
          WINDOW="$(printf '%s' "$BODY" \
            | node scripts/ci/production-e2e-provenance.mjs release-window "$EXPECTED_LIVE_SHA")" || STATUS=$?
          case "$STATUS" in
            0)
              if [ "$RUNTIME_RESUMED" = 'true' ] && [ "${LIVE_COVERAGE_COMPLETE:-false}" = 'true' ]; then
                echo 'certified=true' >> "$GITHUB_OUTPUT"
              else
                echo "NON-VERDICT: the exact engine did not resume or not all required live-table cases passed." >> "$GITHUB_STEP_SUMMARY"
              fi
              echo "Production stayed on \`$EXPECTED_LIVE_SHA\` during the live-table observation window." >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              echo "::warning::UNKNOWN: production advanced during certification ($WINDOW). This run could not certify one exact release; it is not a report of a defect."
              {
                echo "NON-VERDICT: production advanced from \`$EXPECTED_LIVE_SHA\` during certification ($WINDOW)."
                echo "Every suite that completed before the switch still certifies \`$EXPECTED_LIVE_SHA\`; any suite that straddled it could not tell."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::production left \`$EXPECTED_LIVE_SHA\` for a release that is not a forward publish on this lineage."
              exit 1
              ;;
          esac

      - name: Retain The Verified Mobile Table Screens And Measurements
        if: always() && steps.live.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-live-table-proof
          path: |
            test-results/live-table-realtime/**/mobile-live-table-*
            test-results/seat-move-announcement/**/mobile-live-table-*
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload the report when something is wrong on production
        # `failure()` is false when GitHub cancels a job at its time limit. The
        # old condition therefore discarded the only report from exactly the
        # run that exposed the obsolete timeout. Preserve evidence for both
        # kinds of non-verdict, while still skipping uploads on a clean run.
        if: always() && (failure() || cancelled() || steps.live_coverage.outputs.complete != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-live-table-report
          path: |
            playwright-report/
            test-results/
            e2e-report/
          retention-days: 3 # 2026-09-01 cost audit: reports are read same-day or never

  # The database cutover receipt is written only after BOTH browser lanes have
  # completed against one exact client and the live-table lane has completed
  # against one exact engine. The broad client job may remain red for another
  # route; that failure remains visible in the workflow verdict, but cannot
  # erase exact first-attempt evidence from these three affected journeys. A
  # superseded/non-verdict lane exposes certified=false and cannot reach here.
  #
  # The CLIENT half is phase1_certified alone (2026-10-07): the three journeys
  # passed exactly once AND ran inside one release bracket on client_sha. The
  # whole-job `certified` window is still computed and reported, but it spans
  # forty minutes of unrelated routes, and at the real publish rate it held on
  # neither passing run of 2026-10-06/07, so requiring it meant the seal was
  # never owed. Keep this condition identical to SEAL_OWED in post-deploy-verdict
  # below (tests/unit/phase1CustomizationCertificateCoverage.test.ts).
  # This proof needs a staff actor for the native settled-departure door.
  # It must never lend staff authority to the live-table spectator job or add
  # an engine dependency to the independent client publication certificate.
  club-channel-lifecycle-e2e:
    name: Exact engine club channel lifecycle
    needs: [publication-gate, certification-cleanup-safety]
    if: "needs.publication-gate.outputs.should_run == 'true' && needs.publication-gate.outputs.client_navigation != 'true' && github.event_name == 'repository_dispatch' && github.event.client_payload.engine_sha != ''"
    runs-on: ubuntu-latest
    # Up to 15m schedule lead + 12m thaw prerequisite + 15m case/fixture
    # allowance + setup and reserved-account cleanup, all bounded below.
    timeout-minutes: 60
    concurrency:
      group: post-deploy-club-channel-lifecycle-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publication-gate.outputs.verification_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked verifier dependencies
        run: npm ci --ignore-scripts
      - name: Install maintained Chromium verifier
        run: |
          sudo python3 scripts/ci/ubuntu-apt-mirror.py
          npx playwright install --with-deps chromium
      - name: Wait for the exact engine to finish thaw before channel certification
        env:
          EXPECTED_ENGINE_SHA: ${{ github.event.client_payload.engine_sha }}
        run: node scripts/ci/await-engine-gameplay.mjs "$EXPECTED_ENGINE_SHA"
      - name: Provision isolated lifecycle staff account
        id: account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs create
      - name: Prepare native reserved zero-balance staff authority
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
        run: node scripts/ci/production-e2e-account.mjs prepare-staff
      - name: Certify exact engine club channel lifecycle
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_REQUIRE_AUTH: '1'
          EXPECTED_ENGINE_SHA: ${{ github.event.client_payload.engine_sha }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/club-channel-lifecycle.json
        run: >-
          npx playwright test tests/e2e/production-club-channel-lifecycle.spec.ts
          --project=chromium --reporter=line,json --workers=1 --retries=0
          --output=test-results/club-channel-lifecycle
      - name: Require the exact club channel case to execute
        if: always()
        run: node scripts/ci/assert-e2e-actually-ran.mjs e2e-report/club-channel-lifecycle.json
      - name: Hard-delete isolated lifecycle staff account
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs cleanup
      - name: Retain exact engine club channel lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: club-channel-lifecycle
          path: |
            e2e-report/club-channel-lifecycle.json
            test-results/club-channel-lifecycle/
          if-no-files-found: error
          retention-days: 14

  phase1-customization-cutover-seal:
    needs: [publication-gate, production-e2e, live-table-e2e]
    if: >-
      ${{
        always() &&
        needs.publication-gate.outputs.should_run == 'true' &&
        needs.live-table-e2e.result == 'success' &&
        needs.production-e2e.outputs.phase1_certified == 'true' &&
        needs.live-table-e2e.outputs.certified == 'true' &&
        needs.production-e2e.outputs.client_sha == needs.live-table-e2e.outputs.client_sha
      }}
    name: Seal certified Phase 1 customization cutover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sealed: ${{ steps.seal.outputs.sealed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publication-gate.outputs.verification_sha || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Re-read the exact artifacts certified by both browser lanes
        id: artifacts
        env:
          CLIENT_SHA: ${{ needs.production-e2e.outputs.client_sha }}
          LIVE_TABLE_CLIENT_SHA: ${{ needs.live-table-e2e.outputs.client_sha }}
          ENGINE_SHA: ${{ needs.live-table-e2e.outputs.engine_sha }}
        run: |
          set -euo pipefail
          test "$CLIENT_SHA" = "$LIVE_TABLE_CLIENT_SHA"
          git fetch --no-tags --filter=blob:none origin main

          CLIENT_BODY="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
            "https://smarter.poker/hub/club-arena/build-info.json?cutover=$RANDOM")" || CLIENT_BODY=''
          if [ -z "$CLIENT_BODY" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'NON-VERDICT: the terminal cutover could not re-read the client identity.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CLIENT_STATUS=0
          CLIENT_WINDOW="$(printf '%s' "$CLIENT_BODY" \
            | node scripts/ci/production-e2e-provenance.mjs release-window "$CLIENT_SHA")" \
            || CLIENT_STATUS=$?
          # A LATER CLIENT IS NOT AN UNTESTED SEAL. The seal records the client
          # the journeys and the live-table lane actually ran against
          # ($CLIENT_SHA), never what is serving now. A forward protected-main
          # release since then is accepted only when it still declares the
          # Phase 1 contract below; a rollback or off-lineage SHA already made
          # release-window exit 1 above. fn_seal_phase_one_customization_cutover
          # itself binds only the ENGINE to what is live, which is unchanged.
          LIVE_CLIENT_SHA="$CLIENT_SHA"
          if [ "$CLIENT_STATUS" -eq 3 ]; then
            LIVE_CLIENT_SHA="${CLIENT_WINDOW#superseded }"
            [[ "$LIVE_CLIENT_SHA" =~ ^[0-9a-f]{40}$ ]]
            echo "Client \`$CLIENT_SHA\` was certified; production has since advanced to \`$LIVE_CLIENT_SHA\` on protected main." >> "$GITHUB_STEP_SUMMARY"
          else
            test "$CLIENT_STATUS" -eq 0
          fi

          ENGINE_BODY="$(curl -fsS --max-time 20 -H 'Cache-Control: no-store' \
            "https://engine.smarter.poker/health?cutover=$RANDOM")" || ENGINE_BODY=''
          if [ -z "$ENGINE_BODY" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'NON-VERDICT: the terminal cutover could not re-read the engine identity.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          LIVE_ENGINE_SHA="$(printf '%s' "$ENGINE_BODY" \
            | node scripts/ci/production-e2e-provenance.mjs engine-live)"
          if [ "$LIVE_ENGINE_SHA" != "$ENGINE_SHA" ]; then
            git cat-file -e "$LIVE_ENGINE_SHA^{commit}"
            git merge-base --is-ancestor "$LIVE_ENGINE_SHA" origin/main
            if git merge-base --is-ancestor "$ENGINE_SHA" "$LIVE_ENGINE_SHA"; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo "NON-VERDICT: engine \`$ENGINE_SHA\` was superseded by protected-main release \`$LIVE_ENGINE_SHA\` before sealing." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::The live engine \`$LIVE_ENGINE_SHA\` is not a forward protected-main release from certified engine \`$ENGINE_SHA\`."
            exit 1
          fi

          MARKER='scripts/ci/phase1-customization-cutover-v1.json'
          for artifact_sha in "$CLIENT_SHA" "$LIVE_CLIENT_SHA" "$ENGINE_SHA"; do
            git cat-file -e "$artifact_sha^{commit}"
            git merge-base --is-ancestor "$artifact_sha" origin/main
            if ! git cat-file -e "$artifact_sha:$MARKER" 2>/dev/null; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo "Phase 1 cutover is not ready: \`$artifact_sha\` does not carry \`$MARKER\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git show "$artifact_sha:$MARKER" \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const v=JSON.parse(s);if(v.contract!=='phase1-customization-v1')process.exit(1)})"
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Write the durable cutover receipt
        id: seal
        if: steps.artifacts.outcome == 'success' && steps.artifacts.outputs.ready == 'true'
        env:
          CLIENT_SHA: ${{ needs.production-e2e.outputs.client_sha }}
          ENGINE_SHA: ${{ needs.live-table-e2e.outputs.engine_sha }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/ci/seal-phase1-customization-cutover.mjs
          echo 'sealed=true' >> "$GITHUB_OUTPUT"
          echo "Phase 1 client \`$CLIENT_SHA\` and engine \`$ENGINE_SHA\` now have one durable cutover seal." >> "$GITHUB_STEP_SUMMARY"

  # On 2026-10-05 this workflow failed four times in 69 minutes (runs
  # 37361302553, 37363764720, 37365802796, 37368847647) at
  # "Confirm The Hetzner Web Publish Reached Production" / "Read The Origin Job
  # Verdict", which left every lane below it SKIPPED, and
  # public.operational_alert_events received nothing for any of them: a later
  # green run cleared the episode and no person and no fleet lane ever learned
  # the publish on main 6953271d had gone 69 minutes unconfirmed.
  #
  # always() is load-bearing and if: failure() would not do: three of those four
  # runs had no FAILED lane, their lanes never ran. The should_run clause is NOT
  # used to gate this job, because a gate that fails never reaches the step that
  # writes should_run — the superseded publisher stand-down, where the gate
  # SUCCEEDS and deliberately leaves should_run empty, is told apart inside
  # record-post-deploy-verdict.mjs and records nothing.
  post-deploy-verdict:
    needs:
      - certification-cleanup-safety
      - publication-gate
      - seo-contract
      - production-e2e
      - live-table-e2e
      - phase1-customization-cutover-seal
    if: ${{ always() && needs.publication-gate.result != 'skipped' && needs.publication-gate.outputs.client_navigation != 'true' }}
    name: This verification admits its own verdict to the operational inbox
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      # actions: read lets the recorder read this run's own job record, so a
      # lane cancelled while still queued (no runner, no steps) is told apart
      # from one that started and was killed.
      actions: read
      contents: read
    steps:
      # Full commit history, no blobs: a success closes an episode only when
      # its release descends from every release the episode failed on, and
      # that is read with git merge-base --is-ancestor. A shallow clone would
      # make every lineage COULD NOT TELL and nothing would ever close.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install the pinned database client
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Record the production-verification verdict
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WORKFLOW_LABEL: Post-Deploy E2E
          ALERT_SOURCE: club-arena.post-deploy-e2e
          ALERT_NAME: PostDeployVerificationIncomplete
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GATE_NAME: Confirm The Hetzner Web Publish Reached Production
          GATE_RESULT: ${{ needs.publication-gate.result }}
          GATE_SHOULD_RUN: ${{ needs.publication-gate.outputs.should_run }}
          LANES: |
            ${{ needs.certification-cleanup-safety.result }}|Installed certification cleanup protects live tables
            ${{ needs.seo-contract.result }}|The Live SEO Contract Holds
            ${{ needs.production-e2e.result }}|Client browser verification
            ${{ needs.live-table-e2e.result }}|Live-table and engine verification
            ${{ needs.phase1-customization-cutover-seal.result }}|Seal certified Phase 1 customization cutover
          GH_TOKEN: ${{ github.token }}
          # A lane is owed only when its own `if:` held. The SEO contract runs
          # only for a publisher (workflow_run) event, so an engine-triggered
          # certificate (repository_dispatch) skips it by design: run
          # 37604057526 certified and SEALED the Phase 1 cutover and still
          # fired PostDeployVerificationIncomplete for that skip alone. Keep
          # each condition identical to its job's `if:` (pinned by
          # tests/unit/phase1CustomizationCertificateCoverage.test.ts).
          SEO_OWED: ${{ needs.publication-gate.outputs.should_run == 'true' && github.event_name == 'workflow_run' }}
          # The seal is owed only when both browser lanes certified one exact
          # release. A seal skipped because no run certified one is a
          # non-verdict, not incomplete verification.
          SEAL_OWED: >-
            ${{
              needs.publication-gate.outputs.should_run == 'true' &&
              needs.live-table-e2e.result == 'success' &&
              needs.production-e2e.outputs.phase1_certified == 'true' &&
              needs.live-table-e2e.outputs.certified == 'true' &&
              needs.production-e2e.outputs.client_sha == needs.live-table-e2e.outputs.client_sha
            }}
        run: |
          set -euo pipefail
          UNOWED_LANES=''
          if [ "$SEO_OWED" != 'true' ]; then
            UNOWED_LANES+=$'The Live SEO Contract Holds\n'
          fi
          if [ "$SEAL_OWED" != 'true' ]; then
            UNOWED_LANES+=$'Seal certified Phase 1 customization cutover\n'
          fi
          export UNOWED_LANES
          node scripts/ci/record-post-deploy-verdict.mjs

  # A RUN THAT TESTED NOTHING DOES NOT SAY SUCCESS (2026-10-26).
  #
  # When the publisher this run listens to was replaced before it reached the
  # origin, the gate above stands down: it succeeds, leaves should_run empty,
  # every lane skips, and the verdict recorder correctly records nothing. But
  # GitHub then concluded the whole run `success` - "Post-Deploy E2E <sha>"
  # green for a release no browser ever looked at. check-main-is-green.mjs
  # steps over `cancelled` and `skipped` runs precisely because they carry no
  # verdict (tests/a-skipped-run-is-not-a-green-run.test.ts), and it believed
  # these. Measured 2026-10-25: failed verification 40242809027 was followed by
  # stand-down 40243837996 concluding `success`, which the detector would read
  # as main recovering.
  #
  # So once the recorder has confirmed the stand-down, this job cancels its
  # own run. `cancelled` is the conclusion the estate already reserves for
  # "superseded by a newer publish" (CLAUDE.md 10.83), so nothing pages and
  # nothing mistakes it for a pass. It runs last, after the recorder, so the
  # recorder never sees a cancelled gate (which it rightly treats as a fault).
  # If the cancellation cannot be made, the run fails out loud rather than
  # falling back to a silent `success`.
  stood-down-is-not-green:
    name: A stood-down run is marked superseded, not passed
    needs:
      - private-record-client-proof
      - stats-pagination-proof
      - publication-gate
      - post-deploy-verdict
      - club-channel-lifecycle-e2e
    # `!cancelled()`, never `always()` (2026-10-26). GitHub does not stop an
    # `always()` job when its run is cancelled, so on main runs 40268560267 and
    # 40269218566 this step's own cancel was accepted, the run was marked
    # cancelled, and the step then sat out its 300 s guard and reported
    # failure. `!cancelled()` still lets the job evaluate past skipped needs,
    # and its own cancellation stops it, as ci.yml's heavy jobs do.
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_run' &&
      needs.publication-gate.result == 'success' &&
      needs.publication-gate.outputs.should_run != 'true' &&
      needs.post-deploy-verdict.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
    steps:
      - name: Retire this run as superseded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          {
            echo '### Superseded, not verified'
            echo
            echo "Publisher run $SOURCE_RUN_ID was replaced before it reached the origin, so nothing was published and no browser ran. This run is cancelled so it can never read as a passed verification; the newer publisher's own run carries the verdict."
          } >> "$GITHUB_STEP_SUMMARY"
          for attempt in 1 2 3; do
            if gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" > /dev/null; then
              echo "Cancellation accepted for run $RUN_ID; the runner stops this step when it lands."
              sleep 300
              echo "::error::Run $RUN_ID was still running 300 s after its cancellation was accepted, so it could not be marked superseded."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::GitHub refused to cancel run $RUN_ID three times, so a stood-down run could not be marked superseded."
          exit 1
