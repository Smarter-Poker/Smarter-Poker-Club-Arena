name: Post-Deploy E2E (production)
run-name: Post-Deploy E2E ${{ github.event.client_payload.engine_sha || github.sha }}

# ─────────────────────────────────────────────────────────────────────────────
# THE TIER THAT DID NOT EXIST (Dan 2026-08-29)
#
# An inventory of the e2e suite found SIXTEEN spec files running in no CI job
# at all. Seven pure-geometry ones joined `css-beats-e2e` on the same day. The
# rest could not: they need a signed-in session or a deployed URL, and
# `css-beats-e2e` has neither by design (it renders stylesheets with
# page.setContent so it can gate a merge in seconds).
#
# So they had nowhere to run, and "nowhere to run" is how a guard becomes a
# comment. mobile-fit-audit.spec.ts has said the answer in its own header
# since the day it was written:
#
#   "STRICT mode (MOBILE_FIT_STRICT=1, or CI where this suite runs against
#    production AFTER a deploy) fails on any violation. Post-deploy CI is the
#    right place for strict: a red run names the route and the offending
#    element without blocking anyone's merge."
#
# This is that job. It runs AFTER Club Arena publishes to its Hetzner origin,
# against the real deployed bundle through the public rewrite, signed in.
#
# WHY IT DOES NOT GATE A MERGE, and why that is not a weakness: by the time it
# runs, the code is already on main and already published. Blocking is not
# available. What it provides is the thing this estate keeps discovering it
# lacks: somebody actually looking at production after a deploy. A red run
# here is a real defect on the live site, named by route and element.
#
# NOT A `schedule:` TRIGGER. `workflow_run` is explicitly not the cron the
# estate rules restrict (World Hub CLAUDE.md section 11), because it is
# event-driven off the publish it verifies, and it schedules nothing.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    # This is the publisher's `name:`, not its filename. #2676 deleted
    # build-for-world-hub.yml (name 'Build for World Hub Sync') and repointed
    # fifteen files by FILENAME - and missed this one, so from 19:17 to 01:30
    # on 2026-09-02/03 this workflow could only fire from GitHub's throttled
    # scheduler. tests/workflow-run-names-a-live-workflow.law.test.ts now
    # refuses any workflow_run listener whose name no workflow carries.
    workflows: ['Publish Club Arena']
    types: [completed]
  schedule:
    - cron: '35 6 * * *'
  repository_dispatch:
    types: [run-post-deploy-e2e]

jobs:
  publication-gate:
    name: Confirm The Hetzner Web Publish Reached Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.origin.outputs.should_run }}
      engine_trigger_sha: ${{ steps.origin.outputs.engine_trigger_sha }}
    steps:
      # workflow_run.conclusion covers the whole publisher, including the
      # optional Capgo job. A Capgo failure after a verified web publish must
      # never suppress web E2E, so read the exact origin job and its proof step.
      - name: Read The Origin Job Verdict
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          ENGINE_TRIGGER_SHA: ${{ github.event.client_payload.engine_sha || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            [[ "$ENGINE_TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || { echo '::error::An engine-triggered production certificate requires one full lowercase engine SHA.'; exit 1; }
            echo "engine_trigger_sha=$ENGINE_TRIGGER_SHA" >> "$GITHUB_OUTPUT"
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'engine_trigger_sha=' >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = schedule ]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$EVENT_NAME" = workflow_run ] \
            || { echo "::error::Unsupported production certification event: $EVENT_NAME"; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] \
            || { echo '::error::The source workflow run id is malformed.'; exit 1; }
          JOBS_JSON="$(mktemp)"
          trap 'rm -f -- "$JOBS_JSON"' EXIT
          timeout 30s gh api \
            "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$JOBS_JSON"
          node - "$JOBS_JSON" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('node:fs');
          const [file, output] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (!Array.isArray(payload.jobs)) throw new Error('The source jobs response is malformed.');
          const jobs = payload.jobs.filter((entry) => entry?.name === 'publish-to-origin');
          if (jobs.length !== 1) {
            throw new Error(`Expected one latest publish-to-origin job, received ${jobs.length}.`);
          }
          const origin = jobs[0];
          const verdicts = (origin.steps ?? []).filter(
            (entry) => entry?.name === 'Stand down if the origin already serves a newer bundle'
          );
          const publishes = (origin.steps ?? []).filter(
            (entry) => entry?.name === 'Publish through the host-owned immutable transaction'
          );
          const proofs = (origin.steps ?? []).filter(
            (entry) => entry?.name === 'Verify the origin serves this bundle'
          );
          if (verdicts.length !== 1 || publishes.length !== 1 || proofs.length !== 1) {
            throw new Error('The origin job is missing one of its release-verdict steps.');
          }
          const originSucceeded =
            origin.status === 'completed' &&
            origin.conclusion === 'success';
          const publishProved =
            proofs[0].status === 'completed' &&
            proofs[0].conclusion === 'success';
          const safeStanddown =
            verdicts[0].status === 'completed' &&
            verdicts[0].conclusion === 'success' &&
            publishes[0].status === 'completed' &&
            publishes[0].conclusion === 'skipped' &&
            proofs[0].status === 'completed' &&
            proofs[0].conclusion === 'skipped';
          if (!originSucceeded || (!publishProved && !safeStanddown)) {
            throw new Error(
              'The source run neither proved a Hetzner web publish nor completed a safe forward stand-down.'
            );
          }
          fs.appendFileSync(output, 'should_run=true\n');
          NODE

  production-e2e:
    needs: publication-gate
    # A verified publish and a safe forward stand-down both certify the live
    # player route. A failed/skipped origin job makes the gate red, never green
    # without executing the browser suite. Optional downstream failures cannot
    # hide a successful web release.
    if: needs.publication-gate.outputs.should_run == 'true'
    name: Specs that need a real deployed page
    # This trusted workflow can receive production database credentials. Run it
    # on a fresh hosted image, never on a persistent runner that has executed
    # pull-request code.
    runs-on: ubuntu-latest
    # Serialize only jobs that will really touch the shared production test
    # accounts. Gate-only no-op runs never occupy this lock.
    concurrency:
      group: post-deploy-e2e-production
      cancel-in-progress: false
    # Cashier plus six isolated stateful groups and the 138-test responsive
    # sweep take 20-24 minutes when production is under normal publish load.
    # The old 20-minute ceiling cancelled the honesty/report steps just as the
    # sweep completed, discarding a real verdict. This remains bounded while
    # leaving enough room for first-attempt, zero-retry certification.
    # The live-table certificate now proves an actual disconnect/reconnect and
    # a complete causal hand afterward for cash, MTT, Spin and SNG in serial
    # mobile WebKit. Preserve a hard job ceiling, but budget the four real hand
    # cycles rather than letting GitHub cancel the final format mid-verdict.
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The step below may need to resolve the sha production is actually
          # serving, which is usually an ancestor of this run's commit and is
          # absent from the default shallow clone.
          fetch-depth: 0
          # blob:none keeps every one of the 7,223 commits and drops the blobs of old
          # revisions. Measured 2026-09-13, three runs each: 33-35s / 531MB against
          # 36-43s / 766MB, for identical ancestry. Nothing in this repo's workflows
          # reads a historical file version - they ask merge-base, rev-list, log and
          # cat-file -e, which are all commit-graph work - so those blobs were paid
          # for on every run and never read.
          filter: blob:none

      - name: Resolve the exact protected-main engine component
        id: engine
        env:
          ENGINE_TRIGGER_SHA: ${{ needs.publication-gate.outputs.engine_trigger_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          MAIN_SHA="$(git rev-parse --verify 'origin/main^{commit}')"
          if [ -n "$ENGINE_TRIGGER_SHA" ]; then
            # Certify the immutable release that requested this run. A newer
            # unshipped merge cannot substitute a different release identity.
            ENGINE_SHA="$ENGINE_TRIGGER_SHA"
          else
            ENGINE_SHA="$(git log "$MAIN_SHA" -1 --format=%H -- \
              'server/**' ':(exclude)server/**/*.test.ts' ':(exclude)server/sim/**')"
          fi
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::Could not resolve one exact engine-runtime commit from protected main.'; exit 1; }
          git cat-file -e "$ENGINE_SHA^{commit}" \
            || { echo '::error::The requested engine commit is unavailable.'; exit 1; }
          git merge-base --is-ancestor "$ENGINE_SHA" "$MAIN_SHA" \
            || { echo '::error::The requested engine commit is outside protected main.'; exit 1; }
          echo "sha=$ENGINE_SHA" >> "$GITHUB_OUTPUT"
          echo "Exact protected-main engine component: \`$ENGINE_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # Production credentials are confined to this trusted default-branch
      # workflow. Pull-request CI validates committed source and never receives
      # them; every successful publish runs this read-only production audit.
      # Keep this chip-safety proof in its own first step. A failure in another
      # catalogue audit must not prevent the FK question from being asked.
      - name: Prove every club foreign key remains deletable
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/check-club-fk-indexes.mjs

      - name: Audit the remaining live schema from trusted code
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/ci/check-phantom-tables.mjs
          node scripts/ci/check-phantom-columns.mjs
          node scripts/ci/check-embed-relationships.mjs

      # The live-table suite already requires this exact engine. Check that
      # prerequisite before creating a production account or spending the full
      # browser budget on a release which cannot pass. Keep the preceding
      # read-only schema/FK audits and the later in-suite identity checks.
      - name: Require the exact engine before opening production browser fixtures
        env:
          EXPECTED_ENGINE_SHA: ${{ steps.engine.outputs.sha }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
            "https://engine.smarter.poker/health?certificate=$GITHUB_RUN_ID" \
            | node scripts/ci/production-e2e-provenance.mjs engine-ready "$EXPECTED_ENGINE_SHA"

      - name: Install Chromium and WebKit
        run: npx playwright install chromium webkit --with-deps

      # Production must be reachable and serving one exact repository commit
      # before any browser assertion can carry a verdict.
      - name: Confirm production is serving, and record what we are testing
        id: live
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            BODY=''
            if BODY=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "https://smarter.poker/hub/club-arena/build-info.json?cb=$RANDOM"); then
              if LIVE=$(printf '%s' "$BODY" \
                | node scripts/ci/production-e2e-provenance.mjs build-info); then
                [[ "$LIVE" =~ ^[0-9a-f]{40}$ ]]
                echo "sha=$LIVE" >> "$GITHUB_OUTPUT"
                echo "ready=true" >> "$GITHUB_OUTPUT"
                echo "### Post-deploy E2E" >> "$GITHUB_STEP_SUMMARY"
                echo "Testing production as it is serving right now: \`$LIVE\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "  attempt $i: build-info.json did not contain one exact Club Arena SHA"
            sleep 10
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::error::production did not serve one valid full build-info.json SHA."
          exit 1

      # ───────────────────────────────────────────────────────────────────
      # THE SPECS AND THE BUNDLE MUST COME FROM THE SAME COMMIT.
      #
      # The step above stopped pinning to this run's sha on purpose, and the
      # reasoning is sound: the question is "is production healthy right now".
      # But the CHECKOUT was never brought along. So the run tested whatever
      # production served using the assertions from a different, newer commit.
      #
      # That is not a hypothetical. On 2026-08-31 runs 33394046555 and
      # 33394398578 failed on `[data-cashier-recovery="true"]` not found. The
      # element was on `main` (CashierTradePage.tsx:2162, merged in #2165 at
      # 12:43) and the spec asserting it was in the checkout - but production
      # was still serving a bundle from before it. Nothing was broken. The run
      # was asking a new question of an old page, and calling the answer a
      # defect. Ten minutes later, unchanged, the same spec passed.
      #
      # A guard whose reds are routinely false is a guard people learn to
      # ignore, which is how it becomes a comment again.
      #
      # So: when production is serving an ANCESTOR of this checkout, take the
      # specs from that ancestor too. Unknown and divergent provenance fail
      # closed because a mismatched assertion set cannot produce a verdict.
      # ───────────────────────────────────────────────────────────────────
      - name: Take the specs from the commit production is actually serving
        if: steps.live.outputs.ready == 'true'
        id: align
        run: |
          set -euo pipefail
          LIVE='${{ steps.live.outputs.sha }}'
          HERE=$(git rev-parse HEAD)
          [[ "$LIVE" =~ ^[0-9a-f]{40}$ ]] && [[ "$HERE" =~ ^[0-9a-f]{40}$ ]]
          if ! git cat-file -e "$LIVE^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$LIVE" --depth=1
          fi
          RELATION=$(node scripts/ci/production-e2e-provenance.mjs lineage "$LIVE" "$HERE")
          if [ "$RELATION" = same ]; then
            echo "specs=$HERE" >> $GITHUB_OUTPUT
            echo "The specs and the deployed bundle are the same commit (\`$HERE\`)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "$RELATION" = ancestor ]; then
            # ASSERTIONS from the deployed commit; HARNESS from this one.
            #
            # Swapping tests/e2e wholesale would also drag global-setup.ts and
            # its support/ helpers back to $LIVE - and $LIVE predates the
            # E2E_REQUIRE_AUTH throw added in this very commit. The run would
            # then silently regain the signed-out fallback it just lost, on
            # exactly the runs where production is behind. A fix that disables
            # itself under the condition it was written for is worse than none.
            git checkout "$LIVE" -- tests/e2e
            # Authentication and exact cross-artifact provenance are harness
            # authority, not page-version assertions. Never let deploy lag
            # roll either guard back to an older, weaker implementation.
            git checkout "$HERE" -- \
              tests/e2e/global-setup.ts \
              tests/e2e/production-live-table-realtime.spec.ts \
              tests/e2e/support
            echo "specs=$LIVE" >> $GITHUB_OUTPUT
            echo "Production is serving \`$LIVE\`, an ancestor of this run's \`$HERE\`." >> $GITHUB_STEP_SUMMARY
            echo "Page assertions taken from \`$LIVE\`; auth, exact engine provenance, and support harnesses kept at \`$HERE\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Unexpected provenance relation '$RELATION'."
            exit 1
          fi

      # A standing shared login is eventually changed, disabled, left behind a
      # one-time gate, or mutated by two overlapping suites. Build one isolated
      # player for this job instead. The account lives only in RUNNER_TEMP and
      # is hard-deleted by the always() cleanup below through a server function
      # that refuses every email outside the reserved certification namespace.
      - name: Provision an isolated production E2E account
        if: steps.live.outputs.ready == 'true'
        id: account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs create

      # The Player Command route is intentionally staff-only. Give the brand
      # new reserved identity a zero-balance admin membership before any
      # browser starts. The helper refuses existing memberships and non-test
      # identities; the always() sweep below removes this row with the account.
      - name: Prepare isolated Player Command staff access
        if: steps.live.outputs.ready == 'true' && steps.account.outcome == 'success'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
        run: node scripts/ci/production-e2e-account.mjs prepare-staff

      - name: Certify the live cashier database contract
        if: always() && steps.live.outputs.ready == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # `pg` is a pinned repository dependency. This stays deterministic on
        # hosted and estate runners instead of assuming the image has psql.
        run: node scripts/verification-harness/certify-cashier-contract.mjs

      # Keep the release-critical Cashier result independent from the broader
      # production sweep. A failure on Stats or another route must not obscure
      # whether the money surface itself passed or failed.
      - name: Certify the authenticated production Cashier
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success'
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          ARENA_BASE_URL: https://smarter.poker/hub/club-arena
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          # This job has credentials. A silent signed-out fallback here produces
          # a green run that verified almost nothing - see global-setup.ts.
          E2E_REQUIRE_AUTH: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report/cashier.json
        run: >-
          npx playwright test tests/e2e/production-cashier.spec.ts
          --project=chromium --reporter=line,json --workers=1 --retries=0

      # `always()` is the point. Without it, a failed Cashier step skips this one
      # entirely - so a single money-surface red hid the whole production sweep,
      # which is the exact opposite of what the note above this job's Cashier
      # step promises ("A failure on Stats or another route must not obscure
      # whether the money surface itself passed or failed"). It promised
      # independence and delivered it in one direction only. Run 33394046555:
      # Cashier failed, and thirteen spec files plus tests/e2e/routes never ran.
      - name: Run the specs that need a deployed page
        if: always() && steps.live.outputs.ready == 'true' && steps.account.outcome == 'success'
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          ARENA_BASE_URL: https://smarter.poker/hub/club-arena
          # Customization certification never mutates either standing player.
          # Realtime creates two isolated identities to prove cross-device sync
          # and cross-player isolation; commerce creates a third for checkout.
          # Every one is hard-deleted and residue-checked before the run ends.
          CUSTOMIZATION_COMMERCE_CERTIFICATION: '1'
          # Daily Missions uses the same reserved hard-delete harness for one
          # production player, then proves the complete economy/realtime/error
          # journey and verifies that no account or ledger residue remains.
          DAILY_MISSIONS_CERTIFICATION: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          # The mode mobile-fit-audit.spec.ts was built for and has never been
          # run in. Without it the spec logs a report and passes regardless.
          MOBILE_FIT_STRICT: '1'
          E2E_REQUIRE_AUTH: '1'
          LIVE_SHA: ${{ steps.live.outputs.sha }}
          # The live-table certificate is the one suite that must prove both
          # artifacts. Club Arena can publish before the hourly engine window;
          # a frontend-only green during that gap is not release proof.
          LIVE_TABLE_REALTIME_CERTIFICATION: '1'
          ENGINE_HEALTH_URL: https://engine.smarter.poker/health
          EXPECTED_ENGINE_SHA: ${{ steps.engine.outputs.sha }}
        # Every spec the css-beats gate cannot take, named explicitly for the
        # same reason that gate names its own: a spec not named in a job runs
        # in no job. If you add a spec that needs a login or a live URL, add it
        # here in the same commit.
        #
        # tests/e2e/routes/ (nine files) is named as a DIRECTORY on purpose.
        # The first sweep that wired the orphans missed it entirely by globbing
        # only tests/e2e/*.spec.ts, so nine route suites stayed invisible one
        # level down - the same class of miss as the specs this job exists for.
        # A directory cannot go stale when a tenth file is added beside them.
        run: |
          # Do NOT let the first invocation abort the second. Under `set -e` a
          # red Stats run stopped the sweep before a single route spec loaded,
          # which is the same "one failure hides the rest" fault that `always()`
          # above fixes at the step level. Record every verdict, report them all,
          # and fail at the end if any of them failed.
          set +e
          rc=0

          # run_suite <json-name> <spec path...>
          #
          # Two jobs, both of which used to be done inline and wrongly.
          #
          # 1. A spec added AFTER the deployed commit is absent once the step
          #    above takes the specs from $LIVE_SHA. Playwright errors on a named
          #    path that does not exist, before running anything - turning a
          #    normal deploy lag back into the false red this job just stopped
          #    producing. So run what is present and warn about what is not.
          #
          # 2. If nothing is present, WRITE DOWN WHY. A missing report is read by
          #    the honesty check below as "it did not run", which is exactly
          #    right for a silent hole and exactly wrong for a stated absence.
          #
          # Each spec path is passed as an argument and therefore appears in this
          # file exactly once - tests/stats-experience-contract.test.ts requires
          # that of stats-deep.spec.ts, and it is a good rule: a path repeated
          # across a guard and its invocation is a path that can be updated in
          # one place and not the other.
          run_suite () {
            json="$1"; shift
            specs=""
            flags=""
            for a in "$@"; do
              case "$a" in
                -*) flags="$flags $a" ;;
                *)
                  if [ -e "$a" ]; then
                    specs="$specs $a"
                  else
                    echo "::warning::$a is not present at the deployed commit - not run"
                  fi
                  ;;
              esac
            done
            mkdir -p e2e-report
            if [ -z "$specs" ]; then
              printf '{"notRunReason":"no spec in this group exists at the deployed commit %s"}\n' \
                "$LIVE_SHA" > "e2e-report/$json"
              return 0
            fi
            echo "running:$specs"
            output_dir="${json%.json}"
            PLAYWRIGHT_JSON_OUTPUT_NAME="e2e-report/$json" npx playwright test $specs $flags \
              --output="test-results/$output_dir"
          }

          # Certify Stats first among the broader route checks. Cashier has its
          # own preceding release gate so this suite cannot hide its verdict.
          run_suite stats.json tests/e2e/stats-deep.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          stats_rc=$?; [ $stats_rc -ne 0 ] && rc=$stats_rc

          # These contracts either mutate the standing authenticated player or
          # create and destroy isolated production fixtures. Each gets its own
          # single-worker process so a waitlist/realtime update cannot
          # invalidate another browser's snapshot. Playwright retries stay off:
          # a release must not hide a broken first attempt behind a warm retry.
          run_suite lobby.json tests/e2e/club-lobby.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          lobby_rc=$?; [ $lobby_rc -ne 0 ] && rc=$lobby_rc

          # Real mobile Safari transport, one isolated browser and no retry. It
          # proves an engine-resident table is moving before observation, stays
          # causal through the next hand, and recovers one socket owner after a
          # forced network loss. Run separately from the broad Chromium sweep.
          run_suite live-table-realtime.json tests/e2e/production-live-table-realtime.spec.ts --project=webkit-live-table-realtime --reporter=line,json --workers=1 --retries=0
          live_table_realtime_rc=$?; [ $live_table_realtime_rc -ne 0 ] && rc=$live_table_realtime_rc

          # The exact Shark Club Players route from the six-phase audit. This
          # is read-only, but gets an isolated real member from global-setup so
          # it proves auth handoff, roster RPCs, controls and 375px rendering.
          run_suite club-members.json tests/e2e/production-club-members.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          club_members_rc=$?; [ $club_members_rc -ne 0 ] && rc=$club_members_rc

          run_suite customization-realtime.json tests/e2e/production-customization-realtime.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          customization_realtime_rc=$?; [ $customization_realtime_rc -ne 0 ] && rc=$customization_realtime_rc

          run_suite customization-commerce.json tests/e2e/production-customization-commerce.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          customization_commerce_rc=$?; [ $customization_commerce_rc -ne 0 ] && rc=$customization_commerce_rc

          run_suite daily-missions.json tests/e2e/production-daily-missions.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          daily_missions_rc=$?; [ $daily_missions_rc -ne 0 ] && rc=$daily_missions_rc

          run_suite daily-missions-accessibility.json tests/e2e/daily-challenges-accessibility-responsive.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          daily_missions_accessibility_rc=$?; [ $daily_missions_accessibility_rc -ne 0 ] && rc=$daily_missions_accessibility_rc

          run_suite daily-missions-settlement.json tests/e2e/daily-missions-database-settlement.spec.ts --project=chromium --reporter=line,json --workers=1 --retries=0
          daily_missions_settlement_rc=$?; [ $daily_missions_settlement_rc -ne 0 ] && rc=$daily_missions_settlement_rc

          # tests/e2e/routes/ (nine files) is named as a DIRECTORY on purpose.
          # The first sweep that wired the orphans missed it entirely by globbing
          # only tests/e2e/*.spec.ts, so nine route suites stayed invisible one
          # level down - the same class of miss as the specs this job exists for.
          # A directory cannot go stale when a tenth file is added beside them.
          run_suite sweep.json \
            tests/e2e/smoke.spec.ts \
            tests/e2e/club-data-deep.spec.ts \
            tests/e2e/production-mobile-lobby-chrome.spec.ts \
            tests/e2e/mobile-fit-audit.spec.ts \
            tests/e2e/mobile-tap-targets.spec.ts \
            tests/e2e/mobile-input-zoom.spec.ts \
            tests/e2e/mobile-chrome-occlusion.spec.ts \
            tests/e2e/showdown-beats.spec.ts \
            tests/e2e/live-css-loader.spec.ts \
            tests/e2e/card-squeeze-visual-regression.spec.ts \
            tests/e2e/card-squeeze-mobile.spec.ts \
            tests/e2e/river-squeeze-interactive.spec.ts \
            tests/e2e/tournament-buy-in-dialog.spec.ts \
            tests/e2e/tournament-watch.spec.ts \
            tests/e2e/footer-route.spec.ts \
            tests/e2e/mobile-lobby-chrome.spec.ts \
            tests/e2e/header-portrait-frame.spec.ts \
            tests/e2e/production-csp-violations.spec.ts \
            tests/e2e/routes \
            --reporter=line,json --workers=2 --retries=0
          sweep_rc=$?; [ $sweep_rc -ne 0 ] && rc=$sweep_rc

          echo "stats exit=$stats_rc  lobby exit=$lobby_rc  live table realtime exit=$live_table_realtime_rc  club members exit=$club_members_rc  customization realtime exit=$customization_realtime_rc  customization commerce exit=$customization_commerce_rc  daily missions exit=$daily_missions_rc  daily missions accessibility exit=$daily_missions_accessibility_rc  daily missions settlement exit=$daily_missions_settlement_rc  sweep exit=$sweep_rc"
          exit $rc

      # THE RUN MUST NOT PASS BY NOT RUNNING.
      #
      # Everything above can succeed while verifying nothing: Playwright exits 0
      # when every test skips, and dozens of these specs skip themselves when
      # they land on /auth or find no live fixture. `always()` so this reports
      # on a red run too - a run can be BOTH failed and dishonest, and the
      # second fact is the one nobody was being told.
      - name: Did the suite actually verify production?
        if: always() && steps.live.outputs.ready == 'true'
        run: >-
          node scripts/ci/assert-e2e-actually-ran.mjs
          e2e-report/cashier.json
          e2e-report/stats.json
          e2e-report/lobby.json
          e2e-report/live-table-realtime.json
          e2e-report/club-members.json
          e2e-report/customization-realtime.json
          e2e-report/customization-commerce.json
          e2e-report/daily-missions.json
          e2e-report/daily-missions-accessibility.json
          e2e-report/daily-missions-settlement.json
          e2e-report/sweep.json

      - name: Hard-delete the isolated production E2E account
        if: always() && steps.live.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs cleanup

      # The suite runs against an unversioned public route for long enough that
      # another legitimate publisher may advance `current` while browsers are
      # still running. A green result assembled across two bundles certifies
      # neither one, so the exact SHA recorded before the first browser must
      # still be live after fixture cleanup. There is deliberately no retry: a
      # changed or unreadable final document is a non-verdict, not eventual
      # success for the release this run claims to have tested.
      - name: Prove production stayed on one exact release during certification
        if: always() && steps.live.outputs.ready == 'true'
        env:
          EXPECTED_LIVE_SHA: ${{ steps.live.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          BODY="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
            "https://smarter.poker/hub/club-arena/build-info.json?final=$RANDOM")"
          FINAL_SHA="$(printf '%s' "$BODY" \
            | node scripts/ci/production-e2e-provenance.mjs unchanged "$EXPECTED_LIVE_SHA")"
          [ "$FINAL_SHA" = "$EXPECTED_LIVE_SHA" ]
          echo "Production stayed on \`$FINAL_SHA\` for the complete browser certificate." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report when something is wrong on production
        # `failure()` is false when GitHub cancels a job at its time limit. The
        # old condition therefore discarded the only report from exactly the
        # run that exposed the obsolete timeout. Preserve evidence for both
        # kinds of non-verdict, while still skipping uploads on a clean run.
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-playwright-report
          path: |
            playwright-report/
            test-results/
            e2e-report/
          retention-days: 3 # 2026-09-01 cost audit: reports are read same-day or never
