name: Explicit Public215 Staged Linux Evidence
run-name: Public215 staged Linux evidence ${{ inputs.dataset }}
on:
  pull_request:
    paths:
      - .github/workflows/public215-linux-preflight.yml
      - scripts/ci/public215-linux-preflight.mjs
      - scripts/ci/public215-linux-preflight.test.mjs
  workflow_dispatch:
    inputs:
      dataset:
        description: Exact private M1 preparation dataset UUID
        required: true
        type: string
      candidate_sha:
        description: Exact protected engine source already built by the existing release lane
        required: true
        type: string
      image_id:
        description: Existing immutable sha256 image ID on the engine host; never built here
        required: true
        type: string
      stage_run:
        description: Existing Auto-Deploy release run with passing exact-source admission
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: public215-linux-${{ github.event.pull_request.number || inputs.dataset }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/ci/public215-linux-preflight.test.mjs
  evidence:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_id == '1132369872'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Existing exact-head source admission
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          node scripts/ci/pr-status.mjs --sha "$CANDIDATE_SHA" --json
      - name: Establish existing pinned SSH identity
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          PRIVATE_DIR="$RUNNER_TEMP/public215-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$PRIVATE_DIR"
          printf '%s\n' "$SSH_KEY" > "$PRIVATE_DIR/key"
          chmod 0600 "$PRIVATE_DIR/key"
          ssh-keygen -y -f "$PRIVATE_DIR/key" >/dev/null
          printf '%s\n' "$HOST_KEY" > "$PRIVATE_DIR/known_hosts"
          ssh-keygen -l -f "$PRIVATE_DIR/known_hosts" >/dev/null
          printf '#!/usr/bin/env bash\nexec ssh -i %q -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%q -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20 %q "$@"\n' "$PRIVATE_DIR/key" "$PRIVATE_DIR/known_hosts" "root@$HOST" > "$PRIVATE_DIR/hssh"
          chmod 0700 "$PRIVATE_DIR/hssh"
          echo "PUBLIC215_SSH_COMMAND=$PRIVATE_DIR/hssh" >> "$GITHUB_ENV"
          echo "PUBLIC215_PRIVATE_DIR=$PRIVATE_DIR" >> "$GITHUB_ENV"
      - name: Read approved preparations and collect bounded isolated Linux receipts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLIC215_RECEIPT_DIR: artifacts/public215-linux-preflight
        run: node scripts/ci/public215-linux-preflight.mjs
      - name: Retain execution receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public215-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/public215-linux-preflight
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove exact ephemeral SSH identity
        if: always()
        run: |
          if [[ "${PUBLIC215_PRIVATE_DIR:-}" == "$RUNNER_TEMP/public215-linux-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]; then
            rm -rf -- "$PUBLIC215_PRIVATE_DIR"
          fi
