# ─────────────────────────────────────────────────────────────────────────────
# PUBLISH CLUB ARENA — the Club Arena-owned Hetzner publisher, isolated on
# fresh hosted runners so prior pull-request code cannot reach release secrets.
#
# WHY THIS FILE EXISTS (2026-09-02). build-for-world-hub.yml stopped being
# scheduled by GitHub at 16:33 UTC. Six runs sat at `queued` with ZERO jobs
# created and `updated_at == created_at`, for up to fifty minutes, while every
# other workflow in this repo - CI, Silent Revert Guard, detect-rewind - picked
# up runners normally in the same minutes. It was not runner capacity and it
# was not the concurrency group: #2664 moved the group to `-g2-` and a fresh
# dispatch against the new group still produced zero jobs. Merging #2654 did
# not even CREATE a run. Neither cancel, force-cancel nor delete would clear
# the stuck runs - GitHub answers 409 "Cannot cancel a workflow run that has
# not been queued yet" and 403 on delete. The wedge is on the workflow ENTRY,
# and the only thing that escapes an entry is a different path.
#
# Production sat on one bundle for 80 minutes because of it.
#
# The exact-main target, the four-way sharded gate, and the refusal to publish
# a bundle older than the one deployed are owned here.
#
# THAT FILE IS GONE NOW (2026-09-02, later the same day). For about ninety
# minutes both files existed and BOTH fired on every push to main, on separate
# concurrency groups, so nothing serialised them: two full builds of the same
# commit, two competing publishes, and the old one still on billed hosted
# runners. Verified identical before deleting - 320 non-comment lines each,
# zero difference once name, path, group and runs-on were normalised.
#
# THIS IS NOW THE ONLY PUBLISHER. There is no second path to production. It is
# event-driven and fail-closed: a failed release is fixed at source and
# re-proposed, never hidden by a timer, retry watcher, or alternate publisher.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish Club Arena

on:
  push:
    branches: [main]
  # Recovery uses repository_dispatch so GitHub always executes the
  # reviewed workflow definition from the default branch. workflow_dispatch
  # can execute branch-authored YAML with production origin credentials.
  repository_dispatch:
    types: [publish-club-arena]

# 2026-08-21: was cancel-in-progress: true, which deadlocked publishing.
# This build takes about 4 minutes. With several agents pushing to main every
# minute or two, every run was killed by the next push before it reached the
# sync step, so production sat on one sha (7547a6e45) for hours while main
# moved far ahead. The queue was never idle and never finished.
#
# false is correct here because of how GitHub scopes it: a new run still
# cancels an older PENDING run in the group, but a run already RUNNING is
# allowed to finish. The group therefore holds at most one in-flight build
# plus the newest queued commit, and each wave of pushes converges on
# publishing the latest main instead of publishing nothing at all.
#
# The key is intentionally static because there is one production resource:
# push and repository_dispatch must serialize even if GitHub gives the two
# event types different refs.
# One-time adoption rule: every run created from the former ref-scoped key must
# be terminal before this definition first reaches main. That older definition
# did not take the host lock. After adoption, every event shares this static key
# and the host lock plus compare-and-swap provide the second serialization layer.
concurrency:
  group: publish-club-arena-production
  cancel-in-progress: false

jobs:
  # ── IS THERE ANYTHING TO PUBLISH AT ALL? ──────────────────────────────────
  # A job rather than a step, because the work this guards is spread across
  # TWO jobs that run in parallel (`client-tests` and `build-and-store`), and
  # a step output cannot cross a runner. Putting the check inside
  # build-and-store would have let the whole test suite run anyway on a cycle
  # that had nothing to publish, which is most of the cost it is meant to save.
  #
  # A push is new work, and a recovery event carries one explicit
  # protected-main SHA to publish.
  publish-needed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      tests_proven: ${{ steps.proven.outputs.tests_proven }}
    steps:
      # ═══════════════════════════════════════════════════════════════════════
      # NO COMMIT LEFT BEHIND — publish the TIP OF MAIN, not the commit that
      # happened to trigger this run. Added 2026-09-02.
      #
      # `actions/checkout` with no `ref` checks out `github.sha`, so every run
      # used to be "publish commit X" rather than "make production equal main".
      # That is what let commits go missing. When a wave of pushes arrives,
      # `cancel-in-progress: false` cancels the older PENDING runs — correctly,
      # they are superseded — and the survivor published only ITS OWN sha. So
      # the backlog was only ever drained if that one specific run succeeded.
      # If it failed, was cancelled at the wrong moment, hit a runner outage or
      # an expired token, that individual run could not be treated as release
      # proof. The source push remains durable and a source fix is re-proposed.
      #
      # Resolving the tip here makes every run a CONVERGENCE step instead of a
      # per-commit delivery. Any single successful run now drains the entire
      # backlog, however many runs were cancelled behind it, because it builds
      # whatever main is at the moment it starts. Cancellation becomes
      # structurally harmless rather than merely usually-harmless.
      #
      # If main moves again while this run builds, its own push event queues the
      # next exact release. The compare-API guard refuses to let a slow run
      # overwrite a newer deployed bundle.
      #
      # FAILS CLOSED: pushes publish the current Club Arena main.
      # Repository events publish their explicit full ref_sha only after proving
      # it IS current main. An ancestor is durable history, but it is not current
      # release authority and must never be used to roll the origin backward.
      # They never inherit a selectable workflow ref.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Resolve the tip of main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.event.client_payload.ref_sha || '' }}
        run: |
          set -euo pipefail
          TIP=$(timeout 30s gh api "repos/${{ github.repository }}/commits/main" --jq .sha 2>/dev/null || echo "")
          [[ "$TIP" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::Could not resolve one full current-main SHA; refusing to publish.'; exit 1; }

          TARGET="$TIP"
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || { echo '::error::publish-club-arena requires one lowercase full client_payload.ref_sha.'; exit 1; }
            [ "$REQUESTED_SHA" = "$TIP" ] \
              || { echo "::error::Requested SHA is not current Club Arena main ($TIP)."; exit 1; }
            TARGET="$REQUESTED_SHA"
          fi

          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Publishing target: ${TARGET:0:7}; current main: ${TIP:0:7}; trigger: ${GITHUB_SHA:0:7}"

      # ═════════════════════════════════════════════════════════════════════════
      # CLIENT TESTS GATE THE BUNDLE, BUT NO LONGER DELAY IT — split out 2026-08-26.
      #
      # This suite used to run as step 5 of build-and-store, IN FRONT of the build.
      # Measured on run 32993261791, the critical path was:
      #
      #     Client tests          5m19s
      #     Build Club Arena      1m59s
      #     Checkout World Hub    3m36s
      #     everything else       ~1m
      #     ------------------------------
      #     publish              ~12m
      #
      # Pushes land on main every two to three minutes. A twelve minute pipeline
      # under a two to three minute arrival rate can only ever publish a sha that
      # is already twelve minutes stale, and every push in between is cancelled
      # while PENDING by `cancel-in-progress: false` — which is that setting
      # working correctly, not failing. Production was fourteen commits behind
      # while every one of those cancels looked like a broken deploy.
      #
      # The tests are 13s on a developer machine and 5m19s here because a GitHub
      # runner has two cores and the suite is ~285s of aggregate work across 429
      # files. Nothing is misconfigured; it is simply serialised.
      #
      # So it runs BESIDE the build instead of in front of it. The gate is exactly
      # as strong: publish-to-origin needs BOTH jobs, so a red test still stops the
      # bundle from shipping. It just stops adding its five minutes to the build's
      # two.
      # ═════════════════════════════════════════════════════════════════════════
      # SHARDED 2026-09-02 to unblock publishing. This suite is the authoritative
      # gate on the bundle (a red test still stops the sync via `needs` below), and
      # it ran ~11 minutes on one 2-core runner. publish-to-origin waits for it, so
      # every publish took ~18 minutes end to end - slower than the merge rate, so
      # production perpetually lagged and intermediate publish runs were cancelled
      # ("last 3 pushes haven't published"). Nothing was ever lost: main is durable
      # and the publisher converges to the latest. But the LAG is the bug.
      #
      # Four shards run in parallel, so wall clock drops to ~3 minutes and the whole
      # publish pipeline to ~7. The gate is exactly as strong: publish-to-origin
      # `needs: [build-and-store, client-tests]`, and `needs` on a matrix waits for
      # EVERY shard, so one red shard still stops the bundle. fail-fast cancels the
      # siblings the moment one fails, which is what a gate wants. Fresh hosted
      # images keep the test and release trust domains isolated.
      # ── HAS THIS EXACT TREE ALREADY PASSED THE CLIENT SUITE? ──────────────
      #
      # The publisher re-runs the whole client suite in four shards on every
      # merge. On a squash merge the resulting commit usually has the SAME TREE
      # as the pull request head that CI just proved green - identical bytes,
      # tested twice, ~2 minutes of shards plus their queue wait on the critical
      # path between a merge and a player seeing the change.
      #
      # "Usually" is not "always", which is why this compares TREE HASHES rather
      # than trusting the merge. If main moved between the PR's last CI run and
      # the squash, the trees differ and the shards run exactly as before. This
      # can only skip when the content is bit-identical to something that
      # already passed.
      #
      # Fails closed: any doubt - no PR found, no green check, an API error -
      # and tests_proven stays false and the shards run.
      - name: Has this exact tree already passed the client suite?
        id: proven
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          echo "tests_proven=false" >> "$GITHUB_OUTPUT"

          TREE=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$SHA" --jq .commit.tree.sha 2>/dev/null || echo "")
          [ -z "$TREE" ] && { echo "::notice::could not read the target tree - running the shards."; exit 0; }

          PR=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$SHA/pulls" --jq '.[0].number' 2>/dev/null || echo "")
          [ -z "$PR" ] || [ "$PR" = "null" ] && { echo "::notice::no source pull request for ${SHA:0:7} - running the shards."; exit 0; }

          HEAD=$(timeout 30s gh api "repos/${{ github.repository }}/pulls/$PR" --jq .head.sha 2>/dev/null || echo "")
          [ -z "$HEAD" ] && { echo "::notice::could not read PR #$PR head - running the shards."; exit 0; }

          HEAD_TREE=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$HEAD" --jq .commit.tree.sha 2>/dev/null || echo "")
          if [ "$TREE" != "$HEAD_TREE" ]; then
            echo "::notice::tree ${TREE:0:7} differs from PR #$PR head tree ${HEAD_TREE:0:7} - main moved, running the shards."
            exit 0
          fi

          OK=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$HEAD/check-runs?per_page=100" \
                 --jq '[.check_runs[] | select(.name=="Client Unit Tests (vitest)" and .conclusion=="success")] | length' 2>/dev/null || echo 0)
          if [ "${OK:-0}" -ge 1 ]; then
            echo "tests_proven=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tree $TREE already passed Client Unit Tests on PR #$PR head ${HEAD:0:7} - skipping the shards."
          else
            echo "::notice::no green Client Unit Tests on PR #$PR head - running the shards."
          fi

  client-tests:
    needs: publish-needed
    # Runs unless this exact TREE already passed the same suite on the pull
    # request head. See "Has this exact tree already passed" above - it compares
    # tree hashes, not merge lineage, and fails closed.
    if: needs.publish-needed.outputs.tests_proven != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    env:
      HUSKY: '0'
    steps:
      - name: Checkout Club Arena at the publish target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-needed.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Cache the installed tree so npm ci is skipped on a hit - ~2 min off
      # each shard. Keyed on the lockfile, so any dependency change installs
      # fresh; identical behaviour, minus the wait.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-bfwh-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Client tests must pass before the bundle ships (shard ${{ matrix.shard }}/4)
        run: npx vitest run tests/ --shard=${{ matrix.shard }}/4

  build-and-store:
    needs: publish-needed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # read is enough now: this job uploads an artifact instead of pushing a
      # branch, so it no longer writes to the repository at all.
      contents: read
    env:
      HUSKY: '0'

    steps:
      # The publish target, not the trigger sha — see "NO COMMIT LEFT BEHIND"
      # in publish-needed. The bundle this job builds IS what production gets,
      # so this checkout is the one that decides whether a queued commit ships.
      - name: Checkout Club Arena at the publish target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-needed.outputs.target_sha }}
          # Strict provenance requires complete ancestry for this exact target.
          fetch-depth: 0
          # blob:none keeps every one of the 7,223 commits and drops the blobs of old
          # revisions. Measured 2026-09-13, three runs each: 33-35s / 531MB against
          # 36-43s / 766MB, for identical ancestry. Nothing in this repo's workflows
          # reads a historical file version - they ask merge-base, rev-list, log and
          # cat-file -e, which are all commit-graph work - so those blobs were paid
          # for on every run and never read.
          filter: blob:none

      # STAGE MARKERS REMOVED (2026-08-21).
      #
      # Three steps here used to `git push HEAD:refs/heads/ci-marker/<sha>-*`
      # after checkout, deps and build, so that "which markers exist" told you
      # which stage died. They were added 2026-08-06 with the explicit
      # justification "without needing the Actions API" — at the time that API
      # was not readable from here.
      #
      # It is readable now. `gh run view <id> --json` and
      # `gh api repos/.../actions/runs/<id>/jobs` return every step with its
      # own conclusion, which is strictly more information than the markers
      # ever carried: today that is how the failing step was identified as
      # "Client tests must pass before the bundle ships", something the
      # markers could only have narrowed to "somewhere after deps".
      #
      # The cost was not free. Three refs per push, never cleaned up, had
      # accumulated 716 ci-marker branches out of 1025 total on this repo —
      # every one of them a permanent ref that `actions/checkout` and every
      # `git ls-remote` pays for. Deleted here so it stops growing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── THE PUBLISHER WAS BUILDING COLD, EVERY TIME ──────────────────────
      #
      # CI's `Production Build` job caches both `node_modules` and
      # `node_modules/.vite`. This job cached neither, so every publish paid a
      # full `npm ci` and a full cold Vite build - measured at 3.4 minutes of
      # run time on top of its queue wait, on the critical path between a merge
      # and a player seeing the change.
      #
      # Same keys as CI on purpose: both are keyed on the lockfile, so a
      # dependency change invalidates both together and neither can serve a
      # stale tree. A cache MISS simply builds exactly as before - there is no
      # new failure mode here, only a faster hit.
      # NOTE THE NODE VERSION IN THE KEY. This job runs Node 22; CI's
      # `Production Build` runs Node 20 and keys its cache `node20`. Sharing one
      # key across two major versions would restore a `node_modules` whose
      # native modules were compiled for the other runtime - a real breakage,
      # and a silent one. Separate keys; each warms after its first run.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-publish-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Cache Vite Build
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-publish-${{ runner.os }}-node22-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # 2026-09-04: content-addressed cache for scripts/optimize-dist-media.mjs,
      # which was 85.7s of this job's 120s build. Same key shape as ci.yml, but
      # a different cache namespace: this job runs Node 22 and CI runs Node 20,
      # and sharp's version is part of every entry key anyway, so nothing is
      # shared across the two by accident.
      - name: Cache optimized dist media
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/dist-media
          key: >-
            dist-media-publish-v1-${{ runner.os }}-${{ hashFiles('public/**/*.png',
            'public/**/*.jpg', 'public/**/*.jpeg', 'public/**/*.webp',
            'src/assets/**', 'scripts/optimize-dist-media.mjs') }}
          restore-keys: dist-media-publish-v1-${{ runner.os }}-

      # This job runs the FULL `npm run build`, `tsc -b` included, while
      # ci.yml's two build jobs run `build:ci` without it. That asymmetry is
      # deliberate: the tree that actually reaches players is typechecked
      # before it ships, and the throwaway PR-head builds are not, because the
      # required `TypeScript Check` job has already checked that same tree.
      #
      - name: Build Club Arena
        env:
          NODE_ENV: production
          VITE_ANTIGRAVITY_ENABLED: 'true'
          VITE_SUPABASE_URL: 'https://kuklfnapbkmacvwxktbh.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          VITE_ENGINE_URL: 'https://engine.smarter.poker'
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ needs.publish-needed.outputs.target_sha }}
          VITE_ONESIGNAL_APP_ID: '2fde0e83-cd01-4f93-a9a0-9be6cfe36e8c'
        run: npm run build

      # Keep source private even if an older tool emits a map.
      - name: Source maps never ship to players
        run: |
          BEFORE=$(find dist -name '*.map' | wc -l | tr -d ' ')
          find dist -name '*.map' -delete
          AFTER=$(find dist -name '*.map' | wc -l | tr -d ' ')
          echo "source maps stripped from dist: $BEFORE removed, $AFTER remaining"
          if [ "$AFTER" != "0" ]; then
            echo "::error::source maps survived the strip - refusing to publish them"
            exit 1
          fi

      # Build provenance: record the commit this dist was actually built from,
      # inside the bundle. Three syncs on 2026-08-19 published a bundle built
      # from a stale tree while naming the current sha in the commit message;
      # nothing in the artefact contradicted them. With this file,
      #   curl -s https://smarter.poker/hub/club-arena/build-info.json
      # answers "what is actually live" without grepping minified chunks.
      - name: Stamp build provenance
        run: |
          cat > dist/build-info.json <<JSON
          {
            "ca_sha": "${{ needs.publish-needed.outputs.target_sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "built_by": "publish-club-arena.yml",
            "run_id": "${{ github.run_id }}"
          }
          JSON
          cat dist/build-info.json

      # The artifact courier authenticates the upload/download envelope, while
      # this manifest authenticates every byte after rsync and makes an existing
      # releases/<sha> directory immutable: a retry may reuse it only when the
      # complete manifest and every recorded file still agree.
      - name: Seal the immutable release bytes
        run: |
          set -euo pipefail
          if find dist -type l -print -quit | grep -q .; then
            echo '::error::dist contains a symlink; refusing a release that can escape its root.'
            exit 1
          fi
          (
            cd dist
            find . -type f ! -path './.release-manifest.sha256' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > .release-manifest.sha256
            test -s .release-manifest.sha256 \
              || { echo '::error::dist/.release-manifest.sha256 is empty; the seal recorded no files.'; exit 1; }
            sha256sum --strict -c .release-manifest.sha256
          )

      # THE COURIER IS AN ARTIFACT, NOT A BRANCH (2026-08-23).
      #
      # This step used to force-push dist/ to an orphan branch
      # `build/world-hub-sync-<sha>` so the sync job could check it out. From
      # 05:17 UTC every publish failed there, four runs in a row and then the
      # manual dispatch too, always the same way:
      #
      #   remote: fatal error in commit_refs
      #   ! [remote rejected] build/world-hub-sync-<sha> (failure)
      #
      # Isolated by experiment rather than guessed at: a small push to this
      # repo succeeds, and pushing the SAME 84MB dist as an orphan branch from
      # a workstation over SSH also succeeds - so it is neither the ref
      # backend, nor the size, nor the content. Only the runner's HTTPS push
      # of an 84MB pack fails, and it fails every time. Production sat 40
      # minutes behind main with a dozen merged pull requests stuck behind it.
      #
      # Passing build output between jobs is what upload-artifact is FOR. It
      # removes the failing push entirely, and with it three long-standing
      # costs of the branch approach: an 84MB pack pushed to the repository on
      # every single commit to main, a ref per publish that only gets cleaned
      # up when the run succeeds (nine were still lying around), and the
      # GITHUB_TOKEN write permission this job needed purely to create them.
      - name: Upload dist for the sync job
        uses: actions/upload-artifact@v4
        with:
          name: club-arena-dist-${{ needs.publish-needed.outputs.target_sha }}
          path: dist
          # upload-artifact excludes dotfiles unless this is explicit. The
          # release seal is intentionally named .release-manifest.sha256, so
          # omitting hidden files would make every origin publish fail before
          # transfer and would separate the bytes from their integrity proof.
          include-hidden-files: true
          # A courier, not a record: the immutable Hetzner release directory
          # and its build stamp are the permanent copy. One day is enough for
          # a retry.
          retention-days: 1
          if-no-files-found: error
          compression-level: 6

      # Prove the thing the next job depends on actually exists, rather than
      # discovering it is missing halfway through publication. Kept from the
      # branch version, which checked the same file for the same reason.
      # WHAT THE ORIGIN REQUIRES IS CHECKED HERE, NOT ONLY index.html
      # (2026-09-22). This step only ever looked at dist/index.html, so a
      # bundle that the host transaction can never accept still went green
      # here, uploaded, and was refused 4 minutes later on the origin. On
      # 2026-09-22 `self-host-fonts` could not reach Google Fonts, exited 0,
      # and produced a dist with no fonts/ at all; runs 35763554815 and
      # 35764705782 then failed inside the host transaction on
      # `test -d "$FINAL/fonts"` with an empty log. The origin serves
      # /fonts/* out of the append-only pool, whose fonts.css is a symlink
      # into current/fonts/fonts.css, so a release without fonts/ would
      # dangle that pointer for every already-cached shell. The origin is
      # right to refuse it; this job is where that refusal is cheap and
      # legible.
      - name: Verify dist is complete
        run: |
          set -uo pipefail
          MISSING=0
          require_directory() {
            [ -d "$1" ] && [ ! -L "$1" ] && return 0
            echo "::error::$1 is not a directory in the built bundle; found: $(ls -ld -- "$1" 2>&1 || true)"
            MISSING=1
          }
          require_file() {
            [ -f "$1" ] && [ ! -L "$1" ] && return 0
            echo "::error::$1 is not a regular file in the built bundle; found: $(ls -ld -- "$1" 2>&1 || true)"
            MISSING=1
          }
          require_file dist/index.html
          require_file dist/build-info.json
          require_file dist/ca-provenance.json
          require_directory dist/assets
          require_directory dist/fonts
          require_file dist/fonts/fonts.css
          if [ "$MISSING" != "0" ]; then
            echo "::error::The built bundle is missing what the origin transaction requires, so publication would be refused on the host. dist contains: $(ls -A1 dist 2>&1 | tr '\n' ' ')"
            exit 1
          fi
          echo "dist carries index.html, assets/, fonts/fonts.css and its provenance ($(du -sh dist | cut -f1) total)"

      - name: Build summary
        run: |
          echo "### Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "dist uploaded as artifact \`club-arena-dist-${{ needs.publish-needed.outputs.target_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Proceeding to publish to the origin..." >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  #  THE APP (store readiness, phase 6): the same merge reaches installed
  #  phones over the air.
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # A web change that just went live on smarter.poker is also the app's web
  # bundle. Capgo (`@capgo/capacitor-updater`, capacitor.config.ts) downloads
  # a new bundle on the next launch and swaps it in - no store review for CSS,
  # copy and fixes (Apple 3.3.2: a plugin, a permission or a change of purpose
  # is a new binary, never an OTA). The native shell calls notifyAppReady() on
  # every launch, which is what lets Capgo roll a broken bundle back.
  #
  # This is NOT a second publisher - it is a job in the one publisher, gated
  # on the same build and the same test shards, and it ships only after the
  # origin was verified serving the same commit (`needs: publish-to-origin`;
  # it sits above that job only to keep the build jobs grouped together).
  # `tests/no-commit-left-behind` counts workflows with a publish-to-origin
  # job, and there is still one.
  #
  # The bundle version is `<native.version>.<run number>`: the binary's
  # marketing version (iOS MARKETING_VERSION, Android versionName, pinned to
  # native.version by tests/unit/nativeAssetsAndOta.test.ts) followed by a
  # monotonic patch, so every upload is unique, ordered, and never below the
  # binary that will install it (Capgo refuses a bundle older than the app).
  #
  # CAPGO_TOKEN is Dan's to create (CLAUDE.md 10.84). The job is switched on
  # by the repository variable CAPGO_OTA_ENABLED='true' (set it together with
  # the secret); until then the job is skipped and the web publish is never
  # held hostage to a store account that does not exist yet.
  publish-to-app:
    name: Publish the app bundle (Capgo OTA)
    needs: [publish-needed, build-and-store, client-tests, publish-to-origin]
    # The repository VARIABLE `CAPGO_OTA_ENABLED` is the switch (secrets are
    # not readable in a job-level `if`; variables are). Off, or absent, the job
    # is skipped and the web publish is untouched. On, the job must have the
    # CAPGO_TOKEN secret too, and fails loudly if it does not - an enabled
    # switch with no token is a misconfiguration, not a quiet no-op.
    if: >-
      always() &&
      vars.CAPGO_OTA_ENABLED == 'true' &&
      needs.build-and-store.result == 'success' &&
      needs.publish-to-origin.result == 'success' &&
      needs.publish-to-origin.outputs.verified_sha != '' &&
      needs.publish-to-origin.outputs.verified_sha == needs.publish-needed.outputs.target_sha &&
      (needs.client-tests.result == 'success' ||
       (needs.client-tests.result == 'skipped' &&
        needs.publish-needed.outputs.tests_proven == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HUSKY: '0'
      CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}

    steps:
      - name: The switch is on, so the token must exist
        run: |
          if [ -z "${CAPGO_TOKEN:-}" ]; then
            echo "::error::CAPGO_OTA_ENABLED is 'true' but the CAPGO_TOKEN secret is not set (docs/APP-STORE-RUNBOOK.md)."
            exit 1
          fi

      - name: Checkout Club Arena at the publish target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-needed.outputs.target_sha }}
          # Strict provenance requires complete ancestry for this exact target.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-publish-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # The native bundle: base '/', no source maps, dist-native/. Same tree,
      # same env as the web build above; the native flag build:native sets in
      # package.json is the only difference (the web job never sets it).
      - name: Build the app bundle
        env:
          NODE_ENV: production
          VITE_ANTIGRAVITY_ENABLED: 'true'
          VITE_SUPABASE_URL: 'https://kuklfnapbkmacvwxktbh.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          VITE_ENGINE_URL: 'https://engine.smarter.poker'
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ needs.publish-needed.outputs.target_sha }}
          VITE_REVENUECAT_IOS_KEY: ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
        run: npm run build:native

      - name: Upload to Capgo
        env:
          SHA: ${{ needs.publish-needed.outputs.target_sha }}
          CHANNEL: ${{ vars.CAPGO_CHANNEL || 'production' }}
        run: |
          set -euo pipefail
          test -f dist-native/index.html \
            || { echo '::error::dist-native/index.html is missing; the native bundle did not build.'; exit 1; }
          NATIVE=$(tr -d '[:space:]' < native.version)
          VERSION="${NATIVE}.${{ github.run_number }}"
          echo "uploading bundle ${VERSION} (${SHA:0:7}) to channel ${CHANNEL}"
          npx --yes @capgo/cli@latest bundle upload \
            --apikey "$CAPGO_TOKEN" \
            --path dist-native \
            --channel "$CHANNEL" \
            --bundle "$VERSION" \
            --no-key
          echo "- OTA: bundle \`${VERSION}\` (\`${SHA:0:7}\`) uploaded to channel \`${CHANNEL}\`" >> $GITHUB_STEP_SUMMARY

  publish-to-origin:
    # The Club Arena repository owns this one Hetzner publisher. The release is
    # transferred into a run-unique incoming directory, verified byte-for-byte,
    # and activated under one host lock only if `current` still names the SHA
    # observed by the ancestry check. The final symlink rename is the last
    # mutation, so a crash cannot expose a partial release.
    needs: [publish-needed, build-and-store, client-tests]
    # MUST be always() with explicit results.
    #
    # `client-tests` is now skipped when the target TREE already passed the same
    # suite on the pull request head. GitHub skips the DEPENDENTS of a skipped
    # job by default, so without this the publisher would quietly publish
    # NOTHING on exactly the fast path this change exists to create - the same
    # shape as the 2026-08-23 incident where a skipped `changes` job took every
    # required check down with it.
    #
    # Run when the build succeeded AND the tests either passed or were provably
    # unnecessary. A client-tests FAILURE still stops the publish.
    if: >-
      always() &&
      needs.build-and-store.result == 'success' &&
      (needs.client-tests.result == 'success' ||
       (needs.client-tests.result == 'skipped' &&
        needs.publish-needed.outputs.tests_proven == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      verified_sha: ${{ steps.verified.outputs.sha }}
    env:
      ORIGIN_HOST: ${{ secrets.CA_ORIGIN_HOST }}
      ORIGIN_USER: ci
      ORIGIN_ROOT: /srv/club-arena
      ORIGIN_URL: https://ca-static.smarter.poker
      PUBLIC_URL: https://smarter.poker/hub/club-arena
      KEEP_RELEASES: '10'

    steps:
      - name: Checkout the exact protected-main publish control
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-needed.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the dist built by the previous job
        uses: actions/download-artifact@v4
        with:
          name: club-arena-dist-${{ needs.publish-needed.outputs.target_sha }}
          path: dist

      - name: Install the origin key and pin the host key
        env:
          KEY: ${{ secrets.CA_ORIGIN_SSH_KEY }}
          HOST_KEY: ${{ secrets.CA_ORIGIN_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$ORIGIN_HOST" =~ ^[A-Za-z0-9.-]+$ ]] \
            || { echo '::error::CA_ORIGIN_HOST is absent or malformed.'; exit 1; }
          [ -n "$KEY" ] && [ -n "$HOST_KEY" ] \
            || { echo '::error::Club Arena origin credentials are incomplete.'; exit 1; }
          umask 077
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ca_origin && chmod 600 ~/.ssh/ca_origin
          printf '%s\n' "$HOST_KEY" > ~/.ssh/ca_origin_known_hosts && chmod 600 ~/.ssh/ca_origin_known_hosts
          timeout 5s ssh-keygen -y -f ~/.ssh/ca_origin >/dev/null
          ssh-keygen -l -f ~/.ssh/ca_origin_known_hosts >/dev/null

      - name: Stand down if the origin already serves a newer bundle
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SSH_OPTIONS=(
            -i "$HOME/.ssh/ca_origin"
            -o "UserKnownHostsFile=$HOME/.ssh/ca_origin_known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=25
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )
          EXPECTED_SHA="${{ needs.publish-needed.outputs.target_sha }}"
          node - "$EXPECTED_SHA" "${{ github.repository }}" "${{ github.run_id }}" <<'NODE'
          const fs = require('node:fs');
          const [expectedSha, repository, runId] = process.argv.slice(2);
          let provenance;
          try {
            provenance = JSON.parse(fs.readFileSync('dist/ca-provenance.json', 'utf8'));
          } catch (error) {
            console.error(`::error::Build provenance is absent or malformed: ${error.message}`);
            process.exit(1);
          }
          const expectedRun = `https://github.com/${repository}/actions/runs/${runId}`;
          const valid =
            provenance &&
            !Array.isArray(provenance) &&
            provenance.schema === 1 &&
            (!Object.prototype.hasOwnProperty.call(provenance, 'validationOnly') || provenance.validationOnly === false) &&
            provenance.commit === expectedSha &&
            provenance.builtBy === 'github-actions' &&
            provenance.dirty === false &&
            provenance.historyComplete === true &&
            provenance.behindMain === 0 &&
            provenance.aheadMain === 0 &&
            provenance.ciRun === expectedRun;
          if (!valid) {
            console.error('::error::Build provenance does not prove this exact clean protected-main CI build.');
            process.exit(1);
          }
          NODE
          OURS_SHA=$(node scripts/ci/production-e2e-provenance.mjs build-info < dist/build-info.json)
          [[ "$OURS_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::Built artifact has no valid full ca_sha.'; exit 1; }
          [ "$OURS_SHA" = "$EXPECTED_SHA" ] \
            || { echo '::error::Artifact provenance does not equal the protected-main publish target.'; exit 1; }
          test -f dist/index.html \
            || { echo '::error::The downloaded release carries no dist/index.html; refusing to publish an incomplete bundle.'; exit 1; }
          test -s dist/.release-manifest.sha256 \
            || { echo '::error::The downloaded release carries no non-empty dist/.release-manifest.sha256; refusing to publish unsealed bytes.'; exit 1; }
          if find dist -type l -print -quit | grep -q .; then
            echo '::error::Downloaded release contains a symlink.'
            exit 1
          fi
          (cd dist && sha256sum --strict -c .release-manifest.sha256 >/dev/null)

          THEIRS_JSON=$(timeout 35s ssh "${SSH_OPTIONS[@]}" "$ORIGIN_USER@$ORIGIN_HOST" \
            "cat $ORIGIN_ROOT/current/build-info.json 2>/dev/null" || true)
          if ! THEIRS_SHA=$(printf '%s' "$THEIRS_JSON" \
            | node scripts/ci/production-e2e-provenance.mjs build-info); then
            echo '::error::Origin provenance is not one valid build-info JSON object.'
            exit 1
          fi
          [[ "$THEIRS_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::Origin provenance is unreadable; refusing an unorderable publish.'; exit 1; }
          # The bundle already served may be newer than ours when two publishes
          # raced, and newer wins. Unknown or diverged ancestry fails closed.
          VERDICT=publish
          if [ "$THEIRS_SHA" != "$OURS_SHA" ]; then
            STATUS=$(timeout 30s gh api "repos/${{ github.repository }}/compare/${THEIRS_SHA}...${OURS_SHA}" --jq .status 2>/dev/null || echo "")
            echo "origin serves ${THEIRS_SHA:0:7}; ours ${OURS_SHA:0:7} is: ${STATUS:-unknown}"
            case "$STATUS" in
              ahead) VERDICT=publish ;;
              behind) VERDICT=standdown ;;
              *) echo "::error::Cannot prove the candidate is a forward Club Arena release (status=${STATUS:-unknown})."; exit 1 ;;
            esac
          fi
          {
            echo "verdict=$VERDICT"
            echo "ours=$OURS_SHA"
            echo "theirs=$THEIRS_SHA"
          } >> "$GITHUB_OUTPUT"
          [ "$VERDICT" = "standdown" ] && echo "::notice::origin already serves a newer bundle (${THEIRS_SHA:0:7}); standing down." || true

      - name: Publish through the host-owned immutable transaction
        if: steps.verdict.outputs.verdict == 'publish'
        run: |
          set -euo pipefail
          SHA="${{ steps.verdict.outputs.ours }}"
          EXPECTED_SHA="${{ steps.verdict.outputs.theirs }}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::The publish candidate is not one full lowercase SHA: '$SHA'."; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::The release the origin serves is not one full lowercase SHA: '$EXPECTED_SHA'."; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] \
            || { echo "::error::GITHUB_RUN_ID is not a run number: '$GITHUB_RUN_ID'; it names this run's staging path."; exit 1; }
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] \
            || { echo "::error::GITHUB_RUN_ATTEMPT is not an attempt number: '$GITHUB_RUN_ATTEMPT'; it names this run's staging path."; exit 1; }
          STAGE_NAME="${SHA}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          mkdir -p /tmp/cacm
          SSH_OPTIONS=(
            -i "$HOME/.ssh/ca_origin"
            -o "UserKnownHostsFile=$HOME/.ssh/ca_origin_known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=25
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
            -o ControlMaster=auto
            -o ControlPath=/tmp/cacm/%C
            -o ControlPersist=60
          )
          RSYNC_RSH="ssh -i $HOME/.ssh/ca_origin -o UserKnownHostsFile=$HOME/.ssh/ca_origin_known_hosts -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -o ControlMaster=auto -o ControlPath=/tmp/cacm/%C -o ControlPersist=60"

          # A run owns one fresh incoming directory. A pre-existing directory
          # for the same run/attempt is evidence of an incomplete invocation,
          # not something whose unknown bytes may be reused.
          timeout 45s ssh "${SSH_OPTIONS[@]}" "$ORIGIN_USER@$ORIGIN_HOST" bash -s -- \
            "$ORIGIN_ROOT" "$STAGE_NAME" <<'REMOTE_STAGE'
          set -euo pipefail
          ROOT="$1"
          STAGE_NAME="$2"
          [ "$ROOT" = /srv/club-arena ] \
            || { echo "the origin root this transaction was handed is '$ROOT', not /srv/club-arena; refusing to touch it" >&2; exit 1; }
          [[ "$STAGE_NAME" =~ ^[0-9a-f]{40}\.[0-9]+\.[0-9]+$ ]] \
            || { echo "the staging name '$STAGE_NAME' is not <sha>.<run>.<attempt>; refusing to create it" >&2; exit 1; }
          install -d -m 0755 "$ROOT/incoming" "$ROOT/releases" "$ROOT/pool/assets" "$ROOT/pool/fonts"
          for DIRECTORY in "$ROOT" "$ROOT/incoming" "$ROOT/releases" "$ROOT/pool" "$ROOT/pool/assets" "$ROOT/pool/fonts"; do
            [ -d "$DIRECTORY" ] \
              || { echo "origin layout: $DIRECTORY is not a directory; found: $(ls -ld -- "$DIRECTORY" 2>&1 || true)" >&2; exit 1; }
            [ ! -L "$DIRECTORY" ] \
              || { echo "origin layout: $DIRECTORY is a symlink to $(readlink "$DIRECTORY"); refusing a root that can escape itself" >&2; exit 1; }
          done
          [ ! -e "$ROOT/incoming/$STAGE_NAME" ] && [ ! -L "$ROOT/incoming/$STAGE_NAME" ] \
            || { echo "this run already owns $ROOT/incoming/$STAGE_NAME; its bytes are from an incomplete invocation and are never reused. Found: $(ls -ld -- "$ROOT/incoming/$STAGE_NAME" 2>&1 || true)" >&2; exit 1; }
          install -d -m 0755 "$ROOT/incoming/$STAGE_NAME"
          REMOTE_STAGE

          # --fsync makes each receiver-side file durable before the host can
          # activate the release. The host populates the additive runtime pool
          # from these verified bytes while it holds the same activation lock.
          timeout 240s rsync -az --delete --fsync --link-dest="$ORIGIN_ROOT/current/" \
            -e "$RSYNC_RSH" dist/ \
            "$ORIGIN_USER@$ORIGIN_HOST:$ORIGIN_ROOT/incoming/$STAGE_NAME/"

          timeout 180s ssh "${SSH_OPTIONS[@]}" "$ORIGIN_USER@$ORIGIN_HOST" bash -s -- \
            "$ORIGIN_ROOT" "$SHA" "$EXPECTED_SHA" "$STAGE_NAME" "$KEEP_RELEASES" \
            "${{ github.repository }}" \
            < "$GITHUB_WORKSPACE/.github/scripts/publish-origin-activate.sh"

      - name: Remove this invocation's remote staging path
        if: always() && steps.verdict.outputs.verdict == 'publish'
        run: |
          set -euo pipefail
          SHA="${{ steps.verdict.outputs.ours }}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::The publish candidate is not one full lowercase SHA: '$SHA'."; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] \
            || { echo "::error::GITHUB_RUN_ID is not a run number: '$GITHUB_RUN_ID'; it names this run's staging path."; exit 1; }
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] \
            || { echo "::error::GITHUB_RUN_ATTEMPT is not an attempt number: '$GITHUB_RUN_ATTEMPT'; it names this run's staging path."; exit 1; }
          STAGE_NAME="${SHA}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          timeout 35s ssh \
            -i "$HOME/.ssh/ca_origin" \
            -o "UserKnownHostsFile=$HOME/.ssh/ca_origin_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=25 \
            "$ORIGIN_USER@$ORIGIN_HOST" bash -s -- "$ORIGIN_ROOT" "$STAGE_NAME" <<'REMOTE_CLEANUP'
          set -euo pipefail
          ROOT="$1"
          STAGE_NAME="$2"
          [ "$ROOT" = /srv/club-arena ] \
            || { echo "the origin root this transaction was handed is '$ROOT', not /srv/club-arena; refusing to touch it" >&2; exit 1; }
          [[ "$STAGE_NAME" =~ ^[0-9a-f]{40}\.[0-9]+\.[0-9]+$ ]] \
            || { echo "the staging name '$STAGE_NAME' is not <sha>.<run>.<attempt>; refusing to remove a path named by it" >&2; exit 1; }
          [ -d "$ROOT/incoming" ] && [ ! -L "$ROOT/incoming" ] \
            || { echo "origin layout: $ROOT/incoming is not a plain directory; found: $(ls -ld -- "$ROOT/incoming" 2>&1 || true)" >&2; exit 1; }
          [ -d "$ROOT/pool/fonts" ] && [ ! -L "$ROOT/pool/fonts" ] \
            || { echo "origin layout: $ROOT/pool/fonts is not a plain directory; found: $(ls -ld -- "$ROOT/pool/fonts" 2>&1 || true)" >&2; exit 1; }
          rm -rf -- "$ROOT/incoming/$STAGE_NAME"
          rm -f -- "$ROOT/.current.$STAGE_NAME"
          rm -f -- "$ROOT/incoming/.manifest-check.$STAGE_NAME"
          rm -f -- "$ROOT/incoming/.legacy-release-manifest.$STAGE_NAME"
          rm -f -- "$ROOT/pool/fonts/.fonts.css.$STAGE_NAME"
          sync -f "$ROOT"
          REMOTE_CLEANUP

      - name: Verify the origin serves this bundle
        if: steps.verdict.outputs.verdict == 'publish'
        id: verified
        run: |
          set -euo pipefail
          SHA="${{ steps.verdict.outputs.ours }}"
          LIVE_ORIGIN=''
          LIVE_PUBLIC=''
          for _ in $(seq 1 12); do
            LIVE_ORIGIN=''
            LIVE_PUBLIC=''
            ORIGIN_BODY=''
            PUBLIC_BODY=''
            if ORIGIN_BODY=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' \
              "$ORIGIN_URL/build-info.json?cb=$RANDOM" 2>/dev/null); then
              LIVE_ORIGIN=$(printf '%s' "$ORIGIN_BODY" \
                | node scripts/ci/production-e2e-provenance.mjs unchanged "$SHA" 2>/dev/null || true)
            fi
            if PUBLIC_BODY=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_URL/build-info.json?cb=$RANDOM" 2>/dev/null); then
              LIVE_PUBLIC=$(printf '%s' "$PUBLIC_BODY" \
                | node scripts/ci/production-e2e-provenance.mjs unchanged "$SHA" 2>/dev/null || true)
            fi
            if [ "$LIVE_ORIGIN" = "$SHA" ] && [ "$LIVE_PUBLIC" = "$SHA" ]; then
              echo "origin and player route serve ${SHA:0:7}"
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              echo "### Published" >> "$GITHUB_STEP_SUMMARY"
              echo "\`${SHA:0:7}\` is live through the Club Arena origin and the player route." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::origin serves '$LIVE_ORIGIN' and player route serves '$LIVE_PUBLIC'; wanted $SHA"
          exit 1

      - name: Restore the previously verified release after any publish failure
        if: failure() && steps.verdict.outputs.verdict == 'publish'
        run: |
          set -euo pipefail
          SHA="${{ steps.verdict.outputs.ours }}"
          EXPECTED_SHA="${{ steps.verdict.outputs.theirs }}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::The publish candidate is not one full lowercase SHA: '$SHA'."; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::The release the origin serves is not one full lowercase SHA: '$EXPECTED_SHA'."; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] \
            || { echo "::error::GITHUB_RUN_ID is not a run number: '$GITHUB_RUN_ID'; it names this run's staging path."; exit 1; }
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] \
            || { echo "::error::GITHUB_RUN_ATTEMPT is not an attempt number: '$GITHUB_RUN_ATTEMPT'; it names this run's staging path."; exit 1; }
          if [ "$SHA" = "$EXPECTED_SHA" ]; then
            echo '::notice::The failed publish targeted the already-current release; no distinct pointer exists to restore.'
            exit 0
          fi
          STAGE_NAME="${SHA}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          SSH_OPTIONS=(
            -i "$HOME/.ssh/ca_origin"
            -o "UserKnownHostsFile=$HOME/.ssh/ca_origin_known_hosts"
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=25
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
          )

          ROLLBACK_RESULT=$(timeout 90s ssh "${SSH_OPTIONS[@]}" "$ORIGIN_USER@$ORIGIN_HOST" bash -s -- \
            "$ORIGIN_ROOT" "$SHA" "$EXPECTED_SHA" "$STAGE_NAME" <<'REMOTE_ROLLBACK'
          set -euo pipefail
          ROOT="$1"
          SHA="$2"
          EXPECTED_SHA="$3"
          STAGE_NAME="$4"
          [ "$ROOT" = /srv/club-arena ] \
            || { echo "the origin root this transaction was handed is '$ROOT', not /srv/club-arena; refusing to touch it" >&2; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "the failed candidate handed to the rollback is not one full lowercase SHA: '$SHA'" >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "the release to restore is not one full lowercase SHA: '$EXPECTED_SHA'" >&2; exit 1; }
          [[ "$STAGE_NAME" =~ ^${SHA}\.[0-9]+\.[0-9]+$ ]] \
            || { echo "the staging name '$STAGE_NAME' does not belong to candidate $SHA; refusing to roll back on another invocation's behalf" >&2; exit 1; }
          for REQUIRED_TOOL in flock python3 sha256sum sync; do
            command -v "$REQUIRED_TOOL" >/dev/null \
              || { echo "the origin host has no $REQUIRED_TOOL on PATH; this rollback needs it" >&2; exit 1; }
          done

          CANDIDATE="$ROOT/releases/$SHA"
          PREVIOUS="$ROOT/releases/$EXPECTED_SHA"
          NEXT="$ROOT/.rollback.$STAGE_NAME"
          CHECK="$ROOT/incoming/.rollback-manifest-check.$STAGE_NAME"
          for DIRECTORY in "$ROOT" "$ROOT/incoming" "$ROOT/releases"; do
            [ -d "$DIRECTORY" ] \
              || { echo "origin layout: $DIRECTORY is not a directory; found: $(ls -ld -- "$DIRECTORY" 2>&1 || true)" >&2; exit 1; }
            [ ! -L "$DIRECTORY" ] \
              || { echo "origin layout: $DIRECTORY is a symlink to $(readlink "$DIRECTORY"); refusing a root that can escape itself" >&2; exit 1; }
          done
          [ ! -L "$ROOT/.publish.lock" ] \
            || { echo "the publish lock $ROOT/.publish.lock is a symlink to $(readlink "$ROOT/.publish.lock"); refusing to serialize against a file somebody else chose" >&2; exit 1; }
          for TEMPORARY in "$NEXT" "$CHECK"; do
            [ ! -e "$TEMPORARY" ] && [ ! -L "$TEMPORARY" ] \
              || { echo "this transaction's scratch path $TEMPORARY already exists; found: $(ls -ld -- "$TEMPORARY" 2>&1 || true)" >&2; exit 1; }
          done
          trap 'rm -f -- "$NEXT" "$CHECK"' EXIT
          exec 9>"$ROOT/.publish.lock"
          flock -w 45 9 \
            || { echo "another publish held $ROOT/.publish.lock for the whole 45s activation window; this candidate was not activated and nothing was changed" >&2; exit 1; }

          [ -L "$ROOT/current" ] \
            || { echo "$ROOT/current is not a symlink, so there is no pointer to restore; found: $(ls -ld -- "$ROOT/current" 2>&1 || true)" >&2; exit 1; }
          CURRENT_LINK="$(readlink "$ROOT/current")"
          if [ "$CURRENT_LINK" = "$PREVIOUS" ]; then
            printf '%s\n' already-restored
            exit 0
          fi
          if [ "$CURRENT_LINK" != "$CANDIDATE" ]; then
            echo "current is $CURRENT_LINK, not the failed candidate; refusing to overwrite it" >&2
            exit 75
          fi

          [ -d "$PREVIOUS" ] && [ ! -L "$PREVIOUS" ] \
            || { echo "the release to restore, $PREVIOUS, is not a plain directory; found: $(ls -ld -- "$PREVIOUS" 2>&1 || true)" >&2; exit 1; }
          test -s "$PREVIOUS/.release-manifest.sha256" \
            || { echo "the release to restore, $PREVIOUS, carries no non-empty .release-manifest.sha256, so its bytes cannot be proved before it is served again" >&2; exit 1; }
          if find "$PREVIOUS" -type l -print -quit | grep -q .; then
            echo 'previous release contains a symlink' >&2
            exit 1
          fi
          if find "$PREVIOUS" ! -type d ! -type f -print -quit | grep -q .; then
            echo 'previous release contains a special file' >&2
            exit 1
          fi
          (cd "$PREVIOUS" && sha256sum --strict -c .release-manifest.sha256 >/dev/null)
          (
            cd "$PREVIOUS"
            find . -type f ! -path './.release-manifest.sha256' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > "$CHECK"
          )
          cmp -s "$CHECK" "$PREVIOUS/.release-manifest.sha256" \
            || { echo "the files under $PREVIOUS are not the files its .release-manifest.sha256 records; refusing to restore a release that cannot be proved" >&2; exit 1; }
          rm -f -- "$CHECK"
          python3 - "$PREVIOUS/build-info.json" "$EXPECTED_SHA" <<'PYTHON_ROLLBACK_BUILD_INFO'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding='utf-8') as handle:
                  build_info = json.load(handle)
          except (OSError, UnicodeError, json.JSONDecodeError) as error:
              raise SystemExit(f'previous build-info is absent or malformed: {error}')
          if type(build_info) is not dict or build_info.get('ca_sha') != sys.argv[2]:
              raise SystemExit('previous build-info does not prove the exact rollback SHA')
          PYTHON_ROLLBACK_BUILD_INFO

          sync -f "$ROOT"
          [ "$(readlink "$ROOT/current")" = "$CANDIDATE" ] \
            || { echo "$ROOT/current moved to $(readlink "$ROOT/current") while the previous release was being proved; refusing to overwrite a pointer this rollback no longer owns" >&2; exit 1; }
          ln -s "$PREVIOUS" "$NEXT"
          mv -Tf "$NEXT" "$ROOT/current"
          sync -f "$ROOT"
          [ "$(readlink "$ROOT/current")" = "$PREVIOUS" ] \
            || { echo "the rollback swap left $ROOT/current pointing at $(readlink "$ROOT/current"), not $PREVIOUS" >&2; exit 1; }
          printf '%s\n' restored
          REMOTE_ROLLBACK
          )
          case "$ROLLBACK_RESULT" in
            restored|already-restored) ;;
            *) echo "::error::Unexpected rollback result: $ROLLBACK_RESULT"; exit 1 ;;
          esac

          LIVE_ORIGIN=''
          LIVE_PUBLIC=''
          for _ in $(seq 1 12); do
            LIVE_ORIGIN=''
            LIVE_PUBLIC=''
            ORIGIN_BODY=''
            PUBLIC_BODY=''
            if ORIGIN_BODY=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' \
              "$ORIGIN_URL/build-info.json?rollback=$RANDOM" 2>/dev/null); then
              LIVE_ORIGIN=$(printf '%s' "$ORIGIN_BODY" \
                | node scripts/ci/production-e2e-provenance.mjs unchanged "$EXPECTED_SHA" 2>/dev/null || true)
            fi
            if PUBLIC_BODY=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' \
              "$PUBLIC_URL/build-info.json?rollback=$RANDOM" 2>/dev/null); then
              LIVE_PUBLIC=$(printf '%s' "$PUBLIC_BODY" \
                | node scripts/ci/production-e2e-provenance.mjs unchanged "$EXPECTED_SHA" 2>/dev/null || true)
            fi
            if [ "$LIVE_ORIGIN" = "$EXPECTED_SHA" ] && [ "$LIVE_PUBLIC" = "$EXPECTED_SHA" ]; then
              echo "::notice::Restored and verified ${EXPECTED_SHA:0:7} after candidate ${SHA:0:7} failed publication proof."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Rollback pointer changed, but origin serves '$LIVE_ORIGIN' and player route serves '$LIVE_PUBLIC'; wanted $EXPECTED_SHA"
          exit 1

      - name: Remove origin credentials and control sockets
        if: always()
        run: |
          set -euo pipefail
          rm -f -- "$HOME/.ssh/ca_origin" "$HOME/.ssh/ca_origin_known_hosts"
          rm -rf -- /tmp/cacm
