# ─────────────────────────────────────────────────────────────────────────────
# PUBLISH CLUB ARENA — the Club Arena-owned Hetzner publisher, isolated on
# fresh hosted runners so prior pull-request code cannot reach release secrets.
#
# WHY THIS FILE EXISTS (2026-09-02). build-for-world-hub.yml stopped being
# scheduled by GitHub at 16:33 UTC. Six runs sat at `queued` with ZERO jobs
# created and `updated_at == created_at`, for up to fifty minutes, while every
# other workflow in this repo - CI, Silent Revert Guard, detect-rewind - picked
# up runners normally in the same minutes. It was not runner capacity and it
# was not the concurrency group: #2664 moved the group to `-g2-` and a fresh
# dispatch against the new group still produced zero jobs. Merging #2654 did
# not even CREATE a run. Neither cancel, force-cancel nor delete would clear
# the stuck runs - GitHub answers 409 "Cannot cancel a workflow run that has
# not been queued yet" and 403 on delete. The wedge is on the workflow ENTRY,
# and the only thing that escapes an entry is a different path.
#
# Production sat on one bundle for 80 minutes because of it.
#
# The exact-main target, the four-way sharded gate, and the refusal to publish
# a bundle older than the one deployed are owned here.
#
# THAT FILE IS GONE NOW (2026-09-02, later the same day). For about ninety
# minutes both files existed and BOTH fired on every push to main, on separate
# concurrency groups, so nothing serialised them: two full builds of the same
# commit, two competing publishes, and the old one still on billed hosted
# runners. Verified identical before deleting - 320 non-comment lines each,
# zero difference once name, path, group and runs-on were normalised.
#
# THIS IS NOW THE ONLY PUBLISHER. There is no second path to production. It is
# event-driven and fail-closed: a failed release is fixed at source and
# re-proposed, never hidden by a timer, retry watcher, or alternate publisher.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish Club Arena

on:
  push:
    branches: [main]
  # Recovery uses repository_dispatch so GitHub always executes the
  # reviewed workflow definition from the default branch. workflow_dispatch
  # can execute branch-authored YAML with production origin credentials.
  repository_dispatch:
    types: [publish-club-arena]

# Preparation is read-only and may run alongside another release. One caller
# job below holds the original global production lock across the ENTIRE
# transaction, including nested job queues, verification, rollback and OTA.
# Its unchanged key also serializes older workflow-level callers during adoption.

jobs:
  publish-needed:
    runs-on: ${{ github.repository_owner == 'Smarter-Software-PIQ' && github.repository_id == '1132369872' && 'ca-linux-4core' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      component: ${{ steps.target.outputs.component }}
      tests_proven: ${{ steps.proven.outputs.tests_proven }}
      selection_base: ${{ steps.selection-base.outputs.base_sha }}
      publish: ${{ steps.runtime.outputs.publish }}
    steps:
      # ═══════════════════════════════════════════════════════════════════════
      # NO COMMIT LEFT BEHIND — publish the TIP OF MAIN, not the commit that
      # happened to trigger this run. Added 2026-09-02.
      #
      # `actions/checkout` with no `ref` checks out `github.sha`, so every run
      # used to be "publish commit X" rather than "make production equal main".
      # That is what let commits go missing. When a wave of pushes arrives,
      # `cancel-in-progress: false` cancels the older PENDING runs — correctly,
      # they are superseded — and the survivor published only ITS OWN sha. So
      # the backlog was only ever drained if that one specific run succeeded.
      # If it failed, was cancelled at the wrong moment, hit a runner outage or
      # an expired token, that individual run could not be treated as release
      # proof. The source push remains durable and a source fix is re-proposed.
      #
      # Resolving the tip here makes every run a CONVERGENCE step instead of a
      # per-commit delivery. Any single successful run now drains the entire
      # backlog, however many runs were cancelled behind it, because it builds
      # whatever main is at the moment it starts. Cancellation becomes
      # structurally harmless rather than merely usually-harmless.
      #
      # If main moves again while this run builds, its own push event queues the
      # next exact release. The compare-API guard refuses to let a slow run
      # overwrite a newer deployed bundle.
      #
      # FAILS CLOSED: pushes publish the current Club Arena main.
      # Repository events publish their explicit full ref_sha only after proving
      # it IS current main. An ancestor is durable history, but it is not current
      # release authority and must never be used to roll the origin backward.
      # They never inherit a selectable workflow ref.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Resolve the tip of main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.event.client_payload.ref_sha || '' }}
          REQUESTED_COMPONENT: ${{ github.event.client_payload.component || 'client' }}
        run: |
          set -euo pipefail
          TIP=$(timeout 30s gh api "repos/${{ github.repository }}/commits/main" --jq .sha 2>/dev/null || echo "")
          [[ "$TIP" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::Could not resolve one full current-main SHA; refusing to publish.'; exit 1; }

          TARGET="$TIP"
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || { echo '::error::publish-club-arena requires one lowercase full client_payload.ref_sha.'; exit 1; }
            [ "$REQUESTED_SHA" = "$TIP" ] \
              || { echo "::error::Requested SHA is not current Club Arena main ($TIP)."; exit 1; }
            TARGET="$REQUESTED_SHA"
          fi

          COMPONENT=client
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then COMPONENT="$REQUESTED_COMPONENT"; fi
          case "$COMPONENT" in client|private-record-gateway|private-record-bootstrap|private-record-credentials|private-record-inspect) ;; *) echo '::error::Unknown publication component'; exit 1;; esac
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Publishing target: ${TARGET:0:7}; current main: ${TIP:0:7}; trigger: ${GITHUB_SHA:0:7}"

      - name: Checkout the exact protected runtime admission source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind UI selection to the complete published backlog
        id: selection-base
        if: steps.target.outputs.component == 'client'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/publisher-ui-selection-base.mjs "${{ steps.target.outputs.sha }}"

      - name: Prove unchanged client runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.target.outputs.component }}" != client ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/client-runtime-retention.mjs admit "${{ steps.target.outputs.sha }}"
          fi
      - name: Preserve immutable runtime admission evidence
        if: steps.target.outputs.component == 'client' && steps.runtime.outputs.publish == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: club-arena-runtime-admission
          path: runtime-admission.json
          if-no-files-found: error
          retention-days: 7

      # ═════════════════════════════════════════════════════════════════════════
      # CLIENT TESTS GATE THE BUNDLE, BUT NO LONGER DELAY IT — split out 2026-08-26.
      #
      # This suite used to run as step 5 of build-and-store, IN FRONT of the build.
      # Measured on run 32993261791, the critical path was:
      #
      #     Client tests          5m19s
      #     Build Club Arena      1m59s
      #     Checkout World Hub    3m36s
      #     everything else       ~1m
      #     ------------------------------
      #     publish              ~12m
      #
      # Pushes land on main every two to three minutes. A twelve minute pipeline
      # under a two to three minute arrival rate can only ever publish a sha that
      # is already twelve minutes stale, and every push in between is cancelled
      # while PENDING by `cancel-in-progress: false` — which is that setting
      # working correctly, not failing. Production was fourteen commits behind
      # while every one of those cancels looked like a broken deploy.
      #
      # The tests are 13s on a developer machine and 5m19s here because a GitHub
      # runner has two cores and the suite is ~285s of aggregate work across 429
      # files. Nothing is misconfigured; it is simply serialised.
      #
      # So it runs BESIDE the build instead of in front of it. The gate is exactly
      # as strong: publish-to-origin needs BOTH jobs, so a red test still stops the
      # bundle from shipping. It just stops adding its five minutes to the build's
      # two.
      # ═════════════════════════════════════════════════════════════════════════
      # SHARDED 2026-09-02 to unblock publishing. This suite is the authoritative
      # gate on the bundle (a red test still stops the sync via `needs` below), and
      # it ran ~11 minutes on one 2-core runner. publish-to-origin waits for it, so
      # every publish took ~18 minutes end to end - slower than the merge rate, so
      # production perpetually lagged and intermediate publish runs were cancelled
      # ("last 3 pushes haven't published"). Nothing was ever lost: main is durable
      # and the publisher converges to the latest. But the LAG is the bug.
      #
      # Four shards run in parallel, so wall clock drops to ~3 minutes and the whole
      # publish pipeline to ~7. The gate is exactly as strong: publish-to-origin
      # `needs: [build-and-store, client-tests]`, and `needs` on a matrix waits for
      # EVERY shard, so one red shard still stops the bundle. fail-fast cancels the
      # siblings the moment one fails, which is what a gate wants. Fresh hosted
      # images keep the test and release trust domains isolated.
      # ── HAS THIS EXACT TREE ALREADY PASSED THE CLIENT SUITE? ──────────────
      #
      # The publisher re-runs the whole client suite in four shards on every
      # merge. On a squash merge the resulting commit usually has the SAME TREE
      # as the pull request head that CI just proved green - identical bytes,
      # tested twice, ~2 minutes of shards plus their queue wait on the critical
      # path between a merge and a player seeing the change.
      #
      # "Usually" is not "always", which is why this compares TREE HASHES rather
      # than trusting the merge. If main moved between the PR's last CI run and
      # the squash, the trees differ and the shards run exactly as before. This
      # can only skip when the content is bit-identical to something that
      # already passed.
      #
      # Fails closed: any doubt - no PR found, no green check, an API error -
      # and tests_proven stays false and the shards run.
      - name: Has this exact tree already passed the client suite?
        id: proven
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          echo "tests_proven=false" >> "$GITHUB_OUTPUT"

          TREE=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$SHA" --jq .commit.tree.sha 2>/dev/null || echo "")
          [ -z "$TREE" ] && { echo "::notice::could not read the target tree - running the shards."; exit 0; }

          PR=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$SHA/pulls" --jq '.[0].number' 2>/dev/null || echo "")
          [ -z "$PR" ] || [ "$PR" = "null" ] && { echo "::notice::no source pull request for ${SHA:0:7} - running the shards."; exit 0; }

          HEAD=$(timeout 30s gh api "repos/${{ github.repository }}/pulls/$PR" --jq .head.sha 2>/dev/null || echo "")
          [ -z "$HEAD" ] && { echo "::notice::could not read PR #$PR head - running the shards."; exit 0; }

          HEAD_TREE=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$HEAD" --jq .commit.tree.sha 2>/dev/null || echo "")
          if [ "$TREE" != "$HEAD_TREE" ]; then
            echo "::notice::tree ${TREE:0:7} differs from PR #$PR head tree ${HEAD_TREE:0:7} - main moved, running the shards."
            exit 0
          fi

          OK=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$HEAD/check-runs?per_page=100" \
                 --jq '[.check_runs[] | select(.name=="Client Unit Tests (vitest)" and .conclusion=="success")] | length' 2>/dev/null || echo 0)
          if [ "${OK:-0}" -ge 1 ]; then
            echo "tests_proven=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tree $TREE already passed Client Unit Tests on PR #$PR head ${HEAD:0:7} - skipping the shards."
          else
            echo "::notice::no green Client Unit Tests on PR #$PR head - running the shards."
          fi

  client-tests:
    needs: publish-needed
    # Runs unless this exact TREE already passed the same suite on the pull
    # request head. See "Has this exact tree already passed" above - it compares
    # tree hashes, not merge lineage, and fails closed.
    if: needs.publish-needed.outputs.component == 'client' && needs.publish-needed.outputs.tests_proven != 'true'
    runs-on: ${{ github.repository_owner == 'Smarter-Software-PIQ' && github.repository_id == '1132369872' && 'ca-linux-8core' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    env:
      HUSKY: '0'
      VITEST_MAX_THREADS: ${{ github.repository_owner == 'Smarter-Software-PIQ' && github.repository_id == '1132369872' && '4' || '2' }}
    steps:
      - name: Checkout Club Arena at the publish target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-needed.outputs.target_sha }}
          # Compare every unpublished commit, including financial predecessors.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Cache the installed tree so npm ci is skipped on a hit - ~2 min off
      # each shard. Keyed on the lockfile, so any dependency change installs
      # fresh; identical behaviour, minus the wait.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-bfwh-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Client tests must pass before the bundle ships (shard ${{ matrix.shard }}/4)
        env:
          CI_BASE_SHA: ${{ needs.publish-needed.outputs.selection_base }}
          CI_HEAD_SHA: ${{ needs.publish-needed.outputs.target_sha }}
        run: node scripts/ci/ui-test-selection.mjs unit --shard=${{ matrix.shard }}/4

  build-and-store:
    needs: publish-needed
    if: needs.publish-needed.outputs.publish != 'false'
    runs-on: ${{ github.repository_owner == 'Smarter-Software-PIQ' && github.repository_id == '1132369872' && 'ca-linux-8core' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      # read is enough now: this job uploads an artifact instead of pushing a
      # branch, so it no longer writes to the repository at all.
      contents: read
    env:
      HUSKY: '0'

    steps:
      # The publish target, not the trigger sha — see "NO COMMIT LEFT BEHIND"
      # in publish-needed. The bundle this job builds IS what production gets,
      # so this checkout is the one that decides whether a queued commit ships.
      - name: Checkout Club Arena at the publish target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-needed.outputs.target_sha }}
          # Strict provenance requires complete ancestry for this exact target.
          fetch-depth: 0
          # blob:none keeps every one of the 7,223 commits and drops the blobs of old
          # revisions. Measured 2026-09-13, three runs each: 33-35s / 531MB against
          # 36-43s / 766MB, for identical ancestry. Nothing in this repo's workflows
          # reads a historical file version - they ask merge-base, rev-list, log and
          # cat-file -e, which are all commit-graph work - so those blobs were paid
          # for on every run and never read.
          filter: blob:none

      # STAGE MARKERS REMOVED (2026-08-21).
      #
      # Three steps here used to `git push HEAD:refs/heads/ci-marker/<sha>-*`
      # after checkout, deps and build, so that "which markers exist" told you
      # which stage died. They were added 2026-08-06 with the explicit
      # justification "without needing the Actions API" — at the time that API
      # was not readable from here.
      #
      # It is readable now. `gh run view <id> --json` and
      # `gh api repos/.../actions/runs/<id>/jobs` return every step with its
      # own conclusion, which is strictly more information than the markers
      # ever carried: today that is how the failing step was identified as
      # "Client tests must pass before the bundle ships", something the
      # markers could only have narrowed to "somewhere after deps".
      #
      # The cost was not free. Three refs per push, never cleaned up, had
      # accumulated 716 ci-marker branches out of 1025 total on this repo —
      # every one of them a permanent ref that `actions/checkout` and every
      # `git ls-remote` pays for. Deleted here so it stops growing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── THE PUBLISHER WAS BUILDING COLD, EVERY TIME ──────────────────────
      #
      # CI's `Production Build` job caches both `node_modules` and
      # `node_modules/.vite`. This job cached neither, so every publish paid a
      # full `npm ci` and a full cold Vite build - measured at 3.4 minutes of
      # run time on top of its queue wait, on the critical path between a merge
      # and a player seeing the change.
      #
      # Same keys as CI on purpose: both are keyed on the lockfile, so a
      # dependency change invalidates both together and neither can serve a
      # stale tree. A cache MISS simply builds exactly as before - there is no
      # new failure mode here, only a faster hit.
      # NOTE THE NODE VERSION IN THE KEY. This job runs Node 22; CI's
      # `Production Build` runs Node 20 and keys its cache `node20`. Sharing one
      # key across two major versions would restore a `node_modules` whose
      # native modules were compiled for the other runtime - a real breakage,
      # and a silent one. Separate keys; each warms after its first run.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-publish-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Cache Vite Build
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-publish-${{ runner.os }}-node22-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # 2026-09-04: content-addressed cache for scripts/optimize-dist-media.mjs,
      # which was 85.7s of this job's 120s build. Same key shape as ci.yml, but
      # a different cache namespace: this job runs Node 22 and CI runs Node 20,
      # and sharp's version is part of every entry key anyway, so nothing is
      # shared across the two by accident.
      - name: Cache optimized dist media
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/dist-media
          key: >-
            dist-media-publish-v1-${{ runner.os }}-${{ hashFiles('public/**/*.png',
            'public/**/*.jpg', 'public/**/*.jpeg', 'public/**/*.webp',
            'src/assets/**', 'scripts/optimize-dist-media.mjs') }}
          restore-keys: dist-media-publish-v1-${{ runner.os }}-

      # This job runs the FULL `npm run build`, `tsc -b` included, while
      # ci.yml's two build jobs run `build:ci` without it. That asymmetry is
      # deliberate: the tree that actually reaches players is typechecked
      # before it ships, and the throwaway PR-head builds are not, because the
      # required `TypeScript Check` job has already checked that same tree.
      #
      - name: Build Club Arena
        env:
          CA_BUILD_PURPOSE: production-publish
          CA_PUBLISH_TARGET_SHA: ${{ needs.publish-needed.outputs.target_sha }}
          NODE_ENV: production
          VITE_ANTIGRAVITY_ENABLED: 'true'
          VITE_SUPABASE_URL: 'https://kuklfnapbkmacvwxktbh.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          VITE_ENGINE_URL: 'https://engine.smarter.poker'
          # Remains off until a protected source change follows hosted qualification.
          VITE_PRIVATE_RECORD_FALLBACK_URL: ''
          VITE_APP_ENV: production
          VITE_APP_VERSION: ${{ needs.publish-needed.outputs.target_sha }}
          VITE_ONESIGNAL_APP_ID: '2fde0e83-cd01-4f93-a9a0-9be6cfe36e8c'
        run: npm run build

      - name: Record the actual client module and build input closure
        run: node scripts/ci/client-runtime-inputs.mjs

      # Keep source private even if an older tool emits a map.
      - name: Source maps never ship to players
        run: |
          BEFORE=$(find dist -name '*.map' | wc -l | tr -d ' ')
          find dist -name '*.map' -delete
          AFTER=$(find dist -name '*.map' | wc -l | tr -d ' ')
          echo "source maps stripped from dist: $BEFORE removed, $AFTER remaining"
          if [ "$AFTER" != "0" ]; then
            echo "::error::source maps survived the strip - refusing to publish them"
            exit 1
          fi

      # Build provenance: record the commit this dist was actually built from,
      # inside the bundle. Three syncs on 2026-08-19 published a bundle built
      # from a stale tree while naming the current sha in the commit message;
      # nothing in the artefact contradicted them. With this file,
      #   curl -s https://smarter.poker/hub/club-arena/build-info.json
      # answers "what is actually live" without grepping minified chunks.
      - name: Stamp build provenance
        run: |
          cat > dist/build-info.json <<JSON
          {
            "ca_sha": "${{ needs.publish-needed.outputs.target_sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "built_by": "publish-club-arena.yml",
            "run_id": "${{ github.run_id }}"
          }
          JSON
          cat dist/build-info.json

      # The artifact courier authenticates the upload/download envelope, while
      # this manifest authenticates every byte after rsync and makes an existing
      # releases/<sha> directory immutable: a retry may reuse it only when the
      # complete manifest and every recorded file still agree.
      - name: Seal the immutable release bytes
        run: |
          set -euo pipefail
          if find dist -type l -print -quit | grep -q .; then
            echo '::error::dist contains a symlink; refusing a release that can escape its root.'
            exit 1
          fi
          (
            cd dist
            find . -type f ! -path './.release-manifest.sha256' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > .release-manifest.sha256
            test -s .release-manifest.sha256 \
              || { echo '::error::dist/.release-manifest.sha256 is empty; the seal recorded no files.'; exit 1; }
            sha256sum --strict -c .release-manifest.sha256
          )

      # THE COURIER IS AN ARTIFACT, NOT A BRANCH (2026-08-23).
      #
      # This step used to force-push dist/ to an orphan branch
      # `build/world-hub-sync-<sha>` so the sync job could check it out. From
      # 05:17 UTC every publish failed there, four runs in a row and then the
      # manual dispatch too, always the same way:
      #
      #   remote: fatal error in commit_refs
      #   ! [remote rejected] build/world-hub-sync-<sha> (failure)
      #
      # Isolated by experiment rather than guessed at: a small push to this
      # repo succeeds, and pushing the SAME 84MB dist as an orphan branch from
      # a workstation over SSH also succeeds - so it is neither the ref
      # backend, nor the size, nor the content. Only the runner's HTTPS push
      # of an 84MB pack fails, and it fails every time. Production sat 40
      # minutes behind main with a dozen merged pull requests stuck behind it.
      #
      # Passing build output between jobs is what upload-artifact is FOR. It
      # removes the failing push entirely, and with it three long-standing
      # costs of the branch approach: an 84MB pack pushed to the repository on
      # every single commit to main, a ref per publish that only gets cleaned
      # up when the run succeeds (nine were still lying around), and the
      # GITHUB_TOKEN write permission this job needed purely to create them.
      - name: Upload dist for the sync job
        uses: actions/upload-artifact@v4
        with:
          name: club-arena-dist-${{ needs.publish-needed.outputs.target_sha }}
          path: dist
          # upload-artifact excludes dotfiles unless this is explicit. The
          # release seal is intentionally named .release-manifest.sha256, so
          # omitting hidden files would make every origin publish fail before
          # transfer and would separate the bytes from their integrity proof.
          include-hidden-files: true
          # A courier, not a record: the immutable Hetzner release directory
          # and its build stamp are the permanent copy. One day is enough for
          # a retry.
          retention-days: 1
          if-no-files-found: error
          compression-level: 6

      # Prove the thing the next job depends on actually exists, rather than
      # discovering it is missing halfway through publication. Kept from the
      # branch version, which checked the same file for the same reason.
      # WHAT THE ORIGIN REQUIRES IS CHECKED HERE, NOT ONLY index.html
      # (2026-09-22). This step only ever looked at dist/index.html, so a
      # bundle that the host transaction can never accept still went green
      # here, uploaded, and was refused 4 minutes later on the origin. On
      # 2026-09-22 `self-host-fonts` could not reach Google Fonts, exited 0,
      # and produced a dist with no fonts/ at all; runs 35763554815 and
      # 35764705782 then failed inside the host transaction on
      # `test -d "$FINAL/fonts"` with an empty log. The origin serves
      # /fonts/* out of the append-only pool, whose fonts.css is a symlink
      # into current/fonts/fonts.css, so a release without fonts/ would
      # dangle that pointer for every already-cached shell. The origin is
      # right to refuse it; this job is where that refusal is cheap and
      # legible.
      - name: Verify dist is complete
        run: |
          set -uo pipefail
          MISSING=0
          require_directory() {
            [ -d "$1" ] && [ ! -L "$1" ] && return 0
            echo "::error::$1 is not a directory in the built bundle; found: $(ls -ld -- "$1" 2>&1 || true)"
            MISSING=1
          }
          require_file() {
            [ -f "$1" ] && [ ! -L "$1" ] && return 0
            echo "::error::$1 is not a regular file in the built bundle; found: $(ls -ld -- "$1" 2>&1 || true)"
            MISSING=1
          }
          require_file dist/index.html
          require_file dist/build-info.json
          require_file dist/ca-provenance.json
          require_directory dist/assets
          require_directory dist/fonts
          require_file dist/fonts/fonts.css
          if [ "$MISSING" != "0" ]; then
            echo "::error::The built bundle is missing what the origin transaction requires, so publication would be refused on the host. dist contains: $(ls -A1 dist 2>&1 | tr '\n' ' ')"
            exit 1
          fi
          echo "dist carries index.html, assets/, fonts/fonts.css and its provenance ($(du -sh dist | cut -f1) total)"

      - name: Build summary
        run: |
          echo "### Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "dist uploaded as artifact \`club-arena-dist-${{ needs.publish-needed.outputs.target_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Proceeding to publish to the origin..." >> $GITHUB_STEP_SUMMARY

  build-record-gateway:
    needs: publish-needed
    if: needs.publish-needed.outputs.component == 'private-record-gateway'
    runs-on: ${{ github.repository_owner == 'Smarter-Software-PIQ' && github.repository_id == '1132369872' && 'ca-linux-8core' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the admitted gateway source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-needed.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile and qualify the gateway
        working-directory: server
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/tsc -p tsconfig.private-record-gateway.json
          node_modules/.bin/vitest run src/transport/PrivateRecordGateway.test.ts src/transport/privateRecordGatewaySocket.test.ts src/transport/privateRecordGatewayRuntime.test.ts src/services/supabase/privateRecordListener.test.ts src/transport/PrivateRecordSubscriptions.test.ts src/transport/AuthorizedPrivateSend.test.ts --maxWorkers=2 --minWorkers=1
      - name: Seal the independent runtime
        run: bash scripts/ci/build-private-record-gateway.sh "$RUNNER_TEMP/gateway-artifact" "${{ needs.publish-needed.outputs.target_sha }}"
      - name: Package immutable gateway subject
        run: |
          mkdir "$RUNNER_TEMP/gateway-transfer"
          tar -czf "$RUNNER_TEMP/gateway-transfer/runtime.tar.gz" -C "$RUNNER_TEMP/gateway-artifact" .
      - name: Attest the protected gateway build
        id: gateway-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/gateway-transfer/runtime.tar.gz
      - name: Retain verification bundle beside its exact subject
        env:
          BUNDLE: ${{ steps.gateway-attestation.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/gateway-transfer/attestation.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: private-record-gateway-${{ needs.publish-needed.outputs.target_sha }}
          path: ${{ runner.temp }}/gateway-transfer
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  production:
    name: production
    needs: [publish-needed, client-tests, build-and-store, build-record-gateway]
    if: >-
      always() &&
      needs.publish-needed.result == 'success' &&
      ((needs.publish-needed.outputs.component == 'client' &&
        (needs.client-tests.result == 'success' ||
         (needs.client-tests.result == 'skipped' && needs.publish-needed.outputs.tests_proven == 'true')) &&
        (needs.publish-needed.outputs.publish == 'false' || needs.build-and-store.result == 'success')) ||
       (needs.publish-needed.outputs.component == 'private-record-gateway' && needs.build-record-gateway.result == 'success') ||
       needs.publish-needed.outputs.component == 'private-record-bootstrap' ||
       needs.publish-needed.outputs.component == 'private-record-credentials' ||
       needs.publish-needed.outputs.component == 'private-record-inspect')
    concurrency:
      group: publish-club-arena-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-club-arena-transaction.yml
    with:
      target_sha: ${{ needs.publish-needed.outputs.target_sha }}
      component: ${{ needs.publish-needed.outputs.component }}
      publish: ${{ needs.publish-needed.outputs.publish }}
      tests_proven: ${{ needs.publish-needed.outputs.tests_proven }}
      client_result: ${{ needs.client-tests.result }}
      build_result: ${{ needs.build-and-store.result }}
      gateway_build_result: ${{ needs.build-record-gateway.result }}
    secrets: inherit
