# ─────────────────────────────────────────────────────────────────────────────
# PUBLISH CLUB ARENA — the Club Arena-owned Hetzner publisher, isolated on
# fresh hosted runners so prior pull-request code cannot reach release secrets.
#
# WHY THIS FILE EXISTS (2026-09-02). build-for-world-hub.yml stopped being
# scheduled by GitHub at 16:33 UTC. Six runs sat at `queued` with ZERO jobs
# created and `updated_at == created_at`, for up to fifty minutes, while every
# other workflow in this repo - CI, Silent Revert Guard, detect-rewind - picked
# up runners normally in the same minutes. It was not runner capacity and it
# was not the concurrency group: #2664 moved the group to `-g2-` and a fresh
# dispatch against the new group still produced zero jobs. Merging #2654 did
# not even CREATE a run. Neither cancel, force-cancel nor delete would clear
# the stuck runs - GitHub answers 409 "Cannot cancel a workflow run that has
# not been queued yet" and 403 on delete. The wedge is on the workflow ENTRY,
# and the only thing that escapes an entry is a different path.
#
# Production sat on one bundle for 80 minutes because of it.
#
# The exact-main target, the four-way sharded gate, and the refusal to publish
# a bundle older than the one deployed are owned here.
#
# THAT FILE IS GONE NOW (2026-09-02, later the same day). For about ninety
# minutes both files existed and BOTH fired on every push to main, on separate
# concurrency groups, so nothing serialised them: two full builds of the same
# commit, two competing publishes, and the old one still on billed hosted
# runners. Verified identical before deleting - 320 non-comment lines each,
# zero difference once name, path, group and runs-on were normalised.
#
# THIS IS NOW THE ONLY PUBLISHER. There is no second path to production. It is
# event-driven and fail-closed: a failed release is fixed at source and
# re-proposed, never hidden by a timer, retry watcher, or alternate publisher.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish Club Arena

on:
  push:
    branches: [main]
  # Recovery uses repository_dispatch so GitHub always executes the
  # reviewed workflow definition from the default branch. workflow_dispatch
  # can execute branch-authored YAML with production origin credentials.
  repository_dispatch:
    types: [publish-club-arena]

# Preparation is read-only and may run alongside another release. One caller
# job below holds the original global production lock across the ENTIRE
# transaction, including nested job queues, verification, rollback and OTA.
# Its unchanged key also serializes older workflow-level callers during adoption.

jobs:
  publish-needed:
    runs-on: ${{ github.repository_owner == 'Smarter-Software-PIQ' && github.repository_id == '1132369872' && 'ca-linux-4core' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      component: ${{ steps.target.outputs.component }}
      tests_proven: ${{ steps.proven.outputs.tests_proven }}
      selection_base: ${{ steps.selection-base.outputs.base_sha }}
      publish: ${{ steps.runtime.outputs.publish }}
    steps:
      # ═══════════════════════════════════════════════════════════════════════
      # NO COMMIT LEFT BEHIND — publish the TIP OF MAIN, not the commit that
      # happened to trigger this run. Added 2026-09-02.
      #
      # `actions/checkout` with no `ref` checks out `github.sha`, so every run
      # used to be "publish commit X" rather than "make production equal main".
      # That is what let commits go missing. When a wave of pushes arrives,
      # `cancel-in-progress: false` cancels the older PENDING runs — correctly,
      # they are superseded — and the survivor published only ITS OWN sha. So
      # the backlog was only ever drained if that one specific run succeeded.
      # If it failed, was cancelled at the wrong moment, hit a runner outage or
      # an expired token, that individual run could not be treated as release
      # proof. The source push remains durable and a source fix is re-proposed.
      #
      # Resolving the tip here makes every run a CONVERGENCE step instead of a
      # per-commit delivery. Any single successful run now drains the entire
      # backlog, however many runs were cancelled behind it, because it builds
      # whatever main is at the moment it starts. Cancellation becomes
      # structurally harmless rather than merely usually-harmless.
      #
      # If main moves again while this run builds, its own push event queues the
      # next exact release. The compare-API guard refuses to let a slow run
      # overwrite a newer deployed bundle.
      #
      # FAILS CLOSED: pushes publish the current Club Arena main.
      # Repository events publish their explicit full ref_sha only after proving
      # it IS current main. An ancestor is durable history, but it is not current
      # release authority and must never be used to roll the origin backward.
      # They never inherit a selectable workflow ref.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Resolve the tip of main
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.event.client_payload.ref_sha || '' }}
          REQUESTED_COMPONENT: ${{ github.event.client_payload.component || 'client' }}
        run: |
          set -euo pipefail
          TIP=$(timeout 30s gh api "repos/${{ github.repository }}/commits/main" --jq .sha 2>/dev/null || echo "")
          [[ "$TIP" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::Could not resolve one full current-main SHA; refusing to publish.'; exit 1; }

          TARGET="$TIP"
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || { echo '::error::publish-club-arena requires one lowercase full client_payload.ref_sha.'; exit 1; }
            [ "$REQUESTED_SHA" = "$TIP" ] \
              || { echo "::error::Requested SHA is not current Club Arena main ($TIP)."; exit 1; }
            TARGET="$REQUESTED_SHA"
          fi

          COMPONENT=client
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then COMPONENT="$REQUESTED_COMPONENT"; fi
          case "$COMPONENT" in client|private-record-gateway|private-record-bootstrap|private-record-credentials|private-record-inspect) ;; *) echo '::error::Unknown publication component'; exit 1;; esac
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Publishing target: ${TARGET:0:7}; current main: ${TIP:0:7}; trigger: ${GITHUB_SHA:0:7}"

      - name: Checkout the exact protected runtime admission source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind UI selection to the complete published backlog
        id: selection-base
        if: steps.target.outputs.component == 'client'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/publisher-ui-selection-base.mjs "${{ steps.target.outputs.sha }}"

      - name: Prove unchanged client runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.target.outputs.component }}" != client ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/client-runtime-retention.mjs admit "${{ steps.target.outputs.sha }}"
          fi
      - name: Preserve immutable runtime admission evidence
        if: steps.target.outputs.component == 'client' && steps.runtime.outputs.publish == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: club-arena-runtime-admission
          path: runtime-admission.json
          if-no-files-found: error
          retention-days: 7

      # ═════════════════════════════════════════════════════════════════════════
      # CLIENT TESTS GATE THE BUNDLE, BUT NO LONGER DELAY IT — split out 2026-08-26.
      #
      # This suite used to run as step 5 of build-and-store, IN FRONT of the build.
      # Measured on run 32993261791, the critical path was:
      #
      #     Client tests          5m19s
      #     Build Club Arena      1m59s
      #     Checkout World Hub    3m36s
      #     everything else       ~1m
      #     ------------------------------
      #     publish              ~12m
      #
      # Pushes land on main every two to three minutes. A twelve minute pipeline
      # under a two to three minute arrival rate can only ever publish a sha that
      # is already twelve minutes stale, and every push in between is cancelled
      # while PENDING by `cancel-in-progress: false` — which is that setting
      # working correctly, not failing. Production was fourteen commits behind
      # while every one of those cancels looked like a broken deploy.
      #
      # The tests are 13s on a developer machine and 5m19s here because a GitHub
      # runner has two cores and the suite is ~285s of aggregate work across 429
      # files. Nothing is misconfigured; it is simply serialised.
      #
      # So it runs BESIDE the build instead of in front of it. The gate is exactly
      # as strong: publish-to-origin needs BOTH jobs, so a red test still stops the
      # bundle from shipping. It just stops adding its five minutes to the build's
      # two.
      # ═════════════════════════════════════════════════════════════════════════
      # SHARDED 2026-09-02 to unblock publishing. This suite is the authoritative
      # gate on the bundle (a red test still stops the sync via `needs` below), and
      # it ran ~11 minutes on one 2-core runner. publish-to-origin waits for it, so
      # every publish took ~18 minutes end to end - slower than the merge rate, so
      # production perpetually lagged and intermediate publish runs were cancelled
      # ("last 3 pushes haven't published"). Nothing was ever lost: main is durable
      # and the publisher converges to the latest. But the LAG is the bug.
      #
      # Four shards run in parallel, so wall clock drops to ~3 minutes and the whole
      # publish pipeline to ~7. The gate is exactly as strong: publish-to-origin
      # `needs: [build-and-store, client-tests]`, and `needs` on a matrix waits for
      # EVERY shard, so one red shard still stops the bundle. fail-fast cancels the
      # siblings the moment one fails, which is what a gate wants. Fresh hosted
      # images keep the test and release trust domains isolated.
      # ── HAS THIS EXACT TREE ALREADY PASSED THE CLIENT SUITE? ──────────────
      #
      # The publisher re-runs the whole client suite in four shards on every
      # merge. On a squash merge the resulting commit usually has the SAME TREE
      # as the pull request head that CI just proved green - identical bytes,
      # tested twice, ~2 minutes of shards plus their queue wait on the critical
      # path between a merge and a player seeing the change.
      #
      # "Usually" is not "always", which is why this compares TREE HASHES rather
      # than trusting the merge. If main moved between the PR's last CI run and
      # the squash, the trees differ and the shards run exactly as before. This
      # can only skip when the content is bit-identical to something that
      # already passed.
      #
      # Fails closed: any doubt - no PR found, no green check, an API error -
      # and tests_proven stays false and the shards run.
      - name: Has this exact tree already passed the client suite?
        id: proven
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          echo "tests_proven=false" >> "$GITHUB_OUTPUT"

          TREE=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$SHA" --jq .commit.tree.sha 2>/dev/null || echo "")
          [ -z "$TREE" ] && { echo "::notice::could not read the target tree - running the shards."; exit 0; }

          PR=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$SHA/pulls" --jq '.[0].number' 2>/dev/null || echo "")
          [ -z "$PR" ] || [ "$PR" = "null" ] && { echo "::notice::no source pull request for ${SHA:0:7} - running the shards."; exit 0; }

          HEAD=$(timeout 30s gh api "repos/${{ github.repository }}/pulls/$PR" --jq .head.sha 2>/dev/null || echo "")
          [ -z "$HEAD" ] && { echo "::notice::could not read PR #$PR head - running the shards."; exit 0; }

          HEAD_TREE=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$HEAD" --jq .commit.tree.sha 2>/dev/null || echo "")
          if [ "$TREE" != "$HEAD_TREE" ]; then
            echo "::notice::tree ${TREE:0:7} differs from PR #$PR head tree ${HEAD_TREE:0:7} - main moved, running the shards."
            exit 0
          fi

          OK=$(timeout 30s gh api "repos/${{ github.repository }}/commits/$HEAD/check-runs?per_page=100" \
                 --jq '[.check_runs[] | select(.name=="Client Unit Tests (vitest)" and .conclusion=="success")] | length' 2>/dev/null || echo 0)
          if [ "${OK:-0}" -ge 1 ]; then
            echo "tests_proven=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tree $TREE already passed Client Unit Tests on PR #$PR head ${HEAD:0:7} - skipping the shards."
          else
            echo "::notice::no green Client Unit Tests on PR #$PR head - running the shards."
          fi

  client-publication:
    needs: publish-needed
    if: needs.publish-needed.outputs.component == 'client'
    concurrency:
      group: publish-club-arena-client-${{ github.repository_id }}-${{ needs.publish-needed.outputs.target_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-club-arena-client.yml
    with:
      target_sha: ${{ needs.publish-needed.outputs.target_sha }}
      component: client
      publish: ${{ needs.publish-needed.outputs.publish }}
      tests_proven: ${{ needs.publish-needed.outputs.tests_proven }}
      selection_base: ${{ needs.publish-needed.outputs.selection_base }}
    secrets: inherit

  build-record-gateway:
    needs: publish-needed
    if: needs.publish-needed.outputs.component == 'private-record-gateway'
    runs-on: ${{ github.repository_owner == 'Smarter-Software-PIQ' && github.repository_id == '1132369872' && 'ca-linux-8core' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout the admitted gateway source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish-needed.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile and qualify the gateway
        working-directory: server
        run: |
          npm ci --ignore-scripts
          node_modules/.bin/tsc -p tsconfig.private-record-gateway.json
          node_modules/.bin/vitest run src/transport/PrivateRecordGateway.test.ts src/transport/privateRecordGatewaySocket.test.ts src/transport/privateRecordGatewayRuntime.test.ts src/services/supabase/privateRecordListener.test.ts src/transport/PrivateRecordSubscriptions.test.ts src/transport/AuthorizedPrivateSend.test.ts --maxWorkers=2 --minWorkers=1
      - name: Seal the independent runtime
        run: bash scripts/ci/build-private-record-gateway.sh "$RUNNER_TEMP/gateway-artifact" "${{ needs.publish-needed.outputs.target_sha }}"
      - name: Package immutable gateway subject
        run: |
          mkdir "$RUNNER_TEMP/gateway-transfer"
          tar -czf "$RUNNER_TEMP/gateway-transfer/runtime.tar.gz" -C "$RUNNER_TEMP/gateway-artifact" .
      - name: Attest the protected gateway build
        id: gateway-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/gateway-transfer/runtime.tar.gz
      - name: Retain verification bundle beside its exact subject
        env:
          BUNDLE: ${{ steps.gateway-attestation.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/gateway-transfer/attestation.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: private-record-gateway-${{ needs.publish-needed.outputs.target_sha }}
          path: ${{ runner.temp }}/gateway-transfer
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  production:
    needs: [publish-needed, build-record-gateway]
    if: >-
      always() &&
      needs.publish-needed.result == 'success' &&
      ((needs.publish-needed.outputs.component == 'private-record-gateway' && needs.build-record-gateway.result == 'success') ||
       needs.publish-needed.outputs.component == 'private-record-bootstrap' ||
       needs.publish-needed.outputs.component == 'private-record-credentials' ||
       needs.publish-needed.outputs.component == 'private-record-inspect')
    concurrency:
      group: publish-club-arena-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-club-arena-transaction.yml
    with:
      target_sha: ${{ needs.publish-needed.outputs.target_sha }}
      component: ${{ needs.publish-needed.outputs.component }}
      publish: ${{ needs.publish-needed.outputs.publish }}
      tests_proven: ${{ needs.publish-needed.outputs.tests_proven }}
      client_result: skipped
      build_result: skipped
      gateway_build_result: ${{ needs.build-record-gateway.result }}
    secrets: inherit
