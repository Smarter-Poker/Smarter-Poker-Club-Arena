# ─────────────────────────────────────────────────────────────────────────────
# PUBLISH WATCHDOG — the only thing here that asks production what it is serving.
#
# Every other gate in this repo answers "did it merge". None of them answer
# "did it ship", and those are different questions with the same green tick.
# Three separate incidents in this repo were merges that never published:
# a sync push rejected for touching a workflow file, a `cancel-in-progress`
# that killed every build before its sync step, and a bundle built from a stale
# tree. In all three, main moved, agents reported success, and users kept
# seeing the previous build for hours.
#
# It self-heals before telling anyone, because the usual causes are transient:
# up to three re-dispatches per sha, and a CANCELLED attempt does not count
# against that budget (a cancellation means a newer push superseded the run -
# the publisher working, not a fault). It was one retry, and counted
# cancellations, until 2026-09-02; that combination is how a healthy repo
# talked itself out of healing and left main unpublished until a human
# dispatched by hand. See .github/scripts/publish-watchdog.sh and
# tests/no-commit-left-behind.law.test.ts.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish Watchdog

on:
  # After the publisher finishes — success OR failure. `workflow_run` fires on
  # a cancelled or failed run too, which is precisely when production is most
  # likely to be stranded.
  workflow_run:
    # This is the publisher's `name:`, not its filename. #2676 deleted
    # build-for-world-hub.yml (name 'Build for World Hub Sync') and repointed
    # fifteen files by FILENAME - and missed this one, so from 19:17 to 01:30
    # on 2026-09-02/03 this workflow could only fire from GitHub's throttled
    # scheduler. tests/workflow-run-names-a-live-workflow.law.test.ts now
    # refuses any workflow_run listener whose name no workflow carries.
    workflows: ['Publish Club Arena']
    types: [completed]
  schedule:
    # Catches everything workflow_run cannot: a publish that never started, a
    # Vercel deploy that failed after the sync pushed, a CDN serving stale.
    # Halved from */15 on 2026-08-23 for cost. `workflow_run` above is the real
    # trigger and fires the moment the publisher finishes; this schedule only
    # catches a publish that never STARTED, and thirty minutes is well inside
    # the window where that matters.
    #
    # 2026-09-01 (cost audit): */30 -> hourly. The workflow_run trigger above
    # fires after every publish attempt, and the publisher itself now carries
    # a */30 catch-up cron - three overlapping nets at */30 was two too many.
    #
    # 2026-09-02: the :42 tick exists for the ENGINE watchdog that runs in
    # this workflow, not for the publisher. On 2026-09-01/02 the deploy
    # workflow's own :40/:45/:50 crons were dropped by GitHub for HOURS at a
    # stretch, and the engine watchdog's only sweep at :19 sits 36 minutes
    # from the :55 break - beyond the deploy's 14-minute break-gate budget,
    # so its dispatch gate rightly refuses to burn a runner then. A sweep at
    # :42 is 13 minutes out: when the engine is behind and every cron was
    # dropped, THIS dispatch is alive and waiting when the break opens. A
    # dropped cron now costs nothing instead of an hour.
    - cron: '19,42 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # to re-dispatch the publisher for its one automatic retry
  # pull-requests: read (2026-09-03) is what lets orphan-work-watchdog.sh tell
  # a proposed branch from a stranded one. Without it `gh pr list` is refused,
  # and the sweep reported every branch with a pull request as having none.
  pull-requests: read

concurrency:
  group: publish-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: Production is serving main
    # STAYS ON GITHUB'S POOL, deliberately (2026-09-03). The publisher runs on
    # the estate's own box. If that box dies, this is the job that has to say
    # so, and it cannot say so from the box that died. The two jobs below are
    # heavier and are not the alarm: they run on the box, and a dead box just
    # queues them.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history is required: the script asks `git merge-base
          # --is-ancestor` to tell publish LAG (an older commit that is still
          # on main, which fixes itself) from a REWIND (a commit that is not on
          # main at all, which never will). A shallow clone answers "not an
          # ancestor" for both and would cry wolf on every normal deploy.
          fetch-depth: 0

      - name: Mint a GitHub App installation token
        id: app-token
        if: vars.AUTOPILOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}

      - name: Compare production against main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # The alarm writes with GITHUB_TOKEN, whose `issues: write` is
          # declared above. An App's installation scopes can be narrowed
          # without anyone here noticing, and a watchdog that cannot raise its
          # alarm is not a watchdog.
          GH_TOKEN_ISSUES: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Last-resort escalation once the automatic retries are spent. A
          # broken bundle must not auto-ship, so the guarantee is that nobody
          # has to notice on their own. Absent credentials degrade to the
          # issue alone; they never fail the run.
          SUPABASE_URL: https://kuklfnapbkmacvwxktbh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash .github/scripts/publish-watchdog.sh

  # ───────────────────────────────────────────────────────────────────────────
  # THE SAME QUESTION, ASKED OF THE ENGINE.
  #
  # The job above asks whether the CLIENT bundle is main. Nothing asked it of
  # the ENGINE, and the engine is where the money is.
  #
  # auto-deploy-hetzner.yml coalesces a restart inside MIN_RESTART_SPACING_SEC
  # and exits 0, and its drain gate defers while hands are in flight and exits
  # 0. Both are correct, and both report SUCCESS - so a green deploy run says
  # nothing about what production is running. A `*/20` catch-up is meant to land
  # the deferred commit, but GitHub schedules are best-effort: on 2026-08-27 a
  # merged engine fix sat unshipped for about two hours behind a green tick on
  # every run, and only landed when a human dispatched the workflow by hand.
  #
  # Separate job, not a step, so an engine problem and a bundle problem cannot
  # mask each other in the log or in the summary.
  # ───────────────────────────────────────────────────────────────────────────
  engine:
    name: The engine is running main
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 6
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          # `git merge-base --is-ancestor` needs real history on both sides: the
          # question is whether the engine is at OR AHEAD OF the newest
          # engine-affecting commit, and a shallow clone cannot answer it.
          fetch-depth: 0

      - name: Mint a GitHub App installation token
        id: app-token
        if: vars.AUTOPILOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}

      - name: Compare the engine against main
        env:
          # Dispatching the deploy needs `actions: write`, which the App token
          # carries; the alarm is written with GITHUB_TOKEN for the same reason
          # the job above does it that way.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN_ISSUES: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ENGINE_URL: https://engine.smarter.poker
          # 2026-09-05: the staleness issue can now quote the pipeline's own
          # ledger (ca_engine_deploy_attempts) for WHY production is behind,
          # instead of leaving the reader to reconstruct it from run logs.
          # Optional - the watchdog runs unchanged without it.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash .github/scripts/engine-watchdog.sh

      # Dan 2026-09-01: "no work ever gets lost, orphaned or not published."
      # The watchdogs in this file ask whether MERGED work reached production.
      # This one asks the question upstream of all of them: does work exist
      # that never became a merge at all - a branch pushed with no PR, a PR
      # with a conflict autopilot cannot land, a forgotten draft? Files one
      # self-updating, self-closing issue naming each piece and its remedy.
      # if: always() - stranded work must be reported even when the engine
      # comparison above failed; the failure domains are independent.
      - name: Find work that nothing will ever publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/orphan-work-watchdog.sh

      # The origin's Caddyfile lives in infra/ca-origin/ but NOTHING deploys
      # it: writing /etc/caddy and reloading Caddy needs root, and there is
      # deliberately no root key in CI. So the box and the repo can drift the
      # moment either is edited, and until 2026-09-03 nothing would have
      # noticed - the 404-cached-for-a-year bug lived there unseen.
      #
      # Comparing the file byte-for-byte would need that same root access and
      # would fail on a comment while passing a config that serves the wrong
      # thing. This asserts the four things the config EXISTS to produce, from
      # outside, over the path a player actually takes. Every check is a bug
      # that was real.
      - name: The origin still behaves the way its config says
        if: always()
        run: bash .github/scripts/origin-contract.sh

  # ── Are the schedules themselves firing? ─────────────────────────────────
  #
  # 2026-09-01: auto-deploy-hetzner moved to an hourly cron at 13:00 UTC and
  # then fired ONCE in the next six hours, so the engine served a fourteen and
  # a half hour old image with five merged pull requests unshipped. Every run
  # was green because none of them happened. cron-health.yml does not cover
  # this - it asks the DATABASE which scheduled work failed, so it watches the
  # horse jobs and not GitHub Actions cron.
  #
  # This is a job in THIS workflow, not a scheduled one of its own, for the
  # reason already stated at the top of this file: a watchdog sharing a failure
  # domain with the thing it watches is not a watchdog. `workflow_run` fires
  # whenever anything else finishes, which on the day this was written was
  # eight or more times against the schedule's one.
  schedules:
    name: The schedules are actually firing
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Every scheduled workflow has fired within its own budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/schedule-liveness.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # IS ANYTHING RED ON MAIN THAT NOBODY IS LOOKING AT?
  #
  # CLAUDE.md 10.83 has described this detector since 2026-09-06 and Club Arena
  # DID NOT HAVE IT - the section documents the World Hub's copy, and every
  # agent reading Club Arena's CLAUDE.md has been told a guard was watching this
  # repo when nothing was. Measured the day this job was added, three workflows
  # were failing on Club Arena's `main` with no open issue naming any of them:
  #
  #   CI - Build & Type Safety                     1.4h, last green 11:00:19Z
  #   Applied Migrations Are Recorded              1.0h, no green in the window
  #   Deploy Monitoring (on infra/monitoring)      0.3h, no green in the window
  #
  # The third is the one that matters, and it is the argument for this job in a
  # single line: `check-alert-rules-match.mjs` could not read the running rules
  # off engine-01 and REFUSED TO PASS - doing exactly what 10.84 designed it to
  # do - and the refusal reached nobody. A check behaving perfectly is still
  # worthless if its result has no reader.
  #
  # Not in the ruleset, so a red run here blocks no merge. That is deliberate:
  # this reports, it never gates. 10.83's rule stands - a workflow is either in
  # the ruleset or only this detector will ever say it broke.
  #
  # ubuntu-latest ON PURPOSE, like the alarm job at the top of this file. The
  # alarm must not share a failure domain with the boxes it watches, and `gh`
  # is preinstalled there - a self-hosted runner without `gh` would give this
  # repo a detector whose alarm silently fails, which is the 10.83 bug wearing
  # a fresh coat.
  main_is_green:
    name: Nothing is silently red on main
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Any workflow red on main past the threshold, with nobody watching
        id: main-green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # PIPESTATUS[0], not the pipeline's code - `tee` always succeeds, and
          # reading the pipeline's status here would report every run as clean.
          set +e
          node scripts/ci/check-main-is-green.mjs 2>&1 | tee /tmp/main-green.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "check-main-is-green exited ${code}"

      - name: Raise the alarm for a silently red main
        if: always() && steps.main-green.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="A workflow has been failing on main with nobody watching"
          BODY=$(printf '%s\n' \
            "One or more workflows have been red on \`main\` past the threshold and have no open issue naming them." \
            "" \
            "A check that is red and blocks nobody stops being a check: it cannot fail any louder than it already is, so the next person to break the same thing learns nothing." \
            '```' \
            "$(cat /tmp/main-green.log)" \
            '```' \
            "" \
            "Detector: \`scripts/ci/check-main-is-green.mjs\`. Closes itself once every workflow's latest run on main is green, or once an issue exists that names it.")
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" || true
          fi

      - name: Close it when main is green again
        if: always() && steps.main-green.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="A workflow has been failing on main with nobody watching"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Every workflow's latest run on main is green again." || true
          fi
