# ─────────────────────────────────────────────────────────────────────────────
# PUBLISH WATCHDOG — the only thing here that asks production what it is serving.
#
# Every other gate in this repo answers "did it merge". None of them answer
# "did it ship", and those are different questions with the same green tick.
# Three separate incidents in this repo were merges that never published:
# a sync push rejected for touching a workflow file, a `cancel-in-progress`
# that killed every build before its sync step, and a bundle built from a stale
# tree. In all three, main moved, agents reported success, and users kept
# seeing the previous build for hours.
#
# It self-heals once per sha before telling anyone, because the usual causes
# are transient. See .github/scripts/publish-watchdog.sh.
# ─────────────────────────────────────────────────────────────────────────────
name: Publish Watchdog

on:
  # After the publisher finishes — success OR failure. `workflow_run` fires on
  # a cancelled or failed run too, which is precisely when production is most
  # likely to be stranded.
  workflow_run:
    workflows: ['Build for World Hub Sync']
    types: [completed]
  schedule:
    # Catches everything workflow_run cannot: a publish that never started, a
    # Vercel deploy that failed after the sync pushed, a CDN serving stale.
    # Halved from */15 on 2026-08-23 for cost. `workflow_run` above is the real
    # trigger and fires the moment the publisher finishes; this schedule only
    # catches a publish that never STARTED, and thirty minutes is well inside
    # the window where that matters.
    #
    # 2026-09-01 (cost audit): */30 -> hourly. The workflow_run trigger above
    # fires after every publish attempt, and the publisher itself now carries
    # a */30 catch-up cron - three overlapping nets at */30 was two too many.
    - cron: '19 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # to re-dispatch the publisher for its one automatic retry

concurrency:
  group: publish-watchdog
  cancel-in-progress: false

jobs:
  watch:
    name: Production is serving main
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history is required: the script asks `git merge-base
          # --is-ancestor` to tell publish LAG (an older commit that is still
          # on main, which fixes itself) from a REWIND (a commit that is not on
          # main at all, which never will). A shallow clone answers "not an
          # ancestor" for both and would cry wolf on every normal deploy.
          fetch-depth: 0

      - name: Mint a GitHub App installation token
        id: app-token
        if: vars.AUTOPILOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}

      - name: Compare production against main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # The alarm writes with GITHUB_TOKEN, whose `issues: write` is
          # declared above. An App's installation scopes can be narrowed
          # without anyone here noticing, and a watchdog that cannot raise its
          # alarm is not a watchdog.
          GH_TOKEN_ISSUES: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/publish-watchdog.sh

  # ───────────────────────────────────────────────────────────────────────────
  # THE SAME QUESTION, ASKED OF THE ENGINE.
  #
  # The job above asks whether the CLIENT bundle is main. Nothing asked it of
  # the ENGINE, and the engine is where the money is.
  #
  # auto-deploy-hetzner.yml coalesces a restart inside MIN_RESTART_SPACING_SEC
  # and exits 0, and its drain gate defers while hands are in flight and exits
  # 0. Both are correct, and both report SUCCESS - so a green deploy run says
  # nothing about what production is running. A `*/20` catch-up is meant to land
  # the deferred commit, but GitHub schedules are best-effort: on 2026-08-27 a
  # merged engine fix sat unshipped for about two hours behind a green tick on
  # every run, and only landed when a human dispatched the workflow by hand.
  #
  # Separate job, not a step, so an engine problem and a bundle problem cannot
  # mask each other in the log or in the summary.
  # ───────────────────────────────────────────────────────────────────────────
  engine:
    name: The engine is running main
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          # `git merge-base --is-ancestor` needs real history on both sides: the
          # question is whether the engine is at OR AHEAD OF the newest
          # engine-affecting commit, and a shallow clone cannot answer it.
          fetch-depth: 0

      - name: Mint a GitHub App installation token
        id: app-token
        if: vars.AUTOPILOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}

      - name: Compare the engine against main
        env:
          # Dispatching the deploy needs `actions: write`, which the App token
          # carries; the alarm is written with GITHUB_TOKEN for the same reason
          # the job above does it that way.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN_ISSUES: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ENGINE_URL: https://engine.smarter.poker
        run: bash .github/scripts/engine-watchdog.sh
