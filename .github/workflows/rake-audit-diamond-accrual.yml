name: Rake audit reads diamond accrual as banked

# fn_rake_bbj_invariants I7 (migration 20261008144428). Runs
# scripts/ci/test-rake-audit-diamond-accrual.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definition
# captured 2026-10-08 (pg_get_functiondef md5 equal to the live function) must
# read a diamond hand banked in ca_diamond_rake_accrual as lost, and the
# migration must count only the real losses (a chip hand never banked, a
# short, missing or non-rake diamond accrual) and reproduce production's
# derived postimage md5. No timer (CLAUDE.md 10.85): pull_request only,
# scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261008144428_the_rake_audit_reads_a_diamond_hand_s_accrual_as_its_banked.sql
      - scripts/ci/fixtures/rake-audit-diamond-accrual/**
      - scripts/ci/test-rake-audit-diamond-accrual.py
      - .github/workflows/rake-audit-diamond-accrual.yml

permissions:
  contents: read

concurrency:
  group: rake-audit-diamond-accrual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rake-audit-diamond-accrual:
    name: Rake audit reads diamond accrual as banked
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Rake audit reads diamond accrual as banked
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-rake-audit-diamond-accrual.py --output artifacts/rake-audit-diamond-accrual
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rake-audit-diamond-accrual-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rake-audit-diamond-accrual/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
