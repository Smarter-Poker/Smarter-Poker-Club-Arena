name: Rake law prices Diamond hands by their settlement

# fn_rake_law_violations() and fn_ca_escalate_reconcile_criticals()
# (migration 20261008043041). Runs scripts/ci/test-rake-law-diamond-hands.py
# against a throwaway PostgreSQL 17 cluster, never production: the exact
# production definitions captured 2026-10-08 (pg_get_functiondef md5 equal to
# the live functions) must flag a settled Diamond hand as over_spec and file a
# rake_law finding under a second source name, and the migration must flag
# only Diamond hands whose rake differs from their settlement receipt, keep
# the chip pricing unchanged, file under the trigger's source, and reproduce
# production's derived postimage md5. The same command ci.yml would run, kept
# in its own file so the change does not edit ci.yml. No timer (CLAUDE.md
# 10.85): pull_request only, scoped to the paths it proves. ci.yml has no push
# trigger, so neither does this.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261008043041_a_diamond_hand_is_priced_by_the_diamond_settler_not_the_chip.sql
      - supabase/migrations/20260921023500_a_hand_that_ended_preflop_has_no_board_to_record.sql
      - supabase/migrations/20260921024924_the_measurement_functions_say_what_they_measure.sql
      - scripts/ci/test-rake-law-diamond-hands.py
      - .github/workflows/rake-law-diamond-hands.yml

permissions:
  contents: read

concurrency:
  group: rake-law-diamond-hands-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rake-law-diamond-hands:
    name: Rake law prices Diamond hands by their settlement, not the chip spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Rake law prices Diamond hands by their settlement, not the chip spec
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-rake-law-diamond-hands.py --output artifacts/rake-law-diamond-hands
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rake-law-diamond-hands-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rake-law-diamond-hands/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
