name: Isolated frontend candidate qualification
run-name: release:${{ inputs.operation_id }}:${{ fromJSON(inputs.request).phase }}
on:
  workflow_dispatch:
    inputs:
      operation_id:
        required: true
        type: string
      request:
        required: true
        type: string
permissions:
  contents: read
# The candidate container has no runner environment, control checkout, Docker
# socket, certificate identity, publication secret, or artifact credentials.
concurrency:
  group: isolated-frontend-release-${{ inputs.operation_id }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: controls
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ fromJSON(inputs.request).source_sha }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Execute trusted frontend qualification boundary
        env:
          RELEASE_REQUEST: ${{ inputs.request }}
          RELEASE_OPERATION_ID: ${{ inputs.operation_id }}
        run: python3 controls/operations/release/native/qualify-frontend.py source controls evidence
      - name: Preserve terminal qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-receipt-${{ inputs.operation_id }}
          path: evidence/receipt.json
          if-no-files-found: error
          retention-days: 7
