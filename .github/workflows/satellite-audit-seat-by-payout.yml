name: Satellite audit finds a seat by its payout

# fn_satellite_conservation_audit (migration 20261007215112). Runs
# scripts/ci/test-satellite-audit-seat-by-payout.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definition
# captured 2026-10-07 (pg_get_functiondef md5 equal to the live function) must
# flag a satellite whose unranked seats have NULL positions, and the migration
# must count those seats by payout_id, keep a cash delivery out of the seat
# count, still flag a satellite that is really a seat short, and reproduce
# production's derived postimage md5. Kept in its own file so the change does
# not edit ci.yml. No timer (CLAUDE.md 10.85): pull_request only, scoped to the
# paths it proves. ci.yml has no push trigger, so neither does this.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261007215112_the_satellite_audit_finds_a_seat_by_its_payout.sql
      - scripts/ci/fixtures/satellite-audit-seat-by-payout/**
      - scripts/ci/test-satellite-audit-seat-by-payout.py
      - .github/workflows/satellite-audit-seat-by-payout.yml

permissions:
  contents: read

concurrency:
  group: satellite-audit-seat-by-payout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  satellite-audit-seat-by-payout:
    name: The satellite audit finds a seat by its payout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: The satellite audit finds a seat by its payout
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-satellite-audit-seat-by-payout.py --output artifacts/satellite-audit-seat-by-payout
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-audit-seat-by-payout-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/satellite-audit-seat-by-payout/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
