name: Schema Integrity Audit

# Compares the committed schema contracts and accounting attestations with
# live production. It is read-only outside its disposable runner workspace:
# it never commits, pushes, opens a pull request, or reconciles source.
#
# WHY THIS EXISTS
# The phantom-reference CI gate reads that manifest as its source of truth. The
# manifest is a snapshot, and migrations in this repo are intentionally stale
# (tables and functions are created straight in prod via the Supabase MCP — see
# CLAUDE.md). So the manifest drifts silently, and the drift only ever surfaces
# as a red CI run on somebody else's unrelated PR.
#
# On 2026-08-17 that happened THREE times in a single session:
#   1. claim_table_lease / heartbeat_table_leases / release_table_leases  (PR #74)
#   2. engine_recovery_events                                            (PR #88)
#   3. vip_feature_usage_monthly / fn_use_throwable                      (PR #90)
# Each was hand-patched to unblock the PR in flight. At that point the manifest
# was 9 tables and 46 functions behind live.
#
# Hand-patching one entry at a time is what produced the drift, and the answer
# to it is scripts/ci/schema-manifest.d - a fragment per agent, so no two
# branches conflict over one snapshot (scripts/ci/schema-manifest.mjs).
#
# So this runs the generator in a disposable checkout and asks the question that
# still matters: production may be AHEAD of the committed contract, which is the
# normal state here and is reported; the contract may never BLESS a table,
# function or column production does not have, because the phantom-reference
# gates read it and would approve a reference runtime refuses. Being merely
# behind used to fail this job, which made it fail on every single run it ever
# completed and buried everything else it measures.

on:
  schedule:
    # 05:20 UTC daily — before the working day, after the nightly jobs.
    # Refreshes the manifest AND runs the definer audit.
    - cron: '20 5 * * *'
    # THE SECURITY AUDIT DOES NOT KEEP OFFICE HOURS (2026-09-01).
    #
    # The definer-exposure job below is the only thing on this estate that can
    # see a hole applied straight to production, and almost all schema here is
    # applied that way. At one run a day, a function that ships anon-executable
    # at 09:00 answers strangers until 05:20 the next morning.
    #
    # That is not hypothetical. On 2026-08-31 fn_collect_bounty - which PAYS
    # KNOCKOUT BOUNTIES - was live and callable by any logged-in player, and on
    # 2026-09-01 fn_seat_club_for_user_membership_unchecked answered a caller
    # with NO ACCOUNT with any player's club membership and live seating. Both
    # were found by this job, and both had been live for hours before it ran.
    #
    # Hourly, on the 40th minute so it does not collide with the estate's other
    # scheduled work. The manifest comparison stays daily; the `refresh` job
    # skips this hourly audit by name.
    - cron: '40 * * * *'
  repository_dispatch:
    types: [audit-schema-integrity]
  # RUN IT NOW (2026-09-19). The definer-exposure job is the only thing on this
  # estate that can see a hole applied straight to production, and waiting for
  # the next :40 to confirm a fix is the wrong shape for that.
  #
  # Nothing about the schedule moves. The `refresh` job's
  # `if: github.event.schedule != '40 * * * *'` is TRUE on a manual run, exactly
  # as it already is on the repository_dispatch above, so a manual run does the
  # full daily comparison. The concurrency key
  # `${{ github.event.schedule || github.event_name }}` becomes its own group,
  # so a manual run never cancels or queues behind a scheduled one.
  workflow_dispatch:

permissions:
  contents: read
  # The live DEFINER-exposure audit below raises its alarm as an issue.
  issues: write

concurrency:
  # Keyed by trigger so the hourly audit and the daily refresh never queue
  # behind one another. An audit run superseded by a newer one is cancelled on
  # purpose: the newer run asks the same question of a more recent database.
  group: schema-integrity-audit-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  refresh:
    # The hourly cron exists for the security audit alone. Regenerating the
    # manifest comparison every hour would bury the one thing this workflow
    # needs a person to look at.
    if: github.event.schedule != '40 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The generator uses only node: builtins + global fetch, so there is
      # nothing to install. Keeping this dependency-free is deliberate: a
      # manifest refresh must not be able to fail on an unrelated npm problem.
      - name: Regenerate the manifest
        id: regenerate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/gen-schema-manifest.mjs

      # The generated base file is a fresh copy of production at this exact
      # moment in the disposable checkout, which is the only moment fragments
      # can be judged. No resulting file is committed or pushed by this audit.
      - name: Absorb and retire manifest fragments
        id: fragments
        continue-on-error: true
        run: node scripts/ci/prune-schema-fragments.mjs


  # ───────────────────────────────────────────────────────────────────────────
  # THE SWEEP THAT FOUND NINETEEN, REPEATED EVERY DAY.
  #
  # check-definer-authorization stops a new unauthenticated SECURITY DEFINER
  # writer arriving through a MIGRATION IN THIS REPOSITORY. It cannot see the
  # live database, and this estate applies schema straight to production through
  # the Supabase MCP - which is how all three of the most recent ones arrived,
  # two of them found by this job's very first run.
  #
  # It lives here because this workflow already holds the service-role key and
  # already runs daily. Its own job, so a schema-manifest problem and a security
  # finding cannot mask each other.
  # ───────────────────────────────────────────────────────────────────────────

      # THE CONTRACT MAY LAG PRODUCTION; IT MAY NEVER BLESS WHAT PRODUCTION LACKS.
      #
      # This replaces `git diff --quiet -- scripts/ci/`, which failed on ANY
      # difference between the committed manifests and the regeneration and told
      # the reader to "regenerate it in a reviewed change". That command cannot
      # pass here. scripts/ci/schema-manifest.mjs made the base snapshot
      # READ-ONLY to agents on 2026-09-22 - it was the most-changed file on main,
      # 25 commits in 24 hours, and any two branches touching it conflicted - so
      # the only action that satisfies a byte-diff is the one the fragment system
      # exists to forbid. Measured: `refresh` RAN sixteen times between
      # 2026-09-13 and 2026-10-02 and FAILED all sixteen, while prune in the last
      # of them reported `445 absorbed, 10 trimmed, 10 still landing, 0 stale`.
      # Nothing was wrong, and the permanent red buried every other verdict here.
      #
      # The script separates the two harms the diff conflated: production being
      # AHEAD of the contract is the documented steady state and is reported,
      # while the contract blessing a name production does not have is a phantom
      # reference the CI gates will approve and runtime will refuse - the one
      # direction nothing in this repository ever checked, because prune only
      # judges fragments and never the base.
      #
      # `if: always()` so this and the stale-fragment step cannot mask one
      # another, but ONLY when the regeneration actually succeeded: without it
      # the "live" files on disk are the committed ones straight out of the
      # checkout, and comparing those with themselves would report a clean
      # contract having measured nothing (CLAUDE.md 10.86 rule 2).
      - name: The contract may lag production, never bless what it lacks
        id: contract
        if: always() && steps.regenerate.outcome == 'success'
        run: node scripts/ci/check-schema-contract.mjs

      # After the manifest has landed, not before: a fragment naming something
      # production does not have is widening the phantom-reference gate for a
      # name that does not exist, and that has to go red without also stopping
      # the refresh it rode in on.
      - name: A stale fragment is an open hole
        if: always() && steps.fragments.outcome == 'failure'
        run: |
          echo "::error title=Stale manifest fragment::See the Absorb step - a fragment has declared something production does not have for over a day."
          exit 1
  anchor-ledger-days:
    name: The ledger attestation is anchored outside the database
    runs-on: ubuntu-latest
    # WHY THIS RUNS HERE AND NOT ON A SCHEDULE OF ITS OWN
    #
    # ca_ledger_day_manifests hashes each day of chip_ledger and stores the sha
    # in the same database as the journal it hashes, so it proves nothing to
    # anybody who does not already trust that database (roadmap 9.2). This
    # generates the expected lines in the disposable checkout and compares
    # them with docs/attestation/chip-ledger-days.tsv, where git owns history.
    #
    # It rides this workflow's existing schedules - BOTH of them, the daily
    # 05:20 and the hourly :40, because unlike `refresh` it carries no `if:`
    # that skips the hourly cron - so no new scheduled trigger is added
    # anywhere (CLAUDE.md 10.85, and the precedent in 10.83 for carrying extra
    # checks on a schedule that already exists). Hourly is the better cadence
    # for an alarm: an unexplained change is seen within the hour, not the
    # next morning, and a run with nothing new is a no-op. The 04:25 manifest
    # cron's new day is picked up by the first run after it.
    #
    # THE SCRIPT FAILS when a day this file already carries hashes differently
    # in the database and no restatement explains it. That failure is the whole
    # point of the file: on 2026-09-07 the eight retained days were recomputed
    # for the first time and 2026-08-31 had been wrong for six days, because
    # fn_ca_ledger_day_manifest only ever examines CURRENT_DATE - 1.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # blob:none keeps every one of the 7,223 commits and drops the blobs of old
          # revisions. Measured 2026-09-13, three runs each: 33-35s / 531MB against
          # 36-43s / 766MB, for identical ancestry. Nothing in this repo's workflows
          # reads a historical file version - they ask merge-base, rev-list, log and
          # cat-file -e, which are all commit-graph work - so those blobs were paid
          # for on every run and never read.
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Anchor every day the database has attested
        id: anchor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # A day already anchored that now hashes differently is the alarm, and
          # the script exits 1 for exactly that. Days the file has simply not
          # caught up with are NOT that - and `git diff --exit-code` treated
          # them identically, so this job went red the first day nobody
          # committed the regenerated file and stayed red, which is how the
          # real signal became invisible. Measured 2026-09-19: every one of the
          # 39 anchored days still hashed the same; the job was red because
          # eight new days had been attested since 2026-09-10 and nothing had
          # committed them.
          UNANCHORED_BACKLOG_FAILS_AT: '14'
          # AND A BACKLOG NOBODY IS TOLD ABOUT IS THE SAME BLIND SPOT AGAIN.
          #
          # The 2026-09-19 change separated the backlog from the incident, which
          # was right, and then gave the backlog NO READER (CLAUDE.md 10.86 rule
          # 3): it printed a ::warning nothing reads, and the first thing a
          # person could see was this job going red on the fourteenth day -
          # arriving as "Schema Integrity Audit has been red", indistinguishable
          # from the incident and masked outright by any open issue naming this
          # workflow, which is the exact failure the two steps below were added
          # to prevent. It then happened: the anchor stopped at 2026-09-18 and
          # nobody heard about it until 2026-10-03, when it crossed the bound
          # with fourteen days of chip_ledger unanchored.
          #
          # DERIVED, NOT GUESSED (CLAUDE.md 10.84). When the anchoring was being
          # done it was one line a day: ea1bf545e4 (2026-09-08), 241e3a2e65
          # (09-09), 97ae9bfe56 (09-10), 1a0cdc3eed (09-11), each +1. A day is
          # attested the morning after it closes, so 0 or 1 behind is the normal
          # state and must never file anything. Three means at least two
          # consecutive days were missed, which has never been normal here, and
          # it leaves eleven days of warning before the hard bound above.
          BACKLOG_ISSUE_AT: '3'
        run: |
          set -euo pipefail
          # Assume the incident until the script returns: an unexplained change
          # is the only thing it exits non-zero for, and under `set -e` nothing
          # after it runs.
          echo "verdict=changed" >> "$GITHUB_OUTPUT"
          node scripts/ci/anchor-ledger-days.mjs 2>&1 | tee /tmp/anchor-ledger-days.log

          # The script rewrote the file in this disposable checkout. This job
          # is contents:read on purpose and cannot commit, so it counts what
          # the anchor is missing and says so.
          NEW=$(git diff --numstat -- docs/attestation/ | awk '{s+=$1} END {print s+0}')
          echo "new_days=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" -eq 0 ]; then
            echo "verdict=clean" >> "$GITHUB_OUTPUT"
            echo "the anchor already carries every day the database has attested."
            exit 0
          fi

          echo "verdict=behind" >> "$GITHUB_OUTPUT"
          echo "::warning title=Ledger anchor::${NEW} attested day(s) are not in docs/attestation/chip-ledger-days.tsv. Run scripts/ci/anchor-ledger-days.mjs and commit the result - git is where this history is supposed to live."
          git diff -- docs/attestation/ | head -60

          # Set before the hard bound below, so a backlog that has already
          # crossed it still reaches the issue rather than only the red run.
          if [ "$NEW" -ge "$BACKLOG_ISSUE_AT" ]; then
            echo "backlog_alarm=yes" >> "$GITHUB_OUTPUT"
          fi

          if [ "$NEW" -ge "$UNANCHORED_BACKLOG_FAILS_AT" ]; then
            echo "::error title=Ledger anchor::${NEW} day(s) behind, at or past the ${UNANCHORED_BACKLOG_FAILS_AT}-day bound. An attestation stored only in the database it hashes proves nothing; it means something while git carries it."
            exit 1
          fi

      # A RED JOB IN A SCHEDULED WORKFLOW IS A TREE NOBODY HEARS FALL.
      #
      # Added 2026-09-07 by the deep dive over the phase 6 work this job shipped
      # in. Without these two steps the strongest signal in the whole ledger
      # attestation - "a day already anchored now hashes differently and nothing
      # explains it" - reached a person only as `check-main-is-green` reporting
      # "Schema Manifest Refresh has been red for six hours", indistinguishable
      # from a manifest-refresh hiccup, and MASKED ENTIRELY whenever any open
      # issue already named this workflow (that detector matches on the workflow
      # name, so it is per-workflow, not per-job). The definer-exposure job below
      # already solved this in this same file; the anchor did not copy it.
      #
      # CLAUDE.md 10.86 rule 3: a guard must have a reader, and you must name
      # them. The reader is this issue.
      - name: Raise the alarm
        # Only for the incident, never for a backlog: filing "an anchored day
        # now hashes differently" because the file is three days behind is the
        # crying-wolf that gets an alarm muted.
        if: failure() && steps.anchor.outputs.verdict == 'changed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Ledger attestation: an anchored day now hashes differently"
          # The plain list endpoint, never --search: the search index is
          # eventually consistent and duplicate issues have been filed that way.
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          BODY=$(printf '%s\n' \
            "\`scripts/ci/anchor-ledger-days.mjs\` found a mismatch. A day already carried by \`docs/attestation/chip-ledger-days.tsv\` now hashes differently in the database, and no row in \`ca_ledger_day_manifest_restatements\` explains it." \
            "" \
            "That means the journal for a day already attested changed, and either it changed outside the sanctioned maintenance path or the change was never recorded. Both are incidents." \
            "" \
            '\`\`\`' \
            "$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/anchor-ledger-days.log | head -60)" \
            '\`\`\`' \
            "" \
            "Do NOT edit the anchor file to make this pass. Read \`ca_ledger_mutation_log\` for that day first - every sanctioned change keeps the old row." \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if [ -n "${N:-}" ]; then
            gh issue comment "$N" --repo "$REPO" --body "$BODY" || echo "::error::could not comment on #$N"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || echo "::error::could not open the issue"
          fi

      # THE BACKLOG'S OWN READER, SEPARATE FROM THE INCIDENT'S.
      #
      # A different issue with a different title, so the two verdicts can never
      # be mistaken for one another and closing one never closes the other. It
      # runs on `always()` because a backlog past the hard bound has already
      # failed the step, and that is precisely when somebody has to be told.
      - name: Say the anchor is behind, on the day it falls behind
        if: always() && steps.anchor.outputs.backlog_alarm == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NEW_DAYS: ${{ steps.anchor.outputs.new_days }}
        run: |
          set -uo pipefail
          TITLE="Ledger attestation: attested days are not anchored in git"
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          BODY=$(printf '%s\n' \
            "\`ca_ledger_day_manifests\` has attested **${NEW_DAYS}** day(s) that \`docs/attestation/chip-ledger-days.tsv\` does not carry." \
            "" \
            "The attestation hashes \`chip_ledger\` and is stored in the same database as the journal it hashes, so it proves nothing to anybody who does not already trust that database. It means something while git carries it, and git does not carry these days." \
            "" \
            "This is NOT the incident - no anchored day has changed its sha. It is the file not being committed, and one reviewed change fixes it: run \`node scripts/ci/anchor-ledger-days.mjs\` (it needs SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY), then commit \`docs/attestation/chip-ledger-days.tsv\` through the normal route in PUBLISHING.md." \
            "" \
            "Never edit a line this file already carries - it is append-only. This audit is \`contents: read\` and cannot commit for you; that is deliberate." \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if [ -n "${N:-}" ]; then
            gh issue comment "$N" --repo "$REPO" --body "$BODY" || echo "::error::could not comment on #$N"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || echo "::error::could not open the issue"
          fi

      - name: Close the backlog issue when git has caught up
        if: always() && steps.anchor.outputs.verdict == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Ledger attestation: attested days are not anchored in git"
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          [ -n "${N:-}" ] || exit 0
          gh issue comment "$N" --repo "$REPO" --body "Caught up. Every day the database has attested is now carried by docs/attestation/chip-ledger-days.tsv. Closing." || true
          gh issue close "$N" --repo "$REPO" || true

      - name: Close the alarm when the anchor agrees again
        if: success() && steps.anchor.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Ledger attestation: an anchored day now hashes differently"
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          [ -n "${N:-}" ] || exit 0
          gh issue comment "$N" --repo "$REPO" --body "Recovered. Every day the database attests now matches the line git already carries, or is explained by a restatement. Closing." || true
          gh issue close "$N" --repo "$REPO" || true

  second-writer:
    name: The second writer agrees with the register
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # PHASE 7 OF THE CHIP-ACCOUNTING PROGRAMME, roadmap 9.6 (2026-09-07).
    #
    # The database registers every money door (ca_money_rpc_registry). The
    # World Hub, in ANOTHER repository, carries its own money routes under
    # pages/api/club-arena/ and calls those doors by name over PostgREST -
    # and until today nothing had ever compared the two. The first comparison
    # found two routes calling doors the register had CLOSED four days
    # earlier, and three RPC calls whose parameter NAMES matched no live
    # signature, so each had answered PGRST202 on every call and whatever the
    # route did next was the only thing that had ever run.
    #
    # A door is only closed if both repos agree it is closed. So this job
    # checks the World Hub out beside this repository, scans its routes, and
    # asks production (fn_ca_second_writer_check) whether every call still
    # agrees. It rides the schedules this workflow already has (hourly at :40
    # and daily at 05:20 - no new trigger, CLAUDE.md 10.85), and it lives here
    # rather than in the World Hub because this workflow already holds the
    # service-role key and the estate's App token.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The App token can read every repository in the estate; GITHUB_TOKEN
      # can read only this one. Same App as agent-open-pr.yml.
      - name: Mint a GitHub App installation token for the World Hub
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Smarter-Poker-World-Hub

      - name: Check out the World Hub's routes
        uses: actions/checkout@v4
        with:
          repository: Smarter-Poker/Smarter-Poker-World-Hub
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: world-hub
          # THE SECOND WRITER IS THE WHOLE SERVER SIDE, not one directory. The
          # phase 7 deep dive scanned beyond pages/api/club-arena and found the
          # legacy poker engine under src/lib calling two closed doors.
          sparse-checkout: |
            pages/api
            src/lib
            lib
          sparse-checkout-cone-mode: true

      - name: Ask the register about every call the World Hub makes
        id: audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/ci/audit-second-writer.mjs --routes world-hub/pages/api --routes world-hub/src/lib --routes world-hub/lib 2>&1 | tee /tmp/second-writer.log

      # A red job in a scheduled workflow is a tree nobody hears fall
      # (CLAUDE.md 10.86 rule 3). The reader is this issue.
      - name: Raise the alarm
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Second writer: a World Hub route disagrees with the money-door register"
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          BODY=$(printf '%s\n' \
            "\`scripts/ci/audit-second-writer.mjs\` compared every \`.rpc()\` call and every direct money-table write under the World Hub's \`pages/api\`, \`src/lib\` and \`lib\` with \`pg_proc\` and \`ca_money_rpc_registry\` (via \`fn_ca_second_writer_check\`), and at least one disagrees: a door that is missing, closed, not executable by the service role, called with parameter names no overload accepts, or a balance column written directly." \
            "" \
            "Such a route has been failing on every call, or moving chips outside the register, since the day the two sides diverged. Fix the ROUTE (in the World Hub) or the REGISTER (here) - never the check." \
            "" \
            '\`\`\`' \
            "$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/second-writer.log | head -80)" \
            '\`\`\`' \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if [ -n "${N:-}" ]; then
            gh issue comment "$N" --repo "$REPO" --body "$BODY" || echo "::error::could not comment on #$N"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || echo "::error::could not open the issue"
          fi

      - name: Close the alarm when both repos agree again
        if: success() && steps.audit.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Second writer: a World Hub route disagrees with the money-door register"
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          [ -n "${N:-}" ] || exit 0
          gh issue comment "$N" --repo "$REPO" --body "Recovered. Every call the World Hub makes agrees with the register. Closing." || true
          gh issue close "$N" --repo "$REPO" || true

  definer-exposure:
    name: No unaccounted DEFINER writer is reachable from a browser
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ask production which DEFINER writers a browser can reach
        id: audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/ci/audit-live-definer-exposure.mjs 2>&1 | tee /tmp/definer-exposure.log

      # A red job in a scheduled workflow is a tree nobody hears fall. The
      # finding has to arrive somewhere a person looks.
      - name: Raise the alarm
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Definer exposure: a SECURITY DEFINER writer is reachable from a browser"
          # The plain list endpoint, never --search: the search index is
          # eventually consistent and two sweeps have filed duplicate issues in
          # this estate that way before.
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          BODY=$(printf '%s\n' \
            "The daily live audit found a SECURITY DEFINER function a browser role can execute, that WRITES, and that never consults auth.uid(), auth.role() or auth.jwt()." \
            "" \
            "SECURITY DEFINER runs it as an owner with BYPASSRLS, so the table policies are not standing behind it either." \
            "" \
            '```' \
            "$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/definer-exposure.log | head -60)" \
            '```' \
            "" \
            "Nineteen of these were closed on 2026-08-27 and two more on 2026-08-28. This issue closes itself on the next clean run." \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if [ -n "${N:-}" ]; then
            gh issue comment "$N" --repo "$REPO" --body "$BODY" || echo "::error::could not comment on #$N"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || echo "::error::could not open the issue"
          fi

      - name: Close the alarm when production is clean again
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Definer exposure: a SECURITY DEFINER writer is reachable from a browser"
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          [ -n "${N:-}" ] || exit 0
          gh issue comment "$N" --repo "$REPO" --body "Recovered. Every DEFINER writer a browser can reach is now accounted for in scripts/ci/definer-exposure-baseline.json. Closing." || true
          gh issue close "$N" --repo "$REPO" || true
