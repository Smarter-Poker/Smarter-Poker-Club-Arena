name: Schema Manifest Refresh

# Keeps scripts/ci/supabase-schema-manifest.json (and the columns manifest) in
# step with the live Supabase schema.
#
# WHY THIS EXISTS
# The phantom-reference CI gate reads that manifest as its source of truth. The
# manifest is a snapshot, and migrations in this repo are intentionally stale
# (tables and functions are created straight in prod via the Supabase MCP — see
# CLAUDE.md). So the manifest drifts silently, and the drift only ever surfaces
# as a red CI run on somebody else's unrelated PR.
#
# On 2026-08-17 that happened THREE times in a single session:
#   1. claim_table_lease / heartbeat_table_leases / release_table_leases  (PR #74)
#   2. engine_recovery_events                                            (PR #88)
#   3. vip_feature_usage_monthly / fn_use_throwable                      (PR #90)
# Each was hand-patched to unblock the PR in flight. At that point the manifest
# was 9 tables and 46 functions behind live.
#
# Hand-patching one entry at a time is what produced the drift. This runs the
# generator that already exists and opens a PR when the snapshot has moved.

on:
  schedule:
    # 05:20 UTC daily — before the working day, after the nightly jobs.
    # Refreshes the manifest AND runs the definer audit.
    - cron: '20 5 * * *'
    # THE SECURITY AUDIT DOES NOT KEEP OFFICE HOURS (2026-09-01).
    #
    # The definer-exposure job below is the only thing on this estate that can
    # see a hole applied straight to production, and almost all schema here is
    # applied that way. At one run a day, a function that ships anon-executable
    # at 09:00 answers strangers until 05:20 the next morning.
    #
    # That is not hypothetical. On 2026-08-31 fn_collect_bounty - which PAYS
    # KNOCKOUT BOUNTIES - was live and callable by any logged-in player, and on
    # 2026-09-01 fn_seat_club_for_user_membership_unchecked answered a caller
    # with NO ACCOUNT with any player's club membership and live seating. Both
    # were found by this job, and both had been live for hours before it ran.
    #
    # Hourly, on the 40th minute so it does not collide with the estate's other
    # scheduled work. The manifest refresh stays daily: it opens a pull request
    # when the schema moves, and hourly PRs would be noise, so the `refresh`
    # job skips this cron by name.
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # The live DEFINER-exposure audit below raises its alarm as an issue.
  issues: write

concurrency:
  # Keyed by trigger so the hourly audit and the daily refresh never queue
  # behind one another. An audit run superseded by a newer one is cancelled on
  # purpose: the newer run asks the same question of a more recent database.
  group: schema-manifest-refresh-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  refresh:
    # The hourly cron exists for the security audit alone. Regenerating the
    # manifest and opening a pull request every hour would bury the one thing
    # this workflow needs a person to look at.
    if: github.event.schedule != '40 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The generator uses only node: builtins + global fetch, so there is
      # nothing to install. Keeping this dependency-free is deliberate: a
      # manifest refresh must not be able to fail on an unrelated npm problem.
      - name: Regenerate the manifest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/gen-schema-manifest.mjs

      # The base file is a fresh copy of production at this exact moment, which
      # is the only moment fragments can be judged. Absorbed ones are deleted
      # here, so scripts/ci/schema-manifest.d empties itself and no agent has to
      # remember to clean up after a migration lands.
      - name: Absorb and retire manifest fragments
        id: fragments
        continue-on-error: true
        run: node scripts/ci/prune-schema-fragments.mjs

      - name: Open a PR if the schema moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- scripts/ci/; then
            echo "Manifest already matches live schema — nothing to do."
            exit 0
          fi

          echo "::group::Drift"
          git diff --stat -- scripts/ci/
          # Names only. Never echo the diff body: these files are large and the
          # log is a public-ish artifact.
          ADDED=$(git diff -U0 -- scripts/ci/supabase-schema-manifest.json \
                  | grep -c '^+ ' || true)
          REMOVED=$(git diff -U0 -- scripts/ci/supabase-schema-manifest.json \
                    | grep -c '^- ' || true)
          echo "entries added: ${ADDED}  removed: ${REMOVED}"
          echo "::endgroup::"

          BRANCH="chore/schema-manifest-refresh"

          # NOT a patch/** branch: that would trigger Agent Apply Patch, which
          # is for queued unified diffs, not for generated files.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A scripts/ci/
          git commit -m "chore(ci): refresh Supabase schema manifest

          Regenerated by .github/workflows/schema-manifest-refresh.yml from the
          live schema via fn_schema_manifest(). Entries added: ${ADDED},
          removed: ${REMOVED}."
          git push -f origin "$BRANCH"

          # Only open a PR if one isn't already open for this branch
          OPEN=$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "::notice::Manifest updated in existing PR for branch $BRANCH."
            exit 0
          fi

          # GitHub Actions cannot open PRs unless
          # Settings -> Actions -> General -> "Allow GitHub Actions to create
          # and approve pull requests" is enabled. That is off here, and this
          # job must not go red over it: the branch is already pushed, which is
          # the part that matters. Fall back to a job-summary link.
          if ! gh pr create \
            --title "chore(ci): refresh Supabase schema manifest" \
            --body "The live Supabase schema has moved ahead of the committed manifest. Regenerated from fn_schema_manifest(). Entries added: ${ADDED}, removed: ${REMOVED}. Review added names (created directly in prod); removed names matter more, since code may still reference them." \
            --base main \
            --head "$BRANCH"
          then
            echo "::notice::Branch $BRANCH pushed. Could not open the PR automatically (Actions lacks create-PR permission) — open it here: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?quick_pull=1"
            {
              echo "### Schema manifest drifted"
              echo ""
              echo "Entries added: **${ADDED}**, removed: **${REMOVED}**."
              echo ""
              echo "[Open the pull request](https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?quick_pull=1)"
              echo ""
              echo "_Automatic PR creation is disabled for GitHub Actions in this repo's settings._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Push with GITHUB_TOKEN does not trigger workflows, so the PR's CI needs
      # one click on "Approve workflows to run". That is intentional: a manifest
      # refresh loosens a safety gate, so a human should look at it.

  # ───────────────────────────────────────────────────────────────────────────
  # THE SWEEP THAT FOUND NINETEEN, REPEATED EVERY DAY.
  #
  # check-definer-authorization stops a new unauthenticated SECURITY DEFINER
  # writer arriving through a MIGRATION IN THIS REPOSITORY. It cannot see the
  # live database, and this estate applies schema straight to production through
  # the Supabase MCP - which is how all three of the most recent ones arrived,
  # two of them found by this job's very first run.
  #
  # It lives here because this workflow already holds the service-role key and
  # already runs daily. Its own job, so a schema-manifest problem and a security
  # finding cannot mask each other.
  # ───────────────────────────────────────────────────────────────────────────

      # After the manifest has landed, not before: a fragment naming something
      # production does not have is widening the phantom-reference gate for a
      # name that does not exist, and that has to go red without also stopping
      # the refresh it rode in on.
      - name: A stale fragment is an open hole
        if: always() && steps.fragments.outcome == 'failure'
        run: |
          echo "::error title=Stale manifest fragment::See the Absorb step - a fragment has declared something production does not have for over a day."
          exit 1
  anchor-ledger-days:
    name: The ledger attestation is anchored outside the database
    runs-on: ubuntu-latest
    # WHY THIS RUNS HERE AND NOT ON A SCHEDULE OF ITS OWN
    #
    # ca_ledger_day_manifests hashes each day of chip_ledger and stores the sha
    # in the same database as the journal it hashes, so it proves nothing to
    # anybody who does not already trust that database (roadmap 9.2). This
    # copies each day's line into docs/attestation/chip-ledger-days.tsv, where
    # git owns the history instead.
    #
    # It rides this workflow's existing schedules - BOTH of them, the daily
    # 05:20 and the hourly :40, because unlike `refresh` it carries no `if:`
    # that skips the hourly cron - so no new scheduled trigger is added
    # anywhere (CLAUDE.md 10.85, and the precedent in 10.83 for carrying extra
    # checks on a schedule that already exists). Hourly is the better cadence
    # for an alarm: an unexplained change is seen within the hour, not the
    # next morning, and a run with nothing new is a no-op. The 04:25 manifest
    # cron's new day is picked up by the first run after it.
    #
    # THE SCRIPT FAILS when a day this file already carries hashes differently
    # in the database and no restatement explains it. That failure is the whole
    # point of the file: on 2026-09-07 the eight retained days were recomputed
    # for the first time and 2026-08-31 had been wrong for six days, because
    # fn_ca_ledger_day_manifest only ever examines CURRENT_DATE - 1.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Anchor every day the database has attested
        id: anchor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/ci/anchor-ledger-days.mjs 2>&1 | tee /tmp/anchor-ledger-days.log

      # A RED JOB IN A SCHEDULED WORKFLOW IS A TREE NOBODY HEARS FALL.
      #
      # Added 2026-09-07 by the deep dive over the phase 6 work this job shipped
      # in. Without these two steps the strongest signal in the whole ledger
      # attestation - "a day already anchored now hashes differently and nothing
      # explains it" - reached a person only as `check-main-is-green` reporting
      # "Schema Manifest Refresh has been red for six hours", indistinguishable
      # from a manifest-refresh hiccup, and MASKED ENTIRELY whenever any open
      # issue already named this workflow (that detector matches on the workflow
      # name, so it is per-workflow, not per-job). The definer-exposure job below
      # already solved this in this same file; the anchor did not copy it.
      #
      # CLAUDE.md 10.86 rule 3: a guard must have a reader, and you must name
      # them. The reader is this issue.
      - name: Raise the alarm
        if: failure() && steps.anchor.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Ledger attestation: an anchored day now hashes differently"
          # The plain list endpoint, never --search: the search index is
          # eventually consistent and duplicate issues have been filed that way.
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          BODY=$(printf '%s\n' \
            "\`scripts/ci/anchor-ledger-days.mjs\` refused to append. A day already carried by \`docs/attestation/chip-ledger-days.tsv\` now hashes differently in the database, and no row in \`ca_ledger_day_manifest_restatements\` explains it." \
            "" \
            "That means the journal for a day already attested changed, and either it changed outside the sanctioned maintenance path or the change was never recorded. Both are incidents." \
            "" \
            '\`\`\`' \
            "$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/anchor-ledger-days.log | head -60)" \
            '\`\`\`' \
            "" \
            "Do NOT edit the anchor file to make this pass. Read \`ca_ledger_mutation_log\` for that day first - every sanctioned change keeps the old row." \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if [ -n "${N:-}" ]; then
            gh issue comment "$N" --repo "$REPO" --body "$BODY" || echo "::error::could not comment on #$N"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || echo "::error::could not open the issue"
          fi

      - name: Close the alarm when the anchor agrees again
        if: success() && steps.anchor.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Ledger attestation: an anchored day now hashes differently"
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          [ -n "${N:-}" ] || exit 0
          gh issue comment "$N" --repo "$REPO" --body "Recovered. Every day the database attests now matches the line git already carries, or is explained by a restatement. Closing." || true
          gh issue close "$N" --repo "$REPO" || true

      # THE LINE HAS TO REACH MAIN, AND GITHUB_TOKEN CANNOT TAKE IT THERE.
      #
      # Found by the deep dive over phase 6 (2026-09-07 evening). This step
      # used to push with secrets.GITHUB_TOKEN and then `gh pr create`. A push
      # made with GITHUB_TOKEN emits no `push` event, so agent-open-pr.yml
      # never saw the branch, and `gh pr create` needs the "Allow GitHub
      # Actions to create pull requests" setting, which is off here - the
      # refresh job above says so in its own comment. github-actions[bot] has
      # opened ZERO pull requests in this repository, ever. So the first new
      # day after the 35 an agent pushed by hand would have been appended to a
      # branch nobody sees, for ever, while this job stayed green - an anchor
      # that never advances, reporting success.
      #
      # It now mints the estate's own App token exactly as agent-open-pr.yml
      # does, and pushes with THAT: the push fires agent-open-pr (which opens
      # the pull request) and agent-autopilot (which merges it on green), the
      # same route every other change takes to main. If the App is not
      # configured the step still pushes, but says out loud that nothing will
      # open the pull request, rather than pretending the notice is delivery.
      - name: Mint a GitHub App installation token
        id: app-token
        if: vars.AUTOPILOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}

      - name: Commit the new lines
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          PUSH_TOKEN_KIND: ${{ steps.app-token.outputs.token && 'app' || secrets.GH_PAT && 'pat' || 'github-token' }}
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/attestation/; then
            echo "No new day to anchor."
            exit 0
          fi

          BRANCH="chore/anchor-ledger-days"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A docs/attestation/
          git commit -m "chore(attestation): anchor the ledger day manifests

          Appended by .github/workflows/schema-manifest-refresh.yml from
          ca_ledger_day_manifests. Append-only: a day already anchored is never
          rewritten, and a change with no restatement fails the job instead."

          # Push with the token in hand, not the checkout's default credential:
          # only a push made with the App (or a PAT) fires agent-open-pr.yml.
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

          if [ "$PUSH_TOKEN_KIND" = "github-token" ]; then
            echo "::error::Branch $BRANCH was pushed with GITHUB_TOKEN, which fires no push event and cannot open a pull request here. The new anchor line will NOT reach main until vars.AUTOPILOT_APP_ID / secrets.AUTOPILOT_APP_PRIVATE_KEY are set (agent-open-pr.yml uses the same pair)."
            exit 1
          fi

          OPEN=$(gh pr list --state open --head "$BRANCH" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$OPEN" != "0" ]; then
            echo "::notice::Anchored in the existing PR for branch $BRANCH."
            exit 0
          fi
          # agent-open-pr.yml opens it on the push event; this is the same
          # request made directly, so the line does not wait on a sweep.
          gh pr create --head "$BRANCH" --base main \
            --title "chore(attestation): anchor the ledger day manifests" \
            --body "One line per attested day, appended from ca_ledger_day_manifests. See docs/attestation/README.md." \
            || echo "::notice::agent-open-pr.yml will open the pull request for $BRANCH on the push event."

  second-writer:
    name: The second writer agrees with the register
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # PHASE 7 OF THE CHIP-ACCOUNTING PROGRAMME, roadmap 9.6 (2026-09-07).
    #
    # The database registers every money door (ca_money_rpc_registry). The
    # World Hub, in ANOTHER repository, carries its own money routes under
    # pages/api/club-arena/ and calls those doors by name over PostgREST -
    # and until today nothing had ever compared the two. The first comparison
    # found two routes calling doors the register had CLOSED four days
    # earlier, and three RPC calls whose parameter NAMES matched no live
    # signature, so each had answered PGRST202 on every call and whatever the
    # route did next was the only thing that had ever run.
    #
    # A door is only closed if both repos agree it is closed. So this job
    # checks the World Hub out beside this repository, scans its routes, and
    # asks production (fn_ca_second_writer_check) whether every call still
    # agrees. It rides the schedules this workflow already has (hourly at :40
    # and daily at 05:20 - no new trigger, CLAUDE.md 10.85), and it lives here
    # rather than in the World Hub because this workflow already holds the
    # service-role key and the estate's App token.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The App token can read every repository in the estate; GITHUB_TOKEN
      # can read only this one. Same App as agent-open-pr.yml.
      - name: Mint a GitHub App installation token for the World Hub
        id: app-token
        if: vars.AUTOPILOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Smarter-Poker-World-Hub

      - name: Check out the World Hub's routes
        uses: actions/checkout@v4
        with:
          repository: Smarter-Poker/Smarter-Poker-World-Hub
          ref: main
          token: ${{ steps.app-token.outputs.token || secrets.GH_PAT }}
          path: world-hub
          # THE SECOND WRITER IS THE WHOLE SERVER SIDE, not one directory. The
          # phase 7 deep dive scanned beyond pages/api/club-arena and found the
          # legacy poker engine under src/lib calling two closed doors.
          sparse-checkout: |
            pages/api
            src/lib
            lib
          sparse-checkout-cone-mode: true

      - name: Ask the register about every call the World Hub makes
        id: audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/ci/audit-second-writer.mjs --routes world-hub/pages/api --routes world-hub/src/lib --routes world-hub/lib 2>&1 | tee /tmp/second-writer.log

      # A red job in a scheduled workflow is a tree nobody hears fall
      # (CLAUDE.md 10.86 rule 3). The reader is this issue.
      - name: Raise the alarm
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Second writer: a World Hub route disagrees with the money-door register"
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          BODY=$(printf '%s\n' \
            "\`scripts/ci/audit-second-writer.mjs\` compared every \`.rpc()\` call and every direct money-table write under the World Hub's \`pages/api\`, \`src/lib\` and \`lib\` with \`pg_proc\` and \`ca_money_rpc_registry\` (via \`fn_ca_second_writer_check\`), and at least one disagrees: a door that is missing, closed, not executable by the service role, called with parameter names no overload accepts, or a balance column written directly." \
            "" \
            "Such a route has been failing on every call, or moving chips outside the register, since the day the two sides diverged. Fix the ROUTE (in the World Hub) or the REGISTER (here) - never the check." \
            "" \
            '\`\`\`' \
            "$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/second-writer.log | head -80)" \
            '\`\`\`' \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if [ -n "${N:-}" ]; then
            gh issue comment "$N" --repo "$REPO" --body "$BODY" || echo "::error::could not comment on #$N"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || echo "::error::could not open the issue"
          fi

      - name: Close the alarm when both repos agree again
        if: success() && steps.audit.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Second writer: a World Hub route disagrees with the money-door register"
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          [ -n "${N:-}" ] || exit 0
          gh issue comment "$N" --repo "$REPO" --body "Recovered. Every call the World Hub makes agrees with the register. Closing." || true
          gh issue close "$N" --repo "$REPO" || true

  definer-exposure:
    name: No unaccounted DEFINER writer is reachable from a browser
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ask production which DEFINER writers a browser can reach
        id: audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          node scripts/ci/audit-live-definer-exposure.mjs 2>&1 | tee /tmp/definer-exposure.log

      # A red job in a scheduled workflow is a tree nobody hears fall. The
      # finding has to arrive somewhere a person looks.
      - name: Raise the alarm
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Definer exposure: a SECURITY DEFINER writer is reachable from a browser"
          # The plain list endpoint, never --search: the search index is
          # eventually consistent and two sweeps have filed duplicate issues in
          # this estate that way before.
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          BODY=$(printf '%s\n' \
            "The daily live audit found a SECURITY DEFINER function a browser role can execute, that WRITES, and that never consults auth.uid(), auth.role() or auth.jwt()." \
            "" \
            "SECURITY DEFINER runs it as an owner with BYPASSRLS, so the table policies are not standing behind it either." \
            "" \
            '```' \
            "$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/definer-exposure.log | head -60)" \
            '```' \
            "" \
            "Nineteen of these were closed on 2026-08-27 and two more on 2026-08-28. This issue closes itself on the next clean run." \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if [ -n "${N:-}" ]; then
            gh issue comment "$N" --repo "$REPO" --body "$BODY" || echo "::error::could not comment on #$N"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY" || echo "::error::could not open the issue"
          fi

      - name: Close the alarm when production is clean again
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TITLE="Definer exposure: a SECURITY DEFINER writer is reachable from a browser"
          N=$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" 2>/dev/null)
          [ -n "${N:-}" ] || exit 0
          gh issue comment "$N" --repo "$REPO" --body "Recovered. Every DEFINER writer a browser can reach is now accounted for in scripts/ci/definer-exposure-baseline.json. Closing." || true
          gh issue close "$N" --repo "$REPO" || true
