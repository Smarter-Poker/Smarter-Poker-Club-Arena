# ─────────────────────────────────────────────────────────────────────────────
# SECRETS EXPIRY WATCH (added 2026-09-01, deploy-audit phase 1)
#
# A credential that expires silently is an outage with a date on it. This runs
# weekly, reads scripts/ci/secrets-inventory.json, live-checks what it can (the
# GitHub token's real expiry, Supabase key formats), and opens/updates one
# `secrets-expiry`-labeled issue when anything is within its warn window or has
# an unverified expiry. It NEVER fails the run and NEVER prints a secret value.
#
# Weekly is right: expiry is measured in months, the warn window is 21 days,
# and a daily red job about a date 79 days away would become wallpaper.
# ─────────────────────────────────────────────────────────────────────────────
name: Secrets Expiry Watch

on:
  schedule:
    - cron: '13 9 * * 1' # Mondays 09:13 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: secrets-expiry
  cancel-in-progress: false

jobs:
  check:
    name: No credential lapses without warning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check every credential's expiry
        env:
          # The App token exposes no expiration header, so the LIVE github
          # check needs the PAT (whose own expiry is one of the things we
          # watch). Issue writes use GITHUB_TOKEN, whose issues:write is
          # declared above. Supabase keys are read to confirm their format.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN_ISSUES: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/check-secrets-expiry.mjs
