# ─────────────────────────────────────────────────────────────────────────────
# CREDENTIAL CONTRACT AUDIT
#
# A credential that expires silently is an outage with a date on it. This runs
# weekly, reads scripts/ci/secrets-inventory.json, live-checks what it can (the
# GitHub token's real expiry, Supabase key formats), and opens/updates one
# `secrets-expiry`-labeled issue when anything is within its warn window or has
# an unverified expiry. It NEVER fails the run and NEVER prints a secret value.
#
# Weekly is right: expiry is measured in months, the warn window is 21 days,
# and a daily red job about a date 79 days away would become wallpaper.
# ─────────────────────────────────────────────────────────────────────────────
name: Credential Contract Audit

on:
  schedule:
    - cron: '13 9 * * 1' # Mondays 09:13 UTC
  repository_dispatch:
    types: [audit-secrets-expiry]

permissions:
  contents: read
  issues: write

concurrency:
  group: secrets-expiry
  cancel-in-progress: false

jobs:
  check:
    name: No credential lapses without warning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mint the GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}

      - name: The App authority is alive
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/check-token.sh

      - name: Check every credential's expiry
        env:
          # Issue writes use the narrowly scoped built-in token. Supabase keys
          # are read only to confirm their format; values are never printed.
          GH_TOKEN_ISSUES: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/check-secrets-expiry.mjs
