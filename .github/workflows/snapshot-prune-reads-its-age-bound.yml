name: Snapshot prune reads its age bound

# sp_prune_hand_state_snapshots (migration 20261016103317). Runs
# scripts/ci/test-snapshot-prune-reads-its-age-bound.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definition
# captured 2026-10-16 (pg_get_functiondef md5 equal to the live function)
# calls the per-row disposal function for every young snapshot, and the
# migration must delete exactly the same rows while calling it only for rows
# past the eight-day bound, and reproduce production's derived postimage md5.
# No timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it
# proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261016103317_the_snapshot_prune_reads_its_age_bound_before_the_function.sql
      - scripts/ci/fixtures/snapshot-prune-age-bound/**
      - scripts/ci/test-snapshot-prune-reads-its-age-bound.py
      - .github/workflows/snapshot-prune-reads-its-age-bound.yml
      - supabase/migrations/*_snapshot_retention_traverses_bounded_candidates_before_eligi.sql
      - scripts/ci/fixtures/snapshot-prune-bounded-preimage.sql
      - scripts/ci/test-snapshot-prune-bounded-candidates.py

permissions:
  contents: read

concurrency:
  group: snapshot-prune-reads-its-age-bound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-prune-reads-its-age-bound:
    name: Snapshot prune deletes the same rows without a call per young snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Snapshot prune deletes the same rows without a call per young snapshot
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-snapshot-prune-reads-its-age-bound.py --output artifacts/snapshot-prune-reads-its-age-bound
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-prune-reads-its-age-bound-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/snapshot-prune-reads-its-age-bound/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
      - name: Snapshot retention bounds candidates and commits cursor atomically
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-snapshot-prune-bounded-candidates.py
      - name: Retain bounded scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-prune-bounded-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/snapshot-prune-bounded/RESULTS.json
          retention-days: 7
          if-no-files-found: error
