name: Spin edge drift needs a second window

# fn_spin_fairness_check (migration 20261016172618). Runs
# scripts/ci/test-spin-edge-second-window.py against a throwaway PostgreSQL 17
# cluster, never production: the exact production definition captured
# 2026-10-16 (pg_get_functiondef md5 equal to the live function) must raise a
# critical on a single-window rare-tier run, and the migration must report
# that as expectation_unconfirmed, still raise when the preceding window drifts
# the same way or beyond |z| 6 alone, close only the alert and incident it
# names, keep owner, security, settings and grants, and reproduce production's
# derived postimage md5. No timer (CLAUDE.md 10.85): pull_request only, scoped
# to the paths it proves.
on: the exact production definition
# captured 2026-10-16 (pg_get_functiondef md5 equal to the live function) must
# read a settled hand's rake and drop as unexplained while its post-commit
# obligations are still in flight, and the migration must read every phase of
# the same hands as zero, exclude tournament and Diamond tables, open a new
# basis, declare its guard redefinition, keep owner, security, settings and
# grants, and reproduce production's derived postimage md5. No timer
# (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261016172618_a_spin_edge_drift_needs_a_second_window.sql
      - scripts/ci/fixtures/spin-edge-second-window/**
      - scripts/ci/test-spin-edge-second-window.py
      - .github/workflows/spin-edge-second-window.yml

permissions:
  contents: read

concurrency:
  group: spin-edge-second-window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spin-edge-second-window:
    name: Spin edge drift needs a second window
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      - name: Spin edge drift needs a second window
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-spin-edge-second-window.py --output artifacts/spin-edge-second-window
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spin-edge-second-window-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/spin-edge-second-window/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
