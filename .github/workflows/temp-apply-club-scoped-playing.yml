name: Temporary Apply Club Scoped Playing

on:
  push:
    branches:
      - codex/fix/club-scoped-live-layout-20260831

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify club-scoped live-player count
        shell: bash
        run: |
          set -euo pipefail
          for region in \
            aws-0-us-east-1 aws-0-us-west-1 aws-0-eu-central-1 \
            aws-0-eu-west-1 aws-0-eu-west-2 aws-0-eu-west-3 \
            aws-0-ap-southeast-1 aws-0-ap-southeast-2 \
            aws-0-ap-northeast-1 aws-0-ap-northeast-2 \
            aws-0-sa-east-1 aws-0-ca-central-1
          do
            host="${region}.pooler.supabase.com"
            if psql -X -v ON_ERROR_STOP=1 -h "$host" \
              -U postgres.kuklfnapbkmacvwxktbh -d postgres -p 6543 \
              -c 'select 1' >/dev/null 2>&1
            then
              echo "Connected through ${region}"
              psql -X -v ON_ERROR_STOP=1 -h "$host" \
                -U postgres.kuklfnapbkmacvwxktbh -d postgres -p 6543 \
                -f supabase/migrations/20260831223000_club_home_playing_is_club_scoped.sql
              psql -X -v ON_ERROR_STOP=1 -h "$host" \
                -U postgres.kuklfnapbkmacvwxktbh -d postgres -p 6543 <<'SQL'
          select c.name,
                 public.fn_get_club_member_count(c.id) as members,
                 (public.get_club_home(c.id::text)->>'players_playing')::int as scoped_playing
            from public.clubs c
           where c.name ilike 'Deep Stack Society%'
           order by c.created_at desc
           limit 1;
          SQL
              exit 0
            fi
          done
          echo 'No Supabase pooler endpoint accepted the production connection.' >&2
          exit 1
