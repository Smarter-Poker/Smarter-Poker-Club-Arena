name: The dead tour scraper is retired

# ca_retired_cron_jobs registration of /cron/tour-schedule-scraper (migration
# 20261015095255). Runs scripts/ci/test-the-dead-tour-scraper-is-retired.py
# against a throwaway PostgreSQL 17 cluster, never production: the exact
# production v_openclaw_job_staleness captured 2026-10-15 (viewdef md5 equal to
# the live view) must page the scraper once it goes quiet, and the migration
# must take it out of the view while a healthy job stays quiet and a stopped
# job still pages, refuse a second run, and refuse to retire a scraper that has
# a configuration again. No timer (CLAUDE.md 10.85): pull_request only, scoped
# to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261015095255_the_dead_tour_schedule_scraper_is_a_retired_cron_job.sql
      - scripts/ci/fixtures/the-dead-tour-scraper-is-retired/**
      - scripts/ci/test-the-dead-tour-scraper-is-retired.py
      - .github/workflows/the-dead-tour-scraper-is-retired.yml

permissions:
  contents: read

concurrency:
  group: the-dead-tour-scraper-is-retired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  the-dead-tour-scraper-is-retired:
    name: The dead tour scraper is retired, and the silence alert does not wait for it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: The dead tour scraper is retired, and the silence alert does not wait for it
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-the-dead-tour-scraper-is-retired.py --output artifacts/the-dead-tour-scraper-is-retired
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-dead-tour-scraper-is-retired-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/the-dead-tour-scraper-is-retired/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
