name: The house does not dun itself

# fn_union_age_invoices and fn_union_enforce_stop_loss (migration
# 20261015093202). Runs scripts/ci/test-the-house-does-not-dun-itself.py
# against a throwaway PostgreSQL 17 cluster, never production: the exact
# production definitions, rebuilt from the migrations that wrote them
# (pg_get_functiondef md5 equal to the live functions on 2026-10-15), must
# escalate and suspend a club for a square-up its owner owes himself, and the
# migration must stop that while still chasing and suspending a club with a
# different owner, and reproduce production's derived postimage md5. No
# timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261015093202_the_house_does_not_dun_itself_at_the_source.sql
      - supabase/migrations/20260907183130_an_unpaid_statement_ages_and_is_chased.sql
      - supabase/migrations/20261003024413_the_books_close.sql
      - supabase/migrations/20260926042119_the_union_sweep_evaluates_what_the_open_week_can_prove.sql
      - scripts/ci/test-the-house-does-not-dun-itself.py
      - .github/workflows/the-house-does-not-dun-itself.yml

permissions:
  contents: read

concurrency:
  group: the-house-does-not-dun-itself-${{ github.ref }}
  cancel-in-progress: true

jobs:
  the-house-does-not-dun-itself:
    name: The house does not dun itself, a different owner is still chased
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: The house does not dun itself, a different owner is still chased
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-the-house-does-not-dun-itself.py --output artifacts/the-house-does-not-dun-itself
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-house-does-not-dun-itself-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/the-house-does-not-dun-itself/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
