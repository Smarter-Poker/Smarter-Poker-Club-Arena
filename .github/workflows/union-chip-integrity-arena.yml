name: Union chip integrity knows the Diamond Arena

# fn_union_chip_integrity_check() (migration 20261008043038). Runs
# scripts/ci/test-union-chip-integrity-arena.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definition
# captured 2026-10-08 (pg_get_functiondef md5 equal to the live function)
# must report a live Diamond Arena seat and entry as orphan stamps, and the
# migration must clear exactly those, keep every other orphan (dead accounts in
# the arena, strangers in a chip club), leave the other invariants alone and
# reproduce production's derived postimage md5. No timer (CLAUDE.md 10.85):
# pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261008043038_a_diamond_arena_seat_is_not_an_orphan_stamp.sql
      - scripts/ci/fixtures/union-chip-integrity-arena/**
      - scripts/ci/test-union-chip-integrity-arena.py
      - .github/workflows/union-chip-integrity-arena.yml

permissions:
  contents: read

concurrency:
  group: union-chip-integrity-arena-${{ github.ref }}
  cancel-in-progress: true

jobs:
  union-chip-integrity-arena:
    name: A live Diamond Arena seat is not an orphan stamp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: A live Diamond Arena seat is not an orphan stamp
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-union-chip-integrity-arena.py --output artifacts/union-chip-integrity-arena
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: union-chip-integrity-arena-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/union-chip-integrity-arena/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
