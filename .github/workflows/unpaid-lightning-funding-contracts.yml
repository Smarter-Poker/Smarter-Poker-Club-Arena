name: Unpaid Lightning follows original funding

on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/**
      - scripts/ci/fixtures/weekly-quality-source-bags/**
      - scripts/ci/test-weekly-quality-source-bags-postgres.py
      - tests/weekly-quality-retains-all-original-source-proofs.law.test.ts
      - scripts/ci/fixtures/foreign-certificate-cash-cover/**
      - scripts/ci/test-foreign-certificate-cash-cover-postgres.py
      - scripts/ci/test-zero-standalone-foreign-postgres.py
      - scripts/ci/fixtures/zero-standalone-foreign/**
      - tests/foreign-certificates-read-original-cash-cover.law.test.ts
      - scripts/ci/fixtures/outcome-recognition-join-cover/**
      - scripts/ci/test-outcome-recognition-join-cover-postgres.py
      - tests/recognition-window-index-covers-only-hand-join-keys.law.test.ts
      - scripts/ci/fixtures/linked-outcome-window-index/**
      - scripts/ci/test-linked-outcome-window-index-postgres.py
      - tests/linked-outcome-windows-retain-original-proof.law.test.ts
      - scripts/ci/fixtures/standalone-entry-cover/**
      - scripts/ci/test-standalone-entry-cover-postgres.py
      - tests/standalone-entry-retains-historical-first-week.law.test.ts
      - scripts/ci/fixtures/private-deposit-source-cover/**
      - scripts/ci/test-private-deposit-source-cover-postgres.py
      - tests/private-deposit-key-index-keeps-original-sources.law.test.ts
      - scripts/ci/fixtures/weekly-summary-coordinator-scope/**
      - scripts/ci/test-weekly-summary-coordinator-scope-postgres.py
      - tests/weekly-summary-preserves-nullable-source-scope.law.test.ts
      - scripts/ci/fixtures/fees-before-club-books/**
      - scripts/ci/fixtures/weekly-fee-preparation/**
      - scripts/ci/test-weekly-fee-preparation-postgres.py
      - tests/weekly-fees-prepare-before-the-four-am-payment.law.test.ts
      - scripts/ci/fixtures/rakeback-player-week-indexes/**
      - scripts/ci/fixtures/original-week-clubs/**
      - scripts/ci/test-original-week-clubs-cover-postgres.py
      - tests/original-week-clubs-cover-their-source-witness.law.test.ts
      - scripts/ci/migration-concurrent-preamble.mjs
      - scripts/ci/apply-recorded-migration.mjs
      - scripts/ci/test-rakeback-player-week-indexes-postgres.py
      - tests/rakeback-pages-index-player-week.law.test.ts
      - scripts/ci/fixtures/rakeback-counts-bulk-joins/**
      - scripts/ci/test-rakeback-counts-bulk-joins-postgres.py
      - tests/rakeback-counts-read-each-keyset-once.law.test.ts
      - scripts/ci/test-fees-before-club-books-postgres.py
      - tests/rakeback-is-paid-before-club-books-close.law.test.ts
      - scripts/ci/fixtures/earned-plan-window-original.sql
      - scripts/ci/test-earned-window-cardinality-postgres.py
      - tests/earned-window-counts-each-hand-once.law.test.ts
      - scripts/ci/fixtures/unpaid-lightning-funding-contracts.json
      - scripts/ci/fixtures/unpaid-atomic-cash-contract-columns.json
      - scripts/qualification/original-retirement-boundary/**
      - scripts/qualification/original-seven-discharge/**
      - tests/sealed-inventory-reads-the-sealed-state.law.test.ts
      - scripts/ci/test-daily-reporting-attribution-change-postgres.py
      - scripts/ci/fixtures/daily-reporting-original-owners.sql
      - scripts/ci/test-unpaid-lightning-funding-contracts-postgres.py
      - scripts/ci/test-zero-rakeback-wallet-postgres.py
      - scripts/ci/test-existing-transfer-discharge-postgres.py
      - scripts/ci/fixtures/existing-transfer-discharge/**
      - tests/zero-rakeback-receipts-need-no-player-wallet.law.test.ts
      - .github/workflows/unpaid-lightning-funding-contracts.yml
      - tests/unpaid-lightning-follows-original-funding.law.test.ts

permissions:
  contents: read

concurrency:
  group: unpaid-lightning-funding-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unpaid-lightning-funding-contracts:
    name: Unpaid Lightning follows original funding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Unpaid Lightning follows original funding
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-unpaid-lightning-funding-contracts-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}"
      - name: Historical club changes retain exact daily reporting
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-daily-reporting-attribution-change-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}"
      - name: Sealed inventory retains the complete original financial proof
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/qualification/original-retirement-boundary/run-native.py --report-reader-composition-migration supabase/migrations/20261028002753_original_weekly_report_uses_its_qualified_hand_readers.sql --output "${{ runner.temp }}/sealed-inventory-read" --inventory-state-read-migration supabase/migrations/20261026224626_sealed_inventory_reads_the_sealed_state_directly.sql --treasury-seat-gift-migration supabase/migrations/20261027031649_original_treasury_seat_gifts_keep_their_recorded_owner.sql --original-occupancy-flow-migration supabase/migrations/20261027184348_original_cash_returns_use_their_original_occupancy_keys.sql
      - name: Original treasury gifts retain hand ownership and future admission
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: ORB_REPORT_COMPOSITION_NATIVE="$PWD/scripts/qualification/original-retirement-boundary/report-reader-composition/native-report.py" python3 -B scripts/qualification/original-retirement-boundary/treasury-gifts/targeted/native-original-hands.py --reader-composition scripts/qualification/original-retirement-boundary/treasury-gifts/targeted/native-readers.py --output "${{ runner.temp }}/treasury-financial-owners"
      - name: Old queued treasury entry resumes through the current atomic leaf
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/qualification/original-retirement-boundary/treasury-gifts/targeted/common-leaf/run-queued-native.py --output "${{ runner.temp }}/treasury-queued-old-leaf"
      - name: Earned windows retain every complete hand cardinality
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-earned-window-cardinality-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}"
      - name: Earned rakeback precedes guarded club settlement
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-fees-before-club-books-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}"
      - name: Rakeback source windows retain every original proof count
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-rakeback-counts-bulk-joins-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}"
      - name: Closed weekly fees prepare before the four AM payment
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-weekly-fee-preparation-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}"
      - name: Rakeback pages retain exact math with matching player indexes
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-rakeback-player-week-indexes-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}" --output "${{ runner.temp }}/rakeback-player-week-indexes.json"
      - name: Original weekly club witnesses use the matching source cover
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-original-week-clubs-cover-postgres.py --pg-bin "$PG_BIN" --scratch-root "${{ runner.temp }}"
      - name: Zero rakeback receipts preserve every original positive payment guard
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-zero-rakeback-wallet-postgres.py --pg-bin "$PG_BIN" --scratch-root "${{ runner.temp }}"
      - name: Foreign certificates retain all original sources through the cash cover
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-foreign-certificate-cash-cover-postgres.py --pg-bin "$PG_BIN" --scratch-root "${{ runner.temp }}/foreign-certificate-cover" --output "${{ runner.temp }}/foreign-certificate-cover/result.json"
      - name: Original linked hand proof retains every row with recognition-window access
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-linked-outcome-window-index-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}" --output "${{ runner.temp }}/linked-outcome-window-index.json"
      - name: Standalone entry retains its original historical first week
        run: python3 -B scripts/ci/test-standalone-entry-cover-postgres.py --pg-bin /usr/lib/postgresql/17/bin --scratch "${{ runner.temp }}" --output "${{ runner.temp }}/standalone-entry-cover"
      - name: Original outcome recognition windows cover scalar hand join keys
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-outcome-recognition-join-cover-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}" --output "${{ runner.temp }}/outcome-recognition-join-cover.json"

      - name: Weekly quality retains every original source and receipt proof
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-weekly-quality-source-bags-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}" --output "${{ runner.temp }}/weekly-quality-source-bags.json"
      - name: Weekly statements retain exact NULL and non-NULL earning scope
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-weekly-summary-coordinator-scope-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}" --output "${{ runner.temp }}/weekly-summary-coordinator-scope.json"
      - name: Original private deposit key discovery reads scalar source witnesses
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-private-deposit-source-cover-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}" --output "${{ runner.temp }}/private-deposit-source-cover.json"
