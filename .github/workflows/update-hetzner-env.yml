name: Update Hetzner .env (utility)

# ─────────────────────────────────────────────────────────────────────────────
# REWRITTEN 2026-08-15. The previous version of this workflow was the single
# most dangerous file in the repo. Its restart block was:
#
#     docker stop  club-arena-engine || true
#     docker rm    club-arena-engine || true
#     docker run --name club-arena-engine \
#       --restart unless-stopped -p 3001:3001 \
#       --env-file "$ENV_FILE" -d club-arena-engine:latest
#
# Six independent defects, any one of which is an outage:
#   * -p 3001:3001 — the engine listens on 8080. Caddy proxies to 8080. This
#     publishes nothing the proxy can reach: total outage even on success.
#   * :latest — nothing in the current pipeline maintains that tag. It is
#     whatever ancient image the legacy bare-tag build last left behind, or it
#     does not exist, in which case `docker run` fails AFTER the running
#     container has already been destroyed and the engine is simply gone.
#   * no --label autoheal=true — Docker's HEALTHCHECK only sets a status field;
#     the sp-autoheal sidecar watches for that label. Without it the engine's
#     self-healing is switched off silently.
#   * --restart unless-stopped instead of always — does not come back after a
#     daemon restart if the container had been stopped.
#   * no --health-start-period, no log size caps — unbounded json logs fill the
#     disk, which wedges the engine in exactly the way we are guarding against.
#   * `docker stop` with the default 10s grace, already proven too short: it
#     SIGKILLs the engine partway through its hand-state snapshot flush.
#
# It also had no host-key verification while shipping a secret, and no
# concurrency group, so it could fire in the middle of a live deploy.
#
# Everything that may replace, start, or unpause the container now goes through
# the lock-held maintenance-certificate wrapper. engine-up.sh remains the sole
# run-spec implementation, but is never runnable here without that wrapper.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'Env var name to set (e.g. INTERNAL_API_KEY)'
        required: true
        type: string
      confirm:
        description: 'Type "update" to confirm — this restarts the engine'
        required: true
        type: string

# Shares the deploy lock: this restarts the engine, so it must never run
# concurrently with a deploy that is mid-cutover.
concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  update-env:
    name: Update Hetzner .env
    runs-on: ubuntu-latest
    # A dispatch immediately after the hourly safe window may need to wait for
    # the next one. Keep enough room for one complete hour, cutover, proof and
    # the final exact-state guarantee.
    timeout-minutes: 90
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      SSH_USER: root
      REPO_DIR: /opt/club-arena
      ENGINE_URL: https://engine.smarter.poker
      KEY: ${{ github.event.inputs.key }}
      # Exact, run-scoped files in the canonical env directory. The candidate
      # is never a future boot source until the lock-held wrapper has started
      # and verified a process with those bytes. The rollback snapshot remains
      # immutable until every ambiguous transport path has reconciled.
      ENV_CANDIDATE: /opt/club-arena/server/.env.candidate.${{ github.run_id }}.${{ github.run_attempt }}
      ENV_ROLLBACK: /opt/club-arena/server/.env.rollback.${{ github.run_id }}.${{ github.run_attempt }}
      # Fixed host-known recovery authority. The wrapper alone creates/removes
      # it; workflow cleanup must never delete it because it survives a killed
      # runner or host reboot.
      ENV_ROLLBACK_SENTINEL: /opt/club-arena/server/.env.pending-rollback

    steps:
      - name: Confirm
        run: |
          [ "${{ github.event.inputs.confirm }}" = "update" ] \
            || { echo "::error::confirm must be exactly 'update'"; exit 1; }
          [[ "$KEY" =~ ^[A-Z_][A-Z0-9_]*$ ]] \
            || { echo "::error::key must match [A-Z_][A-Z0-9_]* — got '$KEY'"; exit 1; }

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.HETZNER_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts \
            || { echo "::error::HETZNER_HOST_KEY is empty — refusing to ship a secret to an unverified host"; exit 1; }
          printf '#!/bin/bash\nexec ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "%s@%s" "$@"\n' \
            "$SSH_USER" "$HETZNER_HOST" > ~/hssh
          chmod +x ~/hssh

      - name: Update the value
        env:
          SECRET_VALUE: ${{ secrets[format('{0}', github.event.inputs.key)] }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "::error::No repo secret named '$KEY', or it is empty. The old workflow would have written '$KEY=' and reported success."
            exit 1
          fi
          # The value is passed over stdin, never interpolated into the remote
          # command line. Build a candidate and an immutable rollback snapshot;
          # DO NOT replace the canonical .env here. The certificate wrapper is
          # the only process allowed to promote the candidate, and it does so
          # under the same host lock only after the exact restarted engine has
          # passed direct health.
          printf '%s' "$SECRET_VALUE" | ~/hssh "
            set -euo pipefail
            umask 077
            test ! -e '$ENV_ROLLBACK_SENTINEL' || { echo 'FATAL: an interrupted environment transaction still requires host reconciliation'; exit 1; }
            ENV_FILE=$REPO_DIR/server/.env
            test -s \"\$ENV_FILE\" || { echo 'FATAL: .env missing or empty — refusing to edit'; exit 1; }
            cp -p \"\$ENV_FILE\" '$ENV_ROLLBACK'
            cp -p \"\$ENV_FILE\" '$ENV_CANDIDATE'
            VALUE=\$(cat)
            [ -n \"\$VALUE\" ] || { echo 'FATAL: the requested secret is empty'; exit 1; }
            case \"\$VALUE\" in
              *\$'\\n'* | *\$'\\r'*) echo 'FATAL: Docker env-file values must be one line'; exit 1 ;;
            esac
            MATCHES=\$(grep -c '^$KEY=' \"\$ENV_FILE\" || true)
            [ \"\$MATCHES\" -le 1 ] || { echo 'FATAL: canonical .env contains duplicate $KEY entries'; exit 1; }
            grep -v '^$KEY=' '$ENV_CANDIDATE' > '$ENV_CANDIDATE.new'
            printf '%s=%s\n' '$KEY' \"\$VALUE\" >> '$ENV_CANDIDATE.new'
            OLD=\$(wc -l < \"\$ENV_FILE\"); NEW=\$(wc -l < '$ENV_CANDIDATE.new')
            [ \"\$NEW\" -ge \"\$OLD\" ] || { echo \"FATAL: candidate .env has \$NEW lines vs \$OLD — refusing\"; exit 1; }
            mv '$ENV_CANDIDATE.new' '$ENV_CANDIDATE'
            sync -f '$ENV_ROLLBACK' '$ENV_CANDIDATE'
            cmp -s '$ENV_ROLLBACK' \"\$ENV_FILE\" || { echo 'FATAL: canonical .env changed while the candidate was staged'; exit 1; }
            echo \"OK: staged a \$(grep -c . '$ENV_CANDIDATE')-line candidate for $KEY; canonical .env is unchanged\"
          "

      - name: Restart inside an exact durable maintenance window
        id: restart
        run: |
          # A five-minute certificate appears once per hour. Exit 75 is the
          # wrapper's reserved proof that it refused before any host mutation,
          # so it is safe to wait for the next certificate. Every other failure
          # ends the loop immediately: 76 proves mutation was attempted, while
          # another status leaves the transport outcome unknown.
          WAIT_BUDGET_SECONDS=3900
          WAIT_STARTED_AT=$(date +%s)
          echo "state=awaiting_certificate" >> "$GITHUB_OUTPUT"
          while :; do
            set +e
            ~/hssh "timeout --foreground --signal=TERM --kill-after=180s 600s env \
              IMAGE=club-arena-engine:current CONTAINER=club-arena-engine \
              ENV_FILE=$ENV_CANDIDATE ROLLBACK_ENV_FILE=$ENV_ROLLBACK \
              CERTIFICATE_ENV_FILE=$ENV_ROLLBACK \
              PROMOTE_ENV_FILE_TO=$REPO_DIR/server/.env \
              PUBLIC_HEALTH_URL=$ENGINE_URL/health \
              LOCK_WAIT_S=30 MIN_BREAK_LEFT_MS=180000 \
              ENGINE_UP_SCRIPT=$REPO_DIR/server/scripts/engine-up.sh \
              $REPO_DIR/server/scripts/engine-up-with-maintenance-certificate.sh"
            WRAPPER_STATUS=$?
            set -e

            if [ "$WRAPPER_STATUS" -eq 0 ]; then
              echo "state=completed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$WRAPPER_STATUS" -eq 75 ]; then
              NOW=$(date +%s)
              if [ $((NOW - WAIT_STARTED_AT)) -ge "$WAIT_BUDGET_SECONDS" ]; then
                echo "state=clean_refused" >> "$GITHUB_OUTPUT"
                echo "::error::No exact durable maintenance certificate appeared within ${WAIT_BUDGET_SECONDS}s; the engine was not mutated"
                exit 75
              fi
              echo "No exact certificate yet; the wrapper refused before mutation. Retrying in 15s."
              sleep 15
              continue
            fi
            if [ "$WRAPPER_STATUS" -eq 76 ]; then
              echo "state=mutation_attempted" >> "$GITHUB_OUTPUT"
            else
              echo "state=transport_unknown" >> "$GITHUB_OUTPUT"
            fi
            echo "::error::Maintenance-gated restart failed with status $WRAPPER_STATUS"
            exit "$WRAPPER_STATUS"
          done

      - name: Verify
        run: |
          [ "${{ steps.restart.outputs.state }}" = "completed" ] \
            || { echo "::error::Restart lacks the wrapper's exact completed state"; exit 1; }
          for i in $(seq 1 24); do
            sleep 5
            if curl -sf --max-time 10 "$ENGINE_URL/health" | grep -q '"running":true'; then
              echo "Engine healthy on attempt $i"; exit 0
            fi
            echo "attempt $i: not ready"
          done
          echo "::error::Engine did not come back after the env change"
          ~/hssh "docker logs --tail 120 club-arena-engine" || true
          exit 1

      - name: GUARANTEE the exact current engine is running
        id: guarantee
        # A clean exit-75 refusal is affirmative evidence that no mutation
        # began; running recovery then would turn a safe refusal into an
        # unauthorized restart. Recovery is legal only after the wrapper
        # completed, reported a post-mutation failure, or SSH left the outcome
        # genuinely unknown.
        if: >-
          ${{ always() &&
              (steps.restart.outputs.state == 'completed' ||
               steps.restart.outputs.state == 'mutation_attempted' ||
               steps.restart.outputs.state == 'transport_unknown') }}
        run: |
          # A hard-killed wrapper can leave a restart=no candidate. Reconcile
          # that durable uncommitted marker from the canonical env before the
          # exact ensure-only proof; never start or unpause the candidate.
          ~/hssh "$REPO_DIR/server/scripts/engine-supervisor.sh"
          ~/hssh "timeout --foreground --signal=TERM --kill-after=180s 600s env \
            IMAGE=club-arena-engine:current CONTAINER=club-arena-engine \
            ENV_FILE=$REPO_DIR/server/.env RECOVER_IF_NOT_RUNNING=1 ENSURE_RUNNING_ONLY=1 \
            LOCK_WAIT_S=180 ENGINE_UP_SCRIPT=$REPO_DIR/server/scripts/engine-up.sh \
            $REPO_DIR/server/scripts/engine-up-with-maintenance-certificate.sh"

      - name: Remove run-scoped environment transaction files
        if: always()
        env:
          RESTART_STATE: ${{ steps.restart.outputs.state }}
          GUARANTEE_OUTCOME: ${{ steps.guarantee.outcome }}
        run: |
          # A lost SSH transport can leave the wrapper finishing its own
          # host-local rollback. Wait on the same flock before deleting either
          # exact transaction file, so cleanup can never pull an env file out
          # from under a still-running recovery.
          if [ -x ~/hssh ]; then
            ~/hssh "
              set -euo pipefail
              exec 9>/var/lock/club-arena-engine-up.lock
              flock -w 360 9
              SAFE_TO_DELETE=false
              case '$RESTART_STATE:$GUARANTEE_OUTCOME' in
                completed:* | clean_refused:* | :* | *:success) SAFE_TO_DELETE=true ;;
                *)
                  cmp -s '$ENV_ROLLBACK' '$REPO_DIR/server/.env' && SAFE_TO_DELETE=true
                  ;;
              esac
              if [ -e '$ENV_ROLLBACK_SENTINEL' ]; then
                SAFE_TO_DELETE=false
                echo 'WARNING: durable rollback reconciliation is still pending; preserving run-scoped evidence'
              fi
              if [ "\$SAFE_TO_DELETE" = true ]; then
                rm -f -- '$ENV_CANDIDATE' '$ENV_CANDIDATE.new' '$ENV_CANDIDATE.replace' \
                  '$ENV_ROLLBACK' '$ENV_ROLLBACK.replace'
              else
                echo 'WARNING: preserving the run-scoped rollback snapshot because terminal environment state was not proved'
              fi
            " || echo '::warning::Could not remove the run-scoped env transaction files; neither path is a boot source.'
          fi

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/hssh
