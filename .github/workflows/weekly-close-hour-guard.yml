name: Weekly close follows daily maintenance

on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/**
      - scripts/ci/fixtures/weekly-quality-typed-source-maps/**
      - scripts/ci/test-weekly-quality-typed-source-maps-postgres.py
      - tests/weekly-quality-typed-source-maps-preserve-verdicts.law.test.ts
      - scripts/ci/fixtures/payout-receipt-payer-reuse/**
      - scripts/ci/test-payout-receipt-payer-reuse-postgres.py
      - scripts/ci/test-readonly-payer-receipts-postgres.py
      - scripts/ci/fixtures/leaderboard-monday/**
      - scripts/ci/test-leaderboard-monday-postgres.py
      - scripts/ci/fixtures/weekly-close-hour-guard/**
      - scripts/ci/test-weekly-close-hour-guard-postgres.py
      - .github/workflows/weekly-close-hour-guard.yml
      - tests/the-weekly-close-follows-the-actual-freeze.law.test.ts

permissions:
  contents: read

concurrency:
  group: weekly-close-hour-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-close-hour-guard:
    name: Weekly close follows daily maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Weekly close follows daily maintenance
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-weekly-close-hour-guard-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}"
      - name: Deferred payout receipts retain fresh financial checks
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-payout-receipt-payer-reuse-postgres.py --pg-bin "$PG_BIN" --scratch-root "${{ runner.temp }}"
      - name: Read-only receipts retain the original pure payer reader
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-readonly-payer-receipts-postgres.py --pg-bin "$PG_BIN" --scratch-root "${{ runner.temp }}"
      - name: Leaderboards pay Monday at 02 Chicago across DST
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-leaderboard-monday-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}"
      - name: Weekly quality preserves exact source bags through typed aggregate maps
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-weekly-quality-typed-source-maps-postgres.py --rr-membership-candidate supabase/migrations/20261028185823_weekly_quality_reads_exact_event_aggregate_maps.sql --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}" --output "${{ runner.temp }}/weekly-quality-typed-source-maps.json"
