<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Textarea Tool</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #0ff;
        }

        .container {
            position: relative;
            width: 95%;
            max-width: 800px;
            margin: 0 auto;
            aspect-ratio: 1024 / 682;
        }

        .frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .textarea {
            position: absolute;
            background: rgba(0, 40, 80, 0.5);
            border: 2px solid #0ff;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            padding: 16px;
            resize: none;
            pointer-events: auto;
        }

        .drag-handle {
            position: absolute;
            background: #0ff;
            color: #000;
            padding: 4px 8px;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            cursor: move;
            user-select: none;
            z-index: 10;
        }

        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: #0ff;
            cursor: nwse-resize;
        }

        .coords {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border: 1px solid #0ff;
            font-size: 12px;
            line-height: 1.6;
        }

        .coords div {
            margin: 5px 0;
        }

        .coords strong {
            color: #0f0;
        }
    </style>
</head>

<body>
    <div class="coords" id="coords">
        <div><strong>Position:</strong> <span id="pos">-</span></div>
        <div><strong>Size:</strong> <span id="size">-</span></div>
        <div><strong>CSS:</strong></div>
        <div id="css" style="color: #ff0; font-size: 11px;"></div>
    </div>

    <div class="container" id="container">
        <img src="images/logo-generator-frame.png" alt="Frame" class="frame">
        <div class="drag-handle" id="dragHandle">⋮⋮ DRAG TO MOVE ⋮⋮</div>
        <textarea class="textarea" id="textarea"
            placeholder="e.g., A fierce shark with glowing eyes, cyberpunk style..."></textarea>
        <div class="resize-handle" id="resize"></div>
    </div>

    <script>
        const container = document.getElementById('container');
        const textarea = document.getElementById('textarea');
        const dragHandle = document.getElementById('dragHandle');
        const resize = document.getElementById('resize');
        const coords = document.getElementById('coords');

        // Initial position (current values)
        let top = 24; // percentage
        let left = 12; // percentage
        let width = 76; // percentage
        let height = 52; // percentage

        function updatePosition() {
            // Position drag handle above textarea
            dragHandle.style.top = (top - 3) + '%';
            dragHandle.style.left = left + '%';
            dragHandle.style.width = width + '%';

            // Position textarea
            textarea.style.top = top + '%';
            textarea.style.left = left + '%';
            textarea.style.width = width + '%';
            textarea.style.height = height + '%';

            // Position resize handle at bottom-right of textarea
            resize.style.top = (top + height - 1) + '%';
            resize.style.left = (left + width - 1) + '%';

            document.getElementById('pos').textContent = `top: ${top.toFixed(1)}%, left: ${left.toFixed(1)}%`;
            document.getElementById('size').textContent = `width: ${width.toFixed(1)}%, height: ${height.toFixed(1)}%`;
            document.getElementById('css').innerHTML = `
                top: ${top.toFixed(1)}%;<br>
                left: ${left.toFixed(1)}%;<br>
                width: ${width.toFixed(1)}%;<br>
                height: ${height.toFixed(1)}%;
            `;
        }

        // Dragging via drag handle
        let isDragging = false;
        let startX, startY, startTop, startLeft;

        dragHandle.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startTop = top;
            startLeft = left;
            e.preventDefault();
        });

        // Resizing
        let isResizing = false;
        let startWidth, startHeight;

        resize.addEventListener('mousedown', (e) => {
            isResizing = true;
            startX = e.clientX;
            startY = e.clientY;
            startWidth = width;
            startHeight = height;
            e.preventDefault();
            e.stopPropagation();
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const containerRect = container.getBoundingClientRect();
                const deltaX = ((e.clientX - startX) / containerRect.width) * 100;
                const deltaY = ((e.clientY - startY) / containerRect.height) * 100;

                left = Math.max(0, Math.min(100 - width, startLeft + deltaX));
                top = Math.max(3, Math.min(100 - height, startTop + deltaY));

                updatePosition();
            } else if (isResizing) {
                const containerRect = container.getBoundingClientRect();
                const deltaX = ((e.clientX - startX) / containerRect.width) * 100;
                const deltaY = ((e.clientY - startY) / containerRect.height) * 100;

                width = Math.max(10, Math.min(100 - left, startWidth + deltaX));
                height = Math.max(10, Math.min(97 - top, startHeight + deltaY));

                updatePosition();
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            isResizing = false;
        });

        // Initialize
        updatePosition();
    </script>
</body>

</html>
