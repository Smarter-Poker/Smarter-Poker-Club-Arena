<body>
  <div id="root"></div>

  <!-- ═══════════════════════════════════════════════════════════════════════
       INLINE AUTH ACK — MUST run BEFORE the Vite module bundle
       ═══════════════════════════════════════════════════════════════════════
       This inline script handles the World Hub ↔ Club Arena auth handshake
       INDEPENDENTLY of the React app. If the module bundle fails to parse
       or evaluate (any import throws), this still fires.
       ═══════════════════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      // Only run in iframe context
      if (window.parent === window) return;

      // Storage for auth received before React mounts
      window.__EARLY_AUTH__ = { token: null, refreshToken: null, settings: null };

      // ═══════════════════════════════════════════════════════════════════════
      // UNCONDITIONAL ACK — Always tell parent we're alive and ready.
      // ═══════════════════════════════════════════════════════════════════════
      // The parent's ClubArenaEmbed shows "Connection Problem" if it doesn't
      // receive SMARTER_AUTH_ACK within its retry window. The ACK means
      // "iframe loaded and is handling auth" — NOT "user is authenticated."
      //
      // Actual auth is handled by:
      //   1. SSO via shared localStorage ('smarter-poker-auth' storageKey)
      //   2. postMessage token from parent (when parent's getUser() works)
      //   3. Supabase autoRefreshToken (refreshes expired tokens automatically)
      //   4. AuthGuard (redirects to /auth if all else fails)
      //
      // The parent's getUser() can fail with AbortError, preventing it from
      // sending SMARTER_AUTH_TOKEN. If we only ACK after receiving the token,
      // we deadlock. By ACKing unconditionally, the parent dismisses its
      // overlay and the iframe handles auth through the 4 mechanisms above.
      // ═══════════════════════════════════════════════════════════════════════

      // Listen for auth tokens from parent (still needed for non-SSO scenarios)
      window.addEventListener('message', function(event) {
        var data = event.data;
        if (!data || typeof data !== 'object') return;
        if (data.type !== 'SMARTER_AUTH_TOKEN' || !data.token) return;

        // SECURITY: Validate origin — aligned with parentOrigin.ts isTrustedOrigin()
        // FIX 6: Centralized origin list, fixed subdomain check to prevent spoofing
        var o = event.origin;
        var ok = (o === 'https://smarter.poker') ||
                 (o === 'https://www.smarter.poker') ||
                 (o === 'http://localhost:3000') ||
                 (o === window.location.origin);
        // Subdomain check: must be exactly *.smarter.poker (not evil-smarter.poker)
        if (!ok && o.indexOf('https://') === 0) {
          var host = o.substring(8); // strip https://
          var suffix = '.smarter.poker';
          ok = host.length > suffix.length && host.substring(host.length - suffix.length) === suffix;
        }
        if (!ok) return;
        window.__EARLY_AUTH__.token = data.token;
        window.__EARLY_AUTH__.refreshToken = data.refreshToken || null;
        window.__EARLY_AUTH__.settings = data.settings || null;

        // Re-ACK when token arrives — use validated origin (not '*')
        // FIX 6: Store validated origin for all future postMessage calls
        window.__PARENT_ORIGIN__ = event.origin;
        try { window.parent.postMessage({ type: 'SMARTER_AUTH_ACK' }, event.origin); } catch(e) {}
        console.log('[INLINE-AUTH] Token received from parent, ACK sent to ' + event.origin);
      });

      // ── Immediate ACK + pulse ──
      // FIX 6: Use document.referrer origin or fallback to 'https://smarter.poker'
      // instead of wildcard '*' (which leaks data to any embedder).
      var _ackOrigin = 'https://smarter.poker'; // safe default
      try {
        if (document.referrer) {
          var _refUrl = new URL(document.referrer);
          _ackOrigin = _refUrl.origin;
        }
      } catch(e) {}

      // Send ACK right now AND every 500ms for 30s to ensure parent receives it
      // regardless of timing (parent may start retry loop before our first ACK).
      try {
        window.parent.postMessage({ type: 'SMARTER_AUTH_ACK' }, _ackOrigin);
        window.parent.postMessage({ type: 'CLUB_ARENA_HEARTBEAT' }, _ackOrigin);
        console.log('[INLINE-AUTH] Immediate ACK + heartbeat sent to ' + _ackOrigin);
      } catch(e) {}

      var pulses = 0;
      var pulse = setInterval(function() {
        if (pulses > 60) { clearInterval(pulse); return; }
        pulses++;
        // Use stored parent origin if available (set when token received), else referrer origin
        var target = window.__PARENT_ORIGIN__ || _ackOrigin;
        try {
          window.parent.postMessage({ type: 'SMARTER_AUTH_ACK' }, target);
          window.parent.postMessage({ type: 'CLUB_ARENA_HEARTBEAT' }, target);
        } catch(e) {}
      }, 500);
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
