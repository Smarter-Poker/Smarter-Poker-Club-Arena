<body>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>

  <!-- SELF-HEALING: Detect Next.js soft-navigation black screen and auto-recover.
       When the World Hub navigates here via client-side routing, type="module" scripts
       don't re-execute, leaving #root empty. This inline script detects that condition
       and forces a full page reload to properly boot the SPA. -->
  <script>
    (function() {
      var CHECK_DELAY = 2500;
      var MAX_RETRIES = 3;
      var RETRY_KEY = '__club_arena_recovery';
      var retryCount = 0;
      try { retryCount = parseInt(sessionStorage.getItem(RETRY_KEY) || '0', 10); } catch(e) {}

      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.childNodes.length === 0 && retryCount < MAX_RETRIES) {
          try { sessionStorage.setItem(RETRY_KEY, String(retryCount + 1)); } catch(e) {}

          // On first retry, nuke stale service worker caches that may be causing blank pages
          if (retryCount === 0 && 'caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(key) { caches.delete(key); });
            }).catch(function() {});
          }

          // On second retry, also unregister the service worker entirely
          if (retryCount >= 1 && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) { reg.unregister(); });
            }).catch(function() {});
          }

          // Small delay to let cache/SW cleanup finish before reload
          setTimeout(function() { window.location.reload(); }, retryCount > 0 ? 500 : 100);
        } else if (retryCount >= MAX_RETRIES) {
          try { sessionStorage.removeItem(RETRY_KEY); } catch(e) {}
          // Last resort: show a visible error so the page isn't just blank
          if (root && root.childNodes.length === 0) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a1a;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:2rem"><div><h1 style="font-size:1.5rem;margin-bottom:1rem">Loading failed</h1><p style="color:rgba(255,255,255,0.6);margin-bottom:1.5rem">Please clear your browser cache and reload.</p><button onclick="caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})});location.reload()" style="padding:10px 24px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:1rem;cursor:pointer">Clear Cache & Reload</button></div></div>';
          }
        }
      }, CHECK_DELAY);

      // Clear retry counter on successful mount
      var observer = new MutationObserver(function(mutations, obs) {
        var root = document.getElementById('root');
        if (root && root.childNodes.length > 0) {
          try { sessionStorage.removeItem(RETRY_KEY); } catch(e) {}
          obs.disconnect();
        }
      });
      var rootEl = document.getElementById('root');
      if (rootEl) { observer.observe(rootEl, { childList: true }); }
    })();
  </script>
