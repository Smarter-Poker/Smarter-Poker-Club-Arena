<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link

      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>"
    />
    <link rel="manifest" href="/manifest.json" />
    <!-- Root-relative so Vite rewrites it for whichever base this bundle is
       built with (web sub-path or native root), like the manifest above. -->
    <link rel="apple-touch-icon" href="/poker-chip-logo.png" />
    <!-- PINCH-ZOOM RESTORED 2026-08-23 (Dan approved). This carried
       `maximum-scale=1.0, user-scalable=no`, which disabled pinch-zoom for
       everyone — a WCAG 1.4.4 failure, and on iOS it is what was masking the
       real bug: any text field under 16px makes Safari auto-zoom on focus and
       never zoom back. The lock hid that symptom instead of fixing it.

       Every text field is now at least 16px at phone width (56 rules fixed at
       source across PRs #380/#391/#408), so the auto-zoom cannot fire and the
       lock has nothing left to hold back. tests/e2e/mobile-input-zoom.spec.ts
       fails CI if a sub-16px field ever comes back — do not re-add the lock,
       fix the field. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Create Or Join A Private Online Poker Club On Smarter.Poker. Real Time Cash Games, Tournaments, Hand Histories, Player Stats, Leaderboards, Unions And Full Club Management." />
  <!-- DISCOVERABILITY 2026-09-16: this said `noindex, nofollow`, which told
       Google to drop every Poker Arena page. The static head now describes the
       public landing page and is indexable; src/lib/seo.ts rewrites title,
       description, canonical, robots and JSON-LD per route at render time, and
       flips every signed-in route back to noindex. Do not put noindex back
       here: it applies to the whole arena, not to one page. -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://smarter.poker/hub/club-arena" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Poker Arena" />

  <!-- Open Graph / Social Sharing -->

  <meta property="og:site_name" content="Smarter.Poker" />
  <meta property="og:title" content="Poker Arena | Private Online Poker Clubs | Smarter.Poker" />

  <meta property="og:image:width" content="1200" />

    content="Create Or Join A Private Online Poker Club. Real Time Cash Games, Tournaments, Hand Histories, Player Stats, Leaderboards And Club Management." />
  <meta name="twitter:image" content="https://smarter.poker/images/og-card.jpg" />

  <!-- Structured data for the landing page. Mirrors src/lib/seo.ts, which
       replaces this block per route once the app has booted. Kept static so
       crawlers that do not run JavaScript still get it. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://smarter.poker/#organization",
        "name": "Smarter.Poker",
        "url": "https://smarter.poker",
        "logo": "https://smarter.poker/smarter-poker-logo.png"
      },
      {
        "@type": "SoftwareApplication",
        "@id": "https://smarter.poker/hub/club-arena#app",
        "name": "Poker Arena",
        "alternateName": ["Club Arena", "Smarter.Poker Club Arena"],
        "url": "https://smarter.poker/hub/club-arena",
        "applicationCategory": "GameApplication",
        "applicationSubCategory": "Poker",
        "operatingSystem": "Web, iOS, Android",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "publisher": { "@id": "https://smarter.poker/#organization" },
        "description": "Private Online Poker Clubs On Smarter.Poker With Real Time Cash Games And Tournaments, Hand Histories, Player Statistics, Leaderboards, Unions And Full Club Management."
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Smarter.Poker", "item": "https://smarter.poker" },
          { "@type": "ListItem", "position": 2, "name": "Poker Arena", "item": "https://smarter.poker/hub/club-arena" }
        ]
      }
    ]
  }
  </script>

    <title>Poker Arena | Private Online Poker Clubs | Smarter.Poker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- PERF 2026-08-22: preconnect to Supabase — every boot's first real work is
       auth (getSession → token refresh) + data fetches against this origin.
       Warming DNS+TLS in parallel with JS download saves 100-300ms on mobile. -->
    <link rel="preconnect" href="https://kuklfnapbkmacvwxktbh.supabase.co" crossorigin />
    <!-- PERF 2026-08-22: Google Fonts stylesheet loads ASYNC (media=print swap
       trick) instead of render-blocking. display=swap already renders text in
       fallback fonts, so nothing waits on this fetch anymore. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@700;800&family=Rajdhani:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@700;800&family=Rajdhani:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Global stylesheets. These two <link rel="preload"> tags are NOT dead:
       Vite treats a root-relative /src/*.css reference in index.html as an
       entry stylesheet and bundles it into the index CSS, and this is the
       ONLY way globals.css (.btn, .card, .badge, .input, .skip-link ...) and
       design-tokens.css reach the bundle - no TSX imports them. Removing
       them on 2026-09-07 silently dropped 18 kB of rules from production CSS;
       the entry-chunk gate caught it. Leave them. -->
    <link rel="preload" href="/src/styles/globals.css" as="style" />
    <link rel="preload" href="/src/styles/design-tokens.css" as="style" />
    <!-- Preload club card frame template (used by carousel) -->
    <link rel="preload" href="/images/club-card-frame-template.webp" as="image" type="image/webp" />

    <!-- No third-party push SDK is loaded here, deliberately. OneSignal was
       retired 2026-08-19 and this loader was left behind until 2026-08-29,
       fetching its SDK and pinging the vendor on every session for a feature
       it no longer provided. Full story: docs/changelog/2026-08-29-onesignal-was-still-loading.md
       Push enrolment is src/lib/pushClient.ts against the ROOT service worker. -->
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- SELF-HEALING: Detect Next.js soft-navigation black screen and auto-recover.
       When the World Hub navigates here via client-side routing, type="module" scripts
       don't re-execute, leaving #root empty. This inline script detects that condition
       and forces a full page reload to properly boot the SPA.

       Dan 2026-04-17: Mobile cold boot with 100+ lazy chunks can take 5-8s. The
       old 2500ms check was triggering false-positive reloads every 20s on phones.
       Raised CHECK_DELAY to 10000ms. Also added a boot sentinel (window.__CLUB_ARENA_BOOTING__)
       that main.tsx sets on import — if the sentinel is set, the self-heal stands
       down because React has started (even if mount hasn't finished yet). -->
    <script>
      (function () {
        var CHECK_DELAY = 10000;
        var MAX_RETRIES = 2;
        // NATIVE (2026-09-07): inside the Capacitor shell there is no World Hub
        // soft-navigation to heal, no cache to nuke and no service worker to
        // unregister. A reload loop here would only mask a real boot failure
        // behind two silent restarts. Zero retries: go straight to the visible
        // error, and let the player relaunch. The bridge is injected before
        // any page script runs, so this check is reliable at this point.
        var NATIVE = false;
        try {
          NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        } catch (e) {}
        if (NATIVE) MAX_RETRIES = 0;
        // The one class every native-only stylesheet rule hangs off
        // (src/styles/club-engine.css, "THE APP"). Set here, before any CSS
        // applies, so there is no frame where the document rubber-bands.
        if (NATIVE) document.documentElement.classList.add('ca-native');
        var RETRY_KEY = '__club_arena_recovery';
        var retryCount = 0;
        try {
          retryCount = parseInt(sessionStorage.getItem(RETRY_KEY) || '0', 10);
        } catch (e) {}

        setTimeout(function () {
          var root = document.getElementById('root');
          // Only reload if: (a) #root is empty, AND (b) main.tsx never even imported.
          // The sentinel flips to true the moment main.tsx runs. If it's true, React
          // is booting — just slow. Don't reload, or we'll thrash the chunk loader.
          var mainNeverStarted = !window.__CLUB_ARENA_BOOTING__;
          if (
            root &&
            root.childNodes.length === 0 &&
            mainNeverStarted &&
            retryCount < MAX_RETRIES
          ) {
            try {
              sessionStorage.setItem(RETRY_KEY, String(retryCount + 1));
            } catch (e) {}

            // On first retry, nuke stale service worker caches that may be causing blank pages
            if (retryCount === 0 && 'caches' in window) {
              caches
                .keys()
                .then(function (keys) {
                  keys.forEach(function (key) {
                    caches.delete(key);
                  });
                })
                .catch(function () {});
            }

            // On second retry, also unregister the service worker entirely
            if (retryCount >= 1 && 'serviceWorker' in navigator) {
              navigator.serviceWorker
                .getRegistrations()
                .then(function (regs) {
                  regs.forEach(function (reg) {
                    reg.unregister();
                  });
                })
                .catch(function () {});
            }

            // Small delay to let cache/SW cleanup finish before reload
            setTimeout(
              function () {
                window.location.reload();
              },
              retryCount > 0 ? 500 : 100
            );
          } else if (
            retryCount >= MAX_RETRIES &&
            root &&
            root.childNodes.length === 0 &&
            mainNeverStarted
          ) {
            try {
              sessionStorage.removeItem(RETRY_KEY);
            } catch (e) {}
            // Last resort: show a visible error so the page isn't just blank
            root.innerHTML = NATIVE
              ? '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a1a;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:2rem"><div><h1 style="font-size:1.5rem;margin-bottom:1rem">Loading Failed</h1><p style="color:rgba(255,255,255,0.6);margin-bottom:1.5rem">Please Close And Reopen The App.</p><button onclick="location.reload()" style="padding:10px 24px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:1rem;cursor:pointer">Try Again</button></div></div>'
              : '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a1a;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:2rem"><div><h1 style="font-size:1.5rem;margin-bottom:1rem">Loading Failed</h1><p style="color:rgba(255,255,255,0.6);margin-bottom:1.5rem">Please Clear Your Browser Cache And Reload.</p><button onclick="caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})});location.reload()" style="padding:10px 24px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:1rem;cursor:pointer">Clear Cache & Reload</button></div></div>';
          }
        }, CHECK_DELAY);

        // Clear retry counter on successful mount
        var observer = new MutationObserver(function (mutations, obs) {
          var root = document.getElementById('root');
          if (root && root.childNodes.length > 0) {
            try {
              sessionStorage.removeItem(RETRY_KEY);
            } catch (e) {}
            obs.disconnect();
          }
        });
        var rootEl = document.getElementById('root');
        if (rootEl) {
          observer.observe(rootEl, { childList: true });
        }
      })();
    </script>
  </body>
</html>
