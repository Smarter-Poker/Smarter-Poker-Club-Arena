# ═══════════════════════════════════════════════════════════════════════════
# QUARANTINED ALERT RULES — disabled 2026-08-15
#
# These rules reference metrics that DO NOT EXIST in this Prometheus. They were
# loaded and silently evaluated to nothing, which is worse than not having them:
# a dashboard full of green "no alerts firing" panels implied coverage that was
# never there. On 2026-08-15 ten tables froze and no alert was capable of firing.
#
# To re-enable any block, deploy the exporter it needs and move it back into
# alert-rules.yml:
#
#   PostgresConnectionsSaturated / PostgresReplicationLagHigh / PostgresDown
#       -> needs postgres_exporter pointed at Supabase.
#          Supabase does not expose a Postgres exporter on the pooler; use the
#          Supabase metrics endpoint or drop these permanently.
#
#   WorldHubApiDown / ClubArenaApiDown / VercelApiLatencyHigh
#       -> needs blackbox_exporter (probe_success, probe_duration_seconds)
#          plus a scrape job with the target URLs.
#
#   CronLagHigh / CronFailedRunSpike
#       -> needs the cron-health-server (infra/monitoring/cron-health.service)
#          running and scraped; it emits cron_last_run_timestamp /
#          cron_runs_failed_total. It is NOT currently in the scrape config.
#
# Nothing in this file is evaluated. Prometheus only loads rule_files listed in
# prometheus.yml, and this filename is deliberately not listed.
# ═══════════════════════════════════════════════════════════════════════════

groups:
  - name: quarantined-needs-exporters
    interval: 60s
    rules:

      - alert: PostgresConnectionsSaturated
        expr: |
          (sum by (instance) (pg_stat_database_numbackends))
          / on(instance) pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Supabase connections >80% of pool"
          description: |
            Pool is {{ $value | humanize }}% full. Any spike will 5xx. Common
            cause: an API route leaking connections or Vercel's pooler client
            not being reused.

      - alert: PostgresReplicationLagHigh
        expr: pg_replication_lag_seconds > 30
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Supabase replica lag >30s on {{ $labels.instance }}"

      - alert: PostgresDown
        expr: up{job="supabase_pg"} == 0
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "postgres_exporter unreachable"
          description: |
            Either the exporter sidecar died or Supabase is not accepting
            connections from the pooler subnet. Player-facing impact:
            probable site-wide 5xx.

      - alert: WorldHubApiDown
        expr: probe_success{instance="https://smarter.poker/api/health"} == 0
        for: 2m
        labels:
          severity: critical
          component: world-hub
        annotations:
          summary: "World Hub /api/health returning non-2xx"

      - alert: ClubArenaApiDown
        expr: probe_success{instance="https://smarter.poker/api/club-arena/health"} == 0
        for: 2m
        labels:
          severity: critical
          component: club-arena
        annotations:
          summary: "Club Arena health endpoint returning non-2xx"

      - alert: VercelApiLatencyHigh
        expr: probe_duration_seconds > 2
        for: 5m
        labels:
          severity: warning
          component: vercel
        annotations:
          summary: "Vercel API probe >2s on {{ $labels.instance }}"

      - alert: CronLagHigh
        # cron-01 sets cron_last_run_timestamp after each job. If the most
        # recent run is more than 15min behind the expected schedule we have
        # a stuck cron.
        expr: (time() - max by (job_name) (cron_last_run_timestamp)) > 900
        for: 5m
        labels:
          severity: warning
          component: cron
        annotations:
          summary: "Cron job {{ $labels.job_name }} has not run in >15 min"
          description: |
            Expected frequency exceeded. Check /var/log/cron on cron-01 and
            `systemctl status smarter-poker-{{ $labels.job_name }}.timer`.

      - alert: CronFailedRunSpike
        expr: rate(cron_runs_failed_total[30m]) > 0.05
        for: 10m
        labels:
          severity: warning
          component: cron
        annotations:
          summary: "Cron {{ $labels.job_name }} failure rate >5%/30min"
