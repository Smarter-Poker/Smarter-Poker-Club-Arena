# Alert rules — smarter.poker monitoring stack
# Phase 5.1.3
#
# Severity ladder:
#   critical → page oncall via PagerDuty (routed in alertmanager.yml)
#   warning  → Slack #alerts-ops channel
#   info     → Slack #alerts-info (mostly informational, e.g. deploy markers)
#
# Burn-rate philosophy: most latency alerts use the Google SRE multi-window
# multi-burn-rate recipe (1h + 6h windows) so we don't flap on transient
# spikes but still catch sustained degradation within ~30 minutes.

groups:
  - name: engine-health
    interval: 15s
    rules:
      # 2026-08-15: was `up{job="engine_pm2"}`. No scrape config anywhere
      # defines that job — the real one is `engine_game_server` — so this
      # alert could never fire. It was the platform's primary "the engine is
      # dead" signal and it had never been capable of firing.
      # Superseded by EngineScrapeDown in engine-freeze-rules.yml; kept here
      # (corrected) so the SLO rules that reference this job still resolve.
      - alert: EngineDown
        expr: up{job="engine_game_server"} == 0
        for: 1m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'Poker engine unreachable on {{ $labels.instance }}'
          description: |
            pm2-metrics has been unreachable for >1 minute. This means either
            the pm2 process is dead, the node is down, or the metrics module
            crashed. Player-facing impact: active tables cannot tick.
          runbook: https://monitor.smarter.poker/runbooks/engine-down

      - alert: EngineHandsPerSecDropped
        # Hands/sec should average > 0.5 during business hours. A sustained
        # zero during peak means the dealer loop is stuck even though pm2
        # is still "up".
        # 2026-08-15: was `poker_engine_hands_played_total`, which the engine
        # does not emit (the real metric is `poker_hands_dealt_total`). Also
        # the hour() clause was unsatisfiable: `hour() >= 13 and hour() < 6`
        # is never true. Both corrected; see EngineHandsStopped in
        # engine-freeze-rules.yml for the always-on variant.
        # 2026-09-07: carries the break guard now. CLAUDE.md 13 rule 6 -
        # "fleet-level alert rules carry the break guard, or they page hourly
        # about a stop we scheduled". This one never had it, and only escaped
        # paging hourly because `poker_hands_dealt_total` was pinned at 100 and
        # `increase(...)` was permanently 0, so the alert was ALSO permanently
        # true and long since muted. Both halves are fixed; see the long note
        # on EngineHandsStopped in engine-freeze-rules.yml for why the
        # threshold stays at zero.
        expr: |
          sum(increase(poker_hands_dealt_total[5m])) == 0
          and sum(poker_active_players) > 1
          # `unless on()`, not a bare `unless`: this expression aggregates its
          # left side away from {job, instance}, and `unless` matches on the
          # EXACT label set - so a plain one finds no matching series and
          # guards nothing. alert-rules.yml's engine-core group already says
          # this in as many words; these three had it wrong.
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'Engine has played zero hands in the last 10 minutes'
          description: |
            No hands played during peak hours. Likely the dealer tick is
            blocked. Check engine-01 logs and pm2 list.

            A TOTAL stop only. An engine that is crawling rather than stopped
            is EngineFleetThroughputCollapsed.

      - alert: EngineTableCountAnomaly
        # If the active table count drops sharply from the 1h baseline we
        # probably lost a shard or the lobby is failing to promote tables.
        #
        # ── 0.5 WAS NEVER DERIVED, AND IT WAS BOTH TOO LOOSE AND USELESS ────
        # (2026-09-07)
        #
        # Until today `poker_active_tables` answered `1` on a fleet of 272,
        # because /metrics emitted that gauge once per table engine with no
        # label and Prometheus kept one arbitrary sample. So this expression
        # compared 1 with 1 and COULD NOT FIRE, ever. The metric is fleet-wide
        # now (EngineTelemetry.renderFleetMetrics), which means this threshold
        # is about to be load-bearing for the first time and had to be measured
        # before it could be trusted.
        #
        # Hour-over-hour ratio of mean dealing tables, 14 days, break window
        # excluded, 227 comparisons:
        #
        #     min 0.236 | p01 0.440 | p05 0.700 | p10 0.806 | p50 1.000
        #
        #     below 0.5 → 3 of 227      below 0.6 → 5      below 0.7 → 11
        #
        # At 0.5 this would page roughly once every five days on ordinary
        # diurnal traffic. 0.4 sits just under p01 and fires on 1 of 227 — a
        # genuine step change, which is what "we lost a shard" looks like.
        #
        # AND IT IS NOT THE FLEET-COLLAPSE DETECTOR, whatever its name suggests.
        # On 2026-09-07 the 04:00 hour averaged 414 tables against 829 the hour
        # before: a ratio of exactly 0.50, which is not < 0.50. It would have
        # missed the incident at the old threshold and misses it at the new one,
        # because table COUNT barely moved while throughput fell 80%. That case
        # belongs to EngineFleetThroughputCollapsed and EngineCoreSaturated.
        expr: |
          poker_active_tables < 0.4 * avg_over_time(poker_active_tables[1h] offset 1h)
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 15m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: 'Active table count dropped >60% vs 1h baseline'
          description: |
            {{ $labels.instance }} reports {{ $value }} tables. Baseline was
            much higher. Investigate lobby.promote failures.

            This detects the fleet SHRINKING. It does not detect a fleet that
            is the right size and dealing slowly - that is
            EngineFleetThroughputCollapsed.

  # ═══════════════════════════════════════════════════════════════════
  # RECOVERED FROM engine-01, 2026-09-06 (Realtime Programme phase 7).
  #
  # This group existed HERE as a heading with no rules under it, while the
  # box carried the rules below and this repo had never seen them. An empty
  # group is worse than an absent one: it reads as coverage. `deploy.sh`
  # symlinks this file over the live one, so the first person to run it
  # would have deleted every rule in this section without noticing.
  #
  # Restored verbatim from the running file so the repo is a superset and a
  # deploy is safe. The reasoning comments are the original author's.
  # ═══════════════════════════════════════════════════════════════════
  - name: cron-health
    interval: 30s
    rules:
      # Silence, not failure, is the observable that matters here. When
      # CRON_SECRET was rotated without updating the Hetzner VM, all 85 Open
      # Claw jobs 401'd and nothing noticed, because a 401 is refused before
      # anything records it - the log does not fill with errors, it STOPS.
      - alert: OpenClawJobsHaveGoneSilent
        expr: |
          poker_cron_openclaw_stale > 0
        for: 30m
        labels:
          severity: warning
          component: cron
        annotations:
          summary: '{{ $value }} Open Claw job(s) past their staleness threshold'
          description: 'SELECT * FROM v_openclaw_job_staleness WHERE is_stale. A job that stops being dispatched produces no errors at all - it simply stops appearing.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      # humanizeDuration reads its input as SECONDS. This gauge is minutes -
      # its name says so and the threshold below is in minutes - so the first
      # page this rule ever produced described 19,689.6 minutes of silence as
      # "5h 28m 9s". A page that understates a 13.7-day outage by a factor of
      # sixty is worse than no page, because it is believed.
      # A job that is dispatched on time, returns 200, logs status 'success'
      # and does none of its work is invisible to every staleness check ever
      # written, because a skip IS a success as far as the log is concerned.
      #
      # Measured 2026-09-11: eight jobs in this state, 782 skipped runs in ten
      # days, the longest 13.6 days without doing anything, all of them
      # returning {"skipped":"engine_disabled","success":true}. The cause was a
      # single boolean that had been false since January and that handlers
      # deployed in September began reading.
      #
      # A numeric `skipped` is a count of items skipped by a job that did run,
      # and does not count here. Only a reason does.
      - alert: CronJobsReportingSuccessWhileDoingNothing
        expr: |
          poker_cron_jobs_skipping_all_work > 0
        for: 1h
        labels:
          severity: warning
          component: cron
        annotations:
          summary: '{{ $value }} cron job(s) have logged success for 24h while skipping all their work'
          description: 'SELECT job_name, result FROM cron_execution_log WHERE status = ''success'' AND result ? ''skipped'' ORDER BY started_at DESC. A kill switch left off, or a handler that reads one it should not. Staleness alerts cannot see this: the job is being dispatched and is answering.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      - alert: OpenClawFleetLongSilence
        expr: |
          poker_cron_openclaw_worst_silence_minutes > 1440
        for: 30m
        labels:
          severity: critical
          page: sms
          component: cron
        annotations:
          summary: 'An Open Claw job has been silent for {{ $value | humanize }} minutes'
          description: 'More than a day with no successful run. The worst case observed before this alert existed was 18.3 days.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      # Twelve at once on 2026-09-04, all 'job startup timeout', including the
      # snapshot prune and the daily-missions outbox drain.
      - alert: PgCronFailuresElevated
        expr: |
          poker_cron_pg_failures > 10
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 15m
        labels:
          severity: warning
          component: cron
        annotations:
          summary: '{{ $value }} pg_cron failures in the last hour'
          description: "SELECT jobname, status, return_message FROM cron.job_run_details JOIN cron.job USING (jobid) WHERE status <> 'succeeded' ORDER BY start_time DESC."
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      # 856 runs an hour is normal. A collapse means the scheduler itself has
      # stopped, which no per-job alert can see.
      - alert: PgCronFleetStopped
        expr: |
          poker_cron_pg_runs < 50
          and poker_cron_metrics_stale_seconds < 300
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 20m
        labels:
          severity: critical
          component: cron
        annotations:
          summary: 'Only {{ $value }} pg_cron runs in the last hour'
          description: 'The fleet normally runs ~856 an hour. The collector is fresh, so this is the scheduler, not the gauge.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      - alert: CronMetricsBlind
        expr: |
          (
            poker_cron_metrics_stale_seconds > 600
            or absent(poker_cron_metrics_stale_seconds)
          )
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: cron
        annotations:
          summary: 'Cron fleet gauges are stale ({{ $value }}s)'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

  # ── POSTGRES ──────────────────────────────────────────────────────────
  # Also empty until 2026-09-04, and pointedly so: the realtime replication
  # slot spent that morning at 305 MB behind, growing, with nothing on the
  # platform able to see it. The engine-01 stack drops the supabase_pg scrape
  # job (no postgres_exporter deployed), so these are written against gauges
  # the ENGINE emits from SECURITY DEFINER functions instead - it is the
  # Postgres exporter now, for the things that matter.
  #
  # Slot flush-lag rules live in the `replication` group below; these are the
  # ones that group does not cover.

  # ═══════════════════════════════════════════════════════════════════
  # RECOVERED FROM engine-01, 2026-09-06 (Realtime Programme phase 7).
  #
  # This group existed HERE as a heading with no rules under it, while the
  # box carried the rules below and this repo had never seen them. An empty
  # group is worse than an absent one: it reads as coverage. `deploy.sh`
  # symlinks this file over the live one, so the first person to run it
  # would have deleted every rule in this section without noticing.
  #
  # Restored verbatim from the running file so the repo is a superset and a
  # deploy is safe. The reasoning comments are the original author's.
  # ═══════════════════════════════════════════════════════════════════
  - name: postgres-health
    interval: 30s
    rules:
      # restart_lsn, not confirmed_flush_lsn. This is the horizon Postgres
      # cannot recycle WAL past - it is what actually fills the disk, and it
      # sat at 703 MB while flush lag read 305 MB.
      - alert: ReplicationSlotPinningWal
        expr: |
          max by (slot) (poker_pg_replication_slot_restart_lag_bytes) > 2147483648
        for: 20m
        labels:
          severity: critical
          component: database
        annotations:
          summary: 'Slot {{ $labels.slot }} is pinning {{ $value | humanize1024 }}B of WAL on disk'
          description: "Postgres cannot recycle WAL behind a slot's restart_lsn. This is the number that fills the volume, and it runs well ahead of the flush lag."
          runbook: 'docs/runbooks/engine-and-realtime-diagnostics.md'

      # The engine and the database disagreeing about the time silently breaks
      # every deadline, timer and retention window on the platform.
      - alert: EngineDatabaseClockSkew
        expr: |
          abs(poker_db_clock_skew_ms) > 5000
        for: 15m
        labels:
          severity: warning
          component: database
        annotations:
          summary: 'Engine and database clocks differ by {{ $value }}ms'
          description: 'Turn timers, maintenance-break windows and every retention cutoff are computed against one clock or the other.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      - alert: DatabaseRpcErrorsElevated
        expr: |
          rate(poker_rpc_errors_total[10m]) > 1
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 15m
        labels:
          severity: warning
          component: database
        annotations:
          summary: 'Engine RPC errors at {{ $value }}/s'
          description: 'The engine reaches Postgres only through PostgREST. A sustained error rate here is seats, hands and settlements failing to write.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

  # ── vercel-health: DELETED 2026-09-04, deliberately ───────────────────
  # This group existed with no rules in it. Filling it honestly is not
  # possible from this stack: every rule it would want reads
  # probe_success{job="vercel_health"} from blackbox-exporter, and the
  # engine-01 compose does not deploy blackbox - the same reason
  # slo-rules.yml and slo-alerts.yml are marked DISABLED. The engine cannot
  # substitute, because it cannot see whether smarter.poker is reachable from
  # the outside.
  #
  # External frontend provenance is checked by Club Arena's read-only
  # production-integrity audit against ca-static.smarter.poker and the public
  # rewrite. That audit cannot retry or publish.
  #
  # An empty group is worse than no group - it reads as coverage. To bring it
  # back properly: add blackbox-exporter to infra/monitoring/docker-compose.yml,
  # add a vercel_health blackbox job to prometheus.yml, then re-enable
  # slo-rules.yml and slo-alerts.yml and restore this group in the same PR.

  # ── vercel-health: DELETED 2026-09-06, deliberately ───────────────────
  # This group existed here as a heading with NO RULES IN IT, which reads as
  # coverage and is not. Filling it honestly is not possible from this stack:
  # every rule it would want reads probe_success{job="vercel_health"} from
  # blackbox-exporter, and infra/monitoring/docker-compose.yml does not deploy
  # blackbox. The engine cannot substitute - it cannot see whether
  # smarter.poker is reachable from the outside.
  #
  # External frontend provenance is checked by Club Arena's read-only
  # production-integrity audit against the Hetzner origin and public rewrite.
  #
  # To bring it back properly: add blackbox-exporter to docker-compose.yml, add
  # a vercel_health blackbox job to prometheus.yml, then restore this group in
  # the same pull request. The same note on the box has said so since
  # 2026-09-04; this repo is now saying it too.

  - name: host-health
    interval: 30s
    rules:
      - alert: HostDiskNearlyFull
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 15m
        labels:
          severity: warning
          component: infra
        annotations:
          summary: 'Disk <10% free on {{ $labels.host }}'

      - alert: HostCPUSaturated
        expr: |
          100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          component: infra
        annotations:
          summary: 'CPU >85% on {{ $labels.host }} for 10m'

      - alert: HostMemoryPressure
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 10m
        labels:
          severity: warning
          component: infra
        annotations:
          summary: 'Available memory <10% on {{ $labels.host }}'

  # ── REPLICATION (2026-09-04) ────────────────────────────────────────────
  # The realtime replication slot was 136 MB behind and climbing, and nothing
  # on the platform could see it: the only way anyone had ever learned the
  # number was by opening a SQL editor and asking. Logical decoding degrades
  # as a SPIRAL rather than a cliff - a slot that falls behind must read WAL
  # from disk instead of memory, which is slower, so being behind makes it
  # fall further behind. There is no step change to catch, which is exactly
  # why it needs an alert rather than a dashboard.
  #
  # Gauges from server/src/services/ReplicationMetrics.ts via
  # public.fn_replication_slot_metrics().
  - name: replication
    interval: 30s
    rules:
      - alert: ReplicationSlotFallingBehind
        expr: |
          max by (slot) (poker_pg_replication_slot_flush_lag_bytes) > 268435456
        for: 15m
        labels:
          severity: warning
          component: database
        annotations:
          summary: 'Realtime slot {{ $labels.slot }} is >256MB behind'
          description: 'Logical decoding is not keeping up with WAL. This compounds: a lagging slot reads WAL from disk rather than memory. Players see it as stale lobbies and late seat updates.'
          runbook: 'docs/runbooks/engine-and-realtime-diagnostics.md'

      - alert: ReplicationSlotCriticallyBehind
        expr: |
          max by (slot) (poker_pg_replication_slot_flush_lag_bytes) > 1073741824
        for: 10m
        labels:
          severity: critical
          component: database
        annotations:
          summary: 'Realtime slot {{ $labels.slot }} is >1GB behind'
          description: 'At this point the slot is pinning WAL on disk and the instance is at risk of filling it. Do not restart the consumer blind - read the runbook.'
          runbook: 'docs/runbooks/engine-and-realtime-diagnostics.md'

      # An inactive slot advances not at all and pins every WAL segment behind
      # it. Guarded, because the engine's own restart inside the :55 break can
      # briefly drop a consumer.
      - alert: ReplicationSlotInactive
        expr: |
          min by (slot) (poker_pg_replication_slot_active) == 0
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: critical
          component: database
        annotations:
          summary: 'Replication slot {{ $labels.slot }} has no consumer'
          description: 'A slot with no consumer never advances and holds every WAL segment after it on disk.'
          runbook: 'docs/runbooks/engine-and-realtime-diagnostics.md'

      # The collector itself. A gauge that stopped being collected reads as a
      # perfectly healthy slot, which is the failure this whole family exists
      # to prevent, so the staleness is alertable in its own right.
      - alert: ReplicationMetricsBlind
        expr: |
          poker_pg_replication_metrics_stale_seconds > 600
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: 'Replication gauges are stale ({{ $value }}s)'
          description: 'fn_replication_slot_metrics has not returned successfully in over 10 minutes. The lag numbers on the dashboard are last-known-good, not current.'
          runbook: 'docs/runbooks/engine-and-realtime-diagnostics.md'

      # Zero slots is not a quiet database - this database has two logical
      # slots. Zero means the collector cannot see pg_replication_slots.
      - alert: ReplicationSlotsDisappeared
        expr: |
          poker_pg_replication_slots == 0
          and poker_pg_replication_metrics_stale_seconds < 600
        for: 10m
        labels:
          severity: critical
          component: database
        annotations:
          summary: 'No replication slots visible'
          description: 'The collector is fresh but reports zero slots. Either the slots were dropped - realtime is then entirely dead - or the function lost its catalog access.'
          runbook: 'docs/runbooks/engine-and-realtime-diagnostics.md'

  # ── Action latency (Realtime programme Phase 1, 2026-09-04) ──────────────
  # poker_act_to_broadcast_ms is the time from a player's action being
  # accepted to the new state reaching every seat - the number that defines
  # how a table FEELS. It had never been scraped in production (the per-table
  # version is gated off for cardinality). Labelled audience=human|horse and
  # format=cash|spin|hu_sng|mtt. The human series is what pages; a fleet-wide
  # p95 would be a horse number. BOTH RULES GROUP BY format (Dan 2026-09-05:
  # "not just the cash game tables"), so a Spin, a heads-up SNG and an MTT
  # each alert on their own p95 instead of hiding inside a cash average.
  #
  # ⚠ THE 2026-09-05 NUMBERS BELOW MEASURED THE WRONG THING, AND THESE
  # THRESHOLDS INHERIT THAT. The clock was armed AFTER performAction, whose
  # synchronous PLAYER_ACTION handler had already broadcast - so every sample
  # was the interval between two consecutive actions (turn pacing), not
  # action-to-broadcast latency. Fixed the same day by arming before the
  # action. The p50 808ms / p95 1843ms / p99 3755ms below therefore describe
  # PACING, and 3000/6000 are deliberately generous placeholders chosen from
  # them. RE-DERIVE both once a day of true latency data exists: the real
  # numbers will be far smaller, and thresholds this loose would miss a real
  # regression. LAW 6 pins them against whatever the recorded baseline says,
  # so update the baseline and the law together.
  #
  # THE THRESHOLDS COME FROM THE MEASUREMENT, NOT FROM A WISH (2026-09-05).
  # The first version of these rules guessed 500ms/1500ms before any data
  # existed. The first hour of real data says the fleet normally runs:
  #     p50 808ms   p90 1541ms   p95 1843ms   p99 3755ms   (24.3 actions/s)
  # so 500ms was below the MEDIAN and 1500ms below the normal p95 - both would
  # have fired permanently and been muted within a day, which is the failure
  # this programme keeps finding in other people's monitors. 3s is above the
  # normal p95 and below the normal p99; 6s is unambiguous.
  #
  # AND A SINGLE ACTION CANNOT RAISE AN ALARM. The guard was `> 0`, so one
  # human action in ten minutes produced a p95 from a sample of one - and on
  # a platform where humans are rare (15 hours with a human seat in 14 days)
  # that is a false-alarm generator. 0.05/s is ~30 actions in the window.
  #
  # The BASELINE ITSELF is worth attention and is not an alert: 808ms median
  # from action to broadcast, while the event loop is healthy (p99 54ms,
  # equity governor not throttling). That is structural pacing in the
  # broadcast path, not CPU starvation, and it is Phase 2 work to characterise.
  # Guarded by the hourly maintenance break (CLAUDE.md 13.6).
  - name: action-latency
    interval: 30s
    rules:
      - alert: ActionLatencyDegraded
        expr: |
          histogram_quantile(0.95,
            sum by (le, format) (rate(poker_act_to_broadcast_ms_bucket{audience="human"}[10m]))
          ) > 3000
          and sum by (format) (rate(poker_act_to_broadcast_ms_count{audience="human"}[10m])) > 0.05
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: '{{ $labels.format }} tables: p95 act-to-broadcast {{ $value | humanize }}ms over 10m'
          description: |
            A player's action is taking more than half a second to reach the
            other seats, sustained. Compare against the last deploy; check
            event-loop lag and DB write latency on engine-01.
          runbook: 'docs/REALTIME-CONNECTIONS-PROGRAMME.md'

      - alert: ActionLatencyCritical
        expr: |
          histogram_quantile(0.95,
            sum by (le, format) (rate(poker_act_to_broadcast_ms_bucket{audience="human"}[10m]))
          ) > 6000
          and sum by (format) (rate(poker_act_to_broadcast_ms_count{audience="human"}[10m])) > 0.05
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: '{{ $labels.format }} tables: p95 act-to-broadcast {{ $value | humanize }}ms - the table is unplayable'
          description: |
            More than 1.5 s from action to broadcast at p95. At this point
            turn timers are visibly wrong and players are acting on stale
            state. Treat as an outage.
          runbook: 'docs/REALTIME-CONNECTIONS-PROGRAMME.md'

  # ── RECOVERED FROM engine-01, 2026-09-05 ────────────────────────────────
  # These two groups - NINE alerts, all of them about money and settlement -
  # existed ONLY as a hand-written file on the monitoring box. They were in no
  # repository, so nothing versioned them, nothing reviewed them, and nothing
  # could restore them. Worse, they were a landmine: deploy.sh SYMLINKS the
  # live alert-rules.yml to this file, so the first person to run it would
  # have silently deleted every alert below - including the ones that watch
  # for hands failing to settle and for money alerts going unread.
  #
  # Copied here verbatim from /opt/smarter-poker-monitoring/alert-rules.yml so
  # this file is a SUPERSET of what is live and a deploy can only add. See
  # docs/REALTIME-CONNECTIONS-PROGRAMME.md, "Found during Phase 1".

  - name: settlement
    interval: 30s
    rules:
      - alert: HandsAreFailingToSettle
        expr: |
          poker_settlement_failure_rate > 0.02
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: critical
          page: sms
          component: money
        annotations:
          summary: '{{ $value | humanizePercentage }} of hands are failing to settle'
          description: 'fn_ca_settle_hand_stacks_absolute is refusing hands whole. Read ca_settlements.error_detail for the reason before changing anything. The 2026-09-04 cause was a BEFORE UPDATE trigger on table_seats that cancelled no-op writes, making a correct seat write look like a failed one.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      # Baseline before the incident was 0.0-0.2%. A rate that merely doubles
      # is worth knowing about long before it reaches a quarter of all hands.
      - alert: SettlementFailuresAboveBaseline
        expr: |
          poker_settlement_failure_rate > 0.005
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 30m
        labels:
          severity: warning
          component: money
        annotations:
          summary: 'Settlement failure rate {{ $value | humanizePercentage }}, above the 0.2% baseline'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      # No hands settling at all is not a quiet table - this platform settles
      # ~500 hands a minute. The failure-rate gauge is ABSENT in this state, so
      # it must be alerted on separately or the silence reads as health.
      - alert: NoHandsAreSettling
        expr: |
          poker_settlement_window_hands == 0
          and poker_settlement_metrics_stale_seconds < 300
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: critical
          component: money
        annotations:
          summary: 'No hand has settled in five minutes'
          description: 'The collector is fresh and reports zero terminal settlements. Either the engine has stopped dealing or settlement is failing before it reaches a terminal state.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      - alert: SettlementsStuckMidStateMachine
        expr: |
          poker_settlement_stuck > 50
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 15m
        labels:
          severity: warning
          component: money
        annotations:
          summary: '{{ $value }} settlements are neither final nor failed'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      - alert: SettlementMetricsBlind
        expr: |
          (
            poker_settlement_metrics_stale_seconds > 600
            or absent(poker_settlement_metrics_stale_seconds)
          )
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: money
        annotations:
          summary: 'Settlement gauges are stale ({{ $value }}s)'
          description: 'fn_settlement_health has not returned in over ten minutes. Whether hands are settling is currently unknown, and unknown is what thirteen hours of this looked like.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

  # ── HAND PROJECTION OUTBOX (2026-09-10) ────────────────────────────────
  # Every accepted hand leaves one row in public.hand_projection_outbox; the
  # engine's projection worker (server/src/services/supabase/handProjection.ts)
  # turns it into club stats, player stats and the post-commit obligations
  # (rake, BBJ, insurance, add-ons) and deletes it. Until today nothing on
  # /metrics said how far behind that was. Measured 2026-09-10 05:40 UTC:
  # 100,888 rows waiting across 1,329 tables, oldest 00:31 UTC (five hours),
  # because a serial drain at ~300 hands/min met ~600/min arriving.
  #
  # Gauges from server/src/services/supabase/handOutboxMetrics.ts, sampled once
  # a minute on the leader. Counters from handProjection.ts.
  #
  # Thresholds, derived: a healthy row waits under one poll interval (5 s)
  # plus one causal-retry chain (at most 15 s), so 300 s is fifteen times the
  # worst normal case and is not reached by a quiet minute. At deploy these
  # WILL fire until the backlog above is gone (at ~4x throughput, about two
  # to three hours) - that is the truth, not noise; watch the age fall.
  - name: hand-projection
    interval: 30s
    rules:
      - alert: HandProjectionDrainWedged
        # NAMES THE CAUSE, NOT THE SYMPTOM (2026-09-11). The backlog alarm below
        # fires whenever the outbox is old, which covers both "the lane is slow"
        # and "the lane has stopped". Those need different answers. A pass that
        # never settles used to leave drainPromise non-null for ever, and
        # pollIsDue opens by returning false on exactly that, so the 5 s safety
        # poll - the only cross-process wake left on this host, with Realtime in
        # CHANNEL_ERROR and LISTEN unconfigured - was switched off. Measured that
        # evening: drains_total frozen at 324 for fifteen minutes while the outbox
        # climbed to 27,356 rows and fifty-one minutes old.
        #
        # AND UNTIL TODAY IT COULD NOT FIRE AT ALL (2026-09-12). It asked for
        # 180000 on a gauge that reads
        # `drainPromise === null ? 0 : Date.now() - lastDrainStartedAt`, and
        # lastDrainStartedAt is reset by every pass. The pass stops itself at
        # HAND_PROJECTION_DRAIN_DEADLINE_MS (120s), so the gauge is capped near
        # 120000 and 180000 is unreachable by construction: this rule did not
        # fire once during the five-hour outage of 00:04-05:14, when orphaned
        # drain passes starved the table lease heartbeats on the shared
        # PostgREST client and every table on the platform was killed and
        # rebuilt. A threshold above the bound is not a strict alert, it is a
        # rule that is always silent.
        #
        # 90000 is three quarters of the bound, which is what "this pass is
        # running long" has to mean when the pass ends itself at the bound. So
        # a firing means the lane is genuinely slow - not that the bound failed.
        expr: poker_hand_projection_drain_age_ms > 90000
        for: 2m
        labels:
          severity: critical
          component: club-arena-engine
        annotations:
          summary: 'A hand projection drain has been in flight for {{ $value | printf "%.0f" }} ms'
          description: |
            One drain pass has been in flight for three quarters of its deadline.
            While a pass is in flight the safety poll does not run, so nothing
            else will project a hand until it clears. The pass observes the
            deadline itself: at HAND_PROJECTION_DRAIN_DEADLINE_MS (120s) its
            loops stop, it settles, and it queues one continuation. So this
            firing means the lane is slow, not that the bound has failed - read
            poker_hand_projection_drain_results_total by result and
            pg_stat_activity for lock waits on hand-projection:<table>.
      - alert: HandProjectionOutboxBacklog
        expr: |
          poker_hand_projection_outbox_oldest_age_seconds > 300
          and poker_hand_projection_outbox_sample_age_seconds < 300
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: hand-projection
        annotations:
          summary: 'Oldest unprojected hand has waited {{ $value | humanizeDuration }}'
          description: 'hand_projection_outbox is not draining as fast as hands settle. Club and player stats, rake and BBJ bookings for those hands are late. Read poker_hand_projection_drain_results_total by result on /metrics: failed climbing means the RPC is refusing (engine logs HandProjection.*); projected flat with depth > 0 is the stall alert below. Raise HAND_PROJECTION_DRAIN_CONCURRENCY (default 4, max 16) only after reading pg_stat_activity for lock waits on hand-projection:<table>.'
          runbook: 'docs/changelog/2026-09-10-hand-projection-wakes-by-notify-with-a-poll-net.md'

      - alert: HandProjectionOutboxBacklogCritical
        expr: |
          poker_hand_projection_outbox_oldest_age_seconds > 1800
          and poker_hand_projection_outbox_sample_age_seconds < 300
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 15m
        labels:
          severity: critical
          component: hand-projection
        annotations:
          summary: 'Oldest unprojected hand has waited {{ $value | humanizeDuration }}'
          description: 'Half an hour of hands have not reached club stats, player stats or their rake/BBJ bookings. The durable rows are safe; do not delete or hand-mark them. Find the reason in poker_hand_projection_drain_results_total{result="failed"} and engine logs for HandProjection.rpc_failed / semantic_refusal before changing anything.'
          runbook: 'docs/changelog/2026-09-10-hand-projection-wakes-by-notify-with-a-poll-net.md'

      # Rows waiting and nothing projected for ten minutes is the worker not
      # running at all (no leader boot, poll timer gone) or every RPC failing.
      - alert: HandProjectionDrainStalled
        expr: |
          poker_hand_projection_outbox_depth > 0
          and poker_hand_projection_outbox_sample_age_seconds < 300
          and on() increase(poker_hand_projection_drain_results_total{result="projected"}[10m]) == 0
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: critical
          component: hand-projection
        annotations:
          summary: 'The hand projection drain has projected nothing in ten minutes with rows waiting (poker_hand_projection_outbox_depth)'
          description: 'Check poker_hand_projection_wakes_total{source="poll"} is still climbing (the 5 s poll is the only cross-process wake while ENGINE_PG_LISTEN_URL is unset). If wakes climb and projected does not, every fn_project_hand_side_effects call is failing: read engine logs HandProjection.rpc_failed and pg_stat_activity.'
          runbook: 'docs/changelog/2026-09-10-hand-projection-wakes-by-notify-with-a-poll-net.md'

      - alert: HandProjectionMetricsBlind
        expr: |
          poker_hand_projection_outbox_sample_age_seconds > 600
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: hand-projection
        annotations:
          summary: 'Outbox backlog gauges are stale ({{ $value }}s)'
          description: 'HandOutboxMetrics has not refreshed in ten minutes (engine logs: HandOutboxMetrics.refresh_failed). The backlog alerts above cannot fire while this is true, and unknown is what five hours of a 100k-row backlog looked like.'
          runbook: 'docs/changelog/2026-09-10-hand-projection-wakes-by-notify-with-a-poll-net.md'

  # ── MONEY HEALTH (2026-09-04) ───────────────────────────────────────────
  # Two findings from one day, the same failure at two layers.
  #
  # financial_alerts held 1,345 unresolved rows - 656 distinct conditions, the
  # oldest fifteen days old - and nothing had ever reported that the table has
  # contents. Every reconciler and guard on the platform writes there and it
  # works perfectly; nobody was ever told.
  #
  # And aaa_skip_noop_update was attached to table_seats with no migration and
  # no review, breaking 139,153 hand settlements 0.65 seconds later. RULE 2
  # already forbade it; nothing enforced it, because an object created by raw
  # SQL leaves no row in schema_migrations for the existing guard to find.
  #
  # Gauges from server/src/services/MoneyHealthMetrics.ts.
  - name: money-health
    interval: 60s
    rules:
      # Any value above zero is an unreviewed schema change on a chip path.
      # No `for:` grace beyond one scrape - this is the alert whose absence
      # cost thirteen hours.
      - alert: UndeclaredTriggerOnAMoneyTable
        expr: |
          poker_money_undeclared_triggers > 0
        for: 2m
        labels:
          severity: critical
          page: sms
          component: money
        annotations:
          summary: '{{ $value }} undeclared trigger(s) on a money or seat table'
          description: 'A trigger is live on table_seats, club_members, wallets, chip_ledger, tournaments, tournament_players or ca_settlements with no row in ca_declared_money_triggers. Run SELECT * FROM fn_undeclared_money_triggers(). Either it is a legitimate change missing its declaration, or it is an unreviewed one - and the last unreviewed one broke a third of all hand settlements.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      # Criticals unresolved for more than a day. This metric does not track
      # whether an original has been read or investigated.
      - alert: MoneyAlertsGoingUnread
        expr: |
          poker_financial_alerts_stale_critical > 25
        for: 30m
        labels:
          severity: warning
          component: money
        annotations:
          summary: '{{ $value }} critical money alerts open longer than 24h'
          description: "financial_alerts is accumulating criticals nobody has resolved. A deep backlog is dangerous mainly because it hides a real one - on 2026-09-04 it was 1,345 rows deep and contained five 'player was never paid' alerts, all of which had in fact been paid within thirty minutes."
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      - alert: MoneyAlertBacklogGrowing
        expr: |
          poker_financial_alerts_unresolved > 2000
        for: 1h
        labels:
          severity: warning
          component: money
        annotations:
          summary: '{{ $value }} unresolved money alerts'
          description: 'The unresolved financial-alert backlog is above the threshold. poker_financial_alerts_distinct_conditions counts source categories, not unique fault identities. Review each original and its exact hand, period or incident linkage; a flat source count does not establish duplicate alerts.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

      - alert: MoneyHealthBlind
        expr: |
          (
            poker_money_health_stale_seconds > 600
            or absent(poker_money_health_stale_seconds)
          )
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: money
        annotations:
          summary: 'Money-health gauges are stale ({{ $value }}s)'
          description: 'Neither the alert backlog nor the undeclared-trigger check has returned in over ten minutes. poker_money_undeclared_triggers is ABSENT rather than 0 in this state, deliberately - a zero here would be an all-clear the collector has not earned.'
          runbook: 'docs/changelog/2026-09-11-fifteen-rules-were-watching-thirteen-metrics-that-did-not-exist.md'

  # ── Action latency (Realtime programme Phase 1, 2026-09-04) ──────────────
  # poker_act_to_broadcast_ms is the time from a player's action being
  # accepted to the new state reaching every seat - the number that defines
  # how a table FEELS. It had never been scraped in production (the per-table
  # version is gated off for cardinality). Labelled audience=human|horse and
  # format=cash|spin|hu_sng|mtt. The human series is what pages; a fleet-wide
  # p95 would be a horse number. BOTH RULES GROUP BY format (Dan 2026-09-05:
  # "not just the cash game tables"), so a Spin, a heads-up SNG and an MTT
  # each alert on their own p95 instead of hiding inside a cash average.
  #
  # ⚠ THE 2026-09-05 NUMBERS BELOW MEASURED THE WRONG THING, AND THESE
  # THRESHOLDS INHERIT THAT. The clock was armed AFTER performAction, whose
  # synchronous PLAYER_ACTION handler had already broadcast - so every sample
  # was the interval between two consecutive actions (turn pacing), not
  # action-to-broadcast latency. Fixed the same day by arming before the
  # action. The p50 808ms / p95 1843ms / p99 3755ms below therefore describe
  # PACING, and 3000/6000 are deliberately generous placeholders chosen from
  # them. RE-DERIVE both once a day of true latency data exists: the real
  # numbers will be far smaller, and thresholds this loose would miss a real
  # regression. LAW 6 pins them against whatever the recorded baseline says,
  # so update the baseline and the law together.
  #
  # THE THRESHOLDS COME FROM THE MEASUREMENT, NOT FROM A WISH (2026-09-05).
  # The first version of these rules guessed 500ms/1500ms before any data
  # existed. The first hour of real data says the fleet normally runs:
  #     p50 808ms   p90 1541ms   p95 1843ms   p99 3755ms   (24.3 actions/s)
  # so 500ms was below the MEDIAN and 1500ms below the normal p95 - both would
  # have fired permanently and been muted within a day, which is the failure
  # this programme keeps finding in other people's monitors. 3s is above the
  # normal p95 and below the normal p99; 6s is unambiguous.
  #
  # AND A SINGLE ACTION CANNOT RAISE AN ALARM. The guard was `> 0`, so one
  # human action in ten minutes produced a p95 from a sample of one - and on
  # a platform where humans are rare (15 hours with a human seat in 14 days)
  # that is a false-alarm generator. 0.05/s is ~30 actions in the window.
  #
  # The BASELINE ITSELF is worth attention and is not an alert: 808ms median
  # from action to broadcast, while the event loop is healthy (p99 54ms,
  # equity governor not throttling). That is structural pacing in the
  # broadcast path, not CPU starvation, and it is Phase 2 work to characterise.
  # Guarded by the hourly maintenance break (CLAUDE.md 13.6).

  # ── What the player's browser saw (Realtime Phase 2, 2026-09-05) ─────────
  # The client-side twin of the session-refusal rules: those count sockets the
  # SERVER refused, these count sockets the CLIENT lost. On 2026-09-03 every
  # one of Dan's reconnects and every twenty-second auto-reload happened in
  # his browser and reached the platform as nothing, so every rule here stayed
  # green for twenty-two hours. Per-user counting happens in the engine
  # (observability/ClientConnectionEvents.ts); only bounded numbers are
  # scraped, and no user id ever reaches Prometheus.
  - name: client-connections
    interval: 30s
    rules:
      # Dan's question, verbatim: "one player reconnecting more than N times an
      # hour". N is 6, counted in a rolling hour by the engine.
      - alert: PlayersReconnectingRepeatedly
        expr: |
          poker_ws_clients_reconnecting_badly > 0
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: '{{ $value }} player(s) reconnecting repeatedly in the last hour'
          description: |
            At least one player's browser has lost its table socket more than
            six times in an hour, sustained for ten minutes. The engine can
            look perfectly healthy while this is true - that is exactly what
            2026-09-03 looked like. Check poker_ws_client_reconnects_total by
            reason: auth_failed points at sessions, stale at the link or the
            engine going quiet, handshake_timeout at the edge.
          runbook: 'docs/REALTIME-CONNECTIONS-PROGRAMME.md'

      # The current bundle never reloads a live table to repair a socket. Keep
      # this series through the rollout as a regression/old-bundle detector:
      # any new sample means obsolete code is still discarding a player's felt.
      - alert: TablesAreReloadingThemselves
        expr: |
          increase(poker_ws_client_reconnects_total{reason="auto_reload"}[30m]) >= 3
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'A table used the retired auto-reload path {{ $value }} times in 30 minutes'
          description: |
            Current TablePage code has no generic socket-failure reload. This
            counter can rise only from a cached old bundle or a regression.
            A page reload discards live table state; find and remove the caller
            instead of raising the timeout or adding another reload guard.
          runbook: 'docs/REALTIME-CONNECTIONS-PROGRAMME.md'

      # The browser reports auth_failed at the close frame itself. This remains
      # distinct from EngineRefusingSessions below: that counts what the engine
      # rejected, while this also sees a refusal generated by the edge/proxy.
      - alert: PlayersCannotAuthenticateToTables
        expr: |
          increase(poker_ws_client_reconnects_total{reason="auth_failed"}[30m]) >= 3
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'Browsers reported {{ $value }} table sign-in refusals in 30 minutes'
          description: |
            A player's table socket was refused for auth (4401, or an `auth:`
            close reason). The reconnect/session state machine remains active;
            there is deliberately no page-reload workaround.
            Cross-check poker_ws_auth_refused_total: if that is flat while
            this climbs, the refusal is happening in front of the engine.
          runbook: 'docs/REALTIME-CONNECTIONS-PROGRAMME.md'
  # ── Session refusals (2026-09-04) ────────────────────────────────────────
  # Dan's every table socket was refused with 401 for 22 hours - a World Hub
  # cron was signing his account out globally every 15 minutes - and nothing
  # here fired, because a refused upgrade was not a number anywhere. It is
  # now: poker_ws_auth_refused_total{path, denied}, rendered by the engine's
  # always-on /metrics (GameServer.getPrometheusMetrics). See
  # docs/changelog/2026-09-04-a-revoked-session-is-not-a-reconnect.md.
  - name: session-refusals
    interval: 30s
    rules:
      # `invalid` = GoTrue looked at the session and said no. A handful a day
      # is normal (a player signing out on one device while another tab is
      # still open). A steady stream is a revocation loop, a retired signing
      # key, or an auth misconfiguration - and every one of those is a player
      # who cannot sit down. The client now retries a dead session at most
      # once (it is sent to sign in), so this is a count of PEOPLE, not
      # of retries.
      # THRESHOLD RE-DERIVED FROM PRODUCTION 2026-09-06 (phase 7). The rule as
      # written was `>= 6 in 15m`, and it had never run - it is one of the
      # fifteen this repo declared and the box had never loaded. Before loading
      # it, its threshold was measured against the live series it reads:
      #
      #     avg 15m increase over 24h ...  1.1
      #     p95 ..........................  9.2
      #     max ..........................  32.3
      #
      # So `>= 6` sits BELOW the ordinary p95: it would have fired several
      # times a day, for ever, on nothing but seven-day tokens expiring in
      # tabs nobody had closed. An alarm that is always on is an alarm that
      # gets muted, and a muted alarm is what twenty-two hours of silence was
      # made of. Raising the number alone would rot too - the count scales
      # with traffic (1.1 avg at 04:00, 23.4 at 11:38 the same morning).
      #
      # So it fires on the SHAPE that hurt instead: sessions refused WHILE at
      # least one client is stuck in a reconnect loop because of it. On
      # 2026-09-03 both were true continuously for a day; in ordinary churn
      # `poker_ws_clients_reconnecting_badly` measured 0 for 24 hours straight,
      # because a client refused once simply goes away.
      - alert: EngineRefusingSessions
        expr: |
          sum(increase(poker_ws_auth_refused_total{denied="invalid"}[15m])) >= 6
          and poker_ws_clients_reconnecting_badly > 0
        for: 15m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: 'Engine refused {{ $value }} sockets as invalid sessions in 15 min'
          description: |
            GoTrue is rejecting sessions the client believes are live. If
            these are real players, something is revoking sessions behind
            them: check Supabase auth_audit_logs for `logout` events with
            user_agent "node" (a cron or script calling a global signOut),
            a signing-key rotation, or a password change. The 2026-09-03
            outage looked exactly like this and ran for 22 hours unseen.
          runbook: 'docs/changelog/2026-09-04-a-revoked-session-is-not-a-reconnect.md'

      # BACKSTOP. The rule above needs the client beacon to be working; this
      # one needs nothing but the engine's own counter. 60 in fifteen minutes
      # is nearly double the highest ordinary quarter-hour measured on
      # 2026-09-06 (32.3), so it cannot be reached by token expiry at today's
      # traffic - and if traffic grows enough to reach it, that is worth
      # knowing too, which is why this is a warning and not a page.
      - alert: EngineRefusingSessionsInVolume
        expr: |
          sum(increase(poker_ws_auth_refused_total{denied="invalid"}[15m])) >= 60
        for: 15m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: 'Engine refused {{ $value }} sockets as invalid sessions in 15 min'
          description: |
            Far above the ordinary rate of expiring tokens. Either something is
            revoking sessions behind live players, or the client beacon that
            EngineRefusingSessions depends on has stopped reporting - check
            poker_ws_clients_reconnecting_badly is still being written.
          runbook: 'docs/runbooks/tables-say-reconnecting.md'

      # `unavailable` = the engine could not ASK GoTrue. Nobody is refused
      # as invalid on this path (they get a 503 and keep retrying), but
      # nobody can join either. Five minutes of it is an auth outage.
      - alert: EngineCannotReachAuth
        expr: |
          sum(increase(poker_ws_auth_refused_total{denied="unavailable"}[5m])) >= 3
        for: 5m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'Engine cannot verify sessions with Supabase Auth'
          description: |
            auth.getUser() is failing with a network error, 429 or 5xx from
            the engine. Every new table socket is being answered 503 and
            retried; no player can join until GoTrue answers again. Check
            Supabase status and the engine's outbound connectivity.
          runbook: 'docs/changelog/2026-09-04-a-revoked-session-is-not-a-reconnect.md'

  # ═══════════════════════════════════════════════════════════════════════════
  # THE CLUSTER CONTROLLER (must-move cash games, OPORD 1.4 section 18) -
  # 2026-09-05. Three silent failures on 2026-09-04/05 were every one found by
  # a human reading rows: the controller's pass latch stalled for eleven
  # minutes with no log line; a deploy reported success and shipped nothing;
  # the engine died at 04:05 under the 04:00 thaw. The controller had a rich
  # event log (cash_cluster_events) and a per-pass summary, and nothing that
  # could page. These series are rendered by the engine's always-on registry
  # (server/src/cluster/ClusterMetrics.ts, through GameServer.getPrometheus
  # Metrics) on every scrape - the ENGINE_METRICS flag does not gate them.
  #
  # EVERY RULE CARRIES THE BREAK GUARD (CLAUDE.md 13 rule 6). The controller
  # refuses to tick while the platform is frozen, and the engine restarts
  # inside the break, so for up to six minutes an hour "no pass" is the
  # design. `unless on() max_over_time(poker_maintenance_break_active[6m]) == 1`
  # - `on()` because most of these expressions aggregate their left side away
  # from {instance, job}, and a plain `unless` would then match no series and
  # guard nothing. max_over_time reads through the restart's scrape gap.
  # ── THE CORE THAT LIMITS EVERYTHING (2026-09-06) ─────────────────────
  # The engine is ONE Node core. Until today that ceiling had no time series:
  # the p50 lived in the /health JSON and nowhere else, so a slow controller
  # pass, a laggy table and a stalled discovery loop all looked like Postgres
  # and none of them could be correlated with the thing they share.
  #
  # THRESHOLDS ARE THE MAIN LOOP GOVERNOR'S OWN, not guesses. Its table is:
  # effective delay < 40 ms -> 1; < 120 ms -> 0.6; < 300 ms -> 0.35;
  # < 1,000 ms -> 0.2; otherwise -> 0.08. Since 2026-09-08 this is a
  # diagnostic scale only: horse Monte Carlo and its independently sampled
  # governor run on the live decision worker.
  # Measured on engine-01 2026-09-06 while writing this: cluster pass p50
  # 0.86 s at steady state against 26.8 s in the minutes after a restart, so
  # `for:` is long enough that the hourly cutover cannot raise either of these.
  - name: engine-core
    interval: 15s
    rules:
      - alert: EngineCoreOutOfHeadroom
        expr: |
          (
            poker_event_loop_delay_p50_ms > 40
            or poker_main_event_loop_governor_sampler_late_ms > 40
          )
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: 'Engine event loop delay {{ $value | printf "%.0f" }} ms - the core is out of headroom'
          description: |
            The main realtime event loop has been delayed past its first
            capacity threshold for ten minutes. Human actions, timers, state
            broadcasts, the cluster controller and discovery share this loop.
            Check poker_main_event_loop_governor_scale beside it. Horse compute
            runs on another core; poker_equity_governor_scale reports that
            worker independently.
          runbook: 'https://github.com/Smarter-Poker/Smarter-Poker-Club-Arena/blob/main/docs/runbooks/tournament-scheduler-and-engine-saturation.md'

      # Both gauges have the same scrape-target labels and no intrinsic
      # labels. A bare `or` therefore yields one alert per engine and lets
      # sampler lateness survive when the filtered p50 sample is absent.
      - alert: EngineCoreSaturated
        expr: |
          (
            poker_event_loop_delay_p50_ms > 300
            or poker_main_event_loop_governor_sampler_late_ms > 300
          )
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'Engine event loop delay {{ $value | printf "%.0f" }} ms - the core is saturated'
          description: |
            Critical main realtime-loop saturation: tables can lag for every
            seat, human included, even though horse compute is isolated on a
            worker. Inspect poker_main_event_loop_governor_scale; if it
            disagrees with the delay, the sampler is unhealthy. Reduce work on
            the main process rather than raising timeouts. Direct sampler
            lateness is included because synchronous work can starve the
            histogram.
          runbook: 'https://github.com/Smarter-Poker/Smarter-Poker-Club-Arena/blob/main/docs/runbooks/tournament-scheduler-and-engine-saturation.md'

      # The governor throttling is not itself a fault - it is the mechanism
      # working. Sustained throttling IS a capacity signal, and it is the only
      # one that says the platform is trading precision for latency right now.
      - alert: EngineSheddingPrecisionForHours
        expr: |
          poker_equity_governor_scale < 1
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 2h
        labels:
          severity: warning
          component: engine
        annotations:
          summary: 'Horse decision precision has been scaled to {{ $value }} for two hours'
          description: |
            EquityLoadGovernor has been shedding Monte Carlo iterations
            continuously for two hours. Horses are reading a noisier equity
            than the platform intends (CLAUDE.md 10.5 is not broken - every
            seat gets the same engine - but the room is playing worse than it
            was built to). Capacity, not a bug.

  # ── BOUNDED TOURNAMENT WORK LANES (2026-09-07) ────────────────────────
  # The old design opened one five-second elimination timer per tournament.
  # The replacement has four physical work slots and one process-wide queue.
  # Queue depth alone is intentionally NOT an alert: causal bursts can enqueue
  # several tournaments together and a short backlog is normal. It becomes a
  # fault only when every physical slot stays occupied while the oldest event
  # or exact-deadline wake exceeds the two-minute queue SLO.
  - name: tournament-work-scheduler
    interval: 15s
    rules:
      - alert: TournamentEliminationSchedulerSaturated
        expr: |
          poker_tournament_elimination_scheduler_slots_inflight >= 4
          and on(instance, job)
            poker_tournament_elimination_scheduler_oldest_wait_ms > 120000
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 2m
        labels:
          severity: critical
          component: tournament-scheduler
        annotations:
          summary: 'All four elimination slots are occupied while causal work waits beyond two minutes'
          description: |
            The process-wide scheduler has used all four physical slots while
            at least one tournament's event or deadline has waited beyond the
            queue SLO. Do not release a slot whose promise is still live: that
            recreates unbounded database concurrency behind a smaller gauge.
            Inspect failed/timed-out dispatches, PostgREST latency and engine
            event-loop delay using the runbook.
          runbook: 'https://github.com/Smarter-Poker/Smarter-Poker-Club-Arena/blob/main/docs/runbooks/tournament-scheduler-and-engine-saturation.md'

      # Queue age cannot see a different failure mode: every physical promise
      # can be over budget while the logical queue is temporarily empty. Keep
      # this separate from liveness -- it diagnoses wedged tournament work but
      # does not, by itself, authorize an engine restart.
      - alert: TournamentEliminationSchedulerAllSlotsStalled
        expr: |
          poker_tournament_elimination_scheduler_slots_inflight >= 4
          and on(instance, job)
            poker_tournament_elimination_scheduler_stalled_slots >= 4
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 2m
        labels:
          severity: critical
          component: tournament-scheduler
        annotations:
          summary: 'All four elimination promises have remained unresolved beyond their warning budget'
          description: |
            Every physical scheduler slot is held by a promise that has
            exceeded the sweep warning budget. This alert remains effective
            even when no logical work is queued. Do not release an unresolved
            promise or restart solely from this signal; inspect PostgREST,
            error outcomes, event-loop delay and the shared liveness verdict.
          runbook: 'https://github.com/Smarter-Poker/Smarter-Poker-Club-Arena/blob/main/docs/runbooks/tournament-scheduler-and-engine-saturation.md'

      # Bounty settlement is write-ahead now: a process crash may leave an
      # obligation pending, but it may never make that obligation invisible.
      # Repeated drain errors mean neither a live manager nor the event-driven
      # managerless recovery path can finish those durable claims.
      - alert: TournamentBountyRecoveryLaneFailing
        expr: |
          sum(increase(poker_tournament_bounty_recovery_sweep_runs_total{outcome=~"error|partial"}[10m])) >= 5
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 2m
        labels:
          severity: critical
          component: bounty-settlement
        annotations:
          summary: 'Tournament bounty recovery failed {{ $value }} times in ten minutes'
          description: |
            The Realtime/startup-driven recovery drain is repeatedly failing
            to settle durable bounty obligations. Inspect the recovery
            refusal/error, exact outbox state and its ledger or mystery-award
            evidence. Do not bypass the outbox or mark an obligation settled
            by hand.
          runbook: 'https://github.com/Smarter-Poker/Smarter-Poker-Club-Arena/blob/main/docs/runbooks/tournament-scheduler-and-engine-saturation.md'

      # Realtime is the low-latency delivery path, while startup/error drains
      # and the durable outbox preserve correctness. A sustained zero means
      # settlements remain safe but managers may not resume immediately.
      - alert: TournamentBountyRealtimeDisconnected
        expr: |
          poker_tournament_bounty_realtime_connected == 0
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 2m
        labels:
          severity: critical
          component: bounty-settlement
        annotations:
          summary: 'Tournament bounty Realtime delivery is disconnected'
          description: |
            The process-wide obligation channel has not been subscribed for
            two minutes. Inspect transport errors and reconnect status. The
            durable outbox must remain authoritative; do not bypass it or add
            a polling reconciliation loop.
          runbook: 'https://github.com/Smarter-Poker/Smarter-Poker-Club-Arena/blob/main/docs/runbooks/tournament-scheduler-and-engine-saturation.md'

      # Durable manager wakes carry late registration, rebuy and final-table
      # deal progress. Startup/error drains preserve the rows, but a sustained
      # disconnect removes their low-latency delivery guarantee.
      - alert: TournamentManagerWakeRealtimeDisconnected
        expr: |
          poker_tournament_manager_wake_realtime_connected == 0
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 2m
        labels:
          severity: critical
          component: tournament-lifecycle
        annotations:
          summary: 'Tournament manager wake Realtime delivery is disconnected'
          description: |
            The durable manager-wake channel has not been subscribed for two
            minutes. Inspect channel errors and the generation-safe reconnect.
            Do not replace durable wake receipts with polling or acknowledge a
            row before its exact tournament sweep completes.
          runbook: 'https://github.com/Smarter-Poker/Smarter-Poker-Club-Arena/blob/main/docs/runbooks/tournament-scheduler-and-engine-saturation.md'

      # A short non-zero value is ordinary crash/response-loss recovery. Ten
      # minutes is not: the durable obligation exists specifically so payout
      # work survives the manager or process that first attempted it.
      - alert: TournamentBountyOutboxBacklogStuck
        expr: |
          poker_tournament_bounty_recovery_pending > 0
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: critical
          component: bounty-settlement
        annotations:
          summary: '{{ $value }} tournament bounty obligation(s) remain unsettled'
          description: |
            A successful global recovery pass still reports pending bounty
            obligations after ten minutes. Inspect each obligation's exact
            generation, canonical claimants and durable settlement markers.
            Tournament completion must remain blocked until this reaches zero.
          runbook: 'https://github.com/Smarter-Poker/Smarter-Poker-Club-Arena/blob/main/docs/runbooks/tournament-scheduler-and-engine-saturation.md'

  - name: cluster
    interval: 15s
    rules:
      # ── THE ONE THAT WOULD HAVE FIRED ON 2026-09-04 22:10 ──────────────
      # poker_cluster_last_pass_timestamp_seconds is stamped at the end of
      # every pass. The cadence is 5 s and a real pass is ~10 s, so a minute
      # of silence while the engine is scraped is a controller that has
      # stopped: a held latch, a wedged await, or a leader that never started
      # it. The series is absent on a standby and until the first pass after
      # boot, so neither of those can alarm.
      - alert: ClusterControllerStalled
        expr: |
          (time() - poker_cluster_last_pass_timestamp_seconds) > 60
          and on() up{job="engine_game_server"} == 1
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 1m
        labels:
          severity: critical
          component: cluster
        annotations:
          summary: 'Cluster controller has not completed a pass for {{ $value | humanizeDuration }}'
          description: |
            The must-move controller ticks every 5 s on the leader and stamps
            this gauge at the end of every pass. It has gone quiet while the
            engine is up, so no feeder opens, no table breaks and no move is
            planned until it moves again. On 2026-09-04 this was the inTick
            latch held by a never-resolving wake; the release ceiling is
            CLUSTER_TICK_STALL_MS (120 s) and the release is counted below.
            Read /health -> cluster.lastPassAt and the engine log for
            '[ClusterController]'.
          runbook: 'docs/changelog/2026-09-05-cluster-metrics-that-page-and-a-deploy-that-proves-itself.md'

      # The latch DID stick and the controller released it itself. Not an
      # outage - the next pass ran - but every one is a wake or an RPC that
      # outlived a 2-minute ceiling, and the 11-minute stall began as one.
      - alert: ClusterPassLatchReleased
        expr: |
          sum(increase(poker_cluster_pass_stalled_total[30m])) > 0
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 0m
        labels:
          severity: warning
          component: cluster
        annotations:
          summary: 'Cluster controller released a stuck pass latch ({{ $value }} in 30 min)'
          description: |
            A pass was still open after CLUSTER_TICK_STALL_MS and was reported
            as ClusterController.tick_stalled. The engine log has the stack. Every
            await inside a pass is supposed to be bounded (15 s client
            deadline, the wake never awaited); one that is not is a defect.

      # Per-game tick failures. A blip is one or two on a slow database; ten
      # in a quarter hour (180 passes) is a game whose fn_cash_cluster_tick
      # throws every time, and that game's tables neither open nor close.
      - alert: ClusterPassErrors
        expr: |
          sum(increase(poker_cluster_pass_errors_total[15m])) >= 10
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: warning
          component: cluster
        annotations:
          summary: '{{ $value }} cluster tick errors in 15 min'
          description: |
            fn_cash_clusters_to_tick or fn_cash_cluster_tick is failing.
            Engine logs: ClusterController.worklist_failed / tick_rpc_failed /
            game_tick_error, with the game_id. A single game failing every
            pass reaches this in under a minute of passes; check that game's
            cash_cluster_events for the last thing it did.

      # Nothing ticks at all while there is work. Distinct from the stall:
      # passes complete, on time, and every one of them fails.
      - alert: ClusterTickingNothing
        expr: |
          poker_cluster_pass_ticked == 0 and poker_cluster_pass_games > 0
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 3m
        labels:
          severity: critical
          component: cluster
        annotations:
          summary: 'Cluster controller ticked 0 of {{ $value }} games for 3 minutes'
          description: |
            The worklist is non-empty and no game's tick succeeded in any
            pass for three minutes. Every must-move game is unmanaged: seats
            open, nobody moves; tables empty, nobody breaks them. Almost
            always the RPC itself (a changed signature, a revoked grant, a
            timeout on every call) rather than a data problem.

      # ── FEEDERS THAT NEVER FILL ────────────────────────────────────────
      # A feeder opens on two buyers and is abandoned when its opening hold
      # expires with nobody seated. Five abandonments in half an hour with
      # not one feeder going live is the fleet promising seats it never
      # fills (2026-09-05, "the fleet keeps the promise that opened a
      # feeder") - the buyers the census counted are not arriving.
      - alert: ClusterFeedersAbandoned
        expr: |
          sum(increase(poker_cluster_actions_total{kind="feeder_abandoned"}[30m])) >= 5
          and on() (sum(increase(poker_cluster_actions_total{kind="feeder_live"}[30m])) or vector(0)) == 0
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 0m
        labels:
          severity: warning
          component: cluster
        annotations:
          summary: '{{ $value }} feeders abandoned in 30 min and none went live'
          description: |
            Feeders are opening on counted demand and closing unfilled. The
            horse census (eligibleHorseCount) says buyers exist; the seeder
            is not seating them on the feeder, or the opening hold is shorter
            than the seeder's cycle. cash_cluster_events kind=feeder_opened
            followed by feeder_abandoned names the tables.

      # ── MOVES THAT EXPIRE ──────────────────────────────────────────────
      # A planned move is executed by the engine at the end of the player's
      # hand. One that expires was planned by the SQL and never executed by
      # the engine: the table has no engine, the hand never ended, or the
      # move handler is broken. Players told "Moving in N hands" who never
      # move is the visible symptom.
      - alert: ClusterMovesExpiring
        expr: |
          sum(increase(poker_cluster_actions_total{kind="moves_expired"}[30m])) >= 5
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 0m
        labels:
          severity: warning
          component: cluster
        annotations:
          summary: '{{ $value }} planned must-moves expired unexecuted in 30 min'
          description: |
            fn_cash_cluster_tick planned moves (kind=moves_planned) that the
            engine did not carry out before their deadline. Compare
            moves_planned against moves_expired on the dashboard; check the
            engine log for the move announcement at hand start and the
            execution at hand end on the affected tables.

      # ── THE PASS IS SLOW ───────────────────────────────────────────────
      # The brief for this rule said p95 > 3 s. The measured norm is ~10 s a
      # pass (78 games, eight in flight, ~0.85 s per tick RPC from Hetzner;
      # docs/changelog/2026-09-05-cluster-autonomy-live-audit.md BUG 3), so
      # 3 s would fire permanently and be muted within the week. 20 s is
      # twice the norm and four cadences: a database that has slowed under
      # the controller, or a worklist that outgrew the pool, and either way a
      # seat opening being noticed late.
      - alert: ClusterPassSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(poker_cluster_pass_duration_seconds_bucket[10m]))
          ) > 20
          and on() sum(rate(poker_cluster_pass_duration_seconds_count[10m])) > 0
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: cluster
        annotations:
          summary: 'Cluster pass p95 is {{ $value | humanizeDuration }} (limit 20s, norm ~10s)'
          description: |
            The controller is spending longer than its own cadence on every
            pass. Each game's tick is ~0.85 s round trip from Hetzner; the
            pool is CLUSTER_TICK_CONCURRENCY. Either the worklist grew past
            what eight in flight can cover in 5 s, or PostgREST is slow.
            /health -> cluster.elapsedMs and cluster.games say which.

  # ═══════════════════════════════════════════════════════════════════════
  # THE CANARY - silence has to mean something (phase 7, 2026-09-06)
  #
  # Every other rule in this file is quiet when things are well, which makes
  # "no alerts" and "no monitoring" the same observation. They were the same
  # observation for twenty-two hours on 2026-09-03, and again for the fifteen
  # rules this repo declared that the box had simply never loaded.
  #
  # MonitoringCanary is always firing, on purpose. It proves the chain a real
  # alert would travel: Prometheus is up, it loaded THIS file, its rule
  # evaluator is running, and Alertmanager is receiving. Its ABSENCE is the
  # signal - `scripts/ci/check-alert-rules-match.mjs` fails when Alertmanager
  # is not holding it, so a monitoring stack that has stopped evaluating
  # cannot look like a quiet night.
  #
  # It routes to null-receiver: nobody is woken by a canary, and its value is
  # entirely in being checked FOR rather than sent anywhere.
  # ═══════════════════════════════════════════════════════════════════════
  # HORSE FLEET (2026-09-11)
  #
  # Dan, 2026-09-11, verbatim: "I SHOULD GET PUSH NOTIFICATIONS OR TEXT IF
  # ANYTHING INSIDE THE HORSES IS FAILING OR THEY CAN'T PLAY."
  #
  # Until today /metrics carried 2,978 poker_ series and not one of them said
  # how many horses were playing. The fleet's own record is a database table
  # (`ca_horse_fleet_heartbeat`) and no alert rule reads tables, so on
  # 2026-09-10 the floor fell from 33,343 hands an hour on 717 tables to 546
  # on 10 over five hours (measured from hand_history) and the only rule that
  # fired was the generic deal rate, twice, into email.
  #
  # TWO DELIVERIES, TWO FAILURE DOMAINS, ON PURPOSE:
  #   - the ENGINE pages Dan's phone directly for the three verdicts it owns
  #     (ClubArenaFleetFloorLost, ClubArenaFleetSilent,
  #     ClubArenaHorseFleetLoopStopped) through raiseEngineAlert's `page`
  #     flag -> fn_raise_notification -> push_outbox -> the per-minute push
  #     dispatch. That path needs no Prometheus and no Alertmanager.
  #   - these rules are the OTHER half: the degradations the engine cannot
  #     see from inside one process. `severity: critical` reaches
  #     email-critical today. `page: sms` reaches a phone only for alert
  #     names on the World Hub pager allowlist
  #     (`tests/the-pager-list-is-exactly-six.test.ts` in that repo); the
  #     names below marked `page: sms` need adding there in a World Hub pull
  #     request, and until they are they are emailed, not texted.
  #
  # EVERY THRESHOLD IS MEASURED (CLAUDE.md 10.84), from hand_history,
  # ca_horse_fleet_heartbeat, the live /metrics scrape and the 60-minute
  # engine log, 2026-09-10 13:00 to 2026-09-11 15:00 UTC. The benchmark
  # incident is 2026-09-10 20:00-00:00 UTC.
  #
  # THE BREAK GUARD is on every fleet-level rule (CLAUDE.md 13 rule 6). A
  # guard on an aggregated expression must be `unless on()`: `unless` matches
  # the exact label set, and a `sum()` has none, so a bare one guards nothing.
  #
  # RULES DELIBERATELY NOT HERE, because the series they read does not exist
  # yet and an alarm that cannot fire is worse than no alarm (10.84: "an empty
  # alert group is worse than no group"). Each lands in the same pull request
  # as its metric:
  #   HorseHostBelowTarget          poker_stable_hand_live_horses{host} / _target{host}
  #   HorseRebuysDeclinedByTreasury poker_horse_rebuy_total{outcome,club}
  #   HorseRotatorSeatReadFailing   poker_horse_rotator_seat_read_failed_total
  #   HorseTournamentFillFailing    poker_horse_tournament_fill_failed_total{reason}
  #   HorseFleetStateUpsertFailing  poker_horse_fleet_state_upsert_failed_total
  # Their full bodies, with measurements, are in
  # docs/changelog/2026-09-11-the-horse-audit.md.
  # ═══════════════════════════════════════════════════════════════════════
  - name: horse-fleet
    interval: 30s
    rules:
      # ── THE FLEET CANNOT PLAY ─────────────────────────────────────────────

      - alert: HorseFleetCollapsed
        # poker_dealable_tables = tables with 2+ dealable seats, not paused.
        # Measured per hour from hand_history, 2026-09-10 13:00 -> 2026-09-11
        # 15:00 UTC: healthy daytime 652-928 tables, the 04:00 UTC night
        # trough 65, and the collapse 47 (21:00), 17 (22:00), 10 (23:00).
        # 20 sits under every healthy hour including the night trough and
        # over the collapse. Boot ramp is 0 tables at 62 s and 59 at 139 s
        # (measured 2026-08-30), inside the 15 m window.
        expr: |
          poker_dealable_tables < 20
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 15m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: 'Only {{ $value }} tables are dealing - the horse fleet has collapsed'
          description: |
            Fewer than 20 tables have two dealable seats for 15 minutes outside a
            break. On 2026-09-10 21:00-00:00 UTC this read 47/17/10 while the
            floor drained. Read ca_horse_fleet_heartbeat (the `detail.gates`
            object names every gate that refused a seat this cycle), the Stable
            Hand per-host caps, and whether tournaments are stuck REGISTERING
            and holding horses at the four-game limit.
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

      - alert: HorseCashActionsStopped
        # THE "HANDFUL OF HORSES" DETECTOR, and the closest series to what Dan
        # actually reported. Horse actions per minute at cash tables,
        # fleet-wide, derived from hand_history (horse-only hands, no
        # tournament) actions per hour / 60: healthy floor 313/min (12:00 UTC
        # 2026-09-11, the quietest healthy daytime hour), 426/min at 04:00
        # UTC; the collapse 215 (21:00), 95 (22:00), 54 (23:00). 150 sits
        # under every healthy hour and over every collapse hour past the first.
        expr: |
          sum(rate(poker_actions_fleet_total{audience="horse",format="cash"}[10m])) * 60 < 150
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 15m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: 'Horse cash actions fell to {{ $value | printf "%.0f" }}/min'
          description: |
            Horses at cash tables are acting under 150 times a minute for 15
            minutes outside a break (healthy floor 313/min). Either they are not
            SEATED (fleet manager, Stable Hand caps, the four-game limit) or
            seated horses are not ACTING (decision worker, turn timeouts) - the
            other rules in this group tell the two apart.
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

      - alert: HorseFleetNotSeated
        # poker_horses_seated counts horses holding chips at every live engine.
        # PROVISIONAL THRESHOLD, and it says so: the series is published for
        # the first time by this release, so it has no history to derive from.
        # It is set as the horse-side equivalent of HorseFleetCollapsed - a
        # dealing table holds at least two players, so fewer than 40 seated
        # horses is the same floor as fewer than 20 dealing tables - and is to
        # be re-derived from a week of the real series. Until then it is a
        # backstop, not the sensitive detector: HorseCashActionsStopped is.
        expr: |
          poker_horses_seated < 40
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 20m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: 'Only {{ $value }} horses are seated anywhere on the platform'
          description: |
            Fewer than 40 horses hold a seat across every cash table and
            tournament for 20 minutes outside a break, against a stable of
            1,000. The floor is empty whatever the lobby says.
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

      - alert: HorseFleetHeartbeatStale
        # poker_horse_fleet_heartbeat_age_seconds: seconds since
        # HorseFleetManager last COMPLETED a seeding cycle and recorded it;
        # -1 before the first of a process. Measured over 24 h of
        # ca_horse_fleet_heartbeat to 2026-09-11: gap p50 30 s, p95 51 s, the
        # hourly break 447-632 s (guarded anyway), and one genuine 2,461 s
        # stall at 01:33 UTC in which no horse could be seated anywhere and
        # nothing fired. 900 s clears every ordinary gap and catches that one
        # at 15 minutes. The ENGINE also pages this condition itself
        # (ClubArenaHorseFleetLoopStopped, DealRateVerifier): two deliveries,
        # two failure domains, deliberately.
        expr: |
          poker_horse_fleet_heartbeat_age_seconds > 900
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: 'The horse fleet loop has not beaten for {{ $value | printf "%.0f" }}s'
          description: |
            HorseFleetManager completes a seeding cycle about every 30 s. No
            completed cycle for 15 minutes means no horse is being seated
            anywhere: the floor drains as sessions end and nothing refills it.
            Read the engine log for the cycle's last error and /health.
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

      # ── THE INPUT DEVICE (a seated horse that cannot act) ──────────────────

      - alert: HorseDecisionWorkerDown
        # Exists since the worker did. 1 only while the sole HorseLogic worker
        # is READY. A worker that is down means every horse turn on the
        # platform takes the legal check/fold fallback.
        expr: poker_horse_decision_worker_ready == 0
        for: 3m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: 'The live horse decision worker is not ready'
          description: |
            poker_horse_decision_worker_ready has read 0 for 3 minutes. Every
            seated horse is checking or folding blind. The GameServer lifecycle
            treats terminal worker failure as fatal; if the process is up and
            this is still 0, the restart did not bring the worker back.
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

      - alert: HorseTurnTimeouts
        # A horse has no browser, so a timeout at its seat is the input device
        # failing, never a player away from the keyboard. Measured in the 60
        # minutes to 13:27 UTC 2026-09-11: 67 orphaned time-bank expiries an
        # hour (1.1/min) from the settle defect fixed in this release;
        # expected after it: about 0. 0.5/min over 15 m is seven timeouts.
        expr: sum(rate(poker_horse_turn_timeouts_total[15m])) * 60 > 0.5
        for: 15m
        labels:
          severity: warning
          component: club-arena-engine
        annotations:
          summary: 'Horses are timing out at {{ $value | printf "%.1f" }}/min'
          description: |
            Seated horses are being resolved by the clock instead of by their own
            decision (kind=timer is the primary turn clock, kind=timebank a bank
            deadline). Check the decision worker queue age and the engine log for
            "Time bank expiry" and "timed out".
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

      - alert: HorseTurnTimeoutStorm
        # The same series at the fleet-wide failure level: with horse cash
        # actions at 313-426/min, a dead think-timer path times out scores a
        # minute. 5/min for 10 m cannot be reached by the fixed baseline.
        expr: sum(rate(poker_horse_turn_timeouts_total[10m])) * 60 > 5
        for: 10m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: 'Horses are timing out at {{ $value | printf "%.1f" }}/min - the input device is broken'
          description: |
            More than five seated horses a minute are being auto-folded or
            auto-checked for ten minutes. The horses are seated and cannot play.
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

      # ── WHY A HORSE TURN WAS ABANDONED ────────────────────────────────────
      #
      # HorseTurnTimeoutStorm above says horses are being folded by the clock.
      # It has never been able to say WHY, because the six fence checks in
      # scheduleHorseAction each answered a failure with a bare return: the
      # turn was refused, nothing was counted, and every decision-path gauge
      # stayed clean. On 2026-09-11 that read as fallbacks 0 and a worker idle
      # at 4.9 ms compute while one horse turn in eight was folded, beside
      # 1,652 engine lease losses a minute across 1,570 tables.
      #
      # This alert is the missing half of that pair. It does not fire because
      # turns are abandoned - abandoning a superseded turn is CORRECT, and a
      # table that has lost its lease must not act. It fires when abandonment
      # is a working condition rather than an exception, and it carries the
      # reason, so the answer arrives with the page instead of after it.
      #
      # 5/min matches HorseTurnTimeoutStorm deliberately: the two describe the
      # same seat from opposite ends, and a threshold that differed would let
      # one fire without the other and invite the wrong conclusion.
      - alert: HorseTurnsAbandonedByLostAuthority
        expr: |
          sum by (reason) (rate(poker_horse_turns_abandoned_total[10m])) * 60 > 5
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: '{{ $value | printf "%.1f" }} horse turns/min abandoned: {{ $labels.reason }}'
          description: |
            Seated horses are reaching their turn and having it taken away
            before they can act, for the reason in the label. lease_lost means
            the table lost its engine lease mid-turn, so the horse was never
            scheduled and the clock folded it; check the engine log for
            tournament_lease_lost and cash_lease_proof_expired, which are not
            themselves metered. seat_moved or hand_replaced at this rate means
            the table is restarting under the horse. superseded is the benign
            one and should not reach this rate on its own.
          runbook: docs/changelog/2026-09-11-a-horse-turn-that-is-abandoned-says-why.md

      # ── A LEASE THAT IS NOT RENEWED ───────────────────────────────────────
      #
      # Measured 2026-09-12: every cash table on the engine was re-claiming its
      # lease roughly every twenty seconds - 63 tables, 923
      # cash_lease_proof_expired restarts in five minutes, the lease_generation
      # changing each cycle - while the main loop sat idle (event-loop p99
      # 21.9 ms) and the database answered heartbeat_table_leases_v4 in 5.2 ms.
      #
      # Each restart mints a new lease generation, and a new generation fails
      # the authority fence of every horse turn in flight at that table, which
      # is the lease_lost reason on poker_horse_turns_abandoned_total and the
      # clock-fold behind HorseTurnTimeoutStorm. This is the cause; those are
      # the symptom.
      #
      # `busy` is the one to watch. The database heartbeat takes
      # FOR NO KEY UPDATE ... SKIP LOCKED so it never queues behind a
      # settlement, so a locked row comes back busy, and busy correctly extends
      # nothing. Four consecutive busies inside the twenty-second proof window
      # is an expiry. One busy is ordinary contention; a rate of them is a
      # table that will restart.
      # ── THE RENEWAL LOOP STOPPED, AND NOTHING SAID SO ─────────────────────
      #
      # runOwnershipLeaseRenewalLoop renews every cash lease and every
      # tournament lease in the process. It is launched once and nothing
      # relaunches it. On 2026-09-12 it stopped for at least two hours:
      # heartbeat_table_leases_v4 and heartbeat_tournament_leases_v4 held at
      # exactly 27,886 and 27,765 calls across a 73-second window while
      # claim_table_lease_v2 took 283 in the same window - 233 a minute. Every
      # one of the 78 cash tables was killed by its own 20-second proof
      # watchdog and re-claimed, 26,129 times, three quarters of those lives
      # dealing no hands, at tables holding 9 of 9 seats.
      #
      # There was no log line, no error and no metric, because nothing FAILED.
      # It was not running, and an engine not doing a thing reads exactly like
      # an engine with nothing to do. This is the rule that tells them apart.
      #
      # A pass runs every 5 seconds, so 5m of zero completed passes is
      # sixty missed renewals against a twenty second proof window. By then
      # every lease in the process is already being lost and re-claimed.
      - alert: LeaseRenewalLoopStopped
        expr: |
          sum(rate(poker_lease_renewal_passes_total{outcome="completed"}[5m])) == 0
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: 'No ownership lease renewal pass has completed for 5 minutes'
          description: |
            The one lifecycle that renews every cash and tournament lease in
            the engine has stopped completing passes. Nothing relaunches it.
            Every lease will reach its twenty second proof window unrenewed,
            every table will be killed by its own watchdog and re-claimed, and
            hands in flight will be abandoned mid-play. Read
            poker_lease_renewal_loop_running: 0 means the loop left, 1 means it
            is wedged inside a pass. Check
            poker_lease_renewal_passes_total{outcome="abandoned"} for a pass
            that never settled, and claim_table_lease_v2 call rate for the
            re-claim storm that follows.
          runbook: docs/changelog/2026-09-12-the-loop-that-renews-every-lease-stopped.md

      - alert: LeaseHeartbeatsNotBeingKept
        expr: |
          sum by (scope) (rate(poker_lease_heartbeat_outcomes_total{state!="kept"}[10m]))
            /
          clamp_min(sum by (scope) (rate(poker_lease_heartbeat_outcomes_total[10m])), 0.001)
            > 0.05
        for: 10m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: '{{ $value | humanizePercentage }} of {{ $labels.scope }} lease heartbeats are not being kept'
          description: |
            More than one heartbeat in twenty is coming back as something other
            than kept, for ten minutes. Read
            poker_lease_heartbeat_outcomes_total by state: busy is a locked row
            the heartbeat skipped rather than waited for, and repeated busies
            inside the twenty-second proof window expire the lease and restart
            the table under its players. taken means another instance holds it.
            stale or missing mean the row is gone or past the audited window.
          runbook: docs/changelog/2026-09-12-a-lease-that-is-not-renewed-says-so.md

      - alert: HorseDecisionFallbacks
        # The worker failed or expired a job and the seat took the legal
        # check/fold. The path reported to external telemetry only before this release, so
        # the baseline is the worker's own expired-job count, which read 0 on
        # the live scrape. 5/min over 10 m is fifty seats folded blind.
        expr: sum(rate(poker_horse_decision_fallbacks_total[10m])) * 60 > 5
        for: 10m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: '{{ $value | printf "%.1f" }} horse decisions/min are falling back to check/fold'
          description: |
            The decision worker is failing or expiring jobs and seated horses are
            acting without a decision. Read
            poker_horse_decision_worker_oldest_queued_age_ms and _expired_jobs.
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

      - alert: HorseSeatsUnactable
        # The horse's decision AND both fallbacks were rejected; the seat is
        # left to the watchdog. Baseline 0 in the 60-minute log.
        expr: increase(poker_horse_seat_unactable_total[15m]) >= 3
        for: 0m
        labels:
          severity: warning
          component: club-arena-engine
        annotations:
          summary: '{{ $value }} horse seats could not be acted in 15m'
          description: |
            Each one costs a table a 45 s stall and a watchdog action. Read the
            engine log for "could not be acted".
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

      - alert: HorseForcedSitOuts
        # The three-strike ladder sat a horse out. Nothing sits a horse back in
        # on its own, so a cash seat is evicted after 2 orbits / 5 minutes and
        # a tournament seat is blinded off. Measured: 12 horses parked SAT_OUT
        # 'forced' at the 14:55 UTC park on 2026-09-11, 8 of them inside one
        # second; one horse had been sitting out since 02:54 UTC. Expected
        # after this release's settle fix: 0.
        expr: increase(poker_horse_forced_sit_outs_total[1h]) >= 3
        for: 0m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: '{{ $value }} horses were forced to sit out in the last hour'
          description: |
            Horses timed out three turns in a row and were sat out by the AFK
            ladder - a seat lost until eviction. Something upstream is stopping
            seated horses from acting (worker, timers, orphaned deadlines).
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

      # ── TOURNAMENTS: horses booked into events that never start ────────────

      - alert: HorseTournamentsOverdue
        # Measured 13:26 UTC 2026-09-11: 97 events REGISTERING more than 30
        # minutes past start_time. Every one holds horse seats and bookings,
        # and the four-game limit then keeps those horses off the cash floor -
        # 428 of 448 seated Midway horses were at that limit on 2026-09-09.
        expr: |
          poker_tournaments_overdue_start >= 5
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 30m
        labels:
          severity: critical
          page: sms
          component: club-arena-engine
        annotations:
          summary: '{{ $value }} tournaments are past their start time and nobody started them'
          description: |
            Tournaments stuck REGISTERING hold horse seats and bookings; the
            four-game limit then keeps those horses off the cash floor.
          runbook: docs/changelog/2026-09-11-the-horse-audit.md

  # ═══════════════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════════════
  #  THE PAGER IS WATCHED BY SOMETHING THAT IS NOT THE PAGER (2026-09-11)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # `page: sms` routes to the `pager-sms` webhook, which is the World Hub's
  # /api/internal/alertmanager-page. That route is careful: when Twilio refuses,
  # or when TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_PHONE_NUMBER are
  # absent from its environment, it answers 502 rather than swallowing the
  # failure, and Alertmanager counts it and retries.
  #
  # Nothing read that count. Measured 2026-09-11: zero rules anywhere in this
  # repo named `alertmanager_notifications_failed_total`, so a dead pager was
  # invisible by construction - the one thing that would have announced it is
  # the pager. That is CLAUDE.md 10.83 exactly: a check nobody can see.
  #
  # DELIBERATELY NOT `page: sms`. An alarm about the pager must not be routed
  # through the pager. These go to email-critical, which is a different
  # integration with a different provider, so the two cannot fail together for
  # one reason.
  #
  # Baseline on engine-01 when this was written: 14 webhook notifications
  # delivered, `reason="serverError"` 0, `reason="clientError"` 1 (a single 4xx
  # from before the bearer was in place). So the threshold is "any failure in
  # fifteen minutes", which is quiet today and cannot be quiet if the pager
  # stops working.
  - name: pager-health
    interval: 30s
    rules:
      - alert: PagerDeliveryFailing
        expr: |
          sum(increase(alertmanager_notifications_failed_total{integration="webhook"}[15m])) > 0
        for: 5m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: 'The SMS pager has failed {{ $value | printf "%.0f" }} delivery attempt(s) in fifteen minutes'
          description: |
            Alertmanager could not deliver to the pager webhook. A `serverError`
            is the World Hub route answering 502, which it does when Twilio
            refuses or when its three TWILIO_* values are missing from the
            hub-vanguard environment; a `clientError` is a 4xx, usually the
            bearer secret. Until this clears, every `page: sms` alert on this
            platform is reaching nobody by text. This alert is routed to email
            on purpose - it is about the pager, so it must not travel through
            it.
          runbook: 'https://github.com/Smarter-Poker/Smarter-Poker-Club-Arena/blob/main/docs/changelog/2026-09-11-the-pager-is-watched.md'

      - alert: CriticalEmailDeliveryFailing
        expr: |
          sum(increase(alertmanager_notifications_failed_total{integration="email"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: 'Alertmanager has failed {{ $value | printf "%.0f" }} email delivery attempt(s) in fifteen minutes'
          description: |
            The email leg is the fallback the pager alarm above is routed to, so
            it is worth knowing separately when it breaks. If BOTH legs are
            failing, the only remaining signal is MonitoringCanary going absent
            from the dashboard.

  - name: monitoring-canary
    interval: 30s
    rules:
      - alert: MonitoringCanary
        expr: |
          vector(1)
        labels:
          severity: canary
          component: monitoring
        annotations:
          summary: 'Monitoring is alive. This alert always fires; its absence is the fault.'
          description: |
            If this is NOT in Alertmanager, the stack is not evaluating rules -
            every other alert in this file is silent for the same reason, and
            that silence is indistinguishable from health. Check that
            prometheus is up, that it loaded alert-rules.yml
            (curl localhost:9090/api/v1/rules), and that alertmanager is
            reachable from it.
          runbook: 'docs/runbooks/tables-say-reconnecting.md'

  # Application memory observations; no rule initiates a release or restart.
  - name: engine-memory
    interval: 15s
    rules:
      # Preserve the measured 256 MiB critical threshold and two-minute window.
      # Sustained pressure raises OOM risk; it does not predict the next victim.
      - alert: EngineHostNearOOM
        expr: |
          node_memory_MemAvailable_bytes{host="engine-01"} < 268435456
        for: 2m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'engine-01 has {{ $value | humanize1024 }}B available - the host is at elevated OOM risk'
          description: |
            Host MemAvailable has stayed below 256 MiB for two minutes.
            Compare current engine RSS, worker activity and other resident
            processes. A missing memory series is unknown, not zero usage.
            The [heap] virtual extent is not resident memory or an allocation
            diagnosis. Follow established incident and lifecycle authority;
            a memory alert does not authorize a bare restart of live tables.
          runbook: 'docs/runbooks/engine-memory.md'

      # Current on-host builder: 896 MiB memory limit + 256 MiB reserve.
      # The existing build gate evaluates available memory at its actual start;
      # this thirty-minute warning reports sustained pressure, not permission.
      - alert: EngineBuildHeadroomLost
        expr: |
          node_memory_MemAvailable_bytes{host="engine-01"} < 1207959552
        for: 30m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: 'engine-01 has {{ $value | humanize1024 }}B available - under the 1152 MiB the engine image build refuses below'
          description: |
            Host MemAvailable has stayed below 1152 MiB for thirty minutes.
            The restored GitHub/Hetzner engine publisher builds on this host;
            server/scripts/build-engine-image.sh requires 1179648 KiB available
            when its existing gate runs. This warning does not authorize a
            build, release or restart, or predict conditions at a later attempt.
            Compare engine RSS, worker activity and other resident processes.
            Absent engine-memory series are unknown, not zero. MemAvailable
            includes reclaimable cache. This warning alone identifies neither
            an allocation cause nor imminent OOM; retain the separate critical alert.
          runbook: 'docs/runbooks/engine-memory.md'

      # Retain the historical 1.6 GiB warning, not a process cap or an exact
      # present-day build fit: other resident memory and workloads vary.
      - alert: EngineProcessMemoryHigh
        expr: |
          poker_engine_process_rss_bytes > 1717986918
        for: 15m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: 'Engine process RSS {{ $value | humanize1024 }}B - above the retained 1.6 GiB process-memory warning'
          description: |
            Engine process RSS has exceeded 1.6 GiB for fifteen minutes.
            Compare whole-process RSS, main-isolate V8 usage, worker activity,
            external memory and threads. poker_engine_native_main_arena_bytes
            is current [heap] virtual extent, not RSS or allocation ownership.
            Correlation between these observations does not establish a leak,
            TLS attribution or a runtime memory limit. Use the existing
            on-host build gate to establish build headroom at the actual attempt.
          runbook: 'docs/runbooks/engine-memory.md'
