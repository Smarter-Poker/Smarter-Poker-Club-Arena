# Alert rules — smarter.poker monitoring stack
# Phase 5.1.3
#
# Severity ladder:
#   critical → page oncall via PagerDuty (routed in alertmanager.yml)
#   warning  → Slack #alerts-ops channel
#   info     → Slack #alerts-info (mostly informational, e.g. deploy markers)
#
# Burn-rate philosophy: most latency alerts use the Google SRE multi-window
# multi-burn-rate recipe (1h + 6h windows) so we don't flap on transient
# spikes but still catch sustained degradation within ~30 minutes.

groups:
  - name: engine-health
    interval: 15s
    rules:
      # 2026-08-15: was `up{job="engine_pm2"}`. No scrape config anywhere
      # defines that job — the real one is `engine_game_server` — so this
      # alert could never fire. It was the platform's primary "the engine is
      # dead" signal and it had never been capable of firing.
      # Superseded by EngineScrapeDown in engine-freeze-rules.yml; kept here
      # (corrected) so the SLO rules that reference this job still resolve.
      - alert: EngineDown
        expr: up{job="engine_game_server"} == 0
        for: 1m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: "Poker engine unreachable on {{ $labels.instance }}"
          description: |
            pm2-metrics has been unreachable for >1 minute. This means either
            the pm2 process is dead, the node is down, or the metrics module
            crashed. Player-facing impact: active tables cannot tick.
          runbook: https://monitor.smarter.poker/runbooks/engine-down

      - alert: EngineHandsPerSecDropped
        # Hands/sec should average > 0.5 during business hours. A sustained
        # zero during peak means the dealer loop is stuck even though pm2
        # is still "up".
        # 2026-08-15: was `poker_engine_hands_played_total`, which the engine
        # does not emit (the real metric is `poker_hands_dealt_total`). Also
        # the hour() clause was unsatisfiable: `hour() >= 13 and hour() < 6`
        # is never true. Both corrected; see EngineHandsStopped in
        # engine-freeze-rules.yml for the always-on variant.
        expr: |
          sum(increase(poker_hands_dealt_total[5m])) == 0
          and sum(poker_active_players) > 1
        for: 10m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: "Engine has played zero hands in the last 10 minutes"
          description: |
            No hands played during peak hours. Likely the dealer tick is
            blocked. Check engine-01 logs and pm2 list.

      - alert: EngineTableCountAnomaly
        # If the active table count drops more than 50% from the 1h baseline
        # we probably lost a shard or the lobby is failing to promote tables.
        expr: |
          poker_active_tables < 0.5 * avg_over_time(poker_active_tables[1h] offset 1h)
        for: 15m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: "Active table count dropped >50% vs 1h baseline"
          description: |
            {{ $labels.instance }} reports {{ $value }} tables. Baseline was
            much higher. Investigate lobby.promote failures.

  # ── CRON FLEET ────────────────────────────────────────────────────────
  # This group carried NO RULES until 2026-09-04 - a heading that alerts on
  # nothing and reads exactly like coverage. On the afternoon it was found,
  # four Open Claw jobs were stale with the worst SILENT FOR 18.3 DAYS, and
  # twelve pg_cron jobs had failed together at 17:46. v_openclaw_job_staleness
  # had been computing all of it, and nothing had ever read it.
  #
  # Gauges from server/src/services/CronFleetMetrics.ts via
  # public.fn_cron_fleet_health().
  - name: cron-health
    interval: 30s
    rules:
      # Silence, not failure, is the observable that matters here. When
      # CRON_SECRET was rotated without updating the Hetzner VM, all 85 Open
      # Claw jobs 401'd and nothing noticed, because a 401 is refused before
      # anything records it - the log does not fill with errors, it STOPS.
      - alert: OpenClawJobsHaveGoneSilent
        expr: |
          poker_cron_openclaw_stale > 0
        for: 30m
        labels:
          severity: warning
          component: cron
        annotations:
          summary: "{{ $value }} Open Claw job(s) past their staleness threshold"
          description: "SELECT * FROM v_openclaw_job_staleness WHERE is_stale. A job that stops being dispatched produces no errors at all - it simply stops appearing."
          runbook: "docs/changelog/2026-09-04-the-headings-that-alerted-on-nothing.md"

      - alert: OpenClawFleetLongSilence
        expr: |
          poker_cron_openclaw_worst_silence_minutes > 1440
        for: 30m
        labels:
          severity: critical
          component: cron
        annotations:
          summary: "An Open Claw job has been silent for {{ $value | humanizeDuration }}"
          description: "More than a day with no successful run. The worst case observed before this alert existed was 18.3 days."
          runbook: "docs/changelog/2026-09-04-the-headings-that-alerted-on-nothing.md"

      # Twelve at once on 2026-09-04, all 'job startup timeout', including the
      # snapshot prune and the daily-missions outbox drain.
      - alert: PgCronFailuresElevated
        expr: |
          poker_cron_pg_failures > 10
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 15m
        labels:
          severity: warning
          component: cron
        annotations:
          summary: "{{ $value }} pg_cron failures in the last hour"
          description: "SELECT jobname, status, return_message FROM cron.job_run_details JOIN cron.job USING (jobid) WHERE status <> 'succeeded' ORDER BY start_time DESC."
          runbook: "docs/changelog/2026-09-04-the-headings-that-alerted-on-nothing.md"

      # 856 runs an hour is normal. A collapse means the scheduler itself has
      # stopped, which no per-job alert can see.
      - alert: PgCronFleetStopped
        expr: |
          poker_cron_pg_runs < 50
          and poker_cron_metrics_stale_seconds < 300
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 20m
        labels:
          severity: critical
          component: cron
        annotations:
          summary: "Only {{ $value }} pg_cron runs in the last hour"
          description: "The fleet normally runs ~856 an hour. The collector is fresh, so this is the scheduler, not the gauge."
          runbook: "docs/changelog/2026-09-04-the-headings-that-alerted-on-nothing.md"

      - alert: CronMetricsBlind
        expr: |
          poker_cron_metrics_stale_seconds > 600
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: cron
        annotations:
          summary: "Cron fleet gauges are stale ({{ $value }}s)"
          runbook: "docs/changelog/2026-09-04-the-headings-that-alerted-on-nothing.md"

  # ── POSTGRES ──────────────────────────────────────────────────────────
  # Also empty until 2026-09-04, and pointedly so: the realtime replication
  # slot spent that morning at 305 MB behind, growing, with nothing on the
  # platform able to see it. The engine-01 stack drops the supabase_pg scrape
  # job (no postgres_exporter deployed), so these are written against gauges
  # the ENGINE emits from SECURITY DEFINER functions instead - it is the
  # Postgres exporter now, for the things that matter.
  #
  # Slot flush-lag rules live in the `replication` group below; these are the
  # ones that group does not cover.
  - name: postgres-health
    interval: 30s
    rules:
      # restart_lsn, not confirmed_flush_lsn. This is the horizon Postgres
      # cannot recycle WAL past - it is what actually fills the disk, and it
      # sat at 703 MB while flush lag read 305 MB.
      - alert: ReplicationSlotPinningWal
        expr: |
          max by (slot) (poker_pg_replication_slot_restart_lag_bytes) > 2147483648
        for: 20m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Slot {{ $labels.slot }} is pinning {{ $value | humanize1024 }}B of WAL on disk"
          description: "Postgres cannot recycle WAL behind a slot's restart_lsn. This is the number that fills the volume, and it runs well ahead of the flush lag."
          runbook: "docs/SENTRY-AND-REALTIME-PROGRAMME.md section 3"

      # The engine and the database disagreeing about the time silently breaks
      # every deadline, timer and retention window on the platform.
      - alert: EngineDatabaseClockSkew
        expr: |
          abs(poker_db_clock_skew_ms) > 5000
        for: 15m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Engine and database clocks differ by {{ $value }}ms"
          description: "Turn timers, maintenance-break windows and every retention cutoff are computed against one clock or the other."
          runbook: "docs/changelog/2026-09-04-the-headings-that-alerted-on-nothing.md"

      - alert: DatabaseRpcErrorsElevated
        expr: |
          rate(poker_rpc_errors_total[10m]) > 1
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 15m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Engine RPC errors at {{ $value }}/s"
          description: "The engine reaches Postgres only through PostgREST. A sustained error rate here is seats, hands and settlements failing to write."
          runbook: "docs/changelog/2026-09-04-the-headings-that-alerted-on-nothing.md"

  # ── vercel-health: DELETED 2026-09-04, deliberately ───────────────────
  # This group existed with no rules in it. Filling it honestly is not
  # possible from this stack: every rule it would want reads
  # probe_success{job="vercel_health"} from blackbox-exporter, and the
  # engine-01 compose does not deploy blackbox - the same reason
  # slo-rules.yml and slo-alerts.yml are marked DISABLED. The engine cannot
  # substitute, because it cannot see whether smarter.poker is reachable from
  # the outside.
  #
  # That coverage is NOT missing, it just lives elsewhere: the World Hub's
  # publish-watchdog.yml runs every 15 minutes, compares main's HEAD against
  # the sha /api/health reports, and raises a self-closing issue when they
  # diverge. It deliberately does not share a failure domain with the deploy
  # pipeline it watches.
  #
  # An empty group is worse than no group - it reads as coverage. To bring it
  # back properly: add blackbox-exporter to infra/monitoring/docker-compose.yml,
  # add a vercel_health blackbox job to prometheus.yml, then re-enable
  # slo-rules.yml and slo-alerts.yml and restore this group in the same PR.

  - name: host-health
    interval: 30s
    rules:
      - alert: HostDiskNearlyFull
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 15m
        labels:
          severity: warning
          component: infra
        annotations:
          summary: "Disk <10% free on {{ $labels.host }}"

      - alert: HostCPUSaturated
        expr: |
          100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          component: infra
        annotations:
          summary: "CPU >85% on {{ $labels.host }} for 10m"

      - alert: HostMemoryPressure
        expr: |
          (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 10m
        labels:
          severity: warning
          component: infra
        annotations:
          summary: "Available memory <10% on {{ $labels.host }}"

  # ── REPLICATION (2026-09-04) ────────────────────────────────────────────
  # The realtime replication slot was 136 MB behind and climbing, and nothing
  # on the platform could see it: the only way anyone had ever learned the
  # number was by opening a SQL editor and asking. Logical decoding degrades
  # as a SPIRAL rather than a cliff - a slot that falls behind must read WAL
  # from disk instead of memory, which is slower, so being behind makes it
  # fall further behind. There is no step change to catch, which is exactly
  # why it needs an alert rather than a dashboard.
  #
  # Gauges from server/src/services/ReplicationMetrics.ts via
  # public.fn_replication_slot_metrics().
  - name: replication
    interval: 30s
    rules:
      - alert: ReplicationSlotFallingBehind
        expr: |
          max by (slot) (poker_pg_replication_slot_flush_lag_bytes) > 268435456
        for: 15m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Realtime slot {{ $labels.slot }} is >256MB behind"
          description: "Logical decoding is not keeping up with WAL. This compounds: a lagging slot reads WAL from disk rather than memory. Players see it as stale lobbies and late seat updates."
          runbook: "docs/SENTRY-AND-REALTIME-PROGRAMME.md section 3"

      - alert: ReplicationSlotCriticallyBehind
        expr: |
          max by (slot) (poker_pg_replication_slot_flush_lag_bytes) > 1073741824
        for: 10m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Realtime slot {{ $labels.slot }} is >1GB behind"
          description: "At this point the slot is pinning WAL on disk and the instance is at risk of filling it. Do not restart the consumer blind - read the runbook."
          runbook: "docs/SENTRY-AND-REALTIME-PROGRAMME.md section 3"

      # An inactive slot advances not at all and pins every WAL segment behind
      # it. Guarded, because the engine's own restart inside the :55 break can
      # briefly drop a consumer.
      - alert: ReplicationSlotInactive
        expr: |
          min by (slot) (poker_pg_replication_slot_active) == 0
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Replication slot {{ $labels.slot }} has no consumer"
          description: "A slot with no consumer never advances and holds every WAL segment after it on disk."
          runbook: "docs/SENTRY-AND-REALTIME-PROGRAMME.md section 3"

      # The collector itself. A gauge that stopped being collected reads as a
      # perfectly healthy slot, which is the failure this whole family exists
      # to prevent, so the staleness is alertable in its own right.
      - alert: ReplicationMetricsBlind
        expr: |
          poker_pg_replication_metrics_stale_seconds > 600
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Replication gauges are stale ({{ $value }}s)"
          description: "fn_replication_slot_metrics has not returned successfully in over 10 minutes. The lag numbers on the dashboard are last-known-good, not current."
          runbook: "docs/SENTRY-AND-REALTIME-PROGRAMME.md section 3"

      # Zero slots is not a quiet database - this database has two logical
      # slots. Zero means the collector cannot see pg_replication_slots.
      - alert: ReplicationSlotsDisappeared
        expr: |
          poker_pg_replication_slots == 0
          and poker_pg_replication_metrics_stale_seconds < 600
        for: 10m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "No replication slots visible"
          description: "The collector is fresh but reports zero slots. Either the slots were dropped - realtime is then entirely dead - or the function lost its catalog access."
          runbook: "docs/SENTRY-AND-REALTIME-PROGRAMME.md section 3"

  # ── SETTLEMENT (2026-09-04) ─────────────────────────────────────────────
  # On 2026-09-04, 139,153 hands failed to settle over thirteen hours -
  # between 25% and 44% of every hand dealt - and nothing raised an alert.
  # The state was written to ca_settlements.state = 'failed' with a full
  # error_detail on every row; the database knew 139,153 times and had no way
  # to say it out loud. It was found by someone querying that table for an
  # unrelated reason.
  #
  # Gauges from server/src/services/SettlementMetrics.ts via
  # public.fn_settlement_health(). The rate is a FIVE-MINUTE WINDOW: the
  # lifetime ratio read 0.077 while the live rate was 0.44.
  - name: settlement
    interval: 30s
    rules:
      - alert: HandsAreFailingToSettle
        expr: |
          poker_settlement_failure_rate > 0.02
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: critical
          component: money
        annotations:
          summary: "{{ $value | humanizePercentage }} of hands are failing to settle"
          description: "fn_ca_settle_hand_stacks_absolute is refusing hands whole. Read ca_settlements.error_detail for the reason before changing anything. The 2026-09-04 cause was a BEFORE UPDATE trigger on table_seats that cancelled no-op writes, making a correct seat write look like a failed one."
          runbook: "docs/changelog/2026-09-04-settlement-was-failing-a-third-of-every-hand.md"

      # Baseline before the incident was 0.0-0.2%. A rate that merely doubles
      # is worth knowing about long before it reaches a quarter of all hands.
      - alert: SettlementFailuresAboveBaseline
        expr: |
          poker_settlement_failure_rate > 0.005
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 30m
        labels:
          severity: warning
          component: money
        annotations:
          summary: "Settlement failure rate {{ $value | humanizePercentage }}, above the 0.2% baseline"
          runbook: "docs/changelog/2026-09-04-settlement-was-failing-a-third-of-every-hand.md"

      # No hands settling at all is not a quiet table - this platform settles
      # ~500 hands a minute. The failure-rate gauge is ABSENT in this state, so
      # it must be alerted on separately or the silence reads as health.
      - alert: NoHandsAreSettling
        expr: |
          poker_settlement_window_hands == 0
          and poker_settlement_metrics_stale_seconds < 300
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: critical
          component: money
        annotations:
          summary: "No hand has settled in five minutes"
          description: "The collector is fresh and reports zero terminal settlements. Either the engine has stopped dealing or settlement is failing before it reaches a terminal state."
          runbook: "docs/changelog/2026-09-04-settlement-was-failing-a-third-of-every-hand.md"

      - alert: SettlementsStuckMidStateMachine
        expr: |
          poker_settlement_stuck > 50
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 15m
        labels:
          severity: warning
          component: money
        annotations:
          summary: "{{ $value }} settlements are neither final nor failed"
          runbook: "docs/changelog/2026-09-04-settlement-was-failing-a-third-of-every-hand.md"

      - alert: SettlementMetricsBlind
        expr: |
          poker_settlement_metrics_stale_seconds > 600
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: money
        annotations:
          summary: "Settlement gauges are stale ({{ $value }}s)"
          description: "fn_settlement_health has not returned in over ten minutes. Whether hands are settling is currently unknown, and unknown is what thirteen hours of this looked like."
          runbook: "docs/changelog/2026-09-04-settlement-was-failing-a-third-of-every-hand.md"

  # ── MONEY HEALTH (2026-09-04) ───────────────────────────────────────────
  # Two findings from one day, the same failure at two layers.
  #
  # financial_alerts held 1,345 unresolved rows - 656 distinct conditions, the
  # oldest fifteen days old - and nothing had ever reported that the table has
  # contents. Every reconciler and guard on the platform writes there and it
  # works perfectly; nobody was ever told.
  #
  # And aaa_skip_noop_update was attached to table_seats with no migration and
  # no review, breaking 139,153 hand settlements 0.65 seconds later. RULE 2
  # already forbade it; nothing enforced it, because an object created by raw
  # SQL leaves no row in schema_migrations for the existing guard to find.
  #
  # Gauges from server/src/services/MoneyHealthMetrics.ts.
  - name: money-health
    interval: 60s
    rules:
      # Any value above zero is an unreviewed schema change on a chip path.
      # No `for:` grace beyond one scrape - this is the alert whose absence
      # cost thirteen hours.
      - alert: UndeclaredTriggerOnAMoneyTable
        expr: |
          poker_money_undeclared_triggers > 0
        for: 2m
        labels:
          severity: critical
          component: money
        annotations:
          summary: "{{ $value }} undeclared trigger(s) on a money or seat table"
          description: "A trigger is live on table_seats, club_members, wallets, chip_ledger, tournaments, tournament_players or ca_settlements with no row in ca_declared_money_triggers. Run SELECT * FROM fn_undeclared_money_triggers(). Either it is a legitimate change missing its declaration, or it is an unreviewed one - and the last unreviewed one broke a third of all hand settlements."
          runbook: "docs/changelog/2026-09-04-settlement-was-failing-a-third-of-every-hand.md"

      # Criticals nobody has looked at in a day. Deliberately NOT the raw
      # unresolved count: a critical raised a minute ago is the system working.
      - alert: MoneyAlertsGoingUnread
        expr: |
          poker_financial_alerts_stale_critical > 25
        for: 30m
        labels:
          severity: warning
          component: money
        annotations:
          summary: "{{ $value }} critical money alerts open longer than 24h"
          description: "financial_alerts is accumulating criticals nobody has resolved. A deep backlog is dangerous mainly because it hides a real one - on 2026-09-04 it was 1,345 rows deep and contained five 'player was never paid' alerts, all of which had in fact been paid within thirty minutes."
          runbook: "docs/changelog/2026-09-04-the-money-alerts-nobody-was-told-about.md"

      - alert: MoneyAlertBacklogGrowing
        expr: |
          poker_financial_alerts_unresolved > 2000
        for: 1h
        labels:
          severity: warning
          component: money
        annotations:
          summary: "{{ $value }} unresolved money alerts"
          description: "Above the 1,345 the backlog stood at when it was first measured. Check poker_financial_alerts_distinct_conditions - if the row count is climbing and the condition count is not, the table is duplicating rather than finding new problems."
          runbook: "docs/changelog/2026-09-04-the-money-alerts-nobody-was-told-about.md"

      - alert: MoneyHealthBlind
        expr: |
          poker_money_health_stale_seconds > 600
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: warning
          component: money
        annotations:
          summary: "Money-health gauges are stale ({{ $value }}s)"
          description: "Neither the alert backlog nor the undeclared-trigger check has returned in over ten minutes. poker_money_undeclared_triggers is ABSENT rather than 0 in this state, deliberately - a zero here would be an all-clear the collector has not earned."
          runbook: "docs/changelog/2026-09-04-the-money-alerts-nobody-was-told-about.md"
