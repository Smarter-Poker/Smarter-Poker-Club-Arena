# AlertManager — engine-01 co-located
#
# 2026-08-15: this file previously routed EVERY alert to a `null-receiver`.
# Combined with 27 alert rules referencing metrics that do not exist in this
# Prometheus, the stack could not have notified anyone of anything — which is
# why ten tables frozen for 18 minutes were reported by a player, not an alert.
#
# Delivery is email via Resend SMTP. Slack was the obvious choice and was
# attempted first, but SLACK_ALERT_URL in the monitoring .env is truncated
# (44 chars) and invalid — Slack answers posts to it with its documentation
# homepage. Resend is already this platform's transactional email provider.
# Both secrets are mounted as files; neither appears in this YAML.
#
# Routing:
#   critical → email immediately, repeat hourly until resolved ("players
#              cannot play" conditions)
#   warning  → email grouped, repeat every 12h so infra noise (CPU, memory)
#              can never bury a critical
#   info     → suppressed; visible in the AlertManager UI for triage

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.resend.com:587'
  smtp_from: 'alerts@smarter.poker'
  smtp_auth_username: 'resend'
  smtp_auth_password_file: /etc/alertmanager/resend_key
  smtp_require_tls: true

route:
  receiver: email-critical
  group_by: [alertname, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    # ── THE 3AM PAGER (2026-09-04; the horse fleet joined it 2026-09-11) ──
    # Six rules carried `page: sms` when this route was written, chosen by
    # Dan. On 2026-09-11 he added a seventh subject in his own words - "I
    # SHOULD GET PUSH NOTIFICATIONS OR TEXT IF ANYTHING INSIDE THE HORSES IS
    # FAILING OR THEY CAN'T PLAY" - and the `horse-fleet` group in
    # alert-rules.yml carries the label on nine rules for it. The route needs
    # no change for that: it matches the LABEL, never a list of names, and
    # the World Hub's pager endpoint does the same (its own test pins the
    # label filter, not an allowlist). The comment said the list was pinned
    # by `tests/the-pager-list-is-exactly-six.test.ts`; no such file exists in
    # either repo, and a claim like that is read as current by every agent
    # after it (CLAUDE.md 10.86). They post to
    # the World Hub, which texts the phone deploy-monitor.js already pages.
    # `continue: true` so the same alert also lands in the critical email.
    # repeat_interval 4h: an unresolved incident re-pages every four hours,
    # not every hour - the estate has already had one SMS storm.
    - matchers:
        - page="sms"
      receiver: pager-sms
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      continue: true

    - matchers:
        - severity="critical"
      receiver: email-critical
      group_wait: 10s
      repeat_interval: 1h

    - matchers:
        - severity="warning"
      receiver: email-warning
      group_wait: 2m
      group_interval: 30m
      repeat_interval: 12h

    # ── THE CANARY (2026-09-06, Realtime phase 7) ─────────────────────
    # MonitoringCanary fires unconditionally and for ever - that is the whole
    # point, because its ABSENCE is the signal and something checks for it
    # (scripts/ci/check-alert-rules-match.mjs). It must therefore reach NOBODY.
    #
    # This route is load-bearing and its absence would be worse than no canary
    # at all: the top-level fallthrough receiver is `email-critical`, so
    # without a match here the canary would email ops every hour, for ever,
    # which is exactly the alert fatigue this phase exists to prevent. It was
    # missing for the first hour of the phase and the audit caught it.
    - matchers:
        - severity="canary"
      receiver: null-receiver

    - matchers:
        - severity="info"
      receiver: null-receiver

receivers:
  - name: null-receiver

  # World Hub route pages/api/internal/alertmanager-page.js. Bearer is
  # CRON_SECRET, read from a file mounted beside resend_key so the secret is
  # never in this file. send_resolved closes the loop with a RESOLVED text.
  - name: pager-sms
    webhook_configs:
      - url: https://smarter.poker/api/internal/alertmanager-page
        send_resolved: true
        max_alerts: 10
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/cron_secret

  - name: email-critical
    email_configs:
      - to: 'admin@smarter.poker'
        send_resolved: true
        headers:
          Subject: '{{ if eq .Status "firing" }}[CRITICAL]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }} — smarter.poker engine'
        html: |
          <div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px">
            <h2 style="color:#c0392b;margin-bottom:4px">{{ .CommonLabels.alertname }}</h2>
            {{ range .Alerts }}
              <p><strong>{{ .Annotations.summary }}</strong></p>
              <p style="color:#555;white-space:pre-wrap">{{ .Annotations.description }}</p>
              {{ if .Annotations.runbook }}<p><a href="{{ .Annotations.runbook }}">Runbook</a></p>{{ end }}
            {{ end }}
            <p style="color:#888;font-size:12px;margin-top:16px">
              Engine health: <a href="https://engine.smarter.poker/health">engine.smarter.poker/health</a><br>
              Check <code>stalledTables</code> for the affected table ids.
            </p>
          </div>

  - name: email-warning
    email_configs:
      - to: 'admin@smarter.poker'
        send_resolved: true
        headers:
          Subject: '[warning] {{ .CommonLabels.alertname }} — smarter.poker'
        html: |
          <div style="font-family:-apple-system,Segoe UI,Roboto,sans-serif">
            {{ range .Alerts }}<p>{{ .Annotations.summary }}</p>{{ end }}
          </div>

inhibit_rules:
  # If the engine is unreachable entirely, do not also spam per-table freeze
  # alerts — they are all downstream of the same cause.
  - source_matchers:
      - alertname="EngineScrapeDown"
    target_matchers:
      - component="engine"
    equal: [instance]

  # A stalled discovery loop implies frozen tables; lead with the platform alert.
  - source_matchers:
      - alertname="EngineDiscoveryStalled"
    target_matchers:
      - alertname="PokerTablesFrozen"
    equal: [cluster]
