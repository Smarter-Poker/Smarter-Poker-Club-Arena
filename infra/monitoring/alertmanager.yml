# AlertManager routing — smarter.poker
# Phase 5.1.3
#
# Routes critical alerts to PagerDuty (via env-injected key) and warning/info
# to Slack. Silences active during deploys are set via amtool from the
# deploy script, not here.

global:
  resolve_timeout: 5m
  slack_api_url: ${SLACK_ALERT_URL}

route:
  receiver: slack-default
  group_by: [alertname, cluster, component]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Page oncall for every critical — no grouping delay.
    - matchers:
        - severity="critical"
      receiver: pagerduty
      group_wait: 10s
      continue: true                             # also post to Slack

    # Warnings + criticals hit Slack ops channel.
    - matchers:
        - severity=~"critical|warning"
      receiver: slack-ops
      continue: true

    # Everything else (info) to the quiet channel.
    - matchers:
        - severity="info"
      receiver: slack-info

receivers:
  - name: pagerduty
    pagerduty_configs:
      - service_key: ${PAGERDUTY_SERVICE_KEY}
        severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          component: '{{ .CommonLabels.component }}'
          runbook:   '{{ .CommonAnnotations.runbook }}'

  - name: slack-default
    slack_configs:
      - channel: '#alerts-ops'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          *Severity:* {{ .CommonLabels.severity }}
          *Component:* {{ .CommonLabels.component }}
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          {{ if .CommonAnnotations.runbook }}*Runbook:* {{ .CommonAnnotations.runbook }}{{ end }}

  - name: slack-ops
    slack_configs:
      - channel: '#alerts-ops'
        send_resolved: true

  - name: slack-info
    slack_configs:
      - channel: '#alerts-info'
        send_resolved: false

inhibit_rules:
  # If EngineDown fires, silence all the downstream engine-specific alerts so
  # oncall only gets one page instead of five.
  - source_matchers:
      - alertname="EngineDown"
    target_matchers:
      - component="engine"
    equal: [instance]

  # If the database is down, suppress the API-health alarms that will
  # inevitably cascade.
  - source_matchers:
      - alertname="PostgresDown"
    target_matchers:
      - alertname=~"WorldHubApiDown|ClubArenaApiDown"
