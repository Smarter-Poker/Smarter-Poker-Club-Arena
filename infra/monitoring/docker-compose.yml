# ═════════════════════════════════════════════════════════════════════════
# Prometheus + Grafana + AlertManager — Hetzner cron-01 monitoring stack
# Phase 5.1.3
# ═════════════════════════════════════════════════════════════════════════
#
# Deploy (on cron-01 Hetzner host):
#   cd /opt/smarter-poker-monitoring
#   cp .env.example .env   # fill in GRAFANA_ADMIN_PASSWORD, SLACK_ALERT_URL
#   docker compose up -d
#
# Exposes on the host:
#   :9090 — Prometheus  (internal only, bind to localhost via firewall)
#   :3001 — Grafana     (reverse-proxy through Caddy w/ basic auth)
#   :9093 — AlertManager (internal only)
#
# Scrape targets (see ./prometheus.yml):
#   - engine-01:9100      node_exporter (Hetzner engine host system metrics)
#   - engine-01:9256      pm2 pm2-metrics module (hand tick, table count)
#   - cron-01:9100        node_exporter (this host's own system metrics)
#   - supabase-pg:9187    postgres_exporter (Supabase pooler, read-only)
#
# Storage: Prometheus keeps 15 days of metrics in ./prometheus-data (rotate
# to S3 if we ever need longer retention — SRE-facing dashboards don't).
# ═════════════════════════════════════════════════════════════════════════

version: '3.8'

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sp-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'                # POST /-/reload on config change
      - '--web.external-url=https://monitor.smarter.poker/prometheus'
    ports:
      - '127.0.0.1:9090:9090'                   # localhost only
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      # Phase 5.1.5 SLO rule + alert files
      - ./slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - ./slo-alerts.yml:/etc/prometheus/slo-alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sp-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    env_file: .env                              # pulls SLACK_ALERT_URL, PAGERDUTY_KEY
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.0
    container_name: sp-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3000'                   # localhost — Caddy reverse-proxies
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://monitor.smarter.poker/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Pin the UID generator to a stable seed so provisioned dashboards
      # keep their panel IDs across container restarts.
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

  # node_exporter on this host (cron-01). engine-01 runs its own separately.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sp-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    network_mode: host                          # so Prometheus scrapes :9100 directly
    volumes:
      - '/:/host:ro,rslave'
