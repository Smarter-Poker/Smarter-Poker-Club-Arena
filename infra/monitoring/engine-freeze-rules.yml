# ═══════════════════════════════════════════════════════════════════════════
# ENGINE FREEZE ALERTS — 2026-08-15
#
# WHY THIS FILE EXISTS
#
# On 2026-08-15 ten cash tables froze permanently and sat dead for 18+ minutes
# with funded seats. Monitoring showed nothing, and it could not have shown
# anything: an audit of the existing rules found 27 alerts referencing metrics
# that do not exist in this Prometheus (EngineDown queried `up{job="engine_pm2"}`
# while the real scrape job is `engine_game_server`; the hands-rate alert queried
# `poker_engine_hands_played_total` while the engine emits
# `poker_hands_dealt_total`; the Postgres and blackbox alerts need exporters that
# are not deployed). On top of that, alertmanager routed everything to a
# null-receiver.
#
# Every rule below is verified against metrics this engine actually emits.
# If you add a rule here, first confirm the metric appears in:
#   curl -s localhost:9090/api/v1/label/__name__/values
# ═══════════════════════════════════════════════════════════════════════════

groups:
  - name: engine-freeze
    interval: 15s
    rules:
      # ── THE ONE THAT MATTERS ───────────────────────────────────────────
      # poker_stalled_tables counts tables with 2+ dealable seats that have
      # made no observable progress (accepted action, turn change, street,
      # hand start) for 2 minutes. A healthy table under a 15s shot clock
      # cannot reach 2 minutes. This is the alert that would have fired on
      # 2026-08-15 at minute two instead of never.
      #
      # ── SECTION 13 RULE 6: BREAK-GUARDED, ADDED 2026-09-22 ──────────────
      # This was the one rule in this file that never carried the guard
      # every later rule below it does. The announced :55 break deliberately
      # parks the whole fleet for up to ~5 minutes every hour, and a parked
      # table has made no progress by definition - so poker_stalled_tables
      # crossing 0 together, fleet-wide, is the SCHEDULED STOP, not a freeze
      # bug. Measured against operational_alert_events 2026-09-13..2026-09-22:
      # 351 deliveries, resolving near :53 at the full seated-table count (61
      # on 2026-09-22) and re-firing near :03 on the thaw's residual lag (3) -
      # once an hour, on the break's own clock. This is exactly the "pages
      # hourly about a stop we scheduled" failure mode section 13 rule 6
      # names, and every sibling rule in this file already carries the guard
      # (EngineScrapeDown, EngineLivenessDead, EngineHandsStopped,
      # EngineFleetThroughputCollapsed, PokerSettlementBlocked) - this one
      # simply predates them and was never brought forward.
      - alert: PokerTablesFrozen
        expr: |
          poker_stalled_tables > 0
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 1m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: '{{ $value }} poker table(s) frozen with players seated'
          description: |
            One or more tables have 2+ dealable seats and have made no progress
            for over 2 minutes. Players are sitting at a dead table right now.
            The engine's own watchdog should have recovered it; if this alert
            is firing, the watchdog did not. Check
            engine.smarter.poker/health -> stalledTables for the table ids.
          runbook: https://monitor.smarter.poker/runbooks/tables-frozen

      # ── THE FLEET STOPPED TOGETHER (2026-09-18) ────────────────────────
      # The zombie sweep now refuses to rebuild the whole estate at once, and
      # counts each refusal. Zero is the healthy value. Anything else says a
      # systemic pause made every dealable table cross the 180s line in the
      # same pass - which for seven days ran on a clock: 97% of all zombie
      # kills landed in minutes :03 and :04, because the maintenance break
      # parks the fleet at :55, the break is five minutes, and the sweep
      # condemns at 180 seconds. On 2026-09-18 at 03:03 that was 464 tables
      # in one minute out of a fleet of about 500.
      #
      # The refusal is the SAFE outcome - nothing was destroyed - so this is a
      # warning, not a page. What needs looking at is why the fleet stopped,
      # not the refusal.
      - alert: PokerFleetWideStall
        expr: increase(poker_fleet_wide_zombie_refusals_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: 'a sweep declined to rebuild the whole fleet ({{ $value }} in 15m)'
          description: |
            More than a third of the tables that should be dealing made no
            progress for 180 seconds in the same sweep. Nothing was rebuilt:
            that many tables stopping together is one systemic pause, not that
            many broken tables, and each one's own watchdog still answers for
            it. Look for what stopped the fleet - the maintenance break
            boundary, a database stall, or an event-loop stall - rather than at
            the tables.
      # ── THE ONE THE RULE ABOVE CANNOT SEE (2026-09-18) ─────────────────
      # PokerTablesFrozen reads poker_stalled_tables, and that gauge counts
      # tables with 2+ DEALABLE seats. A tournament table whose engine was
      # registered and never started reports dealable 0 - it never loaded a
      # seat - so it is outside that question rather than under its threshold,
      # and GameServer's zombie reaper skips a not-running tournament engine on
      # purpose because only its TournamentManager may replace that slot.
      #
      # Measured 2026-09-18 17:08Z: 391 of 554 RUNNING tournaments had dealt no
      # hand for over thirty minutes and 239 for over six hours, across 567
      # tables the database showed with two or more seated funded players.
      # /health reported status ok, liveness ok, stalled 2. Nothing anywhere
      # carried a number for it; the oldest such tournament had been RUNNING
      # since 8 September.
      #
      # A newly admitted engine is legitimately not_started for a moment, so
      # this waits on the AGE of the oldest one rather than the count, and the
      # threshold is well past any plausible start.
      - alert: PokerTournamentTableNeverStarted
        expr: poker_tournament_table_never_started_oldest_seconds > 600
        for: 5m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'a tournament table engine has been registered and never started for {{ $value }}s'
          description: |
            One or more tournament tables hold an engine whose dealing loop has
            never run. Such a table reports dealable 0, so it cannot appear in
            poker_stalled_tables however long it sits, and the zombie reaper
            defers to the owning TournamentManager rather than rebuilding it.
            The tournament stays RUNNING and deals nothing.
            Check engine.smarter.poker/health ->
            tableLivenessSummary.tournamentTablesNeverStarted, then
            /health?liveness_table_ids=... for the loopPhase of each.
          runbook: https://monitor.smarter.poker/runbooks/tables-frozen

      # ── THE ENGINE CANNOT BE REPLACED (2026-09-19) ─────────────────────
      # Whether a break ever certified a restart is recorded per break in
      # engine_maintenance_break_log.ready_for_restart_at, and no alert rule
      # reads a database table. On 2026-09-18 one table held an unresolved F06
      # hand-number preparation from 21:56 onward; the restart gate never
      # opened again; six consecutive engine releases failed, including two
      # off-cycle recovery windows they asked for themselves; and production
      # sat four and a half hours behind main.
      #
      # /health said `status: ok` throughout, and it was telling the truth.
      # Every table was dealing. It was the RESTART that was impossible, which
      # nothing measured. This is that measurement.
      #
      # One shut break is a lost window and gets retried. Two in a row means no
      # fix, security or otherwise, can reach production until somebody acts.
      - alert: PokerEngineCannotBeReplaced
        expr: poker_maintenance_breaks_since_restart_certified >= 2
        for: 0m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: '{{ $value }} consecutive breaks ended with no restart certificate'
          description: |
            The engine restart gate has not opened for two or more breaks in a
            row, so no engine release can land. The felt is unaffected and will
            look healthy; the deploy route is not.
            Read engine.smarter.poker/health -> maintenance.unparkedReasons for
            the reason the gate is refusing. A table holding an unresolved F06
            preparation is process-local: only replacing that table's engine,
            or restarting the process, clears it.
          runbook: https://monitor.smarter.poker/runbooks/tables-frozen

      # The bounded half of the same fault. Past ten minutes an unresolved F06
      # preparation stops holding every other table's restart certificate shut,
      # which is what keeps the deploy route open - but the table itself is
      # still wedged and still needs its engine replaced.
      - alert: PokerRestartGateHeldByStuckPermit
        expr: poker_maintenance_unparked_tables{reason="f06_preparation_stuck"} > 0
        for: 5m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: '{{ $value }} table(s) hold an F06 preparation past the restart gate'
          description: |
            A table has held an unresolved F06 hand-number preparation for over
            ten minutes. It no longer blocks the platform's restart
            certificate, so releases can proceed, but that table is wedged and
            its permit only clears when its engine is replaced. The container
            log names the table id.
          runbook: https://monitor.smarter.poker/runbooks/tables-frozen

      # A settlement retry heartbeat can keep the existing progress watchdog
      # healthy while the same accepted hand remains blocked indefinitely.
      # Confirmed in the live Prometheus name catalog on 2026-09-08 after
      # engine ad6342df deployed: poker_blocked_settlements counts continuous
      # settlement ages >= 30s, independently of retry progress markers.
      - alert: PokerSettlementBlocked
        expr: |
          poker_blocked_settlements > 0
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 1m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: '{{ $value }} table settlement(s) remain blocked'
          description: |
            Accepted hand settlement has remained blocked despite retry activity.
            Check engine.smarter.poker/health -> blockedSettlements for table,
            hand and continuous age, then inspect the matching durable receipt
            and refusal. Do not bypass financial settlement or restart the fleet
            to clear this alert. Normal announced maintenance is suppressed.
          runbook: 'docs/audits/2026-09-08-settlement-blockage-health.md'

      # ── The engine cannot report on itself if it is gone ────────────────
      # Replaces the dead `up{job="engine_pm2"}` rule. This job label is the
      # one in the live scrape config.
      # ── THE :55 BREAK IS NOT AN OUTAGE (Dan 2026-09-01, to-do #2563) ────
      # The engine restarts inside a five-minute announced break every hour,
      # so for up to ~2 minutes of every hour the process is deliberately
      # down. `unless max_over_time(poker_maintenance_break_active[6m]) == 1`
      # suppresses the rule while a break was active in the last six minutes:
      # max_over_time reads through the scrape gap (the series would otherwise
      # go stale the moment the engine dies, which is exactly when the guard
      # is needed). Six minutes covers the 5-minute break plus margin; a REAL
      # outage keeps firing the moment the window ages out.
      - alert: EngineScrapeDown
        expr: |
          up{job="engine_game_server"} == 0
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 1m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'Poker engine /metrics unreachable on {{ $labels.instance }}'
          description: |
            The engine has not been scrapeable for >1 minute: process dead,
            container restarting, or the host is down. No table can tick.

      # ── Discovery is the only thing that starts engines AND reaps zombies
      - alert: EngineDiscoveryStalled
        expr: poker_discovery_stale_ms > 120000
        for: 2m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'Cash-table discovery has not completed for {{ $value }}ms'
          description: |
            discoverCashTables is the only path that starts a new table engine
            and the only path that reaps a dead one. If it has stalled, no table
            can be created or recovered — a platform-wide freeze that no
            per-table alert would catch.

      # ── Composite liveness, useful as a single dashboard stat ───────────
      # Break-guarded like EngineScrapeDown above, same rationale.
      - alert: EngineLivenessDead
        expr: |
          poker_engine_liveness == 0
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 2m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'Engine reports itself NOT live'
          description: |
            Same signal the Docker HEALTHCHECK acts on. If this is firing for
            more than ~1 minute without the container restarting, the
            self-healing restart is not working — investigate the healthcheck.

      # ── Throughput floor. Uses the metric the engine ACTUALLY emits. ────
      #
      # ── THIS RULE WAS TRUE ON A HEALTHY ENGINE FOR MONTHS (2026-09-07) ───
      #
      # `poker_hands_dealt_total` was computed from `tableTimings.length`, a
      # ring buffer capped at 100. Every dealing table reached 100 within a
      # couple of minutes and never moved again, so `increase(...)` was 0
      # FOREVER. And because /metrics emitted the gauge once per table engine
      # with no distinguishing label, Prometheus kept ONE arbitrary sample of
      # the 272 in each scrape. Measured on production 2026-09-07: this alert
      # had been firing continuously for over three hours while the fleet dealt
      # ~27,000 hands an hour. Fixed in EngineTelemetry.renderFleetMetrics and
      # pinned by server/src/engine/oneSeriesPerMetricName.law.test.ts; the
      # counter is monotonic and fleet-wide now, so this expression finally
      # measures what it says.
      #
      # THE THRESHOLD STAYS AT ZERO, DELIBERATELY, and here is the measurement
      # that says it must. Over 7 days of `hand_history`, excluding the :53-:01
      # break window, per 5-minute bucket:
      #
      #                        min    p01     p50
      #     healthy            62     257     2267
      #     the 04:05 incident 94     387     1286
      #
      # The platform's quiet nights go LOWER than its worst outage. Any
      # non-zero floor either misses the outage or pages on a Tuesday at 4am.
      # Zero is the one threshold that means exactly what the summary claims -
      # "nothing at all is being dealt" - and nothing else. The detector for a
      # slow-but-alive engine is EngineFleetThroughputCollapsed below, and the
      # detector that actually caught 2026-09-07 was EngineCoreSaturated.
      - alert: EngineHandsStopped
        expr: |
          sum(increase(poker_hands_dealt_total[10m])) == 0
          and sum(poker_active_players) > 1
          # `unless on()`, not a bare `unless`: this expression aggregates its
          # left side away from {job, instance}, and `unless` matches on the
          # EXACT label set - so a plain one finds no matching series and
          # guards nothing. alert-rules.yml's engine-core group already says
          # this in as many words; these three had it wrong.
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'No hands dealt anywhere for 10 minutes with players seated'
          description: |
            Platform-wide dealing stop. Distinct from PokerTablesFrozen: this
            fires even if the per-table progress accounting is itself broken,
            so it is the backstop for a bug in the freeze detector.

            This detects a TOTAL stop only. An engine that is merely crawling
            will not trip it — see EngineFleetThroughputCollapsed.
          runbook: 'docs/changelog/2026-09-07-the-core-the-break-and-the-metric-that-was-reading-one-table.md'

      # ── AN ENGINE THAT IS ALIVE AND CRAWLING (added 2026-09-07) ──────────
      #
      # On 2026-09-07 at 04:05 UTC the fleet fell from ~480 hands a minute to
      # 6 and stayed down for about two hours. NOTHING in this file fired.
      # EngineHandsStopped needs zero and it was not zero;
      # EngineTableCountAnomaly compares against the hour before and the ratio
      # was exactly 0.50, which is not < 0.50. The only alarms that spoke were
      # EngineCoreOutOfHeadroom and EngineCoreSaturated, on event-loop delay.
      #
      # This is the throughput-shaped backstop for that class, and its numbers
      # are measured rather than chosen. Hands per dealing table per minute,
      # 5-minute buckets, 7 days, break window excluded:
      #
      #                    min     p01     p05     p50     max
      #     healthy        0.482   0.628   1.168   2.111   3.363
      #     the incident   0.416   0.693     -       -     1.254
      #
      # The LEVELS overlap, so the level alone cannot separate an outage from a
      # quiet hour. The DURATION does. Longest continuous run below 1.0:
      #
      #     the incident        60 minutes
      #     worst healthy run   35 minutes   (2026-09-04 16:05)
      #     next healthy runs   25, 25, 20, 15 minutes
      #
      # Hence `< 1.0 for: 40m`: it would have fired on the incident with 20
      # minutes to spare and cleared the worst healthy week by 5.
      #
      # BE HONEST ABOUT THE MARGIN. Five minutes is thin, and this fires 40
      # minutes into an outage, which is far too late to be a primary signal.
      # It is a BACKSTOP for the case where the loop-delay alarms are the ones
      # that are broken. If it turns out to page on a quiet holiday, raise the
      # duration rather than lowering the rate - a quiet night is long and
      # shallow, an outage is deep, and the rate is the half that overlaps.
      - alert: EngineFleetThroughputCollapsed
        # A table with old timing samples is not necessarily able to deal.
        # On 2026-09-13 poker_active_tables retained 574 historical samples
        # while the liveness snapshot had only 15 dealable tables. Dividing
        # current hands by those historical tables falsely diagnosed slow
        # dealing. Use the existing live liveness denominator, averaged over
        # the same five-minute interval as hands, and its current fleet-size
        # gate. HorseFleetCollapsed independently covers too few live tables.
        expr: |
          (
            sum(increase(poker_hands_dealt_total[5m])) / 5
            /
            clamp_min(sum(avg_over_time(poker_dealable_tables[5m])), 1)
          ) < 1.0
          and sum(poker_dealable_tables) > 20
          # `unless on()`, not a bare `unless`: this expression aggregates its
          # left side away from {job, instance}, and `unless` matches on the
          # EXACT label set - so a plain one finds no matching series and
          # guards nothing. alert-rules.yml's engine-core group already says
          # this in as many words; these three had it wrong.
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 40m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'Fleet is dealing under 1 hand per table per minute for 40 minutes'
          description: |
            The engine has more than 20 tables able to deal, but its five-minute
            hands per dealable table per minute have stayed under 1.0.
            The denominator is live dealable capacity averaged over those same
            five minutes; historical timing samples do not count as live tables.

            Compare event-loop delay and equity-governor scale with individual
            table liveness before attributing the cause. Too few tables able
            to deal is reported separately by HorseFleetCollapsed.
          runbook: 'docs/changelog/2026-09-07-the-core-the-break-and-the-metric-that-was-reading-one-table.md'

      # ── EVERY RESTART IS ANNOUNCED, OR IT IS AN INCIDENT (2026-09-05) ────
      #
      # §13 is unambiguous: the engine restarts at :55, inside a break the
      # players were told about at :53, with every table parked. A restart at
      # any other moment voids in-flight hands on every table this process
      # owns (§10.5 - a horse's hand counts) and drops every socket with no
      # warning to anybody.
      #
      # NOTHING WATCHED FOR THAT. EngineTableRebuildChurn below needs FOUR
      # restarts inside thirty minutes; the real pattern on 2026-09-05 was one
      # restart every 35-70 minutes - 16:06, 16:42, 17:49, 18:26, 19:04 UTC,
      # five unannounced restarts in a day, every one of them under the
      # threshold and therefore silent. They were found only because they were
      # also breaking deploys, which is not a detector, it is a coincidence.
      #
      # This asks the only question §13 leaves room for: did the engine restart
      # while no break was running? `resets()` counts counter resets, i.e. real
      # process restarts - `changes()` counts every scrape and fires forever on
      # a healthy engine (measured 2026-08-16: changes()=118, resets()=3).
      #
      # The 8m lookback is longer than the 5-minute break on purpose: a deploy
      # restart lands at ~:57 and the break began at :55, so the guard still
      # sees the break samples that preceded it. A restart with no break within
      # eight minutes had no announcement behind it, whoever caused it.
      - alert: EngineRestartedOutsideTheBreak
        expr: |
          resets(poker_uptime_seconds[8m]) > 0
          unless max_over_time(poker_maintenance_break_active[8m]) == 1
        for: 1m
        labels:
          severity: critical
          component: engine
        annotations:
          summary: 'The engine restarted with no maintenance break running'
          description: |
            Production restarted outside the announced :55 break, so in-flight
            hands were voided and every player was dropped without warning.
            This is a §13 violation whatever caused it.

            Start with `docker logs sp-autoheal` on the engine host: autoheal
            restarts on the Docker HEALTHCHECK, which reads
            poker_engine_liveness. If liveness went to 0 first, the engine
            condemned itself - check poker_dead_stalled_tables against
            poker_dealable_tables, because a MINORITY of stalled tables must
            never read as a dead process (that was the 2026-09-05 defect, and
            server/src/engineLiveness.test.ts pins the rule).

            If liveness stayed 1, autoheal is not the cause: look for an OOM
            kill, a host reboot, or a hand-run `docker restart`.

      # ── The watchdog escalating repeatedly means something is wrong that
      #    recovery is only papering over.
      - alert: EngineTableRebuildChurn
        # resets(), NOT changes(). poker_uptime_seconds is a monotonically
        # increasing counter, so changes() counts EVERY scrape — it measured 118
        # on a perfectly healthy engine and fired permanently, which is worse
        # than no alert because it trains you to ignore the one signal that
        # says the engine is restart-looping. resets() counts counter resets,
        # i.e. actual process restarts, which is what this rule always meant.
        # (Measured 2026-08-16: changes()=118, resets()=3, uptime=170s.)
        expr: resets(poker_uptime_seconds[30m]) > 3
        for: 5m
        labels:
          severity: warning
          component: engine
        annotations:
          summary: 'Engine process restarted more than 3 times in 30 minutes'
          description: |
            Self-healing is firing repeatedly. It is doing its job, but a
            restart loop means an underlying defect is still present. Check
            engine logs for watchdog_* and dealingLoop_died events.

  # ═══════════════════════════════════════════════════════════════════════════
  # STATS PIPELINE (Stats Page Programme phase 1, 2026-09-04)
  #
  # The engine raises these itself through raiseEngineAlert (engine logs + the
  # alert receiver) within a minute of the read that saw them. These rules are
  # the second, independent path: Prometheus reading the poker_stats_* gauges
  # the engine exposes, so a broken alert receiver cannot hide a lagging index.
  # Every gauge is emitted by server/src/observability/StatsHealthMonitor.ts
  # and is NaN until the first ca_stats_health() read completes; NaN compares
  # false, so an unread engine fires nothing here.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: stats-pipeline
    interval: 60s
    rules:
      # The player -> hand index is advanced by the Open Claw route every 15
      # minutes; 30 minutes behind means two ticks missed. During the :55 break
      # no hands are written, so the ceiling cannot move and the lag climbs to
      # ~600 s by design; the break guard and the 30-minute bar both cover it.
      - alert: StatsHandIndexLagging
        expr: |
          poker_stats_index_lag_seconds > 1800
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: warning
          component: club-arena-stats
        annotations:
          summary: 'Stats hand index is {{ $value | humanizeDuration }} behind'
          description: |
            ca_hand_player_idx has not been advanced for two or more Open Claw
            ticks; "Hands Played" on every stats page is stale by this much.
            Check the Open Claw dispatcher on the Hetzner host and the errors
            array from /api/cron/club-stats-maintenance. Found 17 hours behind
            on 2026-09-03 with nothing watching.

      # A hand with no ca_hand_player_stat row 90 s after it was written means
      # trg_ca_stats_live_from_hand raised and swallowed it. The page is no
      # longer live until this returns to 0.
      - alert: StatsLiveTriggerMissingHands
        expr: poker_stats_recent_hands_without_stat > 0
        for: 3m
        labels:
          severity: warning
          component: club-arena-stats
        annotations:
          summary: '{{ $value }} recent hand(s) have no stat row'
          description: |
            The live stats trigger is failing inside the hand insert (it WARNs
            and lets the hand land). Read the Postgres log for
            "trg_ca_stats_live_from_hand:".

      # Zero is the only healthy number. A disagreement is a recording defect
      # in the engine (button_seat or the showdown roster) or a failed writer.
      - alert: StatsWitnessAuditDisagrees
        expr: |
          poker_stats_witness_disagreements > 0
            or poker_stats_player_hands_without_idx > 0
            or poker_stats_human_hands_without_facts > 0
        for: 1m
        labels:
          severity: warning
          component: club-arena-stats
        annotations:
          summary: 'The witness audit found {{ $value }} disagreement(s)'
          description: |
            ca_stats_witness_audit() checks button_seat against the blind
            posts and the derived showdown flag against the engine's showdown
            roster, and counts seats with no index row (every seat, horse or
            human) and human seats with no settlement row. Read the latest
            ca_stats_witness_audit_log row and the hands in its window.

      # Phase 3. The EV line on the stats page is built from
      # ca_hand_facts.all_in_equity. A seat in an all-in RUNOUT (all-in before
      # the river, reached showdown, no betting after the hand's last all-in)
      # with no equity figure is a gap in the settlement writer; a side pot
      # that kept betting is not a runout and owes nothing. Measured
      # 2026-09-04: 715 owed in 7 days, 1 without (0.9986). The bar is the
      # programme's 99%; fifty is the sample floor so a quiet week cannot page
      # on one hand.
      - alert: StatsAllInEquityCoverageLow
        expr: |
          poker_stats_ev_coverage_7d < 0.99
            and poker_stats_allin_showdowns_7d >= 50
        for: 5m
        labels:
          severity: warning
          component: club-arena-stats
        annotations:
          summary: 'All-in equity coverage is {{ $value | humanizePercentage }} over 7 days'
          description: |
            Fewer than 99% of the week's all-in runouts carry an all-in
            equity figure, so EV Adjusted and the luck readouts are
            understating or overstating players. List the candidates with
            SELECT hand_id FROM ca_hand_facts WHERE was_all_in AND
            went_to_showdown AND coalesce(all_in_street,'') <> 'river' AND
            all_in_equity IS NULL AND played_at >= now() - interval '7 days',
            then drop the ones whose action log shows a check, bet or raise
            after the last all-in (side pots, not runouts).

      # The engine could not read ca_stats_health() for ten minutes: the
      # gauges above are frozen at their last value and mean nothing.
      - alert: StatsHealthReadStale
        expr: |
          poker_stats_health_age_seconds > 600
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 2m
        labels:
          severity: warning
          component: club-arena-stats
        annotations:
          summary: 'Engine has not read ca_stats_health() for {{ $value | humanizeDuration }}'
          description: |
            Every poker_stats_* gauge is stale. Usually a PostgREST or RPC
            grant problem; the engine logs "[StatsHealthMonitor] read failed".
