# SLO burn-rate alerts — smarter.poker
# Phase 5.1.5
#
# ───────────────────────────────────────────────────────────────────────────
# Multi-window multi-burn-rate alerts per the Google SRE workbook
# (https://sre.google/workbook/alerting-on-slos/). Each SLO gets four alert
# windows so we page on sustained fast burn and ticket on slow burn, with
# both a short and long window for each severity to cut flap.
#
# Burn-rate thresholds (how fast the 30d budget is being consumed):
#   14.4x — fast-burn page: exhausts 2% of monthly budget in 1h → critical
#    6.0x — slow-burn page: exhausts 5% of monthly budget in 6h → critical
#    3.0x — slow ticket   : exhausts 10% of monthly budget in 24h → warning
#    1.0x — slowest ticket: burning at SLO cap for 3d → warning (capacity signal)
#
# Pattern per severity: require BOTH the long and short window to exceed
# the burn threshold, so a ten-second blip doesn't page and a recovering
# dependency clears the alert within its short window.
#
# Each alert carries:
#   - `slo` label: slug identifying which SLO tripped
#   - `burn_rate` label: threshold multiplier (14.4 / 6 / 3 / 1)
#   - `window` label: short window used for the trigger (5m / 30m / 2h / 6h)
#   - `runbook` annotation: link to monitor.smarter.poker runbook
# ───────────────────────────────────────────────────────────────────────────

groups:
  # ==========================================================================
  # WH hub availability (target 99.9% / 30d)
  # ==========================================================================
  - name: slo-wh-hub-burnrate
    interval: 30s
    rules:
      - alert: WhHubFastBurn
        expr: |
          slo:wh_hub:error_ratio_1h  > (14.4 * (1 - 0.999))
          and
          slo:wh_hub:error_ratio_5m  > (14.4 * (1 - 0.999))
        for: 2m
        labels:
          severity: critical
          component: wh-hub
          slo: wh_hub
          burn_rate: "14.4"
          window: 5m
        annotations:
          summary: "World Hub burning SLO budget fast ({{ $value | humanizePercentage }} error)"
          description: |
            /api/health probes are failing at >14.4x the 99.9% SLO burn rate
            in both the 5m and 1h windows. At this pace we will burn 2% of
            the 30d error budget within an hour. Paging oncall.
          runbook: https://monitor.smarter.poker/runbooks/wh-hub-burn

      - alert: WhHubMediumBurn
        expr: |
          slo:wh_hub:error_ratio_6h  > (6 * (1 - 0.999))
          and
          slo:wh_hub:error_ratio_30m > (6 * (1 - 0.999))
        for: 15m
        labels:
          severity: critical
          component: wh-hub
          slo: wh_hub
          burn_rate: "6"
          window: 30m
        annotations:
          summary: "World Hub burning SLO budget moderately (6x)"
          description: |
            Sustained 6x burn over 30m+6h. At this pace we burn 5% of the
            30d budget per 6h. Oncall should investigate before the fast
            threshold trips.
          runbook: https://monitor.smarter.poker/runbooks/wh-hub-burn

      - alert: WhHubSlowBurn
        expr: |
          slo:wh_hub:error_ratio_1d  > (3 * (1 - 0.999))
          and
          slo:wh_hub:error_ratio_2h  > (3 * (1 - 0.999))
        for: 1h
        labels:
          severity: warning
          component: wh-hub
          slo: wh_hub
          burn_rate: "3"
          window: 2h
        annotations:
          summary: "World Hub slow SLO burn (3x over 24h)"
          description: |
            Not critical but visible — WH availability is trending below
            SLO over the last day. Ticket and review.
          runbook: https://monitor.smarter.poker/runbooks/wh-hub-burn

      - alert: WhHubChronicBurn
        expr: |
          slo:wh_hub:error_ratio_3d  > (1 * (1 - 0.999))
          and
          slo:wh_hub:error_ratio_6h  > (1 * (1 - 0.999))
        for: 3h
        labels:
          severity: warning
          component: wh-hub
          slo: wh_hub
          burn_rate: "1"
          window: 6h
        annotations:
          summary: "World Hub burning budget at the SLO cap for 3d+"
          description: |
            Running right at the 99.9% cliff. No single incident, but
            the cumulative trend will exhaust budget before month-end.
            Treat as a capacity/quality signal, not a page.

      - alert: WhHubBudgetExhausted
        expr: slo:wh_hub:budget_remaining_30d <= 0.05
        for: 10m
        labels:
          severity: warning
          component: wh-hub
          slo: wh_hub
        annotations:
          summary: "WH Hub SLO budget <= 5% — freeze risky deploys"
          description: |
            Less than 5% of the 30d error budget remains. Per our SLO policy,
            only urgent/reliability-improving deploys should go out until the
            budget resets.

  # ==========================================================================
  # CA hub availability (target 99.9% / 30d)
  # ==========================================================================
  - name: slo-ca-hub-burnrate
    interval: 30s
    rules:
      - alert: CaHubFastBurn
        expr: |
          slo:ca_hub:error_ratio_1h  > (14.4 * (1 - 0.999))
          and
          slo:ca_hub:error_ratio_5m  > (14.4 * (1 - 0.999))
        for: 2m
        labels:
          severity: critical
          component: ca-hub
          slo: ca_hub
          burn_rate: "14.4"
          window: 5m
        annotations:
          summary: "Club Arena burning SLO budget fast"
          description: |
            /api/club-arena/health probes failing at >14.4x SLO burn.
            Paging oncall.
          runbook: https://monitor.smarter.poker/runbooks/ca-hub-burn

      - alert: CaHubMediumBurn
        expr: |
          slo:ca_hub:error_ratio_6h  > (6 * (1 - 0.999))
          and
          slo:ca_hub:error_ratio_30m > (6 * (1 - 0.999))
        for: 15m
        labels:
          severity: critical
          component: ca-hub
          slo: ca_hub
          burn_rate: "6"
          window: 30m
        annotations:
          summary: "Club Arena SLO burn at 6x over 30m+6h"
          runbook: https://monitor.smarter.poker/runbooks/ca-hub-burn

      - alert: CaHubSlowBurn
        expr: |
          slo:ca_hub:error_ratio_1d  > (3 * (1 - 0.999))
          and
          slo:ca_hub:error_ratio_2h  > (3 * (1 - 0.999))
        for: 1h
        labels:
          severity: warning
          component: ca-hub
          slo: ca_hub
          burn_rate: "3"
          window: 2h
        annotations:
          summary: "Club Arena slow burn (3x over 24h)"

      - alert: CaHubBudgetExhausted
        expr: slo:ca_hub:budget_remaining_30d <= 0.05
        for: 10m
        labels:
          severity: warning
          component: ca-hub
          slo: ca_hub
        annotations:
          summary: "CA Hub SLO budget <= 5% — freeze risky deploys"

  # ==========================================================================
  # Engine availability (target 99.95% / 30d — tighter than hub SLOs)
  # ==========================================================================
  - name: slo-engine-burnrate
    interval: 15s
    rules:
      - alert: EngineFastBurn
        expr: |
          slo:engine:error_ratio_1h  > (14.4 * (1 - 0.9995))
          and
          slo:engine:error_ratio_5m  > (14.4 * (1 - 0.9995))
        for: 2m
        labels:
          severity: critical
          component: engine
          slo: engine
          burn_rate: "14.4"
          window: 5m
        annotations:
          summary: "Poker engine burning SLO budget fast"
          description: |
            pm2-metrics up-probe has been failing at >14.4x the 99.95% SLO
            burn rate. Player impact: active tables cannot tick. Paging.
          runbook: https://monitor.smarter.poker/runbooks/engine-burn

      - alert: EngineMediumBurn
        expr: |
          slo:engine:error_ratio_6h  > (6 * (1 - 0.9995))
          and
          slo:engine:error_ratio_30m > (6 * (1 - 0.9995))
        for: 15m
        labels:
          severity: critical
          component: engine
          slo: engine
          burn_rate: "6"
          window: 30m
        annotations:
          summary: "Engine SLO burn at 6x over 30m+6h"
          runbook: https://monitor.smarter.poker/runbooks/engine-burn

      - alert: EngineSlowBurn
        expr: |
          slo:engine:error_ratio_1d  > (3 * (1 - 0.9995))
          and
          slo:engine:error_ratio_2h  > (3 * (1 - 0.9995))
        for: 1h
        labels:
          severity: warning
          component: engine
          slo: engine
          burn_rate: "3"
          window: 2h
        annotations:
          summary: "Engine slow burn (3x over 24h)"

      - alert: EngineBudgetExhausted
        expr: slo:engine:budget_remaining_30d <= 0.05
        for: 5m
        labels:
          severity: warning
          component: engine
          slo: engine
        annotations:
          summary: "Engine SLO budget <= 5% — freeze deploys"

  # ==========================================================================
  # Engine hand-tick latency (target p99 < 50ms, fraction-bad budget 1%/30d)
  #
  # Guarded by `> 0.01` so these rules evaluate to no data (not a firing
  # alert) until the poker_engine_hand_tick_duration_seconds histogram
  # lands via Phase 5.1.5a engine instrumentation.
  # ==========================================================================
  - name: slo-engine-tick-burnrate
    interval: 30s
    rules:
      - alert: EngineTickFastBurn
        expr: |
          slo:engine_tick:error_ratio_1h > (14.4 * (1 - 0.99))
          and
          slo:engine_tick:error_ratio_5m > (14.4 * (1 - 0.99))
        for: 5m
        labels:
          severity: critical
          component: engine
          slo: engine_tick
          burn_rate: "14.4"
          window: 5m
        annotations:
          summary: "Engine hand-tick p99 SLO burn (>50ms ticks spiking)"
          description: |
            >14.4x burn on the <50ms p99 SLO in both 5m and 1h windows.
            Hand-tick loop is not keeping up — check GC pauses, Supabase
            writes, or AI decision-tree blow-ups.
          runbook: https://monitor.smarter.poker/runbooks/engine-tick-latency

      - alert: EngineTickSlowBurn
        expr: |
          slo:engine_tick:error_ratio_6h > (6 * (1 - 0.99))
          and
          slo:engine_tick:error_ratio_1h > (6 * (1 - 0.99))
        for: 30m
        labels:
          severity: warning
          component: engine
          slo: engine_tick
          burn_rate: "6"
          window: 1h
        annotations:
          summary: "Engine hand-tick burning budget at 6x"
          runbook: https://monitor.smarter.poker/runbooks/engine-tick-latency

      - alert: EngineTickBudgetExhausted
        expr: slo:engine_tick:budget_remaining_30d <= 0.05
        for: 15m
        labels:
          severity: warning
          component: engine
          slo: engine_tick
        annotations:
          summary: "Engine tick latency budget <= 5% — freeze risky engine changes"
