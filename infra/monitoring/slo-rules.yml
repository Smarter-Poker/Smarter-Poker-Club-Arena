# SLO recording rules — smarter.poker
# Phase 5.1.5
#
# ───────────────────────────────────────────────────────────────────────────
# Defines the four user-facing SLOs for the smarter.poker platform, the
# recording rules that compute error budget burn over 5m/30m/1h/2h/6h/24h/72h
# windows, and the fast-path rules that power the SLO Grafana dashboard.
#
# The multi-window burn-rate *alerts* live in slo-alerts.yml so the rule
# loader stays readable. Recording rules here are intentionally cheap
# (rate over increasing windows) so the Prometheus evaluator doesn't become
# the thing that slows the platform down.
#
# Slugs used across recording rules, alerts, and dashboards:
#   wh_hub       — World Hub public API (scraped via blackbox probe)
#   ca_hub       — Club Arena public API (scraped via blackbox probe)
#   engine       — poker engine (pm2-metrics `up`)
#   engine_tick  — engine hand-tick latency (when the histogram lands)
#
# Target availabilities and error budgets (30d windows):
#   wh_hub       99.9%    43.2 min/30d
#   ca_hub       99.9%    43.2 min/30d
#   engine       99.95%   21.6 min/30d
#   engine_tick  99.0%    p99 < 50ms
# ───────────────────────────────────────────────────────────────────────────

groups:
  # ==========================================================================
  # WH hub availability — blackbox probe success rate against /api/health
  # ==========================================================================
  - name: slo-wh-hub
    interval: 30s
    rules:
      # Total and bad request rates by window. `probe_success` is emitted by
      # the blackbox-exporter; 1 = 2xx within probe timeout, 0 = anything else.
      - record: slo:wh_hub:request_rate_5m
        expr: |
          sum(rate(probe_success{job="vercel_health",instance="https://smarter.poker/api/health"}[5m]))
      - record: slo:wh_hub:error_rate_5m
        expr: |
          sum(rate(probe_success{job="vercel_health",instance="https://smarter.poker/api/health"}[5m] offset 0s) == 0)
            or vector(0)

      # Error-ratio recording rules per window. Used by burn-rate alerts.
      # Each `ratio_<window>` = failed / total over `<window>`.
      # probe_success is a 0/1 gauge so the ratio collapses to 1 - avg.
      - record: slo:wh_hub:error_ratio_5m
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/health"}[5m])
      - record: slo:wh_hub:error_ratio_30m
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/health"}[30m])
      - record: slo:wh_hub:error_ratio_1h
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/health"}[1h])
      - record: slo:wh_hub:error_ratio_2h
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/health"}[2h])
      - record: slo:wh_hub:error_ratio_6h
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/health"}[6h])
      - record: slo:wh_hub:error_ratio_1d
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/health"}[1d])
      - record: slo:wh_hub:error_ratio_3d
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/health"}[3d])

      # Error budget remaining over the 30d SLO window, as a fraction 0..1.
      # At 1.0 we've burned nothing; at 0.0 we've blown the budget. Grafana
      # renders this as a single-stat pill.
      - record: slo:wh_hub:budget_remaining_30d
        expr: |
          clamp_min(
            1 - (
              (1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/health"}[30d]))
              / (1 - 0.999)
            ),
            0
          )

  # ==========================================================================
  # CA hub availability — blackbox probe against /api/club-arena/health
  # ==========================================================================
  - name: slo-ca-hub
    interval: 30s
    rules:
      - record: slo:ca_hub:error_ratio_5m
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/club-arena/health"}[5m])
      - record: slo:ca_hub:error_ratio_30m
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/club-arena/health"}[30m])
      - record: slo:ca_hub:error_ratio_1h
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/club-arena/health"}[1h])
      - record: slo:ca_hub:error_ratio_2h
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/club-arena/health"}[2h])
      - record: slo:ca_hub:error_ratio_6h
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/club-arena/health"}[6h])
      - record: slo:ca_hub:error_ratio_1d
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/club-arena/health"}[1d])
      - record: slo:ca_hub:error_ratio_3d
        expr: |
          1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/club-arena/health"}[3d])

      - record: slo:ca_hub:budget_remaining_30d
        expr: |
          clamp_min(
            1 - (
              (1 - avg_over_time(probe_success{job="vercel_health",instance="https://smarter.poker/api/club-arena/health"}[30d]))
              / (1 - 0.999)
            ),
            0
          )

  # ==========================================================================
  # Engine availability — `up{job="engine_pm2"}` scraped every 5s from
  # pm2-metrics on the Hetzner host. 99.95% target = 21.6 min/30d budget.
  # ==========================================================================
  - name: slo-engine
    interval: 15s
    rules:
      - record: slo:engine:error_ratio_5m
        expr: 1 - avg_over_time(up{job="engine_pm2"}[5m])
      - record: slo:engine:error_ratio_30m
        expr: 1 - avg_over_time(up{job="engine_pm2"}[30m])
      - record: slo:engine:error_ratio_1h
        expr: 1 - avg_over_time(up{job="engine_pm2"}[1h])
      - record: slo:engine:error_ratio_2h
        expr: 1 - avg_over_time(up{job="engine_pm2"}[2h])
      - record: slo:engine:error_ratio_6h
        expr: 1 - avg_over_time(up{job="engine_pm2"}[6h])
      - record: slo:engine:error_ratio_1d
        expr: 1 - avg_over_time(up{job="engine_pm2"}[1d])
      - record: slo:engine:error_ratio_3d
        expr: 1 - avg_over_time(up{job="engine_pm2"}[3d])

      - record: slo:engine:budget_remaining_30d
        expr: |
          clamp_min(
            1 - (
              (1 - avg_over_time(up{job="engine_pm2"}[30d]))
              / (1 - 0.9995)
            ),
            0
          )

  # ==========================================================================
  # Engine hand-tick latency — 99% of hand ticks complete in <50ms over 30d.
  #
  # Depends on pm2-metrics exporting a histogram:
  #   poker_engine_hand_tick_duration_seconds_bucket{le="..."}
  # The metric doesn't exist yet (pending 5.1.5a engine instrumentation), so
  # these rules evaluate to NaN until then. NaN is filtered out by the alert
  # expressions (`> 0.01` below) so this doesn't flap pre-instrumentation.
  # ==========================================================================
  - name: slo-engine-tick
    interval: 30s
    rules:
      # p99 of hand-tick latency over 5m — surfaced on the SLO dashboard.
      - record: slo:engine_tick:p99_5m
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(poker_engine_hand_tick_duration_seconds_bucket[5m])) by (le)
          )

      # Fraction of ticks that violated the 50ms threshold in the window.
      # Used as the error term for burn-rate calculations.
      - record: slo:engine_tick:error_ratio_5m
        expr: |
          (
            sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="+Inf"}[5m]))
            -
            sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="0.05"}[5m]))
          )
          /
          sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="+Inf"}[5m]))

      - record: slo:engine_tick:error_ratio_1h
        expr: |
          (
            sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="+Inf"}[1h]))
            -
            sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="0.05"}[1h]))
          )
          /
          sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="+Inf"}[1h]))

      - record: slo:engine_tick:error_ratio_6h
        expr: |
          (
            sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="+Inf"}[6h]))
            -
            sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="0.05"}[6h]))
          )
          /
          sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="+Inf"}[6h]))

      - record: slo:engine_tick:error_ratio_3d
        expr: |
          (
            sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="+Inf"}[3d]))
            -
            sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="0.05"}[3d]))
          )
          /
          sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="+Inf"}[3d]))

      - record: slo:engine_tick:budget_remaining_30d
        expr: |
          clamp_min(
            1 - (
              (
                sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="+Inf"}[30d]))
                -
                sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="0.05"}[30d]))
              )
              /
              sum(rate(poker_engine_hand_tick_duration_seconds_bucket{le="+Inf"}[30d]))
              / (1 - 0.99)
            ),
            0
          )
