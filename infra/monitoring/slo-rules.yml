# SLO recording rules.
#
# 2026-09-04 — REWRITTEN. This file, and slo-alerts.yml beside it, previously
# contained `groups: []` and a comment saying DISABLED. They were declared in
# prometheus.yml rule_files, mounted in docker-compose.yml, and symlinked onto
# the host by deploy.sh — three layers of plumbing carrying nothing. They
# passed CI legitimately, through the drift check's documented DISABLED opt-out,
# which has no expiry; it had been open since 2026-08-28 and nobody owned
# closing it.
#
# They were disabled because every rule in them read
# probe_success{job="vercel_health"} from a blackbox-exporter that this stack
# does not deploy. That is still true and still not deployed.
#
# The mistake was equating "SLO" with "external HTTP probe". A service level
# objective is a promise about the service, and the promises this platform
# actually makes to a player are about DEALING, RESPONDING and SETTLING —
# every one of which the engine already measures and Prometheus already
# scrapes. So these are written against gauges that exist today, and they fire
# today.
#
# External reachability is not measured by this Prometheus stack. Club Arena's
# read-only production-integrity audit verifies the Hetzner origin and public
# rewrite without owning a retry, repair, or publish path.
#
# Naming: sp:<objective>:<window>. Recording rules only — the objectives
# themselves are asserted in slo-alerts.yml.

groups:
  - name: slo-recording
    interval: 30s
    rules:
      # ── AVAILABILITY ────────────────────────────────────────────────────
      # The engine is scraped every 15s. Averaged over 30m this is the
      # fraction of scrapes that found it alive.
      - record: sp:engine_availability:ratio30m
        expr: |
          avg_over_time(up{job="engine_game_server"}[30m])

      # ── DEALING ─────────────────────────────────────────────────────────
      # The platform's core promise: hands are being dealt. A table that is up,
      # seated and dealing nothing is the failure players actually notice, and
      # no availability metric can see it.
      # `poker_hands_dealt_total`, not `poker_hands_total` (2026-09-09).
      # The latter lives on the flag-gated registry and ENGINE_METRICS is set
      # NOWHERE in this estate, so this recording rule evaluated `rate()` over
      # a series with no samples - an empty vector - and
      # `SLOHandsAreNotBeingDealt` (severity critical, page: sms) was
      # structurally unable to fire. The engine has always published
      # `poker_hands_dealt_total` on the always-on path (EngineTelemetry).
      - record: sp:hands_dealt:rate5m
        expr: |
          rate(poker_hands_dealt_total[5m])

      # Tables that exist but have made no progress: the worst one.
      #
      # READ FROM THE FLEET GAUGE, NOT FROM A THOUSAND SERIES (2026-09-11).
      # `poker_table_ms_since_progress` was emitted for EVERY table, and this
      # rule was its only consumer anywhere - 1,363 samples scraped every
      # fifteen seconds so that one `max()` could pick one of them, with the
      # whole exposition built on the engine's authoritative event loop. The
      # engine publishes the maximum directly now. The per-table series still
      # exists for a table that has actually stalled, which is the one an
      # operator wants to name, so `max()` over it would ALSO be correct - but
      # it would be absent on a healthy fleet, and an absent SLO is not a
      # healthy one (CLAUDE.md 10.86). This gauge is always present.
      - record: sp:table_stall:max_ms
        expr: |
          max(poker_fleet_table_stall_max_ms)

      # ── RESPONDING ──────────────────────────────────────────────────────
      # From a player's action arriving to every seat seeing it. This is the
      # number that feels like lag at the table.
      - record: sp:action_to_broadcast:p95_ms
        expr: |
          max(poker_action_processing_p95_ms)

      - record: sp:broadcast:p95_ms
        expr: |
          max(poker_broadcast_latency_p95_ms)

      # ── SETTLING ────────────────────────────────────────────────────────
      # Expressed as a success ratio so it reads like an SLO. The underlying
      # gauge is a five-minute window; see SettlementMetrics.ts for why it is
      # never a lifetime ratio.
      - record: sp:settlement_success:ratio5m
        expr: |
          1 - poker_settlement_failure_rate

      # ── THE PLUMBING BENEATH ALL OF IT ──────────────────────────────────
      # The engine reaches Postgres only through PostgREST. Every objective
      # above depends on this staying near zero.
      - record: sp:db_error:rate10m
        expr: |
          rate(poker_rpc_errors_total[10m])

  # ── HOW OLD THE MONEY, SETTLEMENT AND CRON READINGS ARE ─────────────────
  #
  # 2026-09-11. Fifteen rules were written on 2026-09-04 against thirteen
  # metric names that nothing emitted. Three of those rules exist to catch
  # exactly that - CronMetricsBlind, MoneyHealthBlind, SettlementMetricsBlind -
  # and each was written as `poker_..._stale_seconds > 600`, which is an empty
  # vector when the collector never ran at all. The blindness detector was
  # blind in the one case it was built for.
  #
  # collect-monitoring-health.sh now publishes one collection timestamp
  # alongside those gauges. Staleness is DERIVED from it here rather than
  # written by the collector, because a collector can only ever write zero for
  # its own age: the moment it stops, a self-reported age freezes at zero and
  # reads as perfectly fresh forever. Computed against time(), it climbs.
  #
  # All three names resolve to the same reading because one collector produces
  # all three families. They stay three names because the alerts are three
  # alerts, and a later split should not have to rewrite them.
  - name: money-health-freshness
    interval: 30s
    rules:
      - record: poker_settlement_metrics_stale_seconds
        expr: |
          time() - poker_health_collected_timestamp_seconds

      - record: poker_money_health_stale_seconds
        expr: |
          time() - poker_health_collected_timestamp_seconds

      - record: poker_cron_metrics_stale_seconds
        expr: |
          time() - poker_health_collected_timestamp_seconds
