# ═══════════════════════════════════════════════════════════════════════════
#  SPIN ALERTS (2026-08-31)
# ═══════════════════════════════════════════════════════════════════════════
#
# Spin is the only format on the platform that charges NO RAKE. There is no
# fee row, no ledger line, nothing to reconcile — the 8% is engineered into
# the multiplier distribution, and the entire commercial design rests on one
# equality:
#
#     E[multiplier] = seats x (1 - rake_rate) = 3 x 0.92126 = 2.7637726
#
# Until 2026-08-31 nothing had ever checked it. Not a job, not a dashboard,
# not a test — the first and only verification in the platform's life was a
# human typing SQL during an audit. If that mean drifted down, players would
# quietly pay a bigger edge than the lobby advertises and no part of this
# system would have said a word.
#
# Every expression below is verified against a gauge the engine actually
# emits (server/src/services/SpinMetrics.ts). check-monitoring-drift.mjs
# asserts this file is listed, mounted and non-empty.

groups:
  - name: spin-fairness
    interval: 60s
    rules:
      # ── THE ONE THAT MATTERS ─────────────────────────────────────────
      # The gauge is already sample-size aware: drift is |z| >= 4 over at
      # least 2,000 draws, which is roughly a 1-in-16,000 false alarm. The
      # 15m `for` is not extra statistics, it is scrape hygiene.
      #
      # BEFORE ESCALATING, READ poker_spin_draw_constrained. A thin reserve
      # pool locks the top tiers out of the draw and renormalises, which
      # lowers the conditional mean through no fault of the RNG. Non-zero
      # there is the explanation; zero there means the draw itself moved.
      - alert: SpinDrawFairnessDrift
        expr: poker_spin_draw_fairness_drift > 0
        for: 15m
        labels:
          severity: critical
          component: spin
        annotations:
          summary: "Spin's realised E[multiplier] is 4+ standard errors from spec"
          description: |
            The mean multiplier drawn over the last 24h differs from the
            2.7637726 the format is sold on by more than four standard
            errors. Below spec means players are paying a larger edge than
            the lobby advertises; above spec means the reserve pool is being
            drained faster than the buy-ins refill it.
            FIRST: check poker_spin_draw_constrained. Non-zero means the
            reserve pool locked tiers out and renormalised — expected, not a
            defect. Zero means the draw itself moved: compare
            v_spin_draw_distribution_7d against spin_tier_spec.
          runbook: 'docs/runbooks/spin-fairness-drift.md'

      # A collector that cannot read is not a healthy platform. A failed
      # refresh keeps the last good snapshot on purpose, so this gauge is
      # the ONLY thing that proves the numbers above are current.
      - alert: SpinMetricsStale
        expr: poker_spin_metrics_stale_seconds > 600
        for: 5m
        labels:
          severity: critical
          component: spin
        annotations:
          summary: "Spin gauges are {{ $value }}s stale — fairness is unwatched"
          description: |
            SpinMetrics has not completed a refresh in over ten minutes. The
            gauges are showing the last good values, which look healthy and
            are not current. fn_spin_metrics is failing; check the engine log
            for SpinMetrics.refresh_failed.
          runbook: 'docs/runbooks/spin-metrics-stale.md'

  - name: spin-money
    interval: 60s
    rules:
      # The prize left the reserve pool and reached no wallet. Since
      # 2026-09-10 one transaction (fn_spin_draw_and_settle_atomic) draws and
      # settles together, and the GameServer winner-backpay caller was
      # removed (docs/BAND-AIDS-REGISTER.md, TIER 1 section 9), so nothing
      # clears this on its own: a standing count is the live path failing.
      - alert: SpinPrizeUnpaid
        expr: poker_spin_unpaid_settlements > 0
        for: 10m
        labels:
          severity: critical
          component: spin
        annotations:
          summary: "{{ $value }} Spin prize(s) drawn from the pool and paid to nobody"
          description: |
            fn_spin_unpaid_settlements(24) compares what the reserve pool
            DREW for each recent Spin against what reached a player's wallet.
            The draw and the settlement commit in one transaction
            (fn_spin_draw_and_settle_atomic) and no back-pay job runs, so a
            standing count means that transaction was bypassed or a later
            write undid part of it. Players are owed money: find the writer.
          runbook: 'docs/runbooks/spin-prize-unpaid.md'

      # NEW gaps only, and the gauge itself is what makes that simple. The
      # eleven historical rows (2026-08-22 to 08-24, cause closed, 293.00
      # chips of pool overstatement) are a remediation decision, not an
      # ongoing incident, and a rule on a lifetime count would fire forever
      # and teach everyone to ignore it.
      #
      # The first cut used delta() over the lifetime count for exactly that
      # reason. It does not need to any more: poker_spin_draw_booking_gaps
      # now counts only spins that ENDED IN THE LAST 24 HOURS, so the closed
      # eleven are already outside it and a plain `> 0` is both simpler and
      # strictly more robust. delta() over a gauge cannot tell a real new gap
      # from the counter resetting on an engine restart.
      - alert: SpinDrawBookingGapOpened
        expr: poker_spin_draw_booking_gaps > 0
        for: 5m
        labels:
          severity: critical
          component: spin
        annotations:
          summary: "A new Spin booked a different multiplier than it paid"
          description: |
            A Spin that ended in the last 24 hours had the reserve pool
            debited for one multiplier step while the players were paid at
            another, so the pool's books and the wallets disagree. This class
            of defect was closed on 2026-08-24; a new row means it reopened.
            v_spin_draw_booking_gaps holds the full history, including the
            eleven closed rows this gauge deliberately cannot see.
          runbook: 'docs/runbooks/spin-booking-gap.md'

      # THE ONE THE BOOKING GAUGE ABOVE CANNOT SEE. SpinDrawBookingGapOpened
      # is guarded, in SQL, on the booked amount being non-null: it asks only
      # whether a game that WAS booked paid something different. A game with
      # no reserve ledger row at all is excluded from that count entirely.
      #
      # That is not hypothetical. On 2026-08-30 the backstop that books them,
      # /api/cron/spin-sweep, had its lookback widened to 14 days on the
      # reasoning that an idempotent settle makes a wide window free. It made
      # the pass exceed the eight-second service_role statement timeout
      # instead, so every run for two days rolled back and booked nothing,
      # 112 Spins paid 5,737.00 out of a pool with no record of them, and the
      # booking gauge read 0 the whole time.
      #
      # Zero is the normal reading. Since 2026-09-10 the launch that deals a
      # Spin books its entry, draws, settles and writes the receipt in ONE
      # transaction (fn_spin_draw_and_settle_atomic), and 0 of 37,391 draws
      # since then lack a receipt. A single one standing for fifteen minutes
      # therefore means that transaction was bypassed, which is the condition,
      # not the symptom. The pg_cron schedule spin_sweep_unbooked was retired on
      # 2026-09-22 by 20260922155223 for exactly that reason. The World Hub
      # route /api/cron/spin-sweep still calls fn_spin_sweep_unbooked from Open
      # Claw; docs/BAND-AIDS-REGISTER.md (TIER 1 #9) names it as compensation
      # still to remove, not as the fix.
      - alert: SpinDrawNeverBooked
        expr: poker_spin_draw_unbooked > 0
        for: 15m
        labels:
          severity: critical
          component: spin
        annotations:
          summary: "{{ $value }} Spin(s) paid a prize the reserve pool never recorded"
          description: |
            A Spin ran, drew a multiplier and paid its player without a single
            spin_reserve_ledger row. The players are not short - the prize
            reached them - but the pool's books do not contain money that left
            it, so every reserve total, every thin-pool decision and every
            reconciliation reading from it is wrong by that amount.
            The atomic draw books every Spin in the transaction that draws it,
            so this means that transaction was bypassed: treat it as a P0 and
            find the writer. The pg_cron sweep was retired on 2026-09-22; the
            World Hub route /api/cron/spin-sweep still calls
            fn_spin_sweep_unbooked from Open Claw at 7,22,37,52. If you read
            that job, read its RESPONSE BODY, not its exit: the dispatcher logs
            "executed successfully" for an HTTP 500, and `remaining` in that
            body is this same number.
          runbook: 'docs/runbooks/spin-never-booked.md'

      # THE OUTAGE NOTHING COULD SEE.
      #
      # On 2026-09-01 every INSERT into `tournaments` raised 42804 for four
      # hours - a text column COALESCEd against '[]'::jsonb inside the
      # AFTER INSERT readiness guard - and the platform created no game of any
      # kind. Every alert in this file stayed silent and every one of them was
      # CORRECT: unbooked_spins was 0 because no Spin ran to be unbooked,
      # booking_gaps likewise, fairness was healthy over the earlier draws, the
      # pool was not thin. They all measure the games that exist.
      #
      # This is the pair that can see an empty factory, and it takes BOTH
      # halves to be honest about it. A room with no boards open and nothing
      # starting is a quiet night and must never page anyone; a room with
      # boards OPEN and nothing starting for half an hour is the failure that
      # happened. Normal cadence is around a hundred Spins an hour.
      - alert: SpinFleetProducingNothing
        expr: poker_spin_seconds_since_last_start > 1800 and poker_spin_open_boards > 0
        for: 5m
        labels:
          severity: critical
          component: spin
        annotations:
          summary: "No Spin has started in {{ $value }}s while boards sit open"
          description: |
            Spin boards are in REGISTERING and none has started for over half
            an hour. Seats may be filling and still nothing runs. Look FIRST at
            whether the platform can create a tournament at all - on
            2026-09-01 the cause was every INSERT into `tournaments` failing in
            an AFTER INSERT trigger, which no other alert here could see.
            Reproduce it by cloning a live row inside a transaction you roll
            back; the error and its call site come back together.
            Check `[ScheduledTournaments.insert_failed]` in the engine log and
            `fn_tournament_management_readiness` for a text/jsonb mismatch.
          runbook: 'docs/runbooks/spin-fleet-stalled.md'

      # Every row is a player who lost VIP points and an agent who lost
      # commission. The threshold is not zero: the settle path attributes
      # asynchronously and a handful in flight is normal. A standing hundred
      # is the live attribution path failing; the old repair and back-pay
      # functions now only count and have no engine caller.
      - alert: RakeAttributionBacklog
        expr: poker_rake_attribution_gaps > 100
        for: 30m
        labels:
          severity: warning
          component: spin
        annotations:
          summary: "{{ $value }} settled rake rows have credited nobody"
          description: |
            Tournament rake was banked but never attributed, so VIP points,
            rakeback and agent commission went unpaid for those events. The
            count is every row of v_tournament_rake_attribution_gaps, all
            tournament formats. Read its verdict and attribution_error, then
            the live path: fn_settle_tournament_rake and
            fn_attribute_tournament_rake.
          runbook: 'docs/runbooks/rake-attribution-backlog.md'

  - name: spin-experience
    interval: 60s
    rules:
      # THE ANIMATION LAW: "the spin animation plays every time it is owed,
      # FOR ITS FULL DURATION." A wheel that starts late because the ENGINE
      # was slow is that law's plainest violation — the player is charged for
      # the engine's lateness in the one moment the format sells.
      #
      # 5s is the breach line v_spin_reveal_latency already uses, so the
      # alert and the view cannot disagree about what "late" means.
      - alert: SpinRevealChronicallyLate
        expr: poker_spin_reveal_lag_p50_ms > 5000
        for: 15m
        labels:
          severity: warning
          component: spin
        annotations:
          summary: "Median Spin reveal is {{ $value }}ms behind its own anchor"
          description: |
            More than half of the spins started in the last hour reached the
            draw over five seconds after the moment the three players were
            promised the wheel. Each one is re-anchored so it still plays in
            full, which is correct and also means the players sat looking at
            a table waiting for it. The cost is in the start path: see the
            sequential reads between start() and fn_spin_draw_multiplier.
          runbook: 'docs/runbooks/spin-reveal-late.md'

      # The reserve pool cannot cover the top tier, so 100x (and possibly
      # 50x) are locked out of the draw entirely. The lobby still advertises
      # them. Warning, not critical: the lockout is the CORRECT behaviour —
      # the alternative is promising a prize the pool cannot pay — but it
      # must not go unnoticed, because it also moves the realised edge.
      - alert: SpinReservePoolThin
        expr: poker_spin_reserve_thin_clubs > 0
        for: 30m
        labels:
          severity: warning
          component: spin
        annotations:
          summary: "{{ $value }} club(s) cannot cover Spin's top tier"
          description: |
            The reserve pool is too thin to pay the highest multiplier, so
            fn_spin_draw_multiplier has locked those tiers out and
            renormalised over the rest. Players cannot win the top prize the
            lobby shows, and poker_spin_draw_realised_multiplier will sit
            below spec for as long as this lasts. Top the pool up, or accept
            it and expect SpinDrawFairnessDrift to follow.
          runbook: 'docs/runbooks/spin-reserve-thin.md'

      # This is the population of partly filled, open, unstarted Spins.
      # The view exposes wait age but does not filter on the fill deadline
      # or booked draws. A population above five for twenty minutes does
      # not establish each member's age or its eligibility for cancellation.
      - alert: SpinUnfilledBacklog
        expr: poker_spin_unfilled_waits > 5
        for: 20m
        labels:
          severity: warning
          component: spin
        annotations:
          summary: "{{ $value }} Spins remain open with a partially filled field"
          description: |
            v_spin_unfilled_waits counts REGISTERING or ANNOUNCED Spins
            with no recorded start and between one live seat and one fewer
            than capacity. It does not filter wait age, policy or booked draws.
            Inspect each board's oldest_seat_at, spin_fill_policy, draw and
            hand evidence, and the actual fn_spin_expire_unfilled result.
            A drawn or played game requires its continuation or settlement
            authority. This count alone proves neither that expiry is due
            nor that the expiry timer failed.
          runbook: 'docs/runbooks/spin-unfilled-backlog.md'
