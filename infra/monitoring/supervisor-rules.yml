# Alerts for the engine supervisor itself.
#
# The recovery stack now has three layers — Docker restart policy, the
# sp-autoheal sidecar, and club-arena-supervisor.timer. Each one makes an
# outage shorter. Each one also makes an outage QUIETER, which is the trap:
# a crash-loop that is being restarted every 90 seconds looks, from the
# outside, exactly like a healthy service. These rules exist so that
# self-healing never becomes self-concealing.
#
# Metrics come from server/scripts/engine-supervisor.sh via the node-exporter
# textfile collector (/var/lib/node-exporter-textfile).
groups:
  - name: club-arena-supervisor
    rules:
      # ── The watcher is the thing most likely to fail silently ─────────────
      - alert: EngineSupervisorStale
        expr: time() - club_arena_supervisor_last_run_timestamp_seconds > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Engine supervisor has not run in over 5 minutes"
          description: >-
            club-arena-supervisor.timer fires every 60s. It has not published a
            heartbeat for {{ $value | humanizeDuration }}. The last-resort
            recovery path for the poker engine is currently NOT running —
            `docker stop`, a half-finished deploy, or a removed container would
            now go unrecovered. Check: systemctl status club-arena-supervisor.timer

      - alert: EngineSupervisorMetricsMissing
        expr: absent(club_arena_supervisor_last_run_timestamp_seconds)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Engine supervisor metrics have disappeared entirely"
          description: >-
            The supervisor heartbeat series is absent, not merely stale. Either
            the supervisor was uninstalled, or the node-exporter textfile
            collector lost its --collector.textfile.directory flag. Either way
            the supervisor is now unobservable.

      # ── Self-healing must not become self-concealing ──────────────────────
      - alert: EngineFlappingUnderSupervisor
        expr: increase(club_arena_supervisor_recoveries_total[30m]) >= 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Engine recovered {{ $value }} times in 30 minutes — this is a crash loop"
          description: >-
            The supervisor is doing its job, which means players may see nothing
            wrong. But an engine that needs recovering three times in half an
            hour has an underlying defect that recovery is only masking. Pull
            `journalctl -u club-arena-supervisor` and `docker logs
            club-arena-engine` before the evidence rotates out.

      - alert: EngineRecoveredUnexpectedly
        expr: increase(club_arena_supervisor_recoveries_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Engine required supervisor intervention"
          description: >-
            A single recovery is not an emergency, but it is never routine — it
            means one of Docker's restart policy, the healthcheck, or the deploy
            left the engine in a state it could not get out of on its own. Worth
            reading the journal to find out which.

      # ── The engine, seen from the host rather than from the internet ──────
      # Distinguishes "the engine is down" from "Caddy/DNS/TLS is down", which
      # the externally-probed alerts cannot tell apart.
      - alert: EngineNotServingOnHost
        expr: club_arena_engine_serving == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Engine not answering /health on the host itself"
          description: >-
            Checked from inside the box, so this is the engine, not the proxy or
            DNS. The supervisor restarts after 3 consecutive failures; if this
            alert persists past ~4 minutes, recovery is failing too.

      - alert: EngineContainerNotRunning
        expr: club_arena_engine_container_running == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Engine container is not in the running state"
          description: >-
            The container exists but is stopped, or is missing entirely. Note
            that `--restart always` does NOT cover a manual `docker stop` — if
            this persists, the supervisor's recreate path is also failing.
