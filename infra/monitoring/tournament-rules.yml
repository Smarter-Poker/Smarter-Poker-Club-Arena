# ═══════════════════════════════════════════════════════════════════════════
#  TOURNAMENT ALERTS (2026-08-31)
# ═══════════════════════════════════════════════════════════════════════════
#
# Until the gauges these rules read existed, /metrics carried 895 poker_*
# series and NOT ONE mentioned a tournament. Every rule file here was about
# tables — and a tournament that never started owns no table, so nothing could
# see it.
#
# The cost was measured, not theorised. Every tournament defect found in the
# 2026-08-30/31 audit was found by a human typing SQL:
#
#   - 10 of 16 RUNNING MTTs hung heads-up-won for HOURS, champion unpaid;
#   - 19 scheduled events spawned NOTHING for six days (a blind preset name
#     that did not resolve);
#   - one event paid 141% of its prize pool.
#
# Not one of them fired an alarm, because none of them could.
#
# Every expression below is verified against a metric the engine actually
# emits (services/TournamentMetrics.ts). check-monitoring-drift.mjs asserts
# this file is loaded, mounted and non-empty.

groups:
  - name: tournament-health
    interval: 30s
    rules:
      # ── THE ONE THAT MATTERS ─────────────────────────────────────────
      # An MTT starts on a clock. Still REGISTERING ten minutes past its own
      # start time means nobody started it — the exact shape of the DEEPSTACK
      # outage, which ran silently for six days.
      #
      # MTT ONLY, deliberately. A seat-first SNG/Spin waiting for its seats to
      # fill is not overdue, it is working; the collector scopes this gauge so
      # this alert cannot cry wolf. poker_tournaments_seat_first_waiting
      # carries that number separately and is NOT alerted on.
      - alert: TournamentNeverStarted
        expr: poker_tournaments_overdue_start > 0
        for: 5m
        labels:
          severity: critical
          component: tournament
        annotations:
          summary: '{{ $value }} MTT(s) past their start time and never started'
          description: |
            One or more MTTs are still REGISTERING/ANNOUNCED more than 10
            minutes after their advertised start time. Players who registered
            are waiting for a game that is not going to begin on its own.
            Check the engine log for ScheduledTournaments.structure_missing
            and for spawn errors, then GameServer's played-but-registering
            sweep.
          runbook: https://monitor.smarter.poker/runbooks/tournament-never-started

      # ── NOBODY IS RUNNING THE TOURNAMENTS (2026-09-09) ────────────────
      # Measured on production 05:52 UTC, and nothing anywhere said it:
      #
      #     /health   activeTables: 102, activeTournaments: 0, liveness: ok
      #     /metrics  poker_tournaments_running 120
      #               poker_tournament_elimination_scheduler_registered 0
      #
      # A full cash fleet and not one of a hundred and twenty tournaments. Every
      # liveness branch was satisfied - cash tables progressing, discovery loop
      # ticking, and `barrenLeaderDead` requires tables.length == 0, which a busy
      # cash fleet never is. Thirteen events had dealt no hand for over an hour,
      # the oldest for fifteen, with 183 players sitting in them.
      #
      # The engine computes the gauge because it is the only thing that knows
      # both halves AND its own leadership: a standby owns nothing by design, a
      # booting instance has not adopted yet, and a stale snapshot means the
      # `running` half is a number nobody re-read. It reports 0 in all three
      # rather than guessing (CLAUDE.md 10.86 rule 1).
      #
      # 10m, DERIVED not guessed: the hourly maintenance break holds the
      # platform for five minutes and the engine is down for roughly two to
      # three of them (CLAUDE.md 13: park at :55, new engine boots ~:58, thaw at
      # :00), and re-adoption is a five-second discovery pass. Ten minutes
      # cannot be reached by a scheduled restart. The break guard below is
      # belt-and-braces per CLAUDE.md 13 rule 6.
      - alert: TournamentFleetUnserved
        expr: |
          poker_tournament_fleet_unserved == 1
          unless max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 10m
        labels:
          severity: critical
          component: tournament
        annotations:
          summary: 'The leader engine owns NO tournament manager while tournaments are RUNNING'
          description: |
            This engine is the leader, is past its boot grace, holds a fresh
            database snapshot, and owns zero tournament managers while the
            database says tournaments are RUNNING. Every one of those events is
            frozen: no hands are dealt, no player can be eliminated, no winner
            is paid, and the knockout-candidate backlog grows for as long as it
            lasts.
            Compare poker_tournaments_owned against poker_tournaments_running,
            then read the engine log for GameServer.running_board_read_failed
            and for tournament admission refusals. Table liveness will look
            perfectly healthy throughout - it is measuring the cash fleet.
          runbook: https://monitor.smarter.poker/runbooks/tournament-fleet-unserved

      # September 13: all 84 running MTTs were silent while 509 managers
      # renewed leases and cash games continued. Neither global hand rate nor
      # manager count detects that. The RPC checks each event independently.
      # Fifteen minutes exceeds the seven-day max hand (214.389s over 2.1m
      # hands). A five-minute sustained alert and the break guard exclude an
      # ordinary five-minute break, slow hand and immediate post-thaw recovery.
      - alert: MttPlayStopped
        expr: |
          (poker_mtt_stalled_running > 0)
          and on(instance) (poker_tournament_metrics_stale_seconds < 300)
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 5m
        labels:
          severity: critical
          component: tournament
        annotations:
          summary: '{{ $value }} MTT(s) have stopped producing hands'
          description: |
            Each counted MTT has been running for at least 15 minutes and has
            no recorded hand for its own event in that window, outside its
            break and add-on grace. Other tournaments and cash games cannot
            clear this count. Inspect manager scheduler in-flight work,
            unprocessed knockouts, one-player tables and table adoption.
          runbook: docs/changelog/2026-09-13-mtt-progress-monitoring.md

      # A break flag must not make a stalled tournament invisible forever.
      # Ten extra minutes exceed the measured longest hand plus ordinary thaw;
      # use the later break/add-on end, including pre-countdown missing ends.
      - alert: MttBreakDidNotEnd
        expr: |
          (poker_mtt_overdue_breaks > 0)
          and on(instance) (poker_tournament_metrics_stale_seconds < 300)
          unless on() max_over_time(poker_maintenance_break_active[6m]) == 1
        for: 2m
        labels:
          severity: critical
          component: tournament
        annotations:
          summary: '{{ $value }} MTT break(s) have not resumed'
          description: |
            An MTT remains marked on break more than ten minutes beyond its
            break or add-on deadline. Missing countdown timestamps have a
            bounded grace as well. Inspect break-clear acknowledgment, add-on
            finalization and maintenance thaw; do not force-release tables
            before the outstanding owner finishes.
          runbook: docs/changelog/2026-09-13-mtt-progress-monitoring.md

      # ── Money is owed and the settle path did not finish ──────────────
      # recoverStuckCompletingTournaments should settle a COMPLETING event
      # within a sweep. Ten minutes means it did not, and the prize pool is
      # sitting undistributed.
      - alert: TournamentStuckCompleting
        expr: poker_tournaments_stuck_completing > 0
        for: 10m
        labels:
          severity: critical
          component: tournament
        annotations:
          summary: '{{ $value }} tournament(s) stuck in COMPLETING'
          description: |
            A tournament has been in COMPLETING for over 10 minutes. The
            recovery watchdog settles these within a sweep, so this means it
            refused to — most likely a position collision or a field with no
            dealt-in survivor, both of which it reports rather than guessing.
            Prize money is undistributed until this clears.
          runbook: https://monitor.smarter.poker/runbooks/tournament-stuck-completing

      # ── The 2026-08-30 outage, made alertable ─────────────────────────
      # A player holding chips with no seat anywhere cannot be eliminated, so
      # the event can never reach one survivor and never pays its champion.
      # This is exactly how 10 of 16 RUNNING MTTs hung.
      #
      # The engine self-heals these after ~2 minutes (the seatless-phantom
      # backstop), and a restart legitimately produces a burst while tables
      # rebuild — measured at 47, cleared within three minutes. So the alert
      # is deliberately slow: 15 minutes of a persistent non-zero count means
      # the backstop is NOT clearing them.
      - alert: TournamentSeatlessPhantoms
        expr: poker_tournament_seatless_phantoms > 0
        for: 15m
        labels:
          severity: critical
          component: tournament
        annotations:
          summary: '{{ $value }} tournament entrant(s) holding chips with no seat'
          description: |
            Entrants in a RUNNING tournament hold chips but have no open seat
            anywhere in that event. They cannot be eliminated, so the
            tournament cannot reach a winner and cannot pay out. The
            seatless-phantom backstop should clear these within ~2 minutes; if
            this is firing it is not clearing them.
          runbook: https://monitor.smarter.poker/runbooks/tournament-seatless-phantoms

      # ── A finished tournament that paid nobody ────────────────────────
      # The strongest money signal available: COMPLETED, has a prize pool, and
      # nothing of value reached anybody against it.
      #
      # "Nothing of value" is deliberately wider than "no cash" (2026-09-12).
      # A satellite pays in a SEAT at the target event or a TICKET to enter one
      # later, neither of which is a wallet transaction, so a cash-only test
      # made every satellite unpaid by construction: 12 firings in 14 days, 12
      # satellites, 0 unpaid. `fn_tournament_metrics` now also clears a
      # tournament that delivered a `tournament_satellite_awards` row, which
      # evidences delivery by constraint rather than by the ledger's intent.
      - alert: TournamentCompletedUnpaid
        expr: poker_tournaments_unpaid_completed > 0
        for: 15m
        labels:
          severity: critical
          component: tournament
        annotations:
          summary: '{{ $value }} completed tournament(s) with a prize pool and no payout'
          description: |
            One or more tournaments finished in the last 6 hours with a
            non-zero prize pool and NOTHING delivered against it: no cash
            prize on the wallet ledger, and no satellite award either. A
            satellite pays in a seat or a ticket rather than in chips and both
            count as payment here, so a satellite in this number is one that
            failed to settle, not one that paid in kind. Players bought in and
            nobody was paid. The payout sweep and the reconciler both run on a
            schedule; if this persists, both have declined to act and it needs
            a human.
          runbook: https://monitor.smarter.poker/runbooks/tournament-unpaid

      # ── THE ALERT ABOUT THE ALERTS ───────────────────────────────────
      # Every rule above reads a gauge that is refreshed from the database
      # once a minute. A failed refresh deliberately KEEPS the last good
      # values rather than zeroing them, because a row of zeroes is
      # indistinguishable from perfect health — the exact defect shape this
      # codebase keeps re-learning (`remainingCount || 0`, `players ?? []`).
      #
      # So staleness is what proves the numbers above are real. Without this
      # rule, a broken collector would present as a perfectly healthy
      # tournament platform, which is worse than having no gauges at all.
      - alert: TournamentMetricsStale
        expr: poker_tournament_metrics_stale_seconds > 600
        for: 5m
        labels:
          severity: warning
          component: tournament
        annotations:
          summary: 'Tournament gauges are {{ $value }}s stale — every tournament alert is blind'
          description: |
            The tournament metrics collector has not completed a refresh in
            over 10 minutes. The gauges above are frozen at their last good
            values, so TournamentNeverStarted, TournamentStuckCompleting,
            TournamentSeatlessPhantoms and TournamentCompletedUnpaid cannot
            fire on anything new. Check the engine log for
            TournamentMetrics.refresh_failed.
          runbook: https://monitor.smarter.poker/runbooks/tournament-metrics-stale

      # ── The board went dark ──────────────────────────────────────────
      # A platform that continuously schedules tournaments should never have
      # none open for registration. Zero for half an hour means the spawners
      # have stopped, which is how the lobby looks empty to a player even
      # though nothing has "failed".
      - alert: TournamentLobbyEmpty
        expr: poker_tournaments_registering == 0 and poker_tournament_metrics_stale_seconds < 600
        for: 30m
        labels:
          severity: warning
          component: tournament
        annotations:
          summary: 'No tournaments open for registration for 30 minutes'
          description: |
            poker_tournaments_registering has been zero for half an hour while
            the collector is fresh, so this is a real empty board rather than a
            stale reading. Both spawners (TournamentRecurringService and
            ScheduledTournamentService) should keep a card published days
            ahead. A player looking at the lobby right now sees nothing to
            enter.
          runbook: https://monitor.smarter.poker/runbooks/tournament-lobby-empty

  # ═══════════════════════════════════════════════════════════════════════════
  #  THE FLEET REPORTS WHAT IT CANNOT FINISH (2026-09-17, phase 3 of the
  #  horse programme)
  # ═══════════════════════════════════════════════════════════════════════════
  # Producer: services/HorseFleetMetrics.ts, one read a minute of
  # fn_ca_horse_fleet_metrics; the refusal counter is engineInstruments.ts.
  # Measured 2026-09-17 20:20 UTC, the afternoon these were written: 835
  # RUNNING tournaments, 547 decided for over ten minutes (oldest nine days),
  # 547 horses seated in them, 560 blocked by an unreconciled entry fee, 864
  # refused finishes in an hour, 1,393 deadlocks in fourteen minutes earlier
  # the same day. Nothing on the scrape said any of it.
  - name: horse-fleet-settlement
    interval: 60s
    rules:
      - alert: TournamentsDecidedButUnfinished
        # A finish takes seconds; the elimination scheduler's worst honest
        # queue was twenty minutes. Fifty games over ten minutes is not a
        # queue, it is a wall, and on 2026-09-17 the number was 547.
        expr: |
          poker_tournaments_decided_unfinished > 50
          and poker_horse_fleet_metrics_stale_seconds < 600
        for: 15m
        labels:
          severity: critical
          component: tournament
        annotations:
          summary: '{{ $value }} tournaments are decided and not finished'
          description: |
            RUNNING tournaments with at most one player still playing for over
            ten minutes. The cards are done; the finish was refused or never
            asked for. Read poker_tournament_finish_refusals_total by reason
            for why the last attempts failed, and
            poker_tournaments_decided_unfinished_oldest_minutes for how long
            this has been true.
          runbook: docs/runbooks/horse-fleet-settlement.md

      - alert: HorsesCommittedToDecidedGames
        # One horse per decided game, by construction; the share of the
        # seated fleet says how much of it is idle. 10% on a 2,400-horse
        # fleet is 240 horses doing nothing; the day this was written it was
        # 23%.
        expr: |
          poker_horses_in_decided_games / clamp_min(poker_horses_seated_in_database, 1) > 0.10
          and poker_horse_fleet_metrics_stale_seconds < 600
        for: 15m
        labels:
          severity: warning
          component: club-arena-engine
        annotations:
          summary: '{{ $value | humanizePercentage }} of seated horses sit in decided games'
          description: |
            Horses seated at tables whose tournament is already decided,
            as a share of every seated horse. They cannot act, cannot be
            reseated, and hold their seat until the tournament finishes.
            TournamentsDecidedButUnfinished says how many games; this says
            how much of the fleet.
          runbook: docs/runbooks/horse-fleet-settlement.md

      - alert: TournamentFinishRefusalsPersisting
        # The database saying no, twenty times in fifteen minutes, for the
        # same reason. Baseline before the accounting cutover: 0.
        expr: sum by (reason) (increase(poker_tournament_finish_refusals_total[15m])) > 20
        for: 15m
        labels:
          severity: critical
          component: tournament
        annotations:
          summary: '{{ $value | printf "%.0f" }} finishes refused in 15m for {{ $labels.reason }}'
          description: |
            The atomic finish refused before commit; nothing moved and the
            manager retries. A refusal that persists is a refusal a retry
            cannot cure: fee_reconciliation is an entry fee with no captured
            accounting batch, prize_set is a prize the ladder could not
            certify, deadlock and timeout are contention. Every refused
            tournament is also counted in poker_tournaments_decided_unfinished.
          runbook: docs/runbooks/horse-fleet-settlement.md

      - alert: TournamentsBlockedByUnreconciledFees
        # An entry fee with no captured batch cannot be attributed and the
        # finish is refused for it. A transition gap, not a race: the count
        # only falls when somebody reconciles the records.
        expr: |
          poker_tournaments_unbatched_fee_running > 0
          and poker_horse_fleet_metrics_stale_seconds < 600
        for: 30m
        labels:
          severity: critical
          component: money
        annotations:
          summary: '{{ $value }} running tournaments hold an entry fee no accounting batch captured'
          description: |
            RUNNING tournaments with a positive tournament rake record and no
            'captured' row in accounting_tournament_fee_batches.
            fn_accounting_tournament_fee_net_plan refuses their finish with
            tournament_fee_sources_require_reconciliation until the fee is
            reconciled. On 2026-09-17 the count was 560, all registered before
            the 18:11 accounting cutover.
          runbook: docs/runbooks/horse-fleet-settlement.md

      - alert: DatabaseDeadlocksElevated
        # pg_stat_database.deadlocks, cumulative. Ten in ten minutes is five
        # times the worst honest hour of 2026-09-17 (2/h); the storm that
        # afternoon ran 1,393 in fourteen minutes and this would have fired
        # inside the second scrape.
        expr: increase(poker_db_deadlocks_total[10m]) > 10
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: '{{ $value | printf "%.0f" }} deadlocks in 10 minutes'
          description: |
            The database is choosing victims. Read the Postgres log for
            "deadlock detected" and the functions in each cycle; every cycle
            is a lock-order difference on a shared row, and the fix is the
            order inside the functions that take it, never a wider lane.
          runbook: docs/runbooks/horse-fleet-settlement.md

      - alert: SettlementLaneConvoy
        # Sampled once a minute, so a convoy shorter than that is invisible
        # here and lives in the Postgres log (log_lock_waits). A wait over
        # five seconds caught by a one-minute sample is a long convoy.
        expr: max_over_time(poker_settlement_lane_waiters_oldest_ms[10m]) > 5000
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: 'A settlement lane wait of {{ $value | printf "%.0f" }} ms was sampled'
          description: |
            Backends were queued on the G, F or B settlement advisory lane
            for over five seconds at a one-minute sample.
            poker_settlement_lane_waiters{lane} says which lane. G is the
            platform-wide lane every hand settlement shares; F is the finish
            lane; B is the hand barrier.
          runbook: docs/runbooks/horse-fleet-settlement.md

      - alert: HorseFleetMetricsStale
        # The collector itself. A failed read keeps the last good snapshot,
        # so every rule above reads "and stale_seconds < 600" and goes
        # quiet; this is the rule that says why they went quiet.
        expr: poker_horse_fleet_metrics_stale_seconds > 600
        for: 5m
        labels:
          severity: warning
          component: club-arena-engine
        annotations:
          summary: 'Horse fleet gauges are {{ $value | humanizeDuration }} old'
          description: |
            HorseFleetMetrics has not completed a refresh in over ten
            minutes. TournamentsDecidedButUnfinished,
            HorsesCommittedToDecidedGames, TournamentsBlockedByUnreconciledFees
            and SettlementLaneConvoy cannot fire on anything new. Check the
            engine log for HorseFleetMetrics.refresh_failed.
          runbook: docs/runbooks/horse-fleet-settlement.md
