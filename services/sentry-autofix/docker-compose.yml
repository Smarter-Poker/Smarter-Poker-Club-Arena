# Sentry autofix webhook receiver — runs on engine-01 alongside the game engine.
# Listens on 127.0.0.1:8787; fronted at https://engine.smarter.poker/webhooks/sentry
# via the Caddy vhost (see infra/caddy snippet in docs/sentry-autofix.md).

services:
  sentry-autofix:
    build: .
    image: smarter-poker/sentry-autofix:1.0.0
    container_name: sp-sentry-autofix
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
