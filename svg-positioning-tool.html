<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Text Positioning Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            align-items: start;
        }

        .svg-container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        #svg-canvas {
            width: 100%;
            height: auto;
            display: block;
            cursor: default;
        }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 20px;
        }

        .controls h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: #00d4ff;
        }

        .stat-control {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .stat-control h3 {
            font-size: 0.9rem;
            color: #00d4ff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .coord-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .coord-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .coord-label {
            color: #888;
            font-size: 0.75rem;
            margin-bottom: 2px;
        }

        .coord-value {
            color: #00ff88;
            font-weight: bold;
        }

        .instructions {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .instructions p {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #ccc;
        }

        .export-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        button {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .code-output {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(0, 212, 255, 0.5);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.85rem;
            color: #00ff88;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            user-select: all;
            cursor: text;
            margin-top: 10px;
        }

        .code-output.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .draggable-text {
            cursor: move;
            user-select: none;
        }

        .draggable-text:hover {
            filter: brightness(1.5);
        }

        .draggable-text.dragging {
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎯 SVG Text Positioning Tool</h1>

        <div class="layout">
            <div class="svg-container">
                <div id="svg-canvas"></div>
            </div>

            <div class="controls">
                <div class="instructions">
                    <p><strong>📌 Instructions:</strong><br>
                        Drag the white numbers on the card to position them correctly. The coordinates will update in
                        real-time. Click "Export Coordinates" when done.</p>
                </div>

                <h2>Stat Positions</h2>

                <div class="stat-control">
                    <h3>Total Members</h3>
                    <div class="coord-display">
                        <div class="coord-item">
                            <div class="coord-label">X</div>
                            <div class="coord-value" id="members-x">-</div>
                        </div>
                        <div class="coord-item">
                            <div class="coord-label">Y</div>
                            <div class="coord-value" id="members-y">-</div>
                        </div>
                    </div>
                </div>

                <div class="stat-control">
                    <h3>Club Level</h3>
                    <div class="coord-display">
                        <div class="coord-item">
                            <div class="coord-label">X</div>
                            <div class="coord-value" id="level-x">-</div>
                        </div>
                        <div class="coord-item">
                            <div class="coord-label">Y</div>
                            <div class="coord-value" id="level-y">-</div>
                        </div>
                    </div>
                </div>

                <div class="stat-control">
                    <h3>Active Players</h3>
                    <div class="coord-display">
                        <div class="coord-item">
                            <div class="coord-label">X</div>
                            <div class="coord-value" id="players-x">-</div>
                        </div>
                        <div class="coord-item">
                            <div class="coord-label">Y</div>
                            <div class="coord-value" id="players-y">-</div>
                        </div>
                    </div>
                </div>

                <div class="export-section">
                    <button onclick="exportCoordinates()">📋 Export Coordinates</button>
                    <button onclick="resetPositions()">🔄 Reset to Original</button>
                    <div id="code-output" class="code-output"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let draggedElement = null;
        let offset = { x: 0, y: 0 };
        let originalPositions = {};

        // Load the SVG
        async function loadSVG() {
            try {
                const response = await fetch('/hub/club-arena/src/assets/club-stats-panel.svg');
                const svgText = await response.text();

                const container = document.getElementById('svg-canvas');
                container.innerHTML = svgText;

                const svg = container.querySelector('svg');
                if (svg) {
                    svg.setAttribute('width', '100%');
                    svg.setAttribute('height', 'auto');

                    // Make text elements draggable
                    const textElements = [
                        { id: 'total-members', displayId: 'members' },
                        { id: 'club-level', displayId: 'level' },
                        { id: 'active-players', displayId: 'players' }
                    ];

                    textElements.forEach(({ id, displayId }) => {
                        const element = svg.getElementById(id);
                        if (element) {
                            element.classList.add('draggable-text');

                            // Store original position
                            originalPositions[id] = {
                                x: parseFloat(element.getAttribute('x') || 0),
                                y: parseFloat(element.getAttribute('y') || 0)
                            };

                            // Update display
                            updateCoordinateDisplay(displayId, originalPositions[id].x, originalPositions[id].y);

                            // Add drag handlers
                            element.addEventListener('mousedown', startDrag);
                        }
                    });

                    // Add global mouse handlers
                    document.addEventListener('mousemove', drag);
                    document.addEventListener('mouseup', endDrag);
                }
            } catch (error) {
                console.error('Error loading SVG:', error);
                document.getElementById('svg-canvas').innerHTML =
                    '<p style="color: #ff4444; padding: 20px;">Error loading SVG. Make sure the dev server is running!</p>';
            }
        }

        function startDrag(e) {
            draggedElement = e.target;
            draggedElement.classList.add('dragging');

            const svg = draggedElement.ownerSVGElement;
            const pt = svg.createSVGPoint();
            pt.x = e.clientX;
            pt.y = e.clientY;
            const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());

            offset.x = svgP.x - parseFloat(draggedElement.getAttribute('x'));
            offset.y = svgP.y - parseFloat(draggedElement.getAttribute('y'));

            e.preventDefault();
        }

        function drag(e) {
            if (!draggedElement) return;

            const svg = draggedElement.ownerSVGElement;
            const pt = svg.createSVGPoint();
            pt.x = e.clientX;
            pt.y = e.clientY;
            const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());

            const newX = svgP.x - offset.x;
            const newY = svgP.y - offset.y;

            draggedElement.setAttribute('x', newX);
            draggedElement.setAttribute('y', newY);

            // Update coordinate display
            const displayId = getDisplayId(draggedElement.id);
            updateCoordinateDisplay(displayId, newX, newY);
        }

        function endDrag() {
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
                draggedElement = null;
            }
        }

        function getDisplayId(elementId) {
            const map = {
                'total-members': 'members',
                'club-level': 'level',
                'active-players': 'players'
            };
            return map[elementId] || '';
        }

        function updateCoordinateDisplay(displayId, x, y) {
            document.getElementById(`${displayId}-x`).textContent = Math.round(x);
            document.getElementById(`${displayId}-y`).textContent = Math.round(y);
        }

        function exportCoordinates() {
            const svg = document.querySelector('#svg-canvas svg');
            if (!svg) {
                alert('❌ SVG not found!');
                return;
            }

            const totalMembersEl = svg.getElementById('total-members');
            const clubLevelEl = svg.getElementById('club-level');
            const activePlayersEl = svg.getElementById('active-players');

            if (!totalMembersEl || !clubLevelEl || !activePlayersEl) {
                alert('❌ Text elements not found in SVG!');
                return;
            }

            const coords = {
                'total-members': {
                    x: Math.round(parseFloat(totalMembersEl.getAttribute('x') || 0)),
                    y: Math.round(parseFloat(totalMembersEl.getAttribute('y') || 0))
                },
                'club-level': {
                    x: Math.round(parseFloat(clubLevelEl.getAttribute('x') || 0)),
                    y: Math.round(parseFloat(clubLevelEl.getAttribute('y') || 0))
                },
                'active-players': {
                    x: Math.round(parseFloat(activePlayersEl.getAttribute('x') || 0)),
                    y: Math.round(parseFloat(activePlayersEl.getAttribute('y') || 0))
                }
            };

            const output = `SVG Text Element Coordinates:

#total-members: x="${coords['total-members'].x}" y="${coords['total-members'].y}"
#club-level: x="${coords['club-level'].x}" y="${coords['club-level'].y}"
#active-players: x="${coords['active-players'].x}" y="${coords['active-players'].y}"

PASTE THESE COORDINATES IN THE CHAT!`;

            const codeOutput = document.getElementById('code-output');
            codeOutput.textContent = output;
            codeOutput.classList.add('show');

            // Scroll to output
            codeOutput.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            // Try to copy to clipboard
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(output).then(() => {
                    alert('✅ Coordinates copied to clipboard! You can also select and copy from the text box below.');
                }).catch(err => {
                    alert('⚠️ Could not auto-copy. Please manually select and copy the text from the box below.');
                    console.error('Clipboard error:', err);
                });
            } else {
                alert('⚠️ Please manually select and copy the text from the box below.');
            }
        }

        function resetPositions() {
            const svg = document.querySelector('#svg-canvas svg');
            if (!svg) return;

            Object.keys(originalPositions).forEach(id => {
                const element = svg.getElementById(id);
                if (element) {
                    element.setAttribute('x', originalPositions[id].x);
                    element.setAttribute('y', originalPositions[id].y);

                    const displayId = getDisplayId(id);
                    updateCoordinateDisplay(displayId, originalPositions[id].x, originalPositions[id].y);
                }
            });

            document.getElementById('code-output').classList.remove('show');
        }

        // Load SVG on page load
        loadSVG();
    </script>
</body>

</html>
