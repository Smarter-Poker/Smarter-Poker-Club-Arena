{
  "rule_files": [
    "../../infra/monitoring/alert-rules.yml"
  ],
  "evaluation_interval": "5m",
  "tests": [
    {
      "name": "A floor that falls to a tenth of its week fires, with only four days retained",
      "interval": "1m",
      "input_series": [
        {
          "series": "poker_hands_dealt_total{job=\"engine_game_server\",instance=\"engine\"}",
          "values": "0+600x5760 3456060+60x179"
        },
        {
          "series": "poker_maintenance_break_active{job=\"engine_game_server\",instance=\"engine\"}",
          "values": "0+0x5940"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"HorseFleetThroughputRelativeDrop\",alertstate=\"firing\"}",
          "eval_time": "5755m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"HorseFleetThroughputRelativeDrop\",alertstate=\"firing\"}",
          "eval_time": "5930m",
          "exp_samples": [
            {
              "labels": "ALERTS{alertname=\"HorseFleetThroughputRelativeDrop\",alertstate=\"firing\",component=\"club-arena-engine\",page=\"sms\",severity=\"critical\"}",
              "value": 1
            }
          ]
        }
      ]
    },
    {
      "name": "Exactly at the 2026-10-13 stall's first hour (0.33 of the week) it fires",
      "interval": "1m",
      "input_series": [
        {
          "series": "poker_hands_dealt_total{job=\"engine_game_server\",instance=\"engine\"}",
          "values": "0+600x5760 3456198+198x179"
        },
        {
          "series": "poker_maintenance_break_active{job=\"engine_game_server\",instance=\"engine\"}",
          "values": "0+0x5940"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"HorseFleetThroughputRelativeDrop\",alertstate=\"firing\"}",
          "eval_time": "5755m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"HorseFleetThroughputRelativeDrop\",alertstate=\"firing\"}",
          "eval_time": "5930m",
          "exp_samples": [
            {
              "labels": "ALERTS{alertname=\"HorseFleetThroughputRelativeDrop\",alertstate=\"firing\",component=\"club-arena-engine\",page=\"sms\",severity=\"critical\"}",
              "value": 1
            }
          ]
        }
      ]
    },
