          "eval_time": "5755m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"HorseFleetThroughputRelativeDrop\",alertstate=\"firing\"}",
          "eval_time": "5930m",
          "exp_samples": []
        }
      ]
    },
    {
      "name": "Fewer than three days of history is no baseline, and it stays silent",
